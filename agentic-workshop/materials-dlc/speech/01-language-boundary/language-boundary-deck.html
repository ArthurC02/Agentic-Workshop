<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "開場", "title": "DDD 的三句話", "lead": "DDD（Domain-Driven Design，領域驅動設計）的作者 Evans，把它濃縮成三句話。", "cards": [["聚焦核心領域", "力氣花在讓業務與眾不同的那一塊。"], ["和領域專家一起建模", "模型是討論出來的，不是工程師自己想的。"], ["在明確邊界內說通用語言", "同一個範圍內，同一件事只有一個名字。"]], "check": "D1 裡哪一個決定你最沒把握？先記下來，最後一頁回來對照。", "notes": "0–2 分鐘。本場講用 Coding Agent 做 DDD 的概念與做法，不是重做 D1：學員不讀程式、不打指令。三句話出自 Evans 的 DDD Reference，第三句原文是「Speak a ubiquitous language within an explicitly bounded context.」今天主要講第二、三句：Agent 能幫忙找語言與邊界的證據，定義仍由人和領域專家決定。不揭露 D3 三張需求卡的參考設計，未來梯次也會看到這份簡報。📖 延伸閱讀：〈Domain-Driven Design Reference〉（Eric Evans，2015）。"}, {"id": "ai-era", "chapter": "開場", "title": "有了 AI，DDD 還重要嗎", "lead": "Evans 在 DDD Europe 2026 主題演講：模型、邊界、語言都還重要，只是樣子會變。", "cards": [["Evans（2026）", "用 LLM 加上確定性計算，從程式抽出領域詞彙。"], ["社群在試", "同場有多場講 LLM 協助策略設計與建模。"]], "check": "你的團隊現在把領域知識放在哪裡：人的腦袋、文件，還是程式？", "notes": "2–4 分鐘。DDD Europe 2026 開場主題演講摘要（2026-06）：「domain models still matter, bounded contexts still matter, language still matters」「but the models will look different.」摘要也提到用 LLM 元件加確定性計算，從程式抽出領域相關的詞彙。同場例子：Thomas Coopman 的工作坊用 LLM 畫 Bounded Context Canvas，並談怎麼分辨有用的協助與幻覺；Chelsea Troy 認為 Bounded Context 的直覺也能用來規劃 LLM 的使用方式。這些都只有議程摘要，沒有成效數字。不要說「Evans 說 LLM 就是 Bounded Context」再延伸成他背書某種 Agent 流程：他 2024 年那句話談的是在系統裡使用 LLM，而且他自己說看法有時效。這些場次之後各場只回扣，不重講。📖 延伸閱讀：〈Opening Keynote Eric Evans〉、〈Accelerate your Strategic Design with LLMs〉、〈The Curse of Unbounded Contexts: Using Domains as LLM Consumers〉（DDD Europe，2026）。"}, {"id": "no-memory", "chapter": "為什麼要寫下來", "title": "Agent 是沒有走廊記憶的新同事", "lead": "Agent 沒聽過會議和茶水間的討論；對話一結束，就忘了你們選了哪個名字。", "cards": [["上下文有限", "塞太多，重要的規則反而被忽略。"], ["寫進 Repo", "語言與邊界寫成檔案，每個 Agent 都讀得到。"]], "check": "你的專案裡，有沒有一個名詞，不同人說的意思不一樣？", "notes": "4–6 分鐘。Anthropic Engineering〈Effective context engineering for AI agents〉（2025-09-29）：「Context is a critical but finite resource for AI agents.」Birgitta Böckeler〈Context Engineering for Coding Agents〉（martinfowler.com，2026-02-05）：給太多上下文，Agent 的效果反而下降。Forte Group 一篇 2026-09 的廠商文章說「An agent has no institutional memory.」只當觀點引用。結論：共用模型要短、放在 Repo、經人確認。本 DLC 用一個 Plugin 保存模型；換成 Repo 裡的 Markdown 詞彙表，道理相同。📖 延伸閱讀：〈Effective context engineering for AI agents〉（Anthropic Engineering，2025）；〈Context Engineering for Coding Agents〉（Birgitta Böckeler／martinfowler.com，2026）。"}, {"id": "success", "chapter": "為什麼要寫下來", "title": "技巧：要證據，不要形容詞", "lead": "請 Agent 做事前先講好：看到哪個實際字樣才算成功；回報對得上才往下。", "cards": [["要實際字樣", "例如「76 passed」，不是「看起來沒問題」。"], ["只回成功或失敗", "確認時 Agent 只答一句，不順手修改。"]], "check": "Agent 說「完成了」時，你看的是它的形容，還是實際輸出？", "notes": "6–8 分鐘。Claude Code 官方文件〈Best practices for Claude Code〉：「Have Claude show evidence rather than asserting success」；其他工具的官方文件通常有對應章節。DLC 每個 ③ 確認結果都用這招。做 DDD 也一樣：Agent 說「這兩個名詞是同一件事」，要附它看到的那幾行。📖 延伸閱讀：〈Best practices for Claude Code〉（Claude Code 官方文件）。"}, {"id": "language", "chapter": "通用語言", "title": "通用語言：說的、寫的、程式都一樣", "lead": "Ubiquitous Language（通用語言）：團隊在對話、文件與程式裡，用同一套名詞。", "cards": [["同一套說法", "會議上怎麼說，程式裡的名稱就怎麼取。"], ["會跟著成長", "團隊越懂業務，語言和模型就跟著改。"]], "check": "說出一個「客服這樣說、程式卻那樣寫」的例子。", "notes": "8–10 分鐘。Evans〈DDD Reference〉：「use the same language in diagrams, writing, and especially speech.」Microsoft Azure Architecture Center〈Use Domain Analysis to Model Microservices〉（2026-02）：「Teams use this language consistently in conversations, documentation, and code.」Fowler〈UbiquitousLanguage〉（2006）：語言與模型會隨團隊對領域的理解而演進。對 Agent 來說，程式裡的名稱是它最常讀到的語言；名稱不一致，它學到的就不一致。📖 延伸閱讀：〈UbiquitousLanguage〉（Martin Fowler，2006）；Eric Evans《Domain-Driven Design》（2003）第 2 章〈Communication and the Use of Language〉。"}, {"id": "candidate", "chapter": "通用語言", "title": "改一個名詞，就是改模型", "lead": "Evans：語言的改變就是模型的改變。所以 Agent 提的新名詞，先當候選。", "code": "詞彙：借閱（圖書館示意）\n  不用的名字：借書、租借\n  證據：docs/example.md:41-48\n  狀態：候選", "cards": [["候選", "附證據的主張，Agent 只能參考。"], ["事實", "經另一個人核准後才成立（下一場）。"]], "check": "挑一筆候選，打開證據的那幾行：真的在講這件事嗎？", "notes": "10–12 分鐘。Evans〈DDD Reference〉：「Recognize that a change in the language is a change to the model.」所以 Agent 把「借書」改成「借閱」不是改錯字，是提議改模型，要由人看證據決定。Philipp Kostyra 在 DDD Europe 2026 的實作課主張把 LLM 當成「a junior domain expert that is allowed to be wrong」，正是候選的意思。範例是圖書館的示意，不是 Repo 的內容。人看證據不需要看懂程式：看那幾行是不是在講同一件事、有沒有被斷章取義。這是 DLC 第一個新概念，下一場才講事實。📖 延伸閱讀：〈Domain-Driven Design Reference〉（Eric Evans，2015）；〈Can AI be a Co-Domain Expert in Domain Modelling?〉（DDD Europe，2026）。"}, {"id": "legacy", "chapter": "Agent 整理語言", "title": "案例：用 AI 讀懂舊系統", "lead": "讓 AI 從舊程式整理業務規則，已是業界常見做法；共同點是最後由人驗證。", "cards": [["Thoughtworks 技術雷達", "把「用 AI 理解舊程式」列為建議採用。"], ["Morgan Stanley（2025）", "先把舊程式轉成白話規格，再由工程師重寫。"], ["COBOL 逆向工程（2024）", "AI 整理理解，仍請領域專家確認。"]], "check": "這些案例裡，哪一步一定要人來做？", "notes": "12–15 分鐘。Thoughtworks Technology Radar 把〈Using GenAI to understand legacy codebases〉列為 Adopt（最後一次出現在 2025-11）：工具可以「surface business rules, summarize logic and identify dependencies.」martinfowler.com〈Legacy Modernization meets GenAI〉（2024-09-24）介紹 Thoughtworks 的 CodeConcise：用 LLM 加程式結構的知識圖譜理解 COBOL，並由領域專家驗證理解。Business Insider（2025-07-01）報導 Morgan Stanley 的 DevGen.AI：先把舊語言程式轉成白話英文規格，再由開發者重寫；報導中截至 2025-06 節省 28 萬小時以上是公司自稱，不是本課程量到的結果，要講就照這樣說；不要說「900 萬行」（原文查不到）。DDD Europe 2026 另有 IKEA 的 Raj Navakoti 講〈Reverse-Engineering DDD〉，只有議程摘要。重點：AI 讓讀程式變便宜，定義仍要人。第 03 場改舊系統時會回扣這頁，不重講。📖 延伸閱讀：〈Using GenAI to understand legacy codebases〉（Thoughtworks Technology Radar，2025）；〈Legacy Modernization meets GenAI〉（Ferri、Coggrave、Sheth／martinfowler.com，2024）；〈A team of engineers saved Morgan Stanley more than 280,000 hours this year〉（Business Insider，2025）。"}, {"id": "glossary", "chapter": "Agent 整理語言", "title": "示範：請 Agent 整理詞彙表", "lead": "Agent 找名詞與證據；人決定標準名稱，並寫下「不要用的名字」。", "prompt": "先不要修改任何檔案。請從我指定的文件、程式與測試裡，找出同一件事有兩個以上名字、或文件有而程式沒有的名詞。列成表：名詞、各處說法、證據（路徑:起-迄行）。不要替我選標準名稱，列完停下。", "cards": [["人決定", "標準名稱、定義，以及哪些名字以後不用。"], ["不要用的名字", "寫進詞彙表，Agent 下次才不會換回來。"]], "check": "Agent 列的同義詞，你有沒有決定哪一個不用？", "notes": "15–17 分鐘。示範提示詞，未實際執行就不要宣稱結果。對照 D1 檢查點 3。重點是「不要替我選」：選名字是定義，定義是人的事；矛盾先記成發現，不要偷偷修掉。Forte Group 的廠商文章（2026-09）說「rejection is where the decision lives.」：詞彙表最有用的一行，常是「不用哪個名字」。社群也有人把這件事做成 Agent Skill（例如 skills.sh 目錄的 ubiquitous-language），只當「有人這樣做」的佐證，不推薦安裝。"}, {"id": "made-up", "chapter": "Agent 整理語言", "title": "小心：Agent 會編出合理的名字", "lead": "Agent 會自信地說出不存在的名字；每個名詞都要附查得到的證據。", "cards": [["研究（2025）", "程式碼模型推薦的套件，商用模型至少 5.2% 不存在。"], ["防法", "證據寫成路徑與行號，再請工具確認原文還在。"]], "check": "Agent 提的名詞裡，有沒有一個在證據裡找不到？", "notes": "17–19 分鐘。USENIX Security 2025 論文〈We Have a Package for You!〉：16 個程式碼生成模型推薦的套件中，幻覺比例商用模型平均至少 5.2%、開源模型 21.7%，共 205,474 個不同的假名稱。這是套件名稱，不是領域名詞，用來類比：越像真的名字越危險。Böckeler 也記錄過：給了上下文，Agent 也不一定照做。所以 D1 讓 Agent 驗證每段證據還對得上原文。第 04 場會加深「只准引用查得到的 id」，只回扣這組數字，不重講。不要說「19.7%」，查不到。📖 延伸閱讀：〈We Have a Package for You! A Comprehensive Analysis of Package Hallucinations by Code Generating LLMs〉（Spracklen 等人，USENIX Security 2025）。"}, {"id": "customer", "chapter": "Agent 整理語言", "title": "用客人的話測模型", "lead": "拿旅客或客服會說的一句話查模型：查不到，代表模型還有缺口。", "cards": [["查得到", "句子裡的說法，對到登記的名詞或別名。"], ["查不到", "不是業務沒這回事，是模型還不知道。"]], "check": "你記下的缺口，是客人真的會說的話嗎？", "notes": "19–20 分鐘。對照 D1 檢查點 5。空結果最容易被誤讀成「沒有這條規則」。延伸：用客人的話測模型，和 Domain Storytelling（用編號句子講業務故事）是同一個精神；第 04 場才示範，這裡只提名字。另一個常見方法是 EventStorming（第 03 場講），也只提名字即可。"}, {"id": "context", "chapter": "邊界", "title": "Bounded Context：意思一致的範圍", "lead": "Bounded Context（限界上下文）：在這個範圍內，同一個名詞的意思一致。", "cards": [["同名不同義很正常", "「帳戶」在登入和帳務是兩件事。"], ["不要硬統一", "大系統要一套全公司模型，既不可行也不划算。"]], "check": "你們公司哪個詞，換個部門意思就不一樣？", "notes": "20–22 分鐘。Fowler〈BoundedContext〉（2014）以 Customer、Product 為例：同一個詞在不同部門意思不同；大系統完全統一模型「will not be feasible or cost-effective」。Azure〈Use Domain Analysis to Model Microservices〉用 account 舉例。對 Agent：沒有標出 Context，它會把兩個「訂單」當成同一個。D1 檢查點 4 要每個 Context 說得出「它決定什麼」。📖 延伸閱讀：〈BoundedContext〉（Martin Fowler，2014）；Vaughn Vernon《Implementing Domain-Driven Design》（2013）第 2 章〈Domains, Subdomains, and Bounded Contexts〉。"}, {"id": "canvas", "chapter": "邊界", "title": "示範：用畫布寫清楚一個 Context", "lead": "DDD Crew 的 Bounded Context Canvas：先用業務語言寫目的，不寫技術。", "prompt": "先不要修改任何檔案。請針對我指定的 Context，依 Bounded Context Canvas 的欄位提草稿：目的、它做的業務決定、使用的名詞、假設、待確認問題。每欄附證據（路徑:起-迄行），找不到的寫「待確認」。目的只列 2 個選項，由我決定。", "cards": [["Agent 填", "名詞、業務決定，以及每一欄的證據。"], ["人寫", "目的那一句，和要問專家的問題。"]], "check": "這個 Context 的目的，不用技術名詞也說得清楚嗎？", "notes": "22–24 分鐘。DDD Crew〈The Bounded Context Canvas〉（GitHub，CC BY-SA 4.0）的 Purpose 欄：「A few sentences describing the why and what of the context in business language. No technical details here.」另有 Ubiquitous Language、Business Decisions、Assumptions、Open Questions 等欄。示範提示詞，未實際執行。D1 只要求一句話職責；畫布是回到團隊後的延伸。DDD Europe 2026 Thomas Coopman 的工作坊也用 LLM 畫這張畫布。📖 延伸閱讀：〈The Bounded Context Canvas〉（DDD Crew）。"}, {"id": "context-map", "chapter": "邊界", "title": "Context Map：上游與下游", "lead": "Evans 的比喻：兩座城在同一條河邊，上游倒進河裡的東西，會流到下游。", "flow": ["上游 Context", "提供資料或服務", "下游 Context", "跟著上游的變動改"], "cards": [["先畫現況", "照實記下誰依賴誰，改造之後再說。"], ["Agent 幫忙找", "誰呼叫誰、誰讀誰的資料，都附證據。"]], "check": "你的系統裡，哪個模組一改，別人就得跟著改？", "notes": "24–26 分鐘。Evans〈DDD Reference〉的 Context Map 一節：先畫現有地形，「Map the existing terrain. Take up transformations later.」上下游的河流比喻也在同一份參考資料。DDD Crew〈Context Mapping〉列出常見關係名稱（Conformist、Anticorruption Layer、Shared Kernel 等），第 03 場會講防腐層。D1 沒有要學員畫完整的 Context Map；這頁是下一頁邊界洩漏的背景。📖 延伸閱讀：〈Context Mapping〉（DDD Crew）；Vaughn Vernon《Implementing Domain-Driven Design》（2013）第 3 章〈Context Maps〉。"}, {"id": "leak", "chapter": "邊界", "title": "邊界洩漏：測試抓不到的錯", "lead": "一個 Context 繞過約定，直接讀寫另一個的資料；測試常常全過，只能靠人看。", "prompt": "先不要修改任何檔案。請對照模型裡的 Context 與它們之間的協作，找出程式裡直接讀寫另一個 Context 資料或內部程式的地方。每筆附證據（路徑:起-迄行），寫出模型怎麼說、程式怎麼做。只列可疑處，不下結論，列完停下。", "cards": [["真的越界", "程式該改，經核准後再做。"], ["模型漏寫", "補一條 Context 之間的協作。"]], "check": "你判斷的那一處，理由是看了證據，還是聽了 Agent 的結論？", "notes": "26–28 分鐘。對照開場檢查點 3 與 D1 檢查點 6。這個 Repo 的自動檢查只有測試，沒有架構檢查，所以越界只能靠人看；例如計價程式直接改會員資料，金額算對、測試照樣全過。Azure〈Use Domain Analysis to Model Microservices〉提醒舊系統的資料結構會滲進新程式：「the external system's data schema or API might leak into the application.」兩種結論都合理，後續不同，所以由人判斷。示範提示詞，未實際執行。"}, {"id": "next", "chapter": "下一站", "title": "帶走什麼", "lead": "Agent 找證據、人來定義；寫下來的都是候選，等另一個人核准。", "flow": ["人選來源", "Agent 附證據提草稿", "人定義語言與邊界", "人判斷洩漏", "另一個人核准"], "cards": [["回到團隊", "從一個常被說錯的名詞開始，寫進 Repo。"], ["下一場", "審查與核准：候選怎麼成為必須遵守的事實。"]], "check": "回到第一頁你最沒把握的決定：它的證據是哪幾行？", "notes": "28–30 分鐘，收尾。最沒把握的決定，通常就是證據最薄的那個。D1 結束時看到還沒 commit 的模型是正確的：自己寫、自己收進紀錄，就沒有人審過。下一場只說會由另一個人審查，不先講簽章操作。"}], "title": "共同語言與邊界：Agent 找證據，人來定義", "minutes": 30, "downloads": [{"label": "下載操作講義", "name": "language-boundary-handout.md", "text": "# 共同語言與邊界：Agent 找證據，人來定義\n\n\u003e 讀者：學員。時機：DDD 延伸課 D1 之後的 30 分鐘講解。前置：已做完開場與 D1。\n\n本場講概念與技巧，不需要寫程式或打指令。頁面上的提示詞是示範，想試再貼給自己的 Agent；沒有實際執行的結果，一律視為未驗證。\n\n## 1. DDD 的三句話\n\nDDD（Domain-Driven Design，領域驅動設計）的作者 Evans，把它濃縮成三句話。\n\n- **聚焦核心領域**：力氣花在讓業務與眾不同的那一塊。\n\n- **和領域專家一起建模**：模型是討論出來的，不是工程師自己想的。\n\n- **在明確邊界內說通用語言**：同一個範圍內，同一件事只有一個名字。\n\n**人工確認**：D1 裡哪一個決定你最沒把握？先記下來，最後一頁回來對照。\n\n## 2. 有了 AI，DDD 還重要嗎\n\nEvans 在 DDD Europe 2026 主題演講：模型、邊界、語言都還重要，只是樣子會變。\n\n- **Evans（2026）**：用 LLM 加上確定性計算，從程式抽出領域詞彙。\n\n- **社群在試**：同場有多場講 LLM 協助策略設計與建模。\n\n**人工確認**：你的團隊現在把領域知識放在哪裡：人的腦袋、文件，還是程式？\n\n## 3. Agent 是沒有走廊記憶的新同事\n\nAgent 沒聽過會議和茶水間的討論；對話一結束，就忘了你們選了哪個名字。\n\n- **上下文有限**：塞太多，重要的規則反而被忽略。\n\n- **寫進 Repo**：語言與邊界寫成檔案，每個 Agent 都讀得到。\n\n**人工確認**：你的專案裡，有沒有一個名詞，不同人說的意思不一樣？\n\n## 4. 技巧：要證據，不要形容詞\n\n請 Agent 做事前先講好：看到哪個實際字樣才算成功；回報對得上才往下。\n\n- **要實際字樣**：例如「76 passed」，不是「看起來沒問題」。\n\n- **只回成功或失敗**：確認時 Agent 只答一句，不順手修改。\n\n**人工確認**：Agent 說「完成了」時，你看的是它的形容，還是實際輸出？\n\n## 5. 通用語言：說的、寫的、程式都一樣\n\nUbiquitous Language（通用語言）：團隊在對話、文件與程式裡，用同一套名詞。\n\n- **同一套說法**：會議上怎麼說，程式裡的名稱就怎麼取。\n\n- **會跟著成長**：團隊越懂業務，語言和模型就跟著改。\n\n**人工確認**：說出一個「客服這樣說、程式卻那樣寫」的例子。\n\n## 6. 改一個名詞，就是改模型\n\nEvans：語言的改變就是模型的改變。所以 Agent 提的新名詞，先當候選。\n\n- **候選**：附證據的主張，Agent 只能參考。\n\n- **事實**：經另一個人核准後才成立（下一場）。\n\n```text\n詞彙：借閱（圖書館示意）\n  不用的名字：借書、租借\n  證據：docs/example.md:41-48\n  狀態：候選\n```\n\n**人工確認**：挑一筆候選，打開證據的那幾行：真的在講這件事嗎？\n\n## 7. 案例：用 AI 讀懂舊系統\n\n讓 AI 從舊程式整理業務規則，已是業界常見做法；共同點是最後由人驗證。\n\n- **Thoughtworks 技術雷達**：把「用 AI 理解舊程式」列為建議採用。\n\n- **Morgan Stanley（2025）**：先把舊程式轉成白話規格，再由工程師重寫。\n\n- **COBOL 逆向工程（2024）**：AI 整理理解，仍請領域專家確認。\n\n**人工確認**：這些案例裡，哪一步一定要人來做？\n\n## 8. 示範：請 Agent 整理詞彙表\n\nAgent 找名詞與證據；人決定標準名稱，並寫下「不要用的名字」。\n\n- **人決定**：標準名稱、定義，以及哪些名字以後不用。\n\n- **不要用的名字**：寫進詞彙表，Agent 下次才不會換回來。\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請從我指定的文件、程式與測試裡，找出同一件事有兩個以上名字、或文件有而程式沒有的名詞。列成表：名詞、各處說法、證據（路徑:起-迄行）。不要替我選標準名稱，列完停下。\n\n**人工確認**：Agent 列的同義詞，你有沒有決定哪一個不用？\n\n## 9. 小心：Agent 會編出合理的名字\n\nAgent 會自信地說出不存在的名字；每個名詞都要附查得到的證據。\n\n- **研究（2025）**：程式碼模型推薦的套件，商用模型至少 5.2% 不存在。\n\n- **防法**：證據寫成路徑與行號，再請工具確認原文還在。\n\n**人工確認**：Agent 提的名詞裡，有沒有一個在證據裡找不到？\n\n## 10. 用客人的話測模型\n\n拿旅客或客服會說的一句話查模型：查不到，代表模型還有缺口。\n\n- **查得到**：句子裡的說法，對到登記的名詞或別名。\n\n- **查不到**：不是業務沒這回事，是模型還不知道。\n\n**人工確認**：你記下的缺口，是客人真的會說的話嗎？\n\n## 11. Bounded Context：意思一致的範圍\n\nBounded Context（限界上下文）：在這個範圍內，同一個名詞的意思一致。\n\n- **同名不同義很正常**：「帳戶」在登入和帳務是兩件事。\n\n- **不要硬統一**：大系統要一套全公司模型，既不可行也不划算。\n\n**人工確認**：你們公司哪個詞，換個部門意思就不一樣？\n\n## 12. 示範：用畫布寫清楚一個 Context\n\nDDD Crew 的 Bounded Context Canvas：先用業務語言寫目的，不寫技術。\n\n- **Agent 填**：名詞、業務決定，以及每一欄的證據。\n\n- **人寫**：目的那一句，和要問專家的問題。\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請針對我指定的 Context，依 Bounded Context Canvas 的欄位提草稿：目的、它做的業務決定、使用的名詞、假設、待確認問題。每欄附證據（路徑:起-迄行），找不到的寫「待確認」。目的只列 2 個選項，由我決定。\n\n**人工確認**：這個 Context 的目的，不用技術名詞也說得清楚嗎？\n\n## 13. Context Map：上游與下游\n\nEvans 的比喻：兩座城在同一條河邊，上游倒進河裡的東西，會流到下游。\n\n上游 Context → 提供資料或服務 → 下游 Context → 跟著上游的變動改\n\n- **先畫現況**：照實記下誰依賴誰，改造之後再說。\n\n- **Agent 幫忙找**：誰呼叫誰、誰讀誰的資料，都附證據。\n\n**人工確認**：你的系統裡，哪個模組一改，別人就得跟著改？\n\n## 14. 邊界洩漏：測試抓不到的錯\n\n一個 Context 繞過約定，直接讀寫另一個的資料；測試常常全過，只能靠人看。\n\n- **真的越界**：程式該改，經核准後再做。\n\n- **模型漏寫**：補一條 Context 之間的協作。\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請對照模型裡的 Context 與它們之間的協作，找出程式裡直接讀寫另一個 Context 資料或內部程式的地方。每筆附證據（路徑:起-迄行），寫出模型怎麼說、程式怎麼做。只列可疑處，不下結論，列完停下。\n\n**人工確認**：你判斷的那一處，理由是看了證據，還是聽了 Agent 的結論？\n\n## 15. 帶走什麼\n\nAgent 找證據、人來定義；寫下來的都是候選，等另一個人核准。\n\n人選來源 → Agent 附證據提草稿 → 人定義語言與邊界 → 人判斷洩漏 → 另一個人核准\n\n- **回到團隊**：從一個常被說錯的名詞開始，寫進 Repo。\n\n- **下一場**：審查與核准：候選怎麼成為必須遵守的事實。\n\n**人工確認**：回到第一頁你最沒把握的決定：它的證據是哪幾行？\n\n## 完成條件\n說得出 DDD 的三句話、為什麼 Agent 需要寫在 Repo 裡的共用語言、候選和事實差在哪；知道怎麼請 Agent 從文件與程式整理詞彙表與 Context 畫布、怎麼防 Agent 編出不存在的名字，以及邊界洩漏要由人看證據判斷；知道下一場要讓另一個人審查核准。\n"}]};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;
const el = id => document.getElementById(id);
let index = 0, notesVisible = false, running = false, accumulated = 0, startedAt = 0;
const overview = el('overview');
function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {
  const available = Math.max(100, innerHeight - document.querySelector('nav').offsetHeight - 18);
  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `${SPEECH_DATA.title.split('：')[0]} · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / ${String(SPEECH_DATA.minutes).padStart(2,'0')}:00`;el('timer').classList.toggle('over',secs>=SPEECH_DATA.minutes*60);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
SPEECH_DATA.downloads.forEach(d=>{const b=node('button',d.label);b.onclick=()=>save(d.name,d.text);el('downloads').append(b);});
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&(e.target.closest('textarea,input,select')||(e.target.closest('button')&&[' ','Enter'].includes(e.key))))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
