<dialog id="overview"><h2>用 Agent 做領域設計：不變量、邊界與舊系統 · 投影片總覽</h2><div id="overview-list"></div><button id="close-overview">關閉 Esc</button></dialog>
<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "開場", "title": "用 Agent 做領域設計，人守什麼", "lead": "D3 做了三個新需求。這一場把背後的 DDD 概念講清楚，再看業界怎麼讓 Agent 照著領域模型寫程式。", "cards": [["今天的概念", "不變量、Aggregate、領域事件、Port 與防腐層。"], ["今天的做法", "交給 Agent 的指令，以及人要確認什麼。"], ["今天的案例", "2025–2026 年的舊系統現代化做法。"]], "check": "D3 三段裡，哪一個決定你們吵最久？最後靠什麼定案？", "notes": "0–2 分鐘。這是講解，不是揭曉：本場不公布任何一張需求卡的參考設計，也不說哪個 Context 是「對的」負責者，未來梯次也會看到這份簡報。先問開場題並記下答案，最後一頁回來對照。本場大部分是新內容：概念用業界最常引用的例子講，每個概念後面接一個交給 Agent 的示範指令；示範指令沒有實際執行，就說未驗證。案例的數字都是該公司自己說的，本工作坊沒有量測效率。"}, {"id": "why-model", "chapter": "為什麼要模型", "title": "先有模型，Agent 才寫得對", "lead": "第 01 場說過 Agent 沒有走廊記憶；加深一層：做設計時，需求講不清楚，它就自己下結論。", "cards": [["Agent 常見的錯", "沒講清楚的規則，它會補一個看起來合理的。"], ["模型提供什麼", "名詞、規則、邊界寫下來，Agent 才有依據。"], ["人保留什麼", "哪條規則成立、歸誰負責，由人決定。"]], "check": "你最近交給 Agent 的工作，有沒有一條規則是它自己補的？", "notes": "2–4 分鐘。Birgitta Böckeler 在 martinfowler.com 的實測紀錄（2025-03）寫到：沒有詳細描述功能需求時，「AI jumps to the wrong conclusions」，而且常常一次做很廣，而不是一小段一小段做出能用的功能。「沒有走廊記憶」與 Evans 2026 主題演講「模型仍重要」都在第 01 場講過，這裡只回扣一句，不重講。這就是先建共用模型、再讓 Agent 寫程式的理由。📖 延伸閱讀：〈The role of developer skills in agentic coding〉（Birgitta Böckeler／martinfowler.com，2025）。"}, {"id": "invariant", "chapter": "不變量與 Aggregate", "title": "不變量：c 一定等於 a + b", "lead": "Invariant（不變量）是任何時候都必須成立的業務規則。Vernon 的例子：a 是 2、b 是 3，c 就必須是 5。", "flow": ["改了 a 或 b", "同一次操作裡重算 c", "結束時 c = a + b"], "cards": [["寫得好", "說得出怎樣算失敗：c 不等於 a + b。"], ["寫不好", "「金額要正確」：沒辦法判斷何時失敗。"]], "check": "挑一條你們寫的不變量：怎樣算它被破壞了？", "notes": "4–6 分鐘。Vaughn Vernon〈Effective Aggregate Design〉第一部分（2011）原文：「An invariant is a business rule that must always be consistent.」c = a + b 的意思：a、b 任何一個改了，c 必須在同一次操作裡跟著改，否則規則就被破壞。換成業務語言：訂單總額等於各明細小計加總。人判斷不變量寫得好不好，只問一題：說得出失敗的樣子嗎？說不出來的，Agent 也寫不出會失敗的測試。對照 D3 各段檢查點 2。📖 延伸閱讀：〈Effective Aggregate Design, Part I〉（Vaughn Vernon，2011）；Vaughn Vernon《Implementing Domain-Driven Design》（2013）第 10 章〈Aggregates〉。"}, {"id": "aggregate", "chapter": "不變量與 Aggregate", "title": "Aggregate：訂單和它的明細", "lead": "Aggregate（聚合）是一組必須一起保持一致、可以當成一個單位處理的資料。Fowler 的例子：訂單和它的明細行。", "cards": [["唯一入口", "外界只拿得到訂單（根），不能直接改某一行明細。"], ["一起成立", "入口先檢查全部規則，再一次寫入。"]], "check": "如果有人能直接改明細，訂單總額的規則還守得住嗎？", "notes": "6–8 分鐘。Martin Fowler〈DDD_Aggregate〉（2013）把 Aggregate 說成「a cluster of domain objects that can be treated as a single unit」，例子就是訂單與明細：分開的物件，但當成一個單位處理。Eric Evans 的定義摘要：外部物件只能持有根的參照（「allow external objects to hold references to the root only」），入口叫 Aggregate root。為什麼重要：總額等於明細加總這條不變量，只能由同一個入口守住；如果 Agent 另外寫了一條路徑直接改明細，規則就破了。D3c 哪些資料放在同一個邊界由學員決定，不要給答案。D3c 檢查點 5 登記規則時會寫上它守的 Aggregate；本 DLC 用的模型工具會拒絕和 Aggregate 不在同一個 Context 的規則，因為一個 Aggregate 只活在一個 Bounded Context 裡（Vernon 第 10 章）。被拒絕時是邊界的問題，讓學員決定，不讓 Agent 刪掉欄位硬過。📖 延伸閱讀：〈DDD_Aggregate〉（Martin Fowler，2013）；Eric Evans〈Domain-Driven Design Reference〉（2015）。"}, {"id": "small-aggregate", "chapter": "不變量與 Aggregate", "title": "Aggregate 要小：無人機外送", "lead": "只放必須在同一次交易裡一致的資料；其他 Aggregate 用 id 參照，邊界外的資料事後同步。", "flow": ["外送只存無人機 id", "外送完成：發出事件", "帳務收到後開發票"], "cards": [["為什麼要小", "越大越容易同時被改，也越難一起成功。"], ["經驗法則", "服務不小於一個 Aggregate，不大於一個 Bounded Context。"]], "check": "你們的邊界裡，有沒有一份資料其實可以事後再同步？", "notes": "8–10.5 分鐘。Microsoft Azure Architecture Center〈Use Tactical DDD to Design Microservices〉（2026-02 更新）的無人機外送範例：Delivery 不直接抓住無人機物件，只存 DroneId；外送完成時發出 DeliveryCompleted 事件，帳務再去開發票。原文規則：「Include only the data that must remain consistent within a single transaction.」Evans 的摘要：邊界內同步套用一致性規則，跨邊界非同步處理。經驗法則原文：服務「no smaller than an aggregate and no larger than a bounded context」。和 D3c 的關係：哪些資料一定要全有或全無，是人要做的取捨；不說參考設計。📖 延伸閱讀：〈Use Tactical DDD to Design Microservices〉（Microsoft Azure Architecture Center，2026）；〈Effective Aggregate Design, Part I〉（Vaughn Vernon，2011）。"}, {"id": "domain-event", "chapter": "不變量與 Aggregate", "title": "領域事件：領域專家在乎的事", "lead": "「資料表多了一列」不是領域事件；「外送取消了」才是。用過去式寫，懂業務的人一聽就懂。", "cards": [["找事件的方法", "EventStorming：橘色便利貼寫事件，照時間排。"], ["跨邊界同步", "邊界外的資料，靠事件事後更新。"], ["交給 Agent", "請它從程式列出事件，人刪掉技術動作。"]], "check": "Agent 列的事件裡，有沒有一個其實只是技術動作？", "notes": "10.5–12.5 分鐘。Evans 的定義：「Something happened that domain experts care about.」Azure 用同一組對比說明：「a record was inserted into a table」不算，「a delivery was canceled」才算。Alberto Brandolini 2013 年介紹 EventStorming：用橘色便利貼寫領域事件，貼在長紙卷上照時間排（「the convention is to use orange stickies for this purpose」）。今天不教完整工作坊，只借它的規則：事件用過去式、用業務語言。Agent 的用法：先從程式與紀錄列一版，人刪掉「已儲存」「已呼叫 API」這種技術動作。這也接上前一頁：跨 Aggregate 的同步就是靠事件。📖 延伸閱讀：〈Introducing Event Storming〉（Alberto Brandolini，2013）；Eric Evans〈Domain-Driven Design Reference〉（2015）；〈Use Tactical DDD to Design Microservices〉（Microsoft Azure Architecture Center，2026）。"}, {"id": "definitions", "chapter": "不變量與 Aggregate", "title": "定義要寫「是什麼」，也寫「不是什麼」", "lead": "Agent 最常把相近的東西當成這個概念；給它判斷用的定義時，連同「不是」一起給。", "prompt": "先不要修改任何檔案。請把這次提出的 Aggregate、規則與領域事件候選，逐一對照下面的定義：Aggregate 是由一個根守住、橫跨多個物件的一條不變量，不是資料表；規則是能被推翻的敘述，不是測試名稱；領域事件是提交後業務在乎的事，不是技術通知。不符合的標出來、說明理由，不要自己改，列完停下。", "cards": [["Aggregate", "是：根守住的跨物件不變量；不是：資料表。"], ["規則", "是：能被推翻的敘述；不是：測試名稱。"], ["領域事件", "是：提交後業務在乎的事；不是：技術通知。"]], "check": "D3 的候選裡，有沒有一個其實落在「不是」那一欄？", "notes": "12.5–15 分鐘。新概念：用「是／不是」寫定義。前三頁的概念收成一張表，給 Agent 當檢查標準。Aggregate 回扣 Vernon 的不變量：沒有一條要一起守的不變量，就不是 Aggregate，只是有子物件的類別或一張表。規則要說得出怎樣算違反；測試名稱只是線索，斷言拒絕情況的測試才是證據。領域事件回扣 Evans 與 Azure：已儲存、已呼叫 API 不算。看起來像但缺定義性質時，寧可不記，或只記成較弱的概念（例如一個名詞）。第 01 場說 Agent 定 Aggregate 不可靠，這張表就是人審查時的標準。示範提示詞，未實際執行。"}, {"id": "agent-boundary", "chapter": "不變量與 Aggregate", "title": "交給 Agent：先列不變量，再提邊界", "lead": "請 Agent 把不變量和放寬時的補救方式並列，提兩個邊界選項，人來選。", "prompt": "先不要修改任何程式。請依需求文件與共用模型，列出這個功能的每條不變量，每條寫一句「怎樣算失敗」。再提 2 個一致性邊界的選項（A、B）：各自哪些資料一起改、哪些用事件事後同步、放寬時怎麼補救。每點附證據：檔案路徑:行號或模型裡的 id。不要替我選，列完停下。", "cards": [["證據來自事實", "選項要指到模型或程式，不是 Agent 的偏好。"], ["回覆很短", "「選 A」；想混合就直接說。"]], "check": "每條不變量都說得出失敗的樣子嗎？選項的取捨你看得懂嗎？", "notes": "15–17.5 分鐘。DDD Crew 的〈Aggregate Design Canvas〉把「不變量」和「修正政策」（放寬即時一致時怎麼補救）放在同一張畫布，原文說這樣「will make design trade-offs explicit」。這頁的提示詞就是請 Agent 先填畫布的這兩欄，人只做選擇。這是主課 B2「比較方案」與 D3 檢查點 2 的加深：比較的依據換成已審查的模型。示範提示詞未實際執行，不要宣稱結果。📖 延伸閱讀：〈Aggregate Design Canvas〉（DDD Crew）。"}, {"id": "port", "chapter": "外部系統", "title": "Port／Adapter：插座規格與轉接頭", "lead": "Port 用自己的業務用語說「我需要什麼」；Adapter 把它翻成外部服務的格式。", "flow": ["領域程式", "Port（自己的用語）", "Adapter（翻譯）", "外部服務"], "cards": [["原始用意", "人、程式、測試都能用同一種方式驅動系統。"], ["好處", "換服務商、用假服務測逾時，只動 Adapter。"]], "check": "領域程式裡，有沒有出現外部服務的欄位名稱？", "notes": "17.5–19 分鐘。Alistair Cockburn〈Hexagonal Architecture〉（2005）的意圖原文：讓應用程式「equally be driven by users, programs, automated test or batch scripts」，並能和資料庫、外部裝置分開開發與測試。比喻：Port 是你家插座的規格，Adapter 是出國用的轉接頭（比喻是本課的說法，不是原文）。要不要定義 Port、由誰翻譯，是 D3a 需求卡留給學員決定的問題，不給答案。📖 延伸閱讀：〈Hexagonal Architecture〉（Alistair Cockburn，2005）；Vaughn Vernon《Implementing Domain-Driven Design》（2013）第 4 章〈Architecture〉。"}, {"id": "acl", "chapter": "外部系統", "title": "防腐層：翻譯官只翻譯", "lead": "Anticorruption Layer（防腐層）是下游自己蓋的翻譯層，讓外部系統的說法不滲進自己的模型。", "cards": [["只翻譯", "不放業務規則，也不負責流程編排。"], ["有成本", "多一層呼叫與維護；舊系統遷移時要決定留多久。"], ["也可以不蓋", "外部模型夠好時，直接照用也是一種選擇。"]], "check": "你們的翻譯層裡，有沒有藏著一條業務規則？", "notes": "19–21 分鐘。Evans 的定義：建立一個隔離層，用「your own domain model」的說法提供上游系統的功能。Azure〈Anti-Corruption Layer Pattern〉（2026-05 更新）的兩個提醒：「Avoid placing business rules or orchestration in the layer.」以及它會增加兩個系統之間的延遲。第三張卡是 Context Map 的另一種關係：Conformist（照著上游的模型走）；DDD Crew 的 Context Mapping 速查表列了所有關係的名稱，可當延伸。講防腐層的成本，是為了避免學員把它當成免費的好東西。📖 延伸閱讀：〈Anti-Corruption Layer Pattern〉（Microsoft Azure Architecture Center，2026）；〈Context Mapping〉（DDD Crew）；Eric Evans《Domain-Driven Design》（2003）第 14 章〈Maintaining Model Integrity〉。"}, {"id": "idempotency", "chapter": "外部系統", "title": "冪等：逾時是「不知道」", "lead": "Idempotency（冪等）：同一個請求送很多次，結果和送一次一樣。外部服務逾時，你不知道它到底收到沒有。", "cards": [["為什麼需要", "逾時後重送，最怕多開一張、多扣一次。"], ["人要確認", "重送與同時送出，結果都只算一次。"]], "check": "逾時後重送，你怎麼知道對方沒有處理兩次？", "notes": "21–22.5 分鐘。逾時不是成功、也不是失敗，是「不知道」；所以外部服務的回應要分類，不能只分成功與失敗。冪等和 D3b 的預留與歸還是同一類問題：重送與同時發生。Agent 很容易只寫「成功」「失敗」兩種分支，審查時請它說明逾時那一條怎麼處理。📖 延伸閱讀：Gregor Hohpe \u0026 Bobby Woolf《Enterprise Integration Patterns》（2003）〈Idempotent Receiver〉。"}, {"id": "agent-leak", "chapter": "外部系統", "title": "交給 Agent：外部說法有沒有滲進來", "lead": "固定規則抓結構，Agent 補看語意；Agent 只回報，改不改由人決定。", "prompt": "不要修改任何檔案。請檢查領域程式（不含 Adapter）有沒有出現外部服務的欄位名稱、錯誤碼或資料格式，每筆附檔案路徑:行號，並說明它該由哪一層翻譯。也列出 Adapter 裡看起來像業務規則的判斷。列成表，列完停下。", "cards": [["為什麼請 Agent", "名稱換了寫法，固定規則就抓不到。"], ["人來決定", "每筆看行號，再決定改不改。"]], "check": "表裡每一筆，你都對照過它指的那一行嗎？", "notes": "22.5–24 分鐘。Thoughtworks Technology Radar 第 34 期（2026-04）把「用 LLM 減少架構漂移」列在 Assess（評估中）：固定規則的檢查工具（例如 ArchUnit）加上 LLM 評估，可以「detect both structural and semantic violations」；同時提醒 Agent 的修正要小、要有驗證迴圈。Thomas Coopman 在 DDD Europe 2026 的工作坊也提到，可以請 Agent 拿現有程式對照 Bounded Context 的定義。這是 D1「邊界洩漏」的加深：從找一次洩漏，變成每次變更後都查。示範提示詞未實際執行。📖 延伸閱讀：〈Architecture drift reduction with LLMs〉（Thoughtworks Technology Radar，2026）。"}, {"id": "tests-guard", "chapter": "用測試守規則", "title": "測試會綠，不代表規則有人守", "lead": "第 02 場看過：Agent 可能改測試配合程式。加深一層：每條不變量都要故意改壞一次，看測試抓不抓得到。", "prompt": "先不要修改測試。請對每條不變量各做一次反事實檢查：暫時把守這條規則的程式改壞，跑測試，記錄 killed（被抓到）或 survived（沒被抓到），再把程式改回原狀。survived 的不要換改法，列出缺哪個測試，列完停下。", "cards": [["killed", "這條規則有測試守著。"], ["survived", "補一個會失敗的測試，不換較好抓的改法。"]], "check": "有沒有一條規則第一次是 survived？後來補了什麼測試？", "notes": "24–26 分鐘。加深一層：「Agent 會改測試配合程式」（系統卡）與「變異測試是最誠實的訊號」（技術雷達）都在第 02 場講過，這裡只回扣一句，不重講。新的一點是範圍：D2 只要求至少一條反事實檢查，D3 每條新規則都要；survived 時不換較好抓的改法，而是補一個會失敗的測試。示範提示詞未實際執行。"}, {"id": "card-only", "chapter": "用測試守規則", "title": "需求沒寫的，Agent 會自己補", "lead": "D3 的需求卡是唯一依據：卡片沒規定的值，寫進交接單的 Unknowns（未知事項），停下來問。", "cards": [["卡片有寫", "照做：路徑、欄位與錯誤碼不自己發明。"], ["卡片沒寫", "寫進 Unknowns：停下來問，或本段不處理。"]], "check": "Agent 有沒有自己補了一個卡片沒寫的數字或狀態？", "notes": "26–28 分鐘。回到 D3 的做法。Agent 很會「合理地補」：逾時幾秒、重試幾次、狀態叫什麼。每一個自己補的值，都是一條沒人核准的規則。這是 DLC 共同規則第 4 條，也是第 2 頁 Böckeler「AI jumps to the wrong conclusions」的實際對策。D3 停手對照時，差異分三種：有理由的取捨、漏看、Agent 補的；第三種代表 Unknowns 漏了一項。"}, {"id": "legacy-cases", "chapter": "改舊系統", "title": "案例：Agent 大量修改，人照常審查", "lead": "大公司用 Agent 改舊程式的共同點：先有清楚的規格或規則，人照常審查。數字都是公司自己說的。", "cards": [["Google，2025-01", "一次 id 型別遷移中，已合併的修改約 80% 由 AI 產生；人照常審查。"], ["Morgan Stanley（第 01 場）", "先產白話規格、工程師再重寫：同樣是人把關。"]], "check": "兩個案例裡，哪一步一定由人做？", "notes": "28–30 分鐘。Google 論文〈How is Google using AI for internal code migrations?〉（arXiv，2025-01）：int32 改 int64 的那次遷移，已合併變更裡 80% 的程式修改完全由 AI 產生，工程師自估總時間減少約 50%；原文「Humans review the LLM-generated code the same way as any other code」。這只是 Google 特定遷移的數字，而且是 Google 自稱，不能說成「Google 80% 程式由 AI 寫」。Morgan Stanley 的 DevGen.AI 在第 01 場講過，這裡只回扣一句：重點是「先產規格、人再重寫」，不是自動翻譯。本工作坊沒有量測效率。📖 延伸閱讀：〈How is Google using AI for internal code migrations?〉（Nikolov 等人，2025）。"}, {"id": "legacy-start", "chapter": "改舊系統", "title": "從一塊邊界清楚的地方開始", "lead": "舊系統現代化的建議很一致：先拆出業務領域，人核准拆法，一次改一塊、每步驗證。", "cards": [["Anthropic，2026-02", "先挑邊界清楚、複雜度中等的一個元件。"], ["AWS Transform", "拆成業務領域與分批計畫時，要人核准。"], ["DDD Europe 2026", "用 AI 產生端到端 API 測試，先守住舊行為。"]], "check": "如果你的團隊要改一個舊系統，第一塊會選哪裡？為什麼？", "notes": "30–32 分鐘。Anthropic〈How AI helps break the cost barrier to COBOL modernization〉（2026-02-23）建議從「a single component or workflow that has clear boundaries and moderate complexity」開始，一次一個元件、每步驗證；文中「quarters instead of years」是廠商主張，不是量測結果。AWS Transform 的大型主機現代化使用者指南明列：中間產物（例如「domains decomposition or wave planning」）需要人核准；InfoQ 2025-05 的上市報導沒有準確率或節省數字，不要講。Cyrille Martraire 與 Olivier Penhoat 在 DDD Europe 2026 分享：在舊系統現代化中用 AI 產生端到端 API 測試，保護一個年營收約 5 億歐元的 API，並把經驗連回 DDD 實務；只有議程摘要，沒有成效數字。共同點：邊界由人核准，舊行為先用測試守住。📖 延伸閱讀：〈How AI helps break the cost barrier to COBOL modernization〉（Anthropic，2026）；〈Modernization of mainframe applications〉（AWS Transform 使用者指南）；〈AI-Generated End-to-End API Tests: An Experience Report in Legacy Modernization〉（DDD Europe，2026）。"}, {"id": "agent-legacy", "chapter": "改舊系統", "title": "交給 Agent：舊程式先抽出領域", "lead": "請 Agent 讀舊程式，整理業務規則與候選邊界；它只提候選，由人和懂業務的人核准。", "prompt": "先不要修改任何程式。請讀這個模組，用業務語言列出：它處理哪些業務事件、守哪些規則、用到哪些名詞。每項附檔案路徑:行號，標成事實、推測或不確定。最後提 2 個可以先獨立出來的邊界選項，各寫風險。不要替我選，列完停下。", "cards": [["Agent 做", "讀大量舊程式，整理成可以審查的清單。"], ["人做", "核准哪些是真規則，選第一塊邊界。"]], "check": "清單裡標成「事實」的規則，有沒有一條你找懂業務的人確認過？", "notes": "32–34.5 分鐘。加深一層：技術雷達「用 AI 理解舊程式」、CodeConcise 由領域專家驗證、Kostyra「可以犯錯的初級領域專家」都在第 01 場講過，這裡不重講。新的一點：第 01 場只整理語言，這裡請 Agent 一路做到業務事件、規則與候選邊界，並標事實、推測或不確定；人核准規則、選第一塊邊界。這就是 DLC 的「候選要人核准才成事實」。示範提示詞未實際執行。"}, {"id": "refactor", "chapter": "寫回模型", "title": "搬程式不等於改模型", "lead": "名詞、負責者、不變量、邊界都沒變，只是搬位置或拆函式，就是重構；模型不改，只更新證據位置。", "prompt": "先不要修改任何檔案。請先列出這次改動碰到引用行的模型紀錄，再對每一筆逐項判斷模型有沒有改：名詞、決定歸哪個 Context、不變量或規則、邊界與允許的依賴、事件或約定。每項回答「有改」或「沒改」並附證據（路徑:起-迄行）。全部沒改就回「只是重構」，並列出位置變了、要重新指向的證據。列完停下。", "cards": [["是模型變更", "改名詞、換負責者、改不變量或邊界。"], ["不是", "改檔名、搬資料夾、拆函式。"]], "check": "D3 寫回模型的候選，有沒有一筆其實只是重構？", "notes": "34.5–38 分鐘。新概念：重構與模型變更的分界。Fowler〈Definition Of Refactoring〉：重構是「a change made to the internal structure of software to make it easier to understand and cheaper to modify」，而且不改變可觀察的行為。對模型來說同理：逐個元素問有沒有變；全都沒變，就不提新候選，只把證據改指新位置。Agent 常把「檔案搬了」當成模型變了，提出一堆沒必要的候選，增加審查負擔；反過來，改名其實是改模型（第 01 場：改一個名詞就是改模型）。對照 D3 各段「新知識寫回模型」與 D4 檢查點 1–2。D3b、D3c 的 Agent 先讀模型工具的變更簡報（brief），它列出改動碰到引用行的已審查紀錄，Agent 從這份清單逐筆問，不靠記憶猜哪些事實受影響。示範提示詞，未實際執行。📖 延伸閱讀：〈Definition Of Refactoring〉（Martin Fowler，2004）。"}, {"id": "next", "chapter": "下一站", "title": "D3 帶走什麼", "lead": "人定不變量與邊界，Agent 依模型實作與檢查，每條規則都要有會失敗的測試守著。", "flow": ["不變量", "Aggregate 邊界", "事件與防腐層", "Agent 實作", "每條 killed", "候選寫回"], "cards": [["今天帶走", "先列不變量與證據，再讓 Agent 動手。"], ["下一場", "模型落後程式時怎麼辦，以及怎麼交給下一個 Agent。"]], "check": "回到開場：吵最久的那個決定，最後寫進交接單的哪一段？", "notes": "38–40 分鐘，收尾。回到開場的答案。D3 留下了新程式和新候選（只算候選，要等下一次成對核准），模型與程式已經不同步，這就是下一場的起點。 模型落後程式時，先用上一頁的判斷分開「只是重構」與「模型真的變了」。"}], "title": "用 Agent 做領域設計：不變量、邊界與舊系統", "minutes": 40, "downloads": [{"label": "下載操作講義", "name": "domain-design-handout.md", "text": "# 用 Agent 做領域設計：不變量、邊界與舊系統\n\n\u003e 讀者：學員。時機：DDD 延伸課 D3a–D3c 之後的 40 分鐘講解。前置：已聽過 DLC Speech 01、02，做完 D3 三段。\n\n本場講概念與技巧，不需要寫程式或打指令。頁面上的提示詞是示範，想試再貼給自己的 Agent；沒有實際執行的結果，一律視為未驗證。案例數字都是該公司自己說的，本工作坊沒有量測效率。本場不公布三張需求卡的參考設計。\n\n## 1. 用 Agent 做領域設計，人守什麼\n\nD3 做了三個新需求。這一場把背後的 DDD 概念講清楚，再看業界怎麼讓 Agent 照著領域模型寫程式。\n\n- **今天的概念**：不變量、Aggregate、領域事件、Port 與防腐層。\n\n- **今天的做法**：交給 Agent 的指令，以及人要確認什麼。\n\n- **今天的案例**：2025–2026 年的舊系統現代化做法。\n\n**人工確認**：D3 三段裡，哪一個決定你們吵最久？最後靠什麼定案？\n\n## 2. 先有模型，Agent 才寫得對\n\n第 01 場說過 Agent 沒有走廊記憶；加深一層：做設計時，需求講不清楚，它就自己下結論。\n\n- **Agent 常見的錯**：沒講清楚的規則，它會補一個看起來合理的。\n\n- **模型提供什麼**：名詞、規則、邊界寫下來，Agent 才有依據。\n\n- **人保留什麼**：哪條規則成立、歸誰負責，由人決定。\n\n**人工確認**：你最近交給 Agent 的工作，有沒有一條規則是它自己補的？\n\n## 3. 不變量：c 一定等於 a + b\n\nInvariant（不變量）是任何時候都必須成立的業務規則。Vernon 的例子：a 是 2、b 是 3，c 就必須是 5。\n\n改了 a 或 b → 同一次操作裡重算 c → 結束時 c = a + b\n\n- **寫得好**：說得出怎樣算失敗：c 不等於 a + b。\n\n- **寫不好**：「金額要正確」：沒辦法判斷何時失敗。\n\n**人工確認**：挑一條你們寫的不變量：怎樣算它被破壞了？\n\n## 4. Aggregate：訂單和它的明細\n\nAggregate（聚合）是一組必須一起保持一致、可以當成一個單位處理的資料。Fowler 的例子：訂單和它的明細行。\n\n- **唯一入口**：外界只拿得到訂單（根），不能直接改某一行明細。\n\n- **一起成立**：入口先檢查全部規則，再一次寫入。\n\n**人工確認**：如果有人能直接改明細，訂單總額的規則還守得住嗎？\n\n## 5. Aggregate 要小：無人機外送\n\n只放必須在同一次交易裡一致的資料；其他 Aggregate 用 id 參照，邊界外的資料事後同步。\n\n外送只存無人機 id → 外送完成：發出事件 → 帳務收到後開發票\n\n- **為什麼要小**：越大越容易同時被改，也越難一起成功。\n\n- **經驗法則**：服務不小於一個 Aggregate，不大於一個 Bounded Context。\n\n**人工確認**：你們的邊界裡，有沒有一份資料其實可以事後再同步？\n\n## 6. 領域事件：領域專家在乎的事\n\n「資料表多了一列」不是領域事件；「外送取消了」才是。用過去式寫，懂業務的人一聽就懂。\n\n- **找事件的方法**：EventStorming：橘色便利貼寫事件，照時間排。\n\n- **跨邊界同步**：邊界外的資料，靠事件事後更新。\n\n- **交給 Agent**：請它從程式列出事件，人刪掉技術動作。\n\n**人工確認**：Agent 列的事件裡，有沒有一個其實只是技術動作？\n\n## 7. 定義要寫「是什麼」，也寫「不是什麼」\n\nAgent 最常把相近的東西當成這個概念；給它判斷用的定義時，連同「不是」一起給。\n\n- **Aggregate**：是：根守住的跨物件不變量；不是：資料表。\n\n- **規則**：是：能被推翻的敘述；不是：測試名稱。\n\n- **領域事件**：是：提交後業務在乎的事；不是：技術通知。\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請把這次提出的 Aggregate、規則與領域事件候選，逐一對照下面的定義：Aggregate 是由一個根守住、橫跨多個物件的一條不變量，不是資料表；規則是能被推翻的敘述，不是測試名稱；領域事件是提交後業務在乎的事，不是技術通知。不符合的標出來、說明理由，不要自己改，列完停下。\n\n**人工確認**：D3 的候選裡，有沒有一個其實落在「不是」那一欄？\n\n## 8. 交給 Agent：先列不變量，再提邊界\n\n請 Agent 把不變量和放寬時的補救方式並列，提兩個邊界選項，人來選。\n\n- **證據來自事實**：選項要指到模型或程式，不是 Agent 的偏好。\n\n- **回覆很短**：「選 A」；想混合就直接說。\n\n### 交給 Agent 的指令\n\n先不要修改任何程式。請依需求文件與共用模型，列出這個功能的每條不變量，每條寫一句「怎樣算失敗」。再提 2 個一致性邊界的選項（A、B）：各自哪些資料一起改、哪些用事件事後同步、放寬時怎麼補救。每點附證據：檔案路徑:行號或模型裡的 id。不要替我選，列完停下。\n\n**人工確認**：每條不變量都說得出失敗的樣子嗎？選項的取捨你看得懂嗎？\n\n## 9. Port／Adapter：插座規格與轉接頭\n\nPort 用自己的業務用語說「我需要什麼」；Adapter 把它翻成外部服務的格式。\n\n領域程式 → Port（自己的用語） → Adapter（翻譯） → 外部服務\n\n- **原始用意**：人、程式、測試都能用同一種方式驅動系統。\n\n- **好處**：換服務商、用假服務測逾時，只動 Adapter。\n\n**人工確認**：領域程式裡，有沒有出現外部服務的欄位名稱？\n\n## 10. 防腐層：翻譯官只翻譯\n\nAnticorruption Layer（防腐層）是下游自己蓋的翻譯層，讓外部系統的說法不滲進自己的模型。\n\n- **只翻譯**：不放業務規則，也不負責流程編排。\n\n- **有成本**：多一層呼叫與維護；舊系統遷移時要決定留多久。\n\n- **也可以不蓋**：外部模型夠好時，直接照用也是一種選擇。\n\n**人工確認**：你們的翻譯層裡，有沒有藏著一條業務規則？\n\n## 11. 冪等：逾時是「不知道」\n\nIdempotency（冪等）：同一個請求送很多次，結果和送一次一樣。外部服務逾時，你不知道它到底收到沒有。\n\n- **為什麼需要**：逾時後重送，最怕多開一張、多扣一次。\n\n- **人要確認**：重送與同時送出，結果都只算一次。\n\n**人工確認**：逾時後重送，你怎麼知道對方沒有處理兩次？\n\n## 12. 交給 Agent：外部說法有沒有滲進來\n\n固定規則抓結構，Agent 補看語意；Agent 只回報，改不改由人決定。\n\n- **為什麼請 Agent**：名稱換了寫法，固定規則就抓不到。\n\n- **人來決定**：每筆看行號，再決定改不改。\n\n### 交給 Agent 的指令\n\n不要修改任何檔案。請檢查領域程式（不含 Adapter）有沒有出現外部服務的欄位名稱、錯誤碼或資料格式，每筆附檔案路徑:行號，並說明它該由哪一層翻譯。也列出 Adapter 裡看起來像業務規則的判斷。列成表，列完停下。\n\n**人工確認**：表裡每一筆，你都對照過它指的那一行嗎？\n\n## 13. 測試會綠，不代表規則有人守\n\n第 02 場看過：Agent 可能改測試配合程式。加深一層：每條不變量都要故意改壞一次，看測試抓不抓得到。\n\n- **killed**：這條規則有測試守著。\n\n- **survived**：補一個會失敗的測試，不換較好抓的改法。\n\n### 交給 Agent 的指令\n\n先不要修改測試。請對每條不變量各做一次反事實檢查：暫時把守這條規則的程式改壞，跑測試，記錄 killed（被抓到）或 survived（沒被抓到），再把程式改回原狀。survived 的不要換改法，列出缺哪個測試，列完停下。\n\n**人工確認**：有沒有一條規則第一次是 survived？後來補了什麼測試？\n\n## 14. 需求沒寫的，Agent 會自己補\n\nD3 的需求卡是唯一依據：卡片沒規定的值，寫進交接單的 Unknowns（未知事項），停下來問。\n\n- **卡片有寫**：照做：路徑、欄位與錯誤碼不自己發明。\n\n- **卡片沒寫**：寫進 Unknowns：停下來問，或本段不處理。\n\n**人工確認**：Agent 有沒有自己補了一個卡片沒寫的數字或狀態？\n\n## 15. 案例：Agent 大量修改，人照常審查\n\n大公司用 Agent 改舊程式的共同點：先有清楚的規格或規則，人照常審查。數字都是公司自己說的。\n\n- **Google，2025-01**：一次 id 型別遷移中，已合併的修改約 80% 由 AI 產生；人照常審查。\n\n- **Morgan Stanley（第 01 場）**：先產白話規格、工程師再重寫：同樣是人把關。\n\n**人工確認**：兩個案例裡，哪一步一定由人做？\n\n## 16. 從一塊邊界清楚的地方開始\n\n舊系統現代化的建議很一致：先拆出業務領域，人核准拆法，一次改一塊、每步驗證。\n\n- **Anthropic，2026-02**：先挑邊界清楚、複雜度中等的一個元件。\n\n- **AWS Transform**：拆成業務領域與分批計畫時，要人核准。\n\n- **DDD Europe 2026**：用 AI 產生端到端 API 測試，先守住舊行為。\n\n**人工確認**：如果你的團隊要改一個舊系統，第一塊會選哪裡？為什麼？\n\n## 17. 交給 Agent：舊程式先抽出領域\n\n請 Agent 讀舊程式，整理業務規則與候選邊界；它只提候選，由人和懂業務的人核准。\n\n- **Agent 做**：讀大量舊程式，整理成可以審查的清單。\n\n- **人做**：核准哪些是真規則，選第一塊邊界。\n\n### 交給 Agent 的指令\n\n先不要修改任何程式。請讀這個模組，用業務語言列出：它處理哪些業務事件、守哪些規則、用到哪些名詞。每項附檔案路徑:行號，標成事實、推測或不確定。最後提 2 個可以先獨立出來的邊界選項，各寫風險。不要替我選，列完停下。\n\n**人工確認**：清單裡標成「事實」的規則，有沒有一條你找懂業務的人確認過？\n\n## 18. 搬程式不等於改模型\n\n名詞、負責者、不變量、邊界都沒變，只是搬位置或拆函式，就是重構；模型不改，只更新證據位置。\n\n- **是模型變更**：改名詞、換負責者、改不變量或邊界。\n\n- **不是**：改檔名、搬資料夾、拆函式。\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請先列出這次改動碰到引用行的模型紀錄，再對每一筆逐項判斷模型有沒有改：名詞、決定歸哪個 Context、不變量或規則、邊界與允許的依賴、事件或約定。每項回答「有改」或「沒改」並附證據（路徑:起-迄行）。全部沒改就回「只是重構」，並列出位置變了、要重新指向的證據。列完停下。\n\n**人工確認**：D3 寫回模型的候選，有沒有一筆其實只是重構？\n\n## 19. D3 帶走什麼\n\n人定不變量與邊界，Agent 依模型實作與檢查，每條規則都要有會失敗的測試守著。\n\n不變量 → Aggregate 邊界 → 事件與防腐層 → Agent 實作 → 每條 killed → 候選寫回\n\n- **今天帶走**：先列不變量與證據，再讓 Agent 動手。\n\n- **下一場**：模型落後程式時怎麼辦，以及怎麼交給下一個 Agent。\n\n**人工確認**：回到開場：吵最久的那個決定，最後寫進交接單的哪一段？\n\n## 完成條件\n能用自己的話說明不變量、Aggregate、領域事件、Port／Adapter 與防腐層、冪等各解決什麼問題；會用「是什麼／不是什麼」檢查 Agent 提的概念、分得出重構與模型變更；會用「先列不變量與證據、Agent 提選項、人來選」的方式把領域設計交給 Agent；知道測試會綠不代表規則有人守；說得出近期用領域模型引導 Agent 改舊系統的做法。\n"}]};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;
const el = id => document.getElementById(id);
let index = 0, notesVisible = false, running = false, accumulated = 0, startedAt = 0;
const overview = el('overview');
function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {
  const available = Math.max(100, innerHeight - document.querySelector('nav').offsetHeight - 18);
  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `${SPEECH_DATA.title.split('：')[0]} · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / ${String(SPEECH_DATA.minutes).padStart(2,'0')}:00`;el('timer').classList.toggle('over',secs>=SPEECH_DATA.minutes*60);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
SPEECH_DATA.downloads.forEach(d=>{const b=node('button',d.label);b.onclick=()=>save(d.name,d.text);el('downloads').append(b);});
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&(e.target.closest('textarea,input,select')||(e.target.closest('button')&&[' ','Enter'].includes(e.key))))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
</body>
</html>
