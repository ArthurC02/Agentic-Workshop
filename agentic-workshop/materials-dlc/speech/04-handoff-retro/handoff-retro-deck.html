<dialog id="overview"><h2>交接與導入：讓下一個 Agent 接得上 · 投影片總覽</h2><div id="overview-list"></div><button id="close-overview">關閉 Esc</button></dialog>
<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "開場", "title": "明天換人接手", "lead": "接手的人只看得到 Repo、共用模型與交接單；今天的對話，他和下一個 Agent 都看不到。", "cards": [["今天的概念", "交接、共用模型、評估 Agent、共用指示。"], ["今天的案例", "2025–2026 年的研究與 DDD 社群的做法。"]], "check": "如果明天換你接手，你最先打開哪一個檔？", "notes": "0–1.5 分鐘。這是講解，不是重做 D4 與回顧。先問開場題並記下答案，最後回來對照。本場大部分是新內容：交接為什麼會失敗、Agent 為什麼要靠外部筆記、團隊怎麼維護共用指示，以及怎麼把「用 Agent 做 DDD」帶回團隊。示範指令沒有實際執行，就說未驗證；案例數字都是對方自己說的，本工作坊沒有量測效率。"}, {"id": "handoff-why", "chapter": "交接", "title": "交接最常掉的是「為什麼」", "lead": "決定留下來了，理由沒留下來，後來的人只能盲從或盲改。Agent 每次開新對話，都是後來的人。", "cards": [["寫在 Repo", "換人、換 Agent，都看得到同一份紀錄。"], ["寫理由", "不只寫做了什麼，也寫為什麼、不做什麼。"]], "check": "你的交接單裡，有沒有一個決定只寫了結果、沒寫理由？", "notes": "1.5–3 分鐘。加深一層：Nygard 的 ADR 與「blind acceptance or blind reversal」在第 02 場講過，不重講。這裡的新角度是交接：同一篇文章也說決策紀錄放在 Repo，團隊換人也看得到；對 Agent 來說更嚴重，每次新對話都從零開始。D4 交接單的 Forces 與 Decision 兩段，就是在寫理由。"}, {"id": "story", "chapter": "交接", "title": "用編號句子講一遍領域", "lead": "Domain Storytelling 的寫法：誰（角色）做了什麼（動詞）、對什麼（工作物件），照發生順序編號。", "code": "1  客人      下單    外送\n2  調度員    指派    無人機\n3  無人機    完成    外送\n4  帳務      開立    發票", "cards": [["人看得懂", "懂業務的人不讀程式，也能指出哪句不對。"], ["Agent 讀得準", "名詞和動詞都來自通用語言，不必猜。"]], "check": "你能用 5 句以內的編號句子，講出 D3 其中一個需求嗎？", "notes": "3–5 分鐘。domainstorytelling.org 的〈Domain Storytelling Quick Start Guide〉：角色的活動畫成箭頭，標上領域語言的動詞（「labeled with verbs from the domain language」），句子照發生順序編號。投影片沿用第 03 場的無人機外送例子。用在交接：交接單前面放一段編號故事，接手的人和 Agent 先知道業務流程，再看細節。可以請 Agent 從程式與模型草擬，再由人逐句改。官網沒有列作者名，不要說是誰發明的。📖 延伸閱讀：〈Domain Storytelling Quick Start Guide〉（domainstorytelling.org）。"}, {"id": "external-memory", "chapter": "交接", "title": "共用模型是 Agent 的外部記憶", "lead": "第 01 場說過上下文有限；加深一層：長任務靠寫在外面的筆記，交接單只放 id 與路徑，需要時再讀。", "cards": [["筆記寫在外面", "共用模型與交接單在 Repo，不在對話裡。"], ["只放指標", "交接單放 id、檔案路徑；細節到模型裡查。"]], "check": "你的交接單，是貼了整段內容，還是只放查得到的 id？", "notes": "5–6.5 分鐘。加深一層：「上下文是有限的資源」與「給太多反而變差」在第 01 場講過，不重講。新的一點來自同一篇 Anthropic〈Effective context engineering for AI agents〉：Agent 保留輕量的識別碼（檔案路徑、查詢、連結），需要時再載入；長任務用結構化筆記寫在上下文外面。第 01 場提過的 Chelsea Troy 也是同一個直覺：Bounded Context 的想法可以拿來管 Agent 的上下文。"}, {"id": "readable-model", "chapter": "交接", "title": "人和 Agent 讀同一份模型", "lead": "每個概念一份 Markdown 文件，關係寫成有型別的連結：人直接讀得懂，Agent 也照著走。", "code": "# 借閱（名詞）\n讀者把館藏帶走，約定期限內歸還。\n## 關係\n- 屬於：流通 Context（contexts/circulation）\n- 不要用：借書、租借\n## 證據\n- docs/example.md#L41-48", "cards": [["人看得懂", "審查的人直接讀，不靠工具轉譯。"], ["關係有型別", "連結寫明「屬於」「不要用」，Agent 不必猜。"]], "check": "你們團隊的模型，不靠工具打得開、讀得懂嗎？", "notes": "6.5–8.5 分鐘。加深上一頁：外部記憶要人和 Agent 讀同一份，才能互相檢查。一種做法是每個概念一份 Markdown，關係寫成連結並說明是哪一種關係；Google Cloud 提出的 Open Knowledge Format（OKF）就是這種格式，規格的說法是「If you can cat a file, you can read OKF.」本 DLC 使用的模型工具也用這種格式保存共用模型，只是其中一個例子；團隊用 Repo 裡的 Markdown 加審查，道理相同。範例延續第 01 場的圖書館示意，不是 Repo 的內容。D2 夥伴審查時，可以直接打開要變更的那份文件看。📖 延伸閱讀：〈Open Knowledge Format (OKF)〉規格（Google Cloud）。"}, {"id": "cite", "chapter": "交接", "title": "看起來合理的名字最危險", "lead": "第 01 場看過：模型會編出看起來合理的名字。加深一層：交接單裡的每個 id，都要逐一查證。", "prompt": "不要修改任何檔案。請把這份交接單引用的每個 id 與檔案路徑列出來，逐一到共用模型與 Repo 查證：查得到、查不到、或狀態不同（例如寫成已審查事實，其實是候選）。列成表，查不到的不要自己補，列完停下。", "cards": [["為什麼會錯", "Agent 照格式「合理地」編出名字。"], ["人看什麼", "表裡有沒有「查不到」或「狀態不同」。"]], "check": "你的交接單裡，有沒有一個 id 第一次查不到？", "notes": "8.5–10 分鐘。套件幻覺研究（USENIX Security 2025）的數字第 01 場講過，這裡只回扣一句，不重唸。交接單裡的 id 是同一種風險：格式對、看起來合理，卻查不到。就算給了正確的上下文，Agent 也不一定照做：Böckeler 2025-10 談規格驅動開發時寫「I frequently saw the agent ultimately not follow all the instructions.」所以逐一查證不能省。這是 D4 的技巧，對照 D4 檢查點 3。示範提示詞未實際執行。📖 延伸閱讀：〈Understanding Spec-Driven-Development: Kiro, spec-kit, and Tessl〉（Birgitta Böckeler／martinfowler.com，2025）。"}, {"id": "drift", "chapter": "模型維護", "title": "模型會落後程式：定期回收", "lead": "程式一直在變，人與 Agent 都會照著既有寫法複製；模型和程式的落差要定期清，不是寫一次就好。", "prompt": "不要修改任何檔案，也不要試著修好。請比對共用模型與目前的程式：列出模型有、但程式已經不同的規則，和程式有、但模型還沒記的規則，每筆附模型 id 與檔案路徑:行號。列成表，列完停下。", "cards": [["不要硬改", "落差寫成新候選或 Unknowns，等人核准。"], ["定期做", "每次大變更後跑一次，像垃圾回收。"], ["擋在門口", "引用沒跟上，commit 就進不來。"]], "check": "Agent 回報落差時，有沒有想自己「修好」它？", "notes": "10–12 分鐘。加深一層：技術雷達〈Architecture drift reduction with LLMs〉在第 03 場講過「固定規則加 LLM 一起查」與「修正要小、要有驗證迴圈」，不重講。這裡補同一條目的另一面：Agent 與人都會複製既有的寫法，包括不好的，所以漂移會累積；他們用垃圾回收比喻定期清理。D4 檢查點 1 的「來源過期」就是漂移；Agent 很容易自己去改，所以提示詞寫「不要試著修好」。D4 檢查點 3 再加一道門：提交前檢查（pre-commit hook）擋下改到被引用程式、引用卻沒跟上的 commit，讓新的漂移進不來；Git 官方文件〈githooks〉：pre-commit 回傳非 0 時，git commit 在建立 commit 前就中止。示範提示詞未實際執行。"}, {"id": "eval", "chapter": "模型維護", "title": "評估 Agent：和人審過的模型比", "lead": "讓 Agent 從程式重新整理一份模型，和人審查過的逐筆配對：它漏了什麼、多編了什麼。", "prompt": "先不要修改任何檔案。請只讀程式，重新整理一份名詞、Context 與規則清單，這一步不要讀共用模型。整理完再和共用模型裡已審查的紀錄逐筆配對，列三張表：配對成功、已審查但你沒找到、你找到但沒有已審查紀錄的。最後算精確率與召回率，列完停下。", "cards": [["漏掉的", "人審過、Agent 沒找到：召回率低。"], ["多出的", "Agent 有、人沒認可：精確率低。"], ["先讀清單", "分數只看結構；漏掉與多出逐筆讀。"]], "check": "多出來的那幾筆，是 Agent 編的，還是人漏審的？", "notes": "12–14.5 分鐘。新概念：用人審過的模型評估 Agent（eval）。人工審查過的模型就是基準答案（gold set）。精確率：Agent 提出的裡面，有多少是對的；召回率：該找到的裡面，Agent 找到多少（Google〈Classification: Accuracy, recall, precision, and related metrics〉）。Anthropic〈Demystifying evals for AI agents〉（2026-01）建議用人的判斷校準評分，而且「we do not take eval scores at face value」：要讀實際紀錄。所以分數之外一定讀兩張清單：多出的可能是編造（回扣第 01 場的幻覺），也可能是人沒審到的真規則；措辭不同但意思一樣的規則，也可能被算成漏掉。引用和基準答案一字不差的配對多半是照抄來的（例如核准後沒動過的紀錄），算分前要排除，否則分數看起來完美卻量不到 Agent 自己的能力。換模型、改提示詞、改擷取順序前後各跑一次，才知道有沒有變好。對照回顧檢查點 2。本 DLC 使用的模型工具有現成的比較指令，只是一種做法。示範提示詞，未實際執行。📖 延伸閱讀：〈Demystifying evals for AI agents〉（Anthropic Engineering，2026）；〈Classification: Accuracy, recall, precision, and related metrics〉（Google Machine Learning Crash Course）。"}, {"id": "curated", "chapter": "模型維護", "title": "團隊共用的 Agent 指示是工程資產", "lead": "規則檔不是個人習慣：放進版本控制，像程式一樣審查與維護。", "cards": [["放哪裡", "每次對話都會讀的規則檔，例如 AGENTS.md、CLAUDE.md。"], ["放什麼", "通用語言、不用的同義詞、哪些事要先問人。"], ["誰維護", "改規則也要審查，和改程式一樣。"]], "check": "你的團隊裡，有沒有一份大家共用、而且有人審查的規則檔？", "notes": "14.5–16 分鐘。Thoughtworks Technology Radar 第 34 期（2026-04）把「Curated shared instructions for software teams」列為 Adopt（建議採用），原文：「treating AI guidance as a collaborative engineering asset rather than a personal workflow」。條目本身就並列多種工具的規則檔（AGENTS.md、CLAUDE.md、.cursorrules），本課不指定工具。和 DDD 的關係：通用語言、不用哪些同義詞、哪個 Context 負責什麼，是最值得放進共用指示的內容；社群也有人把對話裡的術語整理成詞彙表檔（只當佐證，不推薦安裝）。這是主課 Skill 與共同規則的加深一層。📖 延伸閱讀：〈Curated shared instructions for software teams〉（Thoughtworks Technology Radar，2026）；OpenAI Codex〈Custom instructions with AGENTS.md〉。"}, {"id": "bloat", "chapter": "模型維護", "title": "指示越長，越容易被忽略", "lead": "每多一行指示，其他規則就多一分被忽略的機會。檢查每一行：刪掉它，Agent 會犯錯嗎？", "prompt": "不要修改任何檔案。請逐行檢查團隊的規則檔：哪些行刪掉後你會犯錯、哪些和其他行重複、哪些只在特定工作才用得到。列成表，每行附原因，建議刪除或移出的也列出來。列完停下，由我決定。", "cards": [["每次都用到", "留在規則檔。"], ["偶爾才用", "移到需要時才讀的文件或 Skill。"]], "check": "你的規則檔裡，有沒有一行刪掉也不會出錯？", "notes": "16–17.5 分鐘。Thoughtworks Radar 第 34 期把「Agent instruction bloat」列為 Caution（要小心）：「As instructions grow, the likelihood increases that important rules are ignored.」Claude Code 官方文件〈Best practices for Claude Code〉也這樣提醒，並給了檢查題：「Would removing this cause Claude to make mistakes?」其他工具的官方文件通常有對應章節。D4 交接單固定七段、沒內容寫「無」，也是同一個理由：短、可預期。示範提示詞未實際執行。📖 延伸閱讀：〈Agent instruction bloat〉（Thoughtworks Technology Radar，2026）；Claude Code 官方文件〈Best practices for Claude Code〉。"}, {"id": "limits", "chapter": "帶回團隊", "title": "說清楚：今天的簽章是教學示範", "lead": "兩人在同一台機器上，任一人都拿得到私鑰，推送前的檢查也能被跳過；它不能證明真的有兩個人審查。", "cards": [["它的用處", "讓你看見每一步留下什麼證據。"], ["真實團隊要什麼", "每人自己的金鑰，伺服器端擋住沒核准的合併。"]], "check": "要證明「真的有另一個人審查過」，今天還缺什麼？", "notes": "17.5–19 分鐘。這一頁一定要講，不要讓學員以為今天的設定就是安全保證。推送前的檢查（pre-push）可以用 git push --no-verify 跳過，D4 裝的提交前檢查（pre-commit）也能用 git commit --no-verify 跳過；同一台機器上誰都能拿到私鑰。真實團隊用受保護分支這類伺服器端檢查（一般概念，不點名平台）：沒核准不能合併，不靠本機。這也呼應第 02 場的 AWS Kiro 事件：Amazon 事後加入的就是正式環境存取的強制同儕審查。📖 延伸閱讀：Git 官方文件〈githooks〉的 pre-push 與 pre-commit 兩節；Git 官方文件〈git-push〉的 --no-verify 選項說明。"}, {"id": "retro", "chapter": "帶回團隊", "title": "回顧：用證據決定留下哪些把關", "lead": "請 Agent 從 notes/、交接單與版本紀錄整理證據，人判斷哪一步真的擋住過錯；沒有紀錄就寫「未觀察」。", "cards": [["擋住過", "紀錄裡找得到它抓到的錯。"], ["只是做完", "做了，但沒有改變任何結果。"], ["帶走一項行動", "寫出誰做、何時、怎麼知道做到了。"]], "check": "你的回顧裡，有沒有一句沒有證據、卻寫成了結論？", "notes": "19–21.5 分鐘。對照回顧檢查點 1–3。這是第 01 場「要證據，不要形容詞」的加深一層：同一個原則，從檢查 Agent 的回報，用到檢查我們自己的回顧。照流程做完不代表沒價值，可能只是今天剛好沒遇到錯，但要誠實分開說；這一頁的答案每組不同，請兩三組分享。行動要小，例如「下週替一個常吵的名詞寫定義並請同事核准」。本工作坊沒有量測效率，不要引用任何效率數字。最後提醒：私鑰已刪、表單已匯出。"}, {"id": "adopt", "chapter": "帶回團隊", "title": "帶回團隊：從一個 Context 開始", "lead": "AI 不會修好團隊，只會放大原有的長處與短處。先挑一個常吵的名詞或規則，寫下來、請人核准。", "flow": ["一個名詞或規則", "寫進共用模型", "有人審查", "Agent 依它工作", "測試守著"], "cards": [["共用的部分要小", "改共用模型之前，先問會受影響的團隊。"], ["一個審查角色", "誰負責核准共用模型，要有人擔任。"]], "check": "回到開場：明天接手時你打開的那個檔，今天有寫好嗎？", "notes": "21.5–25 分鐘，系列收尾。DORA 2025 報告（Google Cloud，2025-09-24）：「AI doesn't fix a team; it amplifies what's already there.」Evans 對 Shared Kernel（共用核心）的提醒：「Keep this kernel small.」而且改之前要和另一個團隊商量。兩句合起來就是導入建議：先把一小塊語言與規則寫清楚、有人審查，再讓 Agent 依它工作；一次一個 Context，接回第 03 場 Anthropic 與 AWS 的「一次一塊、每步驗證」。回到開場答案，請每人說出自己的一項行動；第 01 場提過的 DDD Europe 2026 做法（從程式抽詞彙、LLM 當可以犯錯的初級專家、LLM 畫邊界畫布）都可以當第一步，只有議程摘要、沒有成效數字。Evans 2024 年鼓勵 DDD 實踐者「start learning about LLMs and conducting experiments now」，也說看法會過期；今天的做法也一樣，回去要用自己的紀錄驗證。📖 延伸閱讀：〈Announcing the 2025 DORA Report〉（Google Cloud，2025）；〈Eric Evans Encourages DDD Practitioners to Experiment with LLMs〉（InfoQ，2024）；Eric Evans〈Domain-Driven Design Reference〉（2015）。"}], "title": "交接與導入：讓下一個 Agent 接得上", "minutes": 25, "downloads": [{"label": "下載操作講義", "name": "handoff-retro-handout.md", "text": "# 交接與導入：讓下一個 Agent 接得上\n\n\u003e 讀者：學員。時機：DDD 延伸課 D4 與回顧之後的 25 分鐘講解。前置：已聽過前三場 DLC Speech，手邊有自己的 notes/ 與 docs/handoffs/。\n\n本場講概念與技巧，不需要寫程式或打指令。頁面上的提示詞是示範，想試再貼給自己的 Agent；沒有實際執行的結果，一律視為未驗證。案例數字都是對方自己說的，本工作坊沒有量測效率。\n\n## 1. 明天換人接手\n\n接手的人只看得到 Repo、共用模型與交接單；今天的對話，他和下一個 Agent 都看不到。\n\n- **今天的概念**：交接、共用模型、評估 Agent、共用指示。\n\n- **今天的案例**：2025–2026 年的研究與 DDD 社群的做法。\n\n**人工確認**：如果明天換你接手，你最先打開哪一個檔？\n\n## 2. 交接最常掉的是「為什麼」\n\n決定留下來了，理由沒留下來，後來的人只能盲從或盲改。Agent 每次開新對話，都是後來的人。\n\n- **寫在 Repo**：換人、換 Agent，都看得到同一份紀錄。\n\n- **寫理由**：不只寫做了什麼，也寫為什麼、不做什麼。\n\n**人工確認**：你的交接單裡，有沒有一個決定只寫了結果、沒寫理由？\n\n## 3. 用編號句子講一遍領域\n\nDomain Storytelling 的寫法：誰（角色）做了什麼（動詞）、對什麼（工作物件），照發生順序編號。\n\n- **人看得懂**：懂業務的人不讀程式，也能指出哪句不對。\n\n- **Agent 讀得準**：名詞和動詞都來自通用語言，不必猜。\n\n```text\n1  客人      下單    外送\n2  調度員    指派    無人機\n3  無人機    完成    外送\n4  帳務      開立    發票\n```\n\n**人工確認**：你能用 5 句以內的編號句子，講出 D3 其中一個需求嗎？\n\n## 4. 共用模型是 Agent 的外部記憶\n\n第 01 場說過上下文有限；加深一層：長任務靠寫在外面的筆記，交接單只放 id 與路徑，需要時再讀。\n\n- **筆記寫在外面**：共用模型與交接單在 Repo，不在對話裡。\n\n- **只放指標**：交接單放 id、檔案路徑；細節到模型裡查。\n\n**人工確認**：你的交接單，是貼了整段內容，還是只放查得到的 id？\n\n## 5. 人和 Agent 讀同一份模型\n\n每個概念一份 Markdown 文件，關係寫成有型別的連結：人直接讀得懂，Agent 也照著走。\n\n- **人看得懂**：審查的人直接讀，不靠工具轉譯。\n\n- **關係有型別**：連結寫明「屬於」「不要用」，Agent 不必猜。\n\n```text\n# 借閱（名詞）\n讀者把館藏帶走，約定期限內歸還。\n## 關係\n- 屬於：流通 Context（contexts/circulation）\n- 不要用：借書、租借\n## 證據\n- docs/example.md#L41-48\n```\n\n**人工確認**：你們團隊的模型，不靠工具打得開、讀得懂嗎？\n\n## 6. 看起來合理的名字最危險\n\n第 01 場看過：模型會編出看起來合理的名字。加深一層：交接單裡的每個 id，都要逐一查證。\n\n- **為什麼會錯**：Agent 照格式「合理地」編出名字。\n\n- **人看什麼**：表裡有沒有「查不到」或「狀態不同」。\n\n### 交給 Agent 的指令\n\n不要修改任何檔案。請把這份交接單引用的每個 id 與檔案路徑列出來，逐一到共用模型與 Repo 查證：查得到、查不到、或狀態不同（例如寫成已審查事實，其實是候選）。列成表，查不到的不要自己補，列完停下。\n\n**人工確認**：你的交接單裡，有沒有一個 id 第一次查不到？\n\n## 7. 模型會落後程式：定期回收\n\n程式一直在變，人與 Agent 都會照著既有寫法複製；模型和程式的落差要定期清，不是寫一次就好。\n\n- **不要硬改**：落差寫成新候選或 Unknowns，等人核准。\n\n- **定期做**：每次大變更後跑一次，像垃圾回收。\n\n- **擋在門口**：引用沒跟上，commit 就進不來。\n\n### 交給 Agent 的指令\n\n不要修改任何檔案，也不要試著修好。請比對共用模型與目前的程式：列出模型有、但程式已經不同的規則，和程式有、但模型還沒記的規則，每筆附模型 id 與檔案路徑:行號。列成表，列完停下。\n\n**人工確認**：Agent 回報落差時，有沒有想自己「修好」它？\n\n## 8. 評估 Agent：和人審過的模型比\n\n讓 Agent 從程式重新整理一份模型，和人審查過的逐筆配對：它漏了什麼、多編了什麼。\n\n- **漏掉的**：人審過、Agent 沒找到：召回率低。\n\n- **多出的**：Agent 有、人沒認可：精確率低。\n\n- **先讀清單**：分數只看結構；漏掉與多出逐筆讀。\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請只讀程式，重新整理一份名詞、Context 與規則清單，這一步不要讀共用模型。整理完再和共用模型裡已審查的紀錄逐筆配對，列三張表：配對成功、已審查但你沒找到、你找到但沒有已審查紀錄的。最後算精確率與召回率，列完停下。\n\n**人工確認**：多出來的那幾筆，是 Agent 編的，還是人漏審的？\n\n## 9. 團隊共用的 Agent 指示是工程資產\n\n規則檔不是個人習慣：放進版本控制，像程式一樣審查與維護。\n\n- **放哪裡**：每次對話都會讀的規則檔，例如 AGENTS.md、CLAUDE.md。\n\n- **放什麼**：通用語言、不用的同義詞、哪些事要先問人。\n\n- **誰維護**：改規則也要審查，和改程式一樣。\n\n**人工確認**：你的團隊裡，有沒有一份大家共用、而且有人審查的規則檔？\n\n## 10. 指示越長，越容易被忽略\n\n每多一行指示，其他規則就多一分被忽略的機會。檢查每一行：刪掉它，Agent 會犯錯嗎？\n\n- **每次都用到**：留在規則檔。\n\n- **偶爾才用**：移到需要時才讀的文件或 Skill。\n\n### 交給 Agent 的指令\n\n不要修改任何檔案。請逐行檢查團隊的規則檔：哪些行刪掉後你會犯錯、哪些和其他行重複、哪些只在特定工作才用得到。列成表，每行附原因，建議刪除或移出的也列出來。列完停下，由我決定。\n\n**人工確認**：你的規則檔裡，有沒有一行刪掉也不會出錯？\n\n## 11. 說清楚：今天的簽章是教學示範\n\n兩人在同一台機器上，任一人都拿得到私鑰，推送前的檢查也能被跳過；它不能證明真的有兩個人審查。\n\n- **它的用處**：讓你看見每一步留下什麼證據。\n\n- **真實團隊要什麼**：每人自己的金鑰，伺服器端擋住沒核准的合併。\n\n**人工確認**：要證明「真的有另一個人審查過」，今天還缺什麼？\n\n## 12. 回顧：用證據決定留下哪些把關\n\n請 Agent 從 notes/、交接單與版本紀錄整理證據，人判斷哪一步真的擋住過錯；沒有紀錄就寫「未觀察」。\n\n- **擋住過**：紀錄裡找得到它抓到的錯。\n\n- **只是做完**：做了，但沒有改變任何結果。\n\n- **帶走一項行動**：寫出誰做、何時、怎麼知道做到了。\n\n**人工確認**：你的回顧裡，有沒有一句沒有證據、卻寫成了結論？\n\n## 13. 帶回團隊：從一個 Context 開始\n\nAI 不會修好團隊，只會放大原有的長處與短處。先挑一個常吵的名詞或規則，寫下來、請人核准。\n\n一個名詞或規則 → 寫進共用模型 → 有人審查 → Agent 依它工作 → 測試守著\n\n- **共用的部分要小**：改共用模型之前，先問會受影響的團隊。\n\n- **一個審查角色**：誰負責核准共用模型，要有人擔任。\n\n**人工確認**：回到開場：明天接手時你打開的那個檔，今天有寫好嗎？\n\n## 完成條件\n說得出交接為什麼要寫理由、共用模型為什麼是 Agent 的外部記憶、為什麼要讓人和 Agent 讀同一份模型、怎麼用人審過的模型評估 Agent 漏了什麼與多編了什麼、看起來合理的 id 為什麼要逐一查證；知道模型漂移要定期回收、團隊共用指示要短且有人審查；說得出成對簽章的限制，帶走一項回到團隊的行動。\n"}]};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;
const el = id => document.getElementById(id);
let index = 0, notesVisible = false, running = false, accumulated = 0, startedAt = 0;
const overview = el('overview');
function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {
  const available = Math.max(100, innerHeight - document.querySelector('nav').offsetHeight - 18);
  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `${SPEECH_DATA.title.split('：')[0]} · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / ${String(SPEECH_DATA.minutes).padStart(2,'0')}:00`;el('timer').classList.toggle('over',secs>=SPEECH_DATA.minutes*60);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
SPEECH_DATA.downloads.forEach(d=>{const b=node('button',d.label);b.onclick=()=>save(d.name,d.text);el('downloads').append(b);});
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&(e.target.closest('textarea,input,select')||(e.target.closest('button')&&[' ','Enter'].includes(e.key))))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
</body>
</html>
