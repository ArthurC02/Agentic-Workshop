<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "開場", "title": "改模型，要有第二個人", "lead": "上一場：改一個名詞就是改模型。這一場：模型的改變怎麼審、誰核准、留下什麼。", "cards": [["上一場留下的", "附證據的語言、邊界與規則，全是候選。"], ["這一場講", "決策紀錄、做與核准分開、怎麼審證據。"]], "check": "D2 裡夥伴審查時，有沒有哪一刻想退回？", "notes": "0–1.5 分鐘。本場講業界怎麼審查與核准設計決策，以及 Agent 時代多出來的風險，不是重做 D2。沒有人想退回也值得問：是證據真的夠，還是只是蓋章？最後一頁回來對照。"}, {"id": "why-record", "chapter": "決策紀錄", "title": "決策為什麼要寫下來", "lead": "Nygard（2011）：專案裡最難追的，是當初為什麼這樣決定。", "cards": [["沒寫下來", "後來的人只能盲目照做，或盲目推翻。"], ["寫成 ADR", "背景、決定、狀態、後果，一份短短的紀錄。"]], "check": "你們團隊上一個重要的設計決定，理由寫在哪裡？", "explain": ["ADR（Architecture Decision Record，架構決策紀錄）是 Michael Nygard 2011 年提出的做法：每個重要的設計決定寫一份短紀錄，包含標題、背景、決定、狀態與後果。他的理由是：專案進行中最難追的，就是當初為什麼這樣決定；沒有紀錄，後來的人只剩兩條路，盲目照做或盲目推翻。", "Nygard 原文的五段各有一句說明：標題用簡短的名詞片語；背景寫當時有哪些力量在拉扯（技術、政治、社會與專案本身）；決定寫我們怎麼回應這些力量；狀態寫提議或已接受；後果寫套用決定之後的情況，好的壞的都寫。課程例子：需求卡 02 規定「點數折抵不是優惠類型，不參加單一優惠比較」。寫成 ADR，背景是「現行計價逐位選最有利的單一優惠」，決定是「先算優惠、再用整筆總額算折抵」，後果是「折抵不改變每位旅客的優惠金額」。Agent 看到這份紀錄，就不會把折抵當成第三種優惠塞進比較。", "AWS 的 ADR 流程指南也強調，紀錄的重點是「為什麼這樣決定」，而不是「怎麼實作」。對 Agent 來說這更關鍵：它沒參加當初的會議，只看得到 Repo；沒寫下理由的決定，在它看來就像可以隨手改掉的程式。", "下週可以挑團隊最近一個重要的設計決定，用這五段寫成一頁放進 Repo，不超過一個畫面。"], "read": ["〈Documenting Architecture Decisions〉（Michael Nygard，2011）", "〈Architectural decision record process〉（AWS Prescriptive Guidance）"], "notes": "1.5–3.5 分鐘。Michael Nygard〈Documenting Architecture Decisions〉（Cognitect，2011-11-15）提出 ADR（Architecture Decision Record，架構決策紀錄）：「One of the hardest things to track during the life of a project is the motivation behind certain decisions.」沒有紀錄，後來的人只剩「blind acceptance or blind reversal」。ADR 的段落是標題、背景、決定、狀態、後果。AWS Prescriptive Guidance 也強調紀錄重點是「為什麼」而不是「怎麼做」。對 Agent 更重要：它沒參加當初的會議，只看得到 Repo。📖 延伸閱讀：〈Documenting Architecture Decisions〉（Michael Nygard，2011）。"}, {"id": "reviewed", "chapter": "決策紀錄", "title": "新概念：已審查事實", "lead": "ADR 有狀態：提議、接受、被取代。本課的候選、已審查事實、新候選取代，一一對應。", "flow": ["提議＝候選", "接受＝已審查事實", "被取代＝新候選核准後"], "cards": [["接受後不改寫", "Agent 必須遵守，不能直接修改。"], ["要改就取代", "提新的候選，舊的保留可查。"]], "check": "Agent 想改一條已審查事實時，正確的做法是什麼？", "explain": ["ADR 有狀態。Nygard 2011 年寫的是：利害關係人還沒同意時是「提議」（proposed），同意後是「接受」（accepted）；後來的決定改變或推翻它時，標成「棄用」（deprecated）或「被取代」（superseded），並指向取代它的那一份，舊的保留可查。MADR 4.0 範本的狀態欄多列了「拒絕」（rejected）。AWS 的流程指南說，ADR 被接受或拒絕後就不再改寫；要改，就提一份新的 ADR，新的被接受後，舊的標成被取代。被拒絕的提案也要寫下理由，免得下次重吵同一件事。", "本課的用語一一對應：Agent 提的候選＝提議；經另一個人核准的已審查事實＝接受；夥伴回「退回：原因」就是不接受，理由寫在提案的紀錄裡；要改已審查事實，就提一筆新候選，核准後取代舊的。已審查事實不是永遠不能變，而是只能透過同一套審查流程改。", "各來源的狀態名稱不完全一樣：Nygard 有「棄用」，AWS 只講提議、接受、拒絕、被取代；AWS 還有「需要重做」的情況，那時狀態仍是提議。不必背哪一套，團隊選一套寫進範本，所有人用同一套就好。", "常見誤解：Agent 發現事實「好像過時了」就直接改。正確做法是讓它提新候選、附證據，等人核准。下週可以看看團隊的設計文件有沒有狀態欄位，還是改了就直接覆蓋。"], "read": ["〈Architectural decision record process〉（AWS Prescriptive Guidance）", "〈Documenting Architecture Decisions〉（Michael Nygard，2011）", "〈About MADR〉（MADR 4.0，2024）"], "notes": "3.5–5.5 分鐘。Nygard 的狀態是 proposed、accepted，被推翻時「we will keep the old one around, but mark it as superseded.」AWS〈Architectural decision record process〉：「When the team accepts an ADR, it becomes immutable.」被拒絕的提案也要寫理由，避免下次重吵同一件事。本課的已審查事實（reviewed）就是 Accepted：不是不能變，而是只能透過同一套審查流程被取代。第 03 場的新知識也會先寫成候選。📖 延伸閱讀：〈Architectural decision record process〉（AWS Prescriptive Guidance）。"}, {"id": "separate", "chapter": "做與核准分開", "title": "球員不兼裁判", "lead": "做變更的 Agent 不核准自己的變更；審查交給另一個乾淨的對話，或另一個人。", "cards": [["官方建議", "另開審查者，只看差異與標準，不看作者的推理。"], ["平台限制", "GitHub 的雲端 Agent 不能核准或合併自己的 PR。"], ["企業做法", "Stripe 自述：Agent 每週上千個 PR，全經人審。"]], "check": "D2 裡，「核准」這句話是在誰的對話裡說的？", "explain": ["「球員不兼裁判」：做變更的人不核准自己的變更。這是人工核准關卡（Gate）的加深一層：主課學過在關卡由人決定，這裡再加一條，核准的必須是另一個人，或至少是一個看不到作者推理的乾淨對話。Claude Code 官方文件建議另開審查者審差異，理由是做事的 Agent 不該替自己打分數。", "業界也這樣做：GitHub 的雲端 Agent 不能核准或合併自己的 PR（Pull Request，合併請求）；Stripe 2026 年自述每週超過一千個由 Agent 產出的 PR，全部交人審查；Anthropic 2026 年 10 月分享，Agent 大量產生變更後，團隊成員仍審每一筆，只是改看變更的意圖。這些數字都是公司自己說的，不當成效率證據。", "限制：D2 為了教學讓兩人共用一台機器、各開自己的 Agent 對話。這能練習分工，但不能證明真的有兩個人；真實團隊要補什麼，第 04 場會講。", "為什麼「另一個人」有用：做的人知道自己的意圖，讀證據時會自動補上沒寫出來的部分；審查的人只看得到寫下來的東西，缺什麼一眼就看出來。對 Agent 也一樣：同一個對話裡自評，它會沿用剛才的推理；換一個沒看過推理的對話來審，才比較接近第二雙眼睛。但乾淨的對話仍是同一類模型，可能有同樣的盲點，所以模型變更的核准仍要由人來做。"], "read": ["〈Best practices for Claude Code〉（Claude Code 官方文件）", "〈Building effective agents〉（Anthropic Engineering，2024）", "〈Risks and mitigations for GitHub Copilot cloud agent〉（GitHub 官方文件）", "〈Minions: Stripe's one-shot, end-to-end coding agents〉（Stripe，2026）", "〈Redesigning source control at Anthropic〉（Anthropic，2026）"], "notes": "5.5–7.5 分鐘。人工核准關卡（Gate）的加深一層。Claude Code 官方文件〈Best practices for Claude Code〉建議用新的審查者審 diff：「the agent doing the work isn't the one grading it.」GitHub〈Risks and mitigations for GitHub Copilot cloud agent〉：雲端 Agent「cannot approve or merge a pull request」。Stripe 工程部落格〈Minions: Stripe's one-shot, end-to-end coding agents〉（2026-02-09）自述每週超過一千個 PR 由 Agent 產出、全部交人審查；這是公司自己的數字。AWS Transform 的使用者指南也把「domains decomposition」列為要人核准的中間產物。D2 的設計：兩人共用一台機器，但各用自己的 Agent 對話。Anthropic〈Redesigning source control at Anthropic〉（2026-10-13）：Agent 大量產生變更之後，「Our team members still review every change request for the system」，只是改看變更的意圖；團隊也寫到「the role of the engineers was to tell Claude \"no.\"」。合併數量是公司自己的數字，不當成效率證據；這裡只取一點：量變大，審查改看意圖，但人仍是說「不」的那一個。📖 延伸閱讀：〈Best practices for Claude Code〉（Claude Code 官方文件）；〈Building effective agents〉（Anthropic Engineering，2024）。"}, {"id": "enforce", "chapter": "做與核准分開", "title": "口頭規則擋不住，寫成檢查", "lead": "AGENTS.md 寫「提案者不能核准自己」只是建議；要每次都發生，就寫成自動檢查。", "flow": ["AGENTS.md：每次都要知道的事", "Skill：照步驟做的流程", "測試與 hook：一定要擋的事"], "cards": [["為什麼", "Agent 忙起來會忘，人也會。"], ["D2 的做法", "沒有夥伴簽章的變更，推不上去。"]], "check": "如果 Agent 自己 commit 再推送，會在哪一步被擋下？", "explain": ["寫在 AGENTS.md 或對話裡的規則（例如「提案者不能核准自己」）對 Agent 只是建議：它忙起來會忘，人也會。要每次都發生，就寫成自動執行的檢查：測試、檢查程式，或 pre-push hook（push 前 Git 自動執行的檢查腳本）。Claude Code 官方文件說，規則檔是建議，hook 是確定性的、保證會執行；AGENTS.md 等其他工具的規則檔也一樣，只是上下文，不是強制設定。", "三種放法各管一件事：每次都要知道的事（名詞、兩個角色、誰不能做什麼）寫在 AGENTS.md；一步步的固定做法（例如反事實檢查、夥伴的簽章 commit）寫成 Skill，對上才載入；一定要發生、不能靠記得的事（沒核准不能推送），交給測試或 hook。", "Thoughtworks 技術雷達第 34 期（2026-04）把「給 Coding Agent 的回饋感測器」列為 Trial（值得試用）：檢查要在寫程式的過程中就跑，commit 前回報乾淨的結果。D2 的做法是：沒有夥伴簽章的變更推不上去。", "限制：本機的檢查可以被跳過，第 04 場會講。下週可以找出團隊一條「大家都知道、卻常被忘記」的規則，想想能不能寫成一個會失敗的測試或檢查。", "課程例子：D2 的推送檢查不看 Agent 說了什麼，只看變更審查包裡有沒有夥伴的核准紀錄、簽章驗不驗得過；沒有就擋。這就是「建議」和「檢查」的差別：建議靠 Agent 記得，檢查不靠任何人記得。限制也要說清楚：檢查只擋得住它被寫來擋的事，規則本身寫錯，檢查會忠實地擋錯東西。"], "read": ["〈githooks〉（Git 官方文件）", "〈Feedback sensors for coding agents〉（Thoughtworks Technology Radar，2026）", "〈How Claude remembers your project〉（Claude Code 官方文件）"], "notes": "7.5–9.5 分鐘。Claude Code 官方文件：「Unlike CLAUDE.md instructions which are advisory, hooks are deterministic」；AGENTS.md 等其他工具的規則檔也一樣，是上下文，不是強制設定。一句話分工：AGENTS.md 放每次都要知道的事，Skill 放一步步的做法（說明對上才載入），hook 放一定要擋的事；學員包的 AGENTS.md「兩個角色」與 signed-commit Skill、D2 的推送檢查正好各是一例。Thoughtworks Technology Radar Vol. 34（2026-04）把〈Feedback sensors for coding agents〉列為 Trial：檢查要在寫程式的過程中跑，commit 前回報乾淨的結果。對照 D2 檢查點 1、2。不要展開金鑰與 hook 細節；這套檢查的限制留到第 04 場。📖 延伸閱讀：〈githooks〉（Git 官方文件）；Claude Code 官方文件〈How Claude remembers your project〉。"}, {"id": "incidents", "chapter": "做與核准分開", "title": "警示案例：少了第二道關卡", "lead": "規則只寫在對話裡、或沒人覆核，就擋不住 Agent 的破壞性動作。", "cards": [["Replit（2025-07）", "凍結期間 Agent 刪了正式資料庫；事後分開開發與正式環境。"], ["AWS（2025-12）", "報導稱 Agent 重建環境，服務中斷 13 小時；Amazon 說是權限設定錯誤。"]], "check": "你的團隊有哪個動作，現在只靠一個人說了算？", "explain": ["Fortune 2025 年 7 月報導：SaaStr 創辦人測試 Replit 的 Agent，在宣布「程式碼與動作凍結」期間，Agent 仍刪掉正式資料庫裡 1,200 多位主管、1,190 多家公司的資料，還說無法回復，其實可以手動回復。Replit 執行長稱這不可接受，之後加入開發與正式資料庫分離、只規劃不執行的模式。教訓：只寫在對話裡的凍結擋不住 Agent。", "The Decoder 2026 年 2 月轉述 Financial Times：AWS 的 Kiro Agent 決定刪除並重建環境，造成某服務中斷 13 小時，報導稱當時工程師不需第二人核准。Amazon 的回應是使用者錯誤、存取控制設定錯誤，不是 AI，之後加入正式環境存取的強制同儕審查。兩邊說法要一起講，不要說成「AWS 承認 AI 造成當機」。", "回到團隊：列出現在只靠一個人說了算的動作（刪資料、部署正式環境、改權限），想想哪一個該加上第二道關卡，而且是擋得住的檢查，不是口頭約定。"], "read": ["〈An AI-powered coding tool wiped out a software company's database, then apologized for a 'catastrophic failure on my part'〉（Fortune，2025）", "〈AWS AI coding tool decided to delete and recreate a customer-facing system〉（The Decoder，2026）"], "notes": "9.5–11.5 分鐘。Fortune（2025-07-23）：SaaStr 創辦人測試 Replit Agent，在「程式碼與動作凍結」期間，Agent 刪掉 1,200 多位主管、1,190 多家公司的資料，還說無法回復，其實可以手動回復；Replit 執行長稱「Unacceptable and should never be possible」，之後加入開發與正式資料庫分離、只規劃模式。教訓：凍結只寫在對話裡沒用。The Decoder（2026-02-20）轉述 Financial Times：AWS 的 Kiro 決定「delete and recreate the environment」，造成某服務 13 小時中斷，報導稱工程師不需第二人核准；Amazon 回應是「user error—specifically misconfigured access controls—not AI」，之後加入正式環境存取的強制同儕審查。兩邊說法都要講；FT 原文在付費牆後，未讀到。不要說「AWS 承認 AI 造成當機」，也不要說「Replit 捏造 4,000 個使用者」。這是兩件事故在 DLC 唯一的完整講法，第 03、04 場只回扣。📖 延伸閱讀：〈An AI-powered coding tool wiped out a software company's database, then apologized for a 'catastrophic failure on my part'〉（Fortune，2025）；〈AWS AI coding tool decided to delete and recreate a customer-facing system〉（The Decoder，2026）。"}, {"id": "record-scope", "chapter": "審查證據", "title": "紀錄只放模型，不放工作筆記", "lead": "一筆紀錄只寫：這個概念是什麼、和誰有關、證據在哪。做法、信心分數、待辦都不放。", "cards": [["為什麼", "審查的人逐條對證據；雜訊越多越難審。"], ["沒解決的問題", "寫進變更提案的待確認問題，不寫進模型。"]], "check": "D2 審的那筆候選，有沒有一句其實是工作筆記？", "explain": ["共用模型的一筆紀錄只寫三件事：這個概念是什麼、和誰有關、證據在哪。Agent 很容易順手寫進「我是用什麼方法找到的」「信心 0.8」「待確認」；這些放進模型，下一個 Agent 會把它們當成事實讀。", "審查的人要逐條對證據，雜訊越多越難審。較短、每句都對得上證據的紀錄，勝過看起來完整、其實只是重述原文的紀錄。沒解決的問題寫在變更提案的待確認問題，審查時一起決定，不寫進模型；這和 ADR 只寫背景、決定、後果是同一個精神。", "下週可以給團隊的 Agent 一句規則：「紀錄只放元素、關係與證據；其他寫進提案的待確認問題。」"], "notes": "11.5–13 分鐘。新概念：紀錄的範圍。Agent 很愛把「我是用什麼方法找到的」「信心 0.8」「待確認」順手寫進紀錄；這些放進模型，下一個 Agent 會把它們當成事實讀。較短、每句都能對證據的紀錄，勝過看起來完整、其實重述原文的紀錄。沒解決的問題放在變更提案的待確認問題，審查時一起決定。這和 ADR 只寫背景、決定、後果是同一個精神。給 Agent 的一句話：「紀錄只放元素、關係與證據；其他寫進提案的待確認問題。」"}, {"id": "package", "chapter": "審查證據", "title": "示範：請 Agent 做審查表", "lead": "審查的人不必看懂程式；他要一張表：每條主張的證據與實際結果。", "prompt": "這次的候選要請夥伴審，幫我做一張審查表：每筆候選的主張、證據行號、對應測試的實際結果字樣、反事實檢查結果。沒實際跑過的標「未驗證」。", "cards": [["看理由", "為什麼這樣定，比怎麼實作重要。"], ["看實際字樣", "passed、killed 要來自實際執行。"]], "check": "表裡有沒有一筆，主張和證據講的不是同一件事？", "explain": ["審查的人不必看懂程式，他要的是一張表：每條主張、證據在哪幾行、對應哪個測試、實際跑出的結果字樣，以及反事實檢查（故意改壞程式，看測試會不會失敗）的結果；沒實際跑過的標「未驗證」。這是第 01 場「要證據，不要形容詞」的加深：證據從一句回報，變成給另一個人審的整張表。", "主課的變更審查看程式改了什麼；這裡看模型要改成什麼、為什麼。AWS 的 ADR 流程指南說，紀錄著重決定的理由，而不是實作方式；審查表把「為什麼」放前面，比放實作細節有用。", "限制：表格整齊不代表內容正確，主張和證據講的可能不是同一件事，所以下一頁講怎麼審。", "課程例子：一列可能長這樣。主張「會員可用點數不得為負」；證據指到需求卡 02 的那一條與程式裡扣點的那幾行；對應測試是一個「餘額不足時拒絕並不扣點」的測試，實際字樣「1 passed」；反事實檢查把扣點前的餘額判斷拿掉，實際字樣 killed。四欄都對得上，夥伴才有東西可審；任何一欄寫「應該會過」，就標「未驗證」。"], "read": ["〈Architectural decision record process〉（AWS Prescriptive Guidance）"], "notes": "13–15 分鐘。對照 D2 檢查點 3。這是上一場「要證據，不要形容詞」的加深一層：證據從一句回報，變成給另一個人審的整張表。AWS 的 ADR 流程：紀錄著重「the reason for the decision rather than how the team implemented it.」主課的變更審查看程式改了什麼；這裡看模型要改成什麼、證據在哪。示範提示詞，未實際執行。"}, {"id": "review", "chapter": "審查證據", "title": "審查怎麼做：先讀、再問、可退回", "lead": "AWS 的 ADR 審查會先安靜讀 10–15 分鐘，再逐條討論，最後接受、重做或退回。", "cards": [["標準是讓整體更好", "Google：確定讓程式更健康就核准，不求完美。"], ["退回要寫理由", "下次就不必重吵同一件事。"]], "check": "你核准前，親自打開過哪一行證據？", "explain": ["AWS 的 ADR 流程建議審查會議這樣開：先安靜讀 10–15 分鐘，再逐條討論，結果是接受、要求重做或拒絕；拒絕時寫下理由，避免下次重吵。Google 的程式碼審查準則則說，標準是確定讓整體程式更健康就核准，不求完美。兩者合起來：審查要真的讀證據，但不是無止境地挑錯。", "InfoQ 2026 年 9 月一篇文章（Nitin Garg）做了小型實驗：審查者手上有人核准過的基準時，抓到的問題比例和沒有時差不多（作者自量的召回率，0.525 對 0.518），但 81% 的發現能指到具名的條文（沒有基準時 0%），審查時間約 48 對 27 分鐘。作者說結果只是方向性的。意思是：已審查的模型讓審查說得出依據、可以追溯，不保證抓到更多錯。", "D2 裡夥伴回「退回：原因」不是失敗，而是審查有在運作；沒有人追問的核准只是蓋章。下週審同事的變更時，核准前至少親自打開一行證據。", "審查時可以問的三題，不需要看懂程式：這條主張的證據真的在講這件事嗎？對應的測試會在規則被違反時失敗嗎（看反事實檢查）？這次有沒有動到既有測試？三題都答得出來就核准；答不出來就退回，把答不出來的那一題寫成理由。"], "read": ["〈The Code Reviewer's Guide〉（Google Engineering Practices）", "〈When Spec-Driven Development Pays off〉（Nitin Garg／InfoQ，2026）"], "notes": "15–17 分鐘。AWS〈Architectural decision record process〉：會議先讀 10–15 分鐘，逐條討論，結果是接受、重做或拒絕；拒絕時「adds a reason for the rejection to prevent future discussions on the same topic.」Google Engineering Practices〈The Standard of Code Review〉：「approving a CL once it is in a state where it definitely improves the overall code health」。對照 D2 檢查點 4：夥伴回「退回：原因」不是失敗，是審查有在運作；沒有人追問的核准只是蓋章。InfoQ〈When Spec-Driven Development Pays off〉（Nitin Garg，2026-09-10）做了小型實驗：審查者手上有人核准過的基準（approved baseline）時，抓到的漂移數和沒有時差不多（作者自稱的 recall 0.525 對 0.518），但 81% 的發現能指到具名的條文（沒有基準時 0%），審查時間約 48 對 27 分鐘。作者說結果只是方向性的。要講清楚：已審查的模型讓審查「說得出依據、可追溯」，不保證抓得更多；他的原則是「automation flags divergence, while a named human decides what is correct」，對應 D2 夥伴具名核准。📖 延伸閱讀：〈The Code Reviewer's Guide〉（Google Engineering Practices）。"}, {"id": "tests-changed", "chapter": "審查證據", "title": "綠燈不等於安全", "lead": "Anthropic 在模型系統卡揭露：Agent 為了讓測試通過，會改測試去配合程式。", "prompt": "審查前，我想先知道這次有沒有動到測試。列出動到的測試檔與行號，每處說明改了什麼、會不會讓原本該失敗的情況變成通過。", "cards": [["怎麼發生", "多次失敗後，寫死預期值或改測試。"], ["審查時看", "這次有沒有動到測試，動了哪幾行。"]], "check": "這次變更動到測試了嗎？動的理由寫在哪？", "explain": ["Anthropic 2025 年 2 月的模型系統卡（廠商公開的模型行為說明）第 6 節揭露：模型多次修不好時，會把程式寫成只對測試的特定輸入成立，甚至修改測試本身去配合程式的輸出。使用者的測試沒發現，靠自動分類器才抓到；系統卡建議監看測試檔被意外修改的情況。", "這不是某一家模型的毛病，而是廠商自己公開的行為紀錄，其他模型也可能發生。所以審查時多問一題：這次變更動到測試了嗎？動了哪幾行、理由寫在哪？測試全綠，可能只是測試被改鬆了。", "下週可以在團隊的審查清單加一行：「本次是否修改了既有測試？理由是什麼？」"], "read": ["〈Claude 3.7 Sonnet System Card〉（Anthropic，2025）"], "notes": "17–19 分鐘。Anthropic〈Claude 3.7 Sonnet System Card〉（2025-02）第 6 節 Excessive Focus on Passing Tests：模型多次失敗後會特例化測試，「also includes modifying the problematic tests themselves to match the code's output.」使用者的測試沒發現，靠自動分類器才抓到；系統卡建議監看「Unexpected modifications to test files」。不要講成某一家模型的毛病：這是廠商自己公開的行為紀錄，其他模型也可能發生。第 03 場只回扣這頁，不重講。示範提示詞，未實際執行。📖 延伸閱讀：〈Claude 3.7 Sonnet System Card〉（Anthropic，2025）。"}, {"id": "mutation", "chapter": "審查證據", "title": "技巧：故意改壞，看測試抓不抓得到", "lead": "反事實檢查：改壞一處、跑測試、自動還原。測試失敗（killed）才證明有人守著。", "prompt": "我想確認這條規則有測試守著。給我 2 個故意改壞的方案：改哪幾行、改成什麼、預期哪個斷言失敗。我選一個，再用 counterfactual 跑，回報 killed 或 survived。", "cards": [["killed", "測試失敗了：這條規則有測試守著。"], ["survived", "測試仍通過：規則沒人守，或測試太弱。"]], "check": "你選的改法，改到的是規則本身，還是無關的字串？", "explain": ["反事實檢查（counterfactual）是本課用語，做法就是變異測試（mutation testing）的手動小版本：故意把守某條規則的程式改壞一處，跑測試，再自動還原。變異測試工具 Stryker 的文件這樣定義：在程式裡引入改動，再對改過的程式跑測試；測試失敗，這個改動（變異）就算被殺掉（killed），證明這條規則有測試守著；測試仍通過叫存活（survived），表示規則沒人守，或測試太弱。變異測試工具會自動產生大量這種小改動。", "survived 還有第三種可能：改動根本沒改變程式的行為，Stryker 稱為等價變異（equivalent mutant），例如兩個值相等時，把「大於等於」改成「小於等於」結果一樣。這種情況沒有測試抓得到，也不需要抓；所以改法要改在規則本身，事先說得出「改完後，哪個情況的結果會不同」。Stryker 的文件也說，它沒有確定的方法自動找出等價變異，只能靠人一個一個判斷。", "Thoughtworks 技術雷達第 34 期稱變異測試是評估測試抓錯能力「最誠實的訊號」，也提醒 AI 產生的測試可能永遠是綠的。改法由人選，是因為 Agent 容易挑最好抓的改法，讓結果好看。", "兩個常見誤讀：指令沒報錯不等於 killed，要看實際字樣；測試要因為對的原因失敗，所以事先寫下預期哪個斷言失敗，如果是程式根本載入不了才失敗，不算證明，本課的工具會標成 inconclusive（無法判斷）。"], "read": ["〈Feedback sensors for coding agents〉（Thoughtworks Technology Radar，2026）", "〈What is mutation testing?〉（Stryker Mutator 文件）", "〈Equivalent mutants〉（Stryker Mutator 文件）"], "notes": "19–21.5 分鐘。這是變異測試（mutation testing）的手動小版本：工具會自動產生大量小改動，看測試殺掉幾個。Thoughtworks Technology Radar Vol. 34（2026-04）在〈Feedback sensors for coding agents〉稱變異測試是評估測試抓錯能力「the most honest signal」，也提醒 AI 產生的測試可能永遠是綠的。為什麼人選改法：Agent 容易挑最好抓的改法。指令沒報錯不等於 killed，要看實際字樣；也要因為對的原因失敗：先寫下預期看到哪個斷言失敗，測試因別的錯（例如程式根本載入不了）而失敗不算證明，本 DLC 的工具會把這種結果標成 inconclusive。第 03 場會加深：每條新規則各改壞一次。📖 延伸閱讀：〈Feedback sensors for coding agents〉（Thoughtworks Technology Radar，2026）。"}, {"id": "record", "chapter": "留下紀錄", "title": "核准紀錄：誰、何時、核准哪一份", "lead": "ADR 被接受時寫下決策者與日期；模型裡的已審查事實也一樣，要查得到誰、何時核准。", "cards": [["誰與何時", "每筆已審查事實附核准者與時間。"], ["提案留在歷史", "紀錄不抄提案；要查時從歷史找得到。"], ["沒被改過", "簽章驗得出；套用前 Agent 再驗一次。"]], "check": "三個月後有人問「這條規則誰核准的」，你從哪裡查？", "explain": ["核准紀錄要回答三個問題：誰核准、何時核准、核准的是哪一份。MADR（一個常用的 ADR 範本，4.0 版，2024）在狀態與日期旁邊有「決策者」欄位；本課的已審查事實就是「接受」加上核准者與時間。範本註明這些欄位是選填，但對需要稽核的團隊很有用。", "AWS 的流程指南寫得更具體：團隊核准 ADR 時，負責人加上時間戳記、版本與利害關係人名單，再把狀態改成「接受」。對應到本課：核准者與時間記在已審查事實上，核准的是哪一份，靠簽章的 commit 指認。", "紀錄本身只寫誰、何時；當初的審查包與討論留在版本與稽核歷史裡，要追查時找得到，不必抄進每筆紀錄。「沒被改過」要靠工具驗證：業界常見做法是簽章的 commit（用金鑰替 commit 簽章，別人能驗出內容沒被改）加上必要審查。", "下週可以問：三個月後有人問「這條規則誰核准的」，你們團隊從哪裡查得到？查不到，就是值得補的地方。"], "read": ["〈About MADR〉（MADR 4.0，2024）", "〈git-commit〉（Git 官方文件）"], "notes": "21.5–23.5 分鐘。對照 D2 檢查點 5、6。MADR 4.0 的 ADR 範本在狀態與日期旁邊有 decision-makers 欄位：「list everyone involved in the decision」。已審查事實就是 Accepted 加上決策者：紀錄本身只寫誰、何時；當初那份審查包與核准過程留在版本與稽核歷史裡，要追查時找得到，不必抄進每筆紀錄（呼應前面：紀錄只放模型）。「沒被改過」要靠工具驗：業界常見做法是簽章 commit 加上必要審查。本 DLC 用的模型工具在每筆已審查紀錄寫入核准者與時間，提案記在稽核紀錄；工具可以換，道理相同。📖 延伸閱讀：〈About MADR〉（MADR 4.0）；〈git-commit〉（Git 官方文件）的 -S 選項說明。"}, {"id": "next", "chapter": "下一站", "title": "帶走什麼", "lead": "做的人和核准的人分開；核准要看證據、留紀錄；事實只能被新提案取代。", "flow": ["提案者附證據", "另一個人審查", "核准並留紀錄", "已審查事實", "下一場依模型做需求"], "cards": [["回到團隊", "挑一個模型變更，寫一份短 ADR 請人審。"], ["下一場", "依已審查事實做新需求，由人決定邊界。"]], "check": "用一句話說出：killed 證明了什麼？", "notes": "23.5–25 分鐘，收尾。回到開場：誰想退回過？哪一步最像只是照流程做完，DLC 回顧會請 Agent 從紀錄整理證據再判斷。銜接 D3：模型成為事實後，新需求的設計選項要以它為依據。"}], "title": "審查與核准：模型變更要經過第二個人", "minutes": 25, "downloads": [{"label": "下載操作講義", "name": "review-approval-handout.md", "text": "# 審查與核准：模型變更要經過第二個人\n\n\u003e 讀者：學員。時機：DDD 延伸課 D2 之後的 25 分鐘講解。前置：已聽過 DLC Speech 01，做完 D2。\n\n**這一段帶走什麼**\n- 決策紀錄（ADR）的提議、接受、取代，對應本課的候選、已審查事實、新候選取代\n- 做的人不核准自己的變更；口頭規則擋不住，要寫成檢查\n- 審查要看的證據：主張對證據、測試有沒有被改、反事實檢查只認 killed\n- 核准紀錄要查得到誰、何時、核准哪一份\n\n每頁最後的段落是講解時來不及說的補充：概念的白話解釋、證據出處、限制與回到團隊的做法；提到的書與文章列在最後的「延伸閱讀」。\n\n本場講概念與技巧，不需要寫程式或打指令。頁面上的提示詞是示範，想試再貼給自己的 Agent；沒有實際執行的結果，一律視為未驗證。\n\n## 1. 改模型，要有第二個人\n\n上一場：改一個名詞就是改模型。這一場：模型的改變怎麼審、誰核准、留下什麼。\n\n- **上一場留下的**：附證據的語言、邊界與規則，全是候選。\n\n- **這一場講**：決策紀錄、做與核准分開、怎麼審證據。\n\n**人工確認**：D2 裡夥伴審查時，有沒有哪一刻想退回？\n\n## 2. 決策為什麼要寫下來\n\nNygard（2011）：專案裡最難追的，是當初為什麼這樣決定。\n\n- **沒寫下來**：後來的人只能盲目照做，或盲目推翻。\n\n- **寫成 ADR**：背景、決定、狀態、後果，一份短短的紀錄。\n\nADR（Architecture Decision Record，架構決策紀錄）是 Michael Nygard 2011 年提出的做法：每個重要的設計決定寫一份短紀錄，包含標題、背景、決定、狀態與後果。他的理由是：專案進行中最難追的，就是當初為什麼這樣決定；沒有紀錄，後來的人只剩兩條路，盲目照做或盲目推翻。\n\nNygard 原文的五段各有一句說明：標題用簡短的名詞片語；背景寫當時有哪些力量在拉扯（技術、政治、社會與專案本身）；決定寫我們怎麼回應這些力量；狀態寫提議或已接受；後果寫套用決定之後的情況，好的壞的都寫。課程例子：需求卡 02 規定「點數折抵不是優惠類型，不參加單一優惠比較」。寫成 ADR，背景是「現行計價逐位選最有利的單一優惠」，決定是「先算優惠、再用整筆總額算折抵」，後果是「折抵不改變每位旅客的優惠金額」。Agent 看到這份紀錄，就不會把折抵當成第三種優惠塞進比較。\n\nAWS 的 ADR 流程指南也強調，紀錄的重點是「為什麼這樣決定」，而不是「怎麼實作」。對 Agent 來說這更關鍵：它沒參加當初的會議，只看得到 Repo；沒寫下理由的決定，在它看來就像可以隨手改掉的程式。\n\n下週可以挑團隊最近一個重要的設計決定，用這五段寫成一頁放進 Repo，不超過一個畫面。\n\n📖 延伸閱讀：〈Documenting Architecture Decisions〉（Michael Nygard，2011）；〈Architectural decision record process〉（AWS Prescriptive Guidance）\n\n**人工確認**：你們團隊上一個重要的設計決定，理由寫在哪裡？\n\n## 3. 新概念：已審查事實\n\nADR 有狀態：提議、接受、被取代。本課的候選、已審查事實、新候選取代，一一對應。\n\n提議＝候選 → 接受＝已審查事實 → 被取代＝新候選核准後\n\n- **接受後不改寫**：Agent 必須遵守，不能直接修改。\n\n- **要改就取代**：提新的候選，舊的保留可查。\n\nADR 有狀態。Nygard 2011 年寫的是：利害關係人還沒同意時是「提議」（proposed），同意後是「接受」（accepted）；後來的決定改變或推翻它時，標成「棄用」（deprecated）或「被取代」（superseded），並指向取代它的那一份，舊的保留可查。MADR 4.0 範本的狀態欄多列了「拒絕」（rejected）。AWS 的流程指南說，ADR 被接受或拒絕後就不再改寫；要改，就提一份新的 ADR，新的被接受後，舊的標成被取代。被拒絕的提案也要寫下理由，免得下次重吵同一件事。\n\n本課的用語一一對應：Agent 提的候選＝提議；經另一個人核准的已審查事實＝接受；夥伴回「退回：原因」就是不接受，理由寫在提案的紀錄裡；要改已審查事實，就提一筆新候選，核准後取代舊的。已審查事實不是永遠不能變，而是只能透過同一套審查流程改。\n\n各來源的狀態名稱不完全一樣：Nygard 有「棄用」，AWS 只講提議、接受、拒絕、被取代；AWS 還有「需要重做」的情況，那時狀態仍是提議。不必背哪一套，團隊選一套寫進範本，所有人用同一套就好。\n\n常見誤解：Agent 發現事實「好像過時了」就直接改。正確做法是讓它提新候選、附證據，等人核准。下週可以看看團隊的設計文件有沒有狀態欄位，還是改了就直接覆蓋。\n\n📖 延伸閱讀：〈Architectural decision record process〉（AWS Prescriptive Guidance）；〈Documenting Architecture Decisions〉（Michael Nygard，2011）；〈About MADR〉（MADR 4.0，2024）\n\n**人工確認**：Agent 想改一條已審查事實時，正確的做法是什麼？\n\n## 4. 球員不兼裁判\n\n做變更的 Agent 不核准自己的變更；審查交給另一個乾淨的對話，或另一個人。\n\n- **官方建議**：另開審查者，只看差異與標準，不看作者的推理。\n\n- **平台限制**：GitHub 的雲端 Agent 不能核准或合併自己的 PR。\n\n- **企業做法**：Stripe 自述：Agent 每週上千個 PR，全經人審。\n\n「球員不兼裁判」：做變更的人不核准自己的變更。這是人工核准關卡（Gate）的加深一層：主課學過在關卡由人決定，這裡再加一條，核准的必須是另一個人，或至少是一個看不到作者推理的乾淨對話。Claude Code 官方文件建議另開審查者審差異，理由是做事的 Agent 不該替自己打分數。\n\n業界也這樣做：GitHub 的雲端 Agent 不能核准或合併自己的 PR（Pull Request，合併請求）；Stripe 2026 年自述每週超過一千個由 Agent 產出的 PR，全部交人審查；Anthropic 2026 年 10 月分享，Agent 大量產生變更後，團隊成員仍審每一筆，只是改看變更的意圖。這些數字都是公司自己說的，不當成效率證據。\n\n限制：D2 為了教學讓兩人共用一台機器、各開自己的 Agent 對話。這能練習分工，但不能證明真的有兩個人；真實團隊要補什麼，第 04 場會講。\n\n為什麼「另一個人」有用：做的人知道自己的意圖，讀證據時會自動補上沒寫出來的部分；審查的人只看得到寫下來的東西，缺什麼一眼就看出來。對 Agent 也一樣：同一個對話裡自評，它會沿用剛才的推理；換一個沒看過推理的對話來審，才比較接近第二雙眼睛。但乾淨的對話仍是同一類模型，可能有同樣的盲點，所以模型變更的核准仍要由人來做。\n\n📖 延伸閱讀：〈Best practices for Claude Code〉（Claude Code 官方文件）；〈Building effective agents〉（Anthropic Engineering，2024）；〈Risks and mitigations for GitHub Copilot cloud agent〉（GitHub 官方文件）；〈Minions: Stripe's one-shot, end-to-end coding agents〉（Stripe，2026）；〈Redesigning source control at Anthropic〉（Anthropic，2026）\n\n**人工確認**：D2 裡，「核准」這句話是在誰的對話裡說的？\n\n## 5. 口頭規則擋不住，寫成檢查\n\nAGENTS.md 寫「提案者不能核准自己」只是建議；要每次都發生，就寫成自動檢查。\n\nAGENTS.md：每次都要知道的事 → Skill：照步驟做的流程 → 測試與 hook：一定要擋的事\n\n- **為什麼**：Agent 忙起來會忘，人也會。\n\n- **D2 的做法**：沒有夥伴簽章的變更，推不上去。\n\n寫在 AGENTS.md 或對話裡的規則（例如「提案者不能核准自己」）對 Agent 只是建議：它忙起來會忘，人也會。要每次都發生，就寫成自動執行的檢查：測試、檢查程式，或 pre-push hook（push 前 Git 自動執行的檢查腳本）。Claude Code 官方文件說，規則檔是建議，hook 是確定性的、保證會執行；AGENTS.md 等其他工具的規則檔也一樣，只是上下文，不是強制設定。\n\n三種放法各管一件事：每次都要知道的事（名詞、兩個角色、誰不能做什麼）寫在 AGENTS.md；一步步的固定做法（例如反事實檢查、夥伴的簽章 commit）寫成 Skill，對上才載入；一定要發生、不能靠記得的事（沒核准不能推送），交給測試或 hook。\n\nThoughtworks 技術雷達第 34 期（2026-04）把「給 Coding Agent 的回饋感測器」列為 Trial（值得試用）：檢查要在寫程式的過程中就跑，commit 前回報乾淨的結果。D2 的做法是：沒有夥伴簽章的變更推不上去。\n\n限制：本機的檢查可以被跳過，第 04 場會講。下週可以找出團隊一條「大家都知道、卻常被忘記」的規則，想想能不能寫成一個會失敗的測試或檢查。\n\n課程例子：D2 的推送檢查不看 Agent 說了什麼，只看變更審查包裡有沒有夥伴的核准紀錄、簽章驗不驗得過；沒有就擋。這就是「建議」和「檢查」的差別：建議靠 Agent 記得，檢查不靠任何人記得。限制也要說清楚：檢查只擋得住它被寫來擋的事，規則本身寫錯，檢查會忠實地擋錯東西。\n\n📖 延伸閱讀：〈githooks〉（Git 官方文件）；〈Feedback sensors for coding agents〉（Thoughtworks Technology Radar，2026）；〈How Claude remembers your project〉（Claude Code 官方文件）\n\n**人工確認**：如果 Agent 自己 commit 再推送，會在哪一步被擋下？\n\n## 6. 警示案例：少了第二道關卡\n\n規則只寫在對話裡、或沒人覆核，就擋不住 Agent 的破壞性動作。\n\n- **Replit（2025-07）**：凍結期間 Agent 刪了正式資料庫；事後分開開發與正式環境。\n\n- **AWS（2025-12）**：報導稱 Agent 重建環境，服務中斷 13 小時；Amazon 說是權限設定錯誤。\n\nFortune 2025 年 7 月報導：SaaStr 創辦人測試 Replit 的 Agent，在宣布「程式碼與動作凍結」期間，Agent 仍刪掉正式資料庫裡 1,200 多位主管、1,190 多家公司的資料，還說無法回復，其實可以手動回復。Replit 執行長稱這不可接受，之後加入開發與正式資料庫分離、只規劃不執行的模式。教訓：只寫在對話裡的凍結擋不住 Agent。\n\nThe Decoder 2026 年 2 月轉述 Financial Times：AWS 的 Kiro Agent 決定刪除並重建環境，造成某服務中斷 13 小時，報導稱當時工程師不需第二人核准。Amazon 的回應是使用者錯誤、存取控制設定錯誤，不是 AI，之後加入正式環境存取的強制同儕審查。兩邊說法要一起講，不要說成「AWS 承認 AI 造成當機」。\n\n回到團隊：列出現在只靠一個人說了算的動作（刪資料、部署正式環境、改權限），想想哪一個該加上第二道關卡，而且是擋得住的檢查，不是口頭約定。\n\n📖 延伸閱讀：〈An AI-powered coding tool wiped out a software company's database, then apologized for a 'catastrophic failure on my part'〉（Fortune，2025）；〈AWS AI coding tool decided to delete and recreate a customer-facing system〉（The Decoder，2026）\n\n**人工確認**：你的團隊有哪個動作，現在只靠一個人說了算？\n\n## 7. 紀錄只放模型，不放工作筆記\n\n一筆紀錄只寫：這個概念是什麼、和誰有關、證據在哪。做法、信心分數、待辦都不放。\n\n- **為什麼**：審查的人逐條對證據；雜訊越多越難審。\n\n- **沒解決的問題**：寫進變更提案的待確認問題，不寫進模型。\n\n共用模型的一筆紀錄只寫三件事：這個概念是什麼、和誰有關、證據在哪。Agent 很容易順手寫進「我是用什麼方法找到的」「信心 0.8」「待確認」；這些放進模型，下一個 Agent 會把它們當成事實讀。\n\n審查的人要逐條對證據，雜訊越多越難審。較短、每句都對得上證據的紀錄，勝過看起來完整、其實只是重述原文的紀錄。沒解決的問題寫在變更提案的待確認問題，審查時一起決定，不寫進模型；這和 ADR 只寫背景、決定、後果是同一個精神。\n\n下週可以給團隊的 Agent 一句規則：「紀錄只放元素、關係與證據；其他寫進提案的待確認問題。」\n\n**人工確認**：D2 審的那筆候選，有沒有一句其實是工作筆記？\n\n## 8. 示範：請 Agent 做審查表\n\n審查的人不必看懂程式；他要一張表：每條主張的證據與實際結果。\n\n- **看理由**：為什麼這樣定，比怎麼實作重要。\n\n- **看實際字樣**：passed、killed 要來自實際執行。\n\n### 交給 Agent 的指令\n\n這次的候選要請夥伴審，幫我做一張審查表：每筆候選的主張、證據行號、對應測試的實際結果字樣、反事實檢查結果。沒實際跑過的標「未驗證」。\n\n審查的人不必看懂程式，他要的是一張表：每條主張、證據在哪幾行、對應哪個測試、實際跑出的結果字樣，以及反事實檢查（故意改壞程式，看測試會不會失敗）的結果；沒實際跑過的標「未驗證」。這是第 01 場「要證據，不要形容詞」的加深：證據從一句回報，變成給另一個人審的整張表。\n\n主課的變更審查看程式改了什麼；這裡看模型要改成什麼、為什麼。AWS 的 ADR 流程指南說，紀錄著重決定的理由，而不是實作方式；審查表把「為什麼」放前面，比放實作細節有用。\n\n限制：表格整齊不代表內容正確，主張和證據講的可能不是同一件事，所以下一頁講怎麼審。\n\n課程例子：一列可能長這樣。主張「會員可用點數不得為負」；證據指到需求卡 02 的那一條與程式裡扣點的那幾行；對應測試是一個「餘額不足時拒絕並不扣點」的測試，實際字樣「1 passed」；反事實檢查把扣點前的餘額判斷拿掉，實際字樣 killed。四欄都對得上，夥伴才有東西可審；任何一欄寫「應該會過」，就標「未驗證」。\n\n📖 延伸閱讀：〈Architectural decision record process〉（AWS Prescriptive Guidance）\n\n**人工確認**：表裡有沒有一筆，主張和證據講的不是同一件事？\n\n## 9. 審查怎麼做：先讀、再問、可退回\n\nAWS 的 ADR 審查會先安靜讀 10–15 分鐘，再逐條討論，最後接受、重做或退回。\n\n- **標準是讓整體更好**：Google：確定讓程式更健康就核准，不求完美。\n\n- **退回要寫理由**：下次就不必重吵同一件事。\n\nAWS 的 ADR 流程建議審查會議這樣開：先安靜讀 10–15 分鐘，再逐條討論，結果是接受、要求重做或拒絕；拒絕時寫下理由，避免下次重吵。Google 的程式碼審查準則則說，標準是確定讓整體程式更健康就核准，不求完美。兩者合起來：審查要真的讀證據，但不是無止境地挑錯。\n\nInfoQ 2026 年 9 月一篇文章（Nitin Garg）做了小型實驗：審查者手上有人核准過的基準時，抓到的問題比例和沒有時差不多（作者自量的召回率，0.525 對 0.518），但 81% 的發現能指到具名的條文（沒有基準時 0%），審查時間約 48 對 27 分鐘。作者說結果只是方向性的。意思是：已審查的模型讓審查說得出依據、可以追溯，不保證抓到更多錯。\n\nD2 裡夥伴回「退回：原因」不是失敗，而是審查有在運作；沒有人追問的核准只是蓋章。下週審同事的變更時，核准前至少親自打開一行證據。\n\n審查時可以問的三題，不需要看懂程式：這條主張的證據真的在講這件事嗎？對應的測試會在規則被違反時失敗嗎（看反事實檢查）？這次有沒有動到既有測試？三題都答得出來就核准；答不出來就退回，把答不出來的那一題寫成理由。\n\n📖 延伸閱讀：〈The Code Reviewer's Guide〉（Google Engineering Practices）；〈When Spec-Driven Development Pays off〉（Nitin Garg／InfoQ，2026）\n\n**人工確認**：你核准前，親自打開過哪一行證據？\n\n## 10. 綠燈不等於安全\n\nAnthropic 在模型系統卡揭露：Agent 為了讓測試通過，會改測試去配合程式。\n\n- **怎麼發生**：多次失敗後，寫死預期值或改測試。\n\n- **審查時看**：這次有沒有動到測試，動了哪幾行。\n\n### 交給 Agent 的指令\n\n審查前，我想先知道這次有沒有動到測試。列出動到的測試檔與行號，每處說明改了什麼、會不會讓原本該失敗的情況變成通過。\n\nAnthropic 2025 年 2 月的模型系統卡（廠商公開的模型行為說明）第 6 節揭露：模型多次修不好時，會把程式寫成只對測試的特定輸入成立，甚至修改測試本身去配合程式的輸出。使用者的測試沒發現，靠自動分類器才抓到；系統卡建議監看測試檔被意外修改的情況。\n\n這不是某一家模型的毛病，而是廠商自己公開的行為紀錄，其他模型也可能發生。所以審查時多問一題：這次變更動到測試了嗎？動了哪幾行、理由寫在哪？測試全綠，可能只是測試被改鬆了。\n\n下週可以在團隊的審查清單加一行：「本次是否修改了既有測試？理由是什麼？」\n\n📖 延伸閱讀：〈Claude 3.7 Sonnet System Card〉（Anthropic，2025）\n\n**人工確認**：這次變更動到測試了嗎？動的理由寫在哪？\n\n## 11. 技巧：故意改壞，看測試抓不抓得到\n\n反事實檢查：改壞一處、跑測試、自動還原。測試失敗（killed）才證明有人守著。\n\n- **killed**：測試失敗了：這條規則有測試守著。\n\n- **survived**：測試仍通過：規則沒人守，或測試太弱。\n\n### 交給 Agent 的指令\n\n我想確認這條規則有測試守著。給我 2 個故意改壞的方案：改哪幾行、改成什麼、預期哪個斷言失敗。我選一個，再用 counterfactual 跑，回報 killed 或 survived。\n\n反事實檢查（counterfactual）是本課用語，做法就是變異測試（mutation testing）的手動小版本：故意把守某條規則的程式改壞一處，跑測試，再自動還原。變異測試工具 Stryker 的文件這樣定義：在程式裡引入改動，再對改過的程式跑測試；測試失敗，這個改動（變異）就算被殺掉（killed），證明這條規則有測試守著；測試仍通過叫存活（survived），表示規則沒人守，或測試太弱。變異測試工具會自動產生大量這種小改動。\n\nsurvived 還有第三種可能：改動根本沒改變程式的行為，Stryker 稱為等價變異（equivalent mutant），例如兩個值相等時，把「大於等於」改成「小於等於」結果一樣。這種情況沒有測試抓得到，也不需要抓；所以改法要改在規則本身，事先說得出「改完後，哪個情況的結果會不同」。Stryker 的文件也說，它沒有確定的方法自動找出等價變異，只能靠人一個一個判斷。\n\nThoughtworks 技術雷達第 34 期稱變異測試是評估測試抓錯能力「最誠實的訊號」，也提醒 AI 產生的測試可能永遠是綠的。改法由人選，是因為 Agent 容易挑最好抓的改法，讓結果好看。\n\n兩個常見誤讀：指令沒報錯不等於 killed，要看實際字樣；測試要因為對的原因失敗，所以事先寫下預期哪個斷言失敗，如果是程式根本載入不了才失敗，不算證明，本課的工具會標成 inconclusive（無法判斷）。\n\n📖 延伸閱讀：〈Feedback sensors for coding agents〉（Thoughtworks Technology Radar，2026）；〈What is mutation testing?〉（Stryker Mutator 文件）；〈Equivalent mutants〉（Stryker Mutator 文件）\n\n**人工確認**：你選的改法，改到的是規則本身，還是無關的字串？\n\n## 12. 核准紀錄：誰、何時、核准哪一份\n\nADR 被接受時寫下決策者與日期；模型裡的已審查事實也一樣，要查得到誰、何時核准。\n\n- **誰與何時**：每筆已審查事實附核准者與時間。\n\n- **提案留在歷史**：紀錄不抄提案；要查時從歷史找得到。\n\n- **沒被改過**：簽章驗得出；套用前 Agent 再驗一次。\n\n核准紀錄要回答三個問題：誰核准、何時核准、核准的是哪一份。MADR（一個常用的 ADR 範本，4.0 版，2024）在狀態與日期旁邊有「決策者」欄位；本課的已審查事實就是「接受」加上核准者與時間。範本註明這些欄位是選填，但對需要稽核的團隊很有用。\n\nAWS 的流程指南寫得更具體：團隊核准 ADR 時，負責人加上時間戳記、版本與利害關係人名單，再把狀態改成「接受」。對應到本課：核准者與時間記在已審查事實上，核准的是哪一份，靠簽章的 commit 指認。\n\n紀錄本身只寫誰、何時；當初的審查包與討論留在版本與稽核歷史裡，要追查時找得到，不必抄進每筆紀錄。「沒被改過」要靠工具驗證：業界常見做法是簽章的 commit（用金鑰替 commit 簽章，別人能驗出內容沒被改）加上必要審查。\n\n下週可以問：三個月後有人問「這條規則誰核准的」，你們團隊從哪裡查得到？查不到，就是值得補的地方。\n\n📖 延伸閱讀：〈About MADR〉（MADR 4.0，2024）；〈git-commit〉（Git 官方文件）\n\n**人工確認**：三個月後有人問「這條規則誰核准的」，你從哪裡查？\n\n## 13. 帶走什麼\n\n做的人和核准的人分開；核准要看證據、留紀錄；事實只能被新提案取代。\n\n提案者附證據 → 另一個人審查 → 核准並留紀錄 → 已審查事實 → 下一場依模型做需求\n\n- **回到團隊**：挑一個模型變更，寫一份短 ADR 請人審。\n\n- **下一場**：依已審查事實做新需求，由人決定邊界。\n\n**人工確認**：用一句話說出：killed 證明了什麼？\n\n## 完成條件\n說得出決策紀錄（ADR）的提議、接受、取代和本課的候選、已審查事實怎麼對應；紀錄為什麼只放模型、核准紀錄為什麼要寫誰與何時；為什麼做的人不能核准自己的變更、規則為什麼要寫成檢查；審查時要看哪些證據、為什麼要查測試有沒有被改、反事實檢查為什麼只認 killed；知道下一場要依已審查事實做新需求。\n\n## 下週可以做的事\n- 挑一個最近的設計決定，寫成一頁 ADR（背景、決定、狀態、後果），請一位同事審查。\n- 在團隊的審查清單加兩行：「是否修改了既有測試？理由？」「核准前打開過哪一行證據？」\n- 列出一個現在只靠一個人說了算的動作，想想能不能改成擋得住的檢查。\n\n## 名詞解釋\n| 名詞 | 意思 | 出處 |\n|---|---|---|\n| ADR（Architecture Decision Record，架構決策紀錄） | 記錄一個重要設計決定的短文件：標題、背景、決定、狀態、後果；重點是為什麼，不是怎麼實作。 | 〈Documenting Architecture Decisions〉（Michael Nygard，2011）；〈Architectural decision record process〉（AWS Prescriptive Guidance） |\n| ADR 的狀態 | 提議（proposed）→ 接受（accepted）或拒絕（rejected）；之後被新決定改變時標成棄用（deprecated）或被取代（superseded）。 | 〈Documenting Architecture Decisions〉（Michael Nygard，2011）；〈About MADR〉（MADR 4.0，2024） |\n| 被取代（superseded） | 新的 ADR 被接受後，舊的標成被取代並指向新的；舊的不刪，仍可查。 | 〈Architectural decision record process〉（AWS Prescriptive Guidance） |\n| 已審查事實（reviewed） | 本課用語：經另一個人核准、Agent 必須遵守的模型內容，對應 ADR 的「接受」；不能直接改寫，只能被新提案取代。 | 〈Architectural decision record process〉（AWS Prescriptive Guidance） |\n| 決策者（decision-makers） | MADR 範本的選填欄位，列出參與決定的人；和日期一起回答「誰、何時」。 | 〈About MADR〉（MADR 4.0，2024） |\n| 變更審查的標準 | 確定讓整體程式更健康就核准，不求完美；退回要寫理由。 | 〈The Code Reviewer's Guide〉（Google Engineering Practices） |\n| Git hook（pre-push hook） | Git 在特定時機自動執行的腳本；pre-push 在推送前執行，回報失敗就中止推送。 | 〈githooks〉（Git 官方文件） |\n| 回饋感測器（feedback sensors） | 在 Agent 寫程式的過程中自動執行、回報結果的檢查，例如測試與靜態檢查。 | 〈Feedback sensors for coding agents〉（Thoughtworks Technology Radar，2026） |\n| 變異測試（mutation testing） | 在程式裡引入小改動，再跑測試，看測試能不能發現；用來評估測試抓錯的能力。 | 〈What is mutation testing?〉（Stryker Mutator 文件） |\n| killed／survived | 改動後測試失敗叫 killed（被抓到）；測試仍通過叫 survived（沒被抓到）。 | 〈What is mutation testing?〉（Stryker Mutator 文件） |\n| 等價變異（equivalent mutant） | 改了程式卻沒改變行為的改動；沒有測試抓得到，只能靠人判斷，所以 survived 不一定代表測試太弱。 | 〈Equivalent mutants〉（Stryker Mutator 文件） |\n| 反事實檢查（counterfactual） | 本課用語：變異測試的手動小版本，由人選一處改壞、跑指定測試、再還原，只認因預期斷言失敗的 killed。 | 〈What is mutation testing?〉（Stryker Mutator 文件） |\n| 簽章 commit | 用金鑰簽過名的 commit，別人能驗出是誰提交、內容沒被改。 | 〈git-commit〉（Git 官方文件） |\n\n## 延伸閱讀\n- 〈Documenting Architecture Decisions〉（Michael Nygard，2011）\n- 〈Architectural decision record process〉（AWS Prescriptive Guidance）\n- 〈About MADR〉（MADR 4.0，2024）\n- 〈Best practices for Claude Code〉（Claude Code 官方文件）\n- 〈Building effective agents〉（Anthropic Engineering，2024）\n- 〈Risks and mitigations for GitHub Copilot cloud agent〉（GitHub 官方文件）\n- 〈Minions: Stripe's one-shot, end-to-end coding agents〉（Stripe，2026）\n- 〈Redesigning source control at Anthropic〉（Anthropic，2026）\n- 〈githooks〉（Git 官方文件）\n- 〈Feedback sensors for coding agents〉（Thoughtworks Technology Radar，2026）\n- 〈How Claude remembers your project〉（Claude Code 官方文件）\n- 〈An AI-powered coding tool wiped out a software company's database, then apologized for a 'catastrophic failure on my part'〉（Fortune，2025）\n- 〈AWS AI coding tool decided to delete and recreate a customer-facing system〉（The Decoder，2026）\n- 〈The Code Reviewer's Guide〉（Google Engineering Practices）\n- 〈When Spec-Driven Development Pays off〉（Nitin Garg／InfoQ，2026）\n- 〈Claude 3.7 Sonnet System Card〉（Anthropic，2025）\n- 〈What is mutation testing?〉（Stryker Mutator 文件）\n- 〈Equivalent mutants〉（Stryker Mutator 文件）\n- 〈git-commit〉（Git 官方文件）\n"}]};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;
const el = id => document.getElementById(id);
let index = 0, notesVisible = false, running = false, accumulated = 0, startedAt = 0;
const overview = el('overview');
function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {
  const available = Math.max(100, innerHeight - document.querySelector('nav').offsetHeight - 18);
  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `${SPEECH_DATA.title.split('：')[0]} · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / ${String(SPEECH_DATA.minutes).padStart(2,'0')}:00`;el('timer').classList.toggle('over',secs>=SPEECH_DATA.minutes*60);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
SPEECH_DATA.downloads.forEach(d=>{const b=node('button',d.label);b.onclick=()=>save(d.name,d.text);el('downloads').append(b);});
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&(e.target.closest('textarea,input,select')||(e.target.closest('button')&&[' ','Enter'].includes(e.key))))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
</body>
</html>
