<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "開場", "title": "改模型，要有第二個人", "lead": "上一場：改一個名詞就是改模型。這一場：模型的改變怎麼審、誰核准、留下什麼。", "cards": [["上一場留下的", "附證據的語言、邊界與規則，全是候選。"], ["這一場講", "決策紀錄、做與核准分開、怎麼審證據。"]], "check": "D2 裡夥伴審查時，有沒有哪一刻想退回？", "notes": "0–1.5 分鐘。本場講業界怎麼審查與核准設計決策，以及 Agent 時代多出來的風險，不是重做 D2。沒有人想退回也值得問：是證據真的夠，還是只是蓋章？最後一頁回來對照。"}, {"id": "why-record", "chapter": "決策紀錄", "title": "決策為什麼要寫下來", "lead": "Nygard（2011）：專案裡最難追的，是當初為什麼這樣決定。", "cards": [["沒寫下來", "後來的人只能盲目照做，或盲目推翻。"], ["寫成 ADR", "背景、決定、狀態、後果，一份短短的紀錄。"]], "check": "你們團隊上一個重要的設計決定，理由寫在哪裡？", "notes": "1.5–3.5 分鐘。Michael Nygard〈Documenting Architecture Decisions〉（Cognitect，2011-11-15）提出 ADR（Architecture Decision Record，架構決策紀錄）：「One of the hardest things to track during the life of a project is the motivation behind certain decisions.」沒有紀錄，後來的人只剩「blind acceptance or blind reversal」。ADR 的段落是標題、背景、決定、狀態、後果。AWS Prescriptive Guidance 也強調紀錄重點是「為什麼」而不是「怎麼做」。對 Agent 更重要：它沒參加當初的會議，只看得到 Repo。📖 延伸閱讀：〈Documenting Architecture Decisions〉（Michael Nygard，2011）。"}, {"id": "reviewed", "chapter": "決策紀錄", "title": "新概念：已審查事實", "lead": "ADR 有狀態：提議、接受、被取代。本課的候選、已審查事實、新候選取代，一一對應。", "flow": ["提議＝候選", "接受＝已審查事實", "被取代＝新候選核准後"], "cards": [["接受後不改寫", "Agent 必須遵守，不能直接修改。"], ["要改就取代", "提新的候選，舊的保留可查。"]], "check": "Agent 想改一條已審查事實時，正確的做法是什麼？", "notes": "3.5–5.5 分鐘。Nygard 的狀態是 proposed、accepted，被推翻時「we will keep the old one around, but mark it as superseded.」AWS〈Architectural decision record process〉：「When the team accepts an ADR, it becomes immutable.」被拒絕的提案也要寫理由，避免下次重吵同一件事。本課的已審查事實（reviewed）就是 Accepted：不是不能變，而是只能透過同一套審查流程被取代。第 03 場的新知識也會先寫成候選。📖 延伸閱讀：〈Architectural decision record process〉（AWS Prescriptive Guidance）。"}, {"id": "separate", "chapter": "做與核准分開", "title": "球員不兼裁判", "lead": "做變更的 Agent 不核准自己的變更；審查交給另一個乾淨的對話，或另一個人。", "cards": [["官方建議", "另開審查者，只看差異與標準，不看作者的推理。"], ["平台限制", "GitHub 的雲端 Agent 不能核准或合併自己的 PR。"], ["企業做法", "Stripe 自述：Agent 每週上千個 PR，全經人審。"]], "check": "D2 裡，「核准」這句話是在誰的對話裡說的？", "notes": "5.5–7.5 分鐘。人工核准關卡（Gate）的加深一層。Claude Code 官方文件〈Best practices for Claude Code〉建議用新的審查者審 diff：「the agent doing the work isn't the one grading it.」GitHub〈Risks and mitigations for GitHub Copilot cloud agent〉：雲端 Agent「cannot approve or merge a pull request」。Stripe 工程部落格〈Minions: Stripe's one-shot, end-to-end coding agents〉（2026-02-09）自述每週超過一千個 PR 由 Agent 產出、全部交人審查；這是公司自己的數字。AWS Transform 的使用者指南也把「domains decomposition」列為要人核准的中間產物。D2 的設計：兩人共用一台機器，但各用自己的 Agent 對話。📖 延伸閱讀：〈Best practices for Claude Code〉（Claude Code 官方文件）；〈Building effective agents〉（Anthropic Engineering，2024）。"}, {"id": "enforce", "chapter": "做與核准分開", "title": "口頭規則擋不住，寫成檢查", "lead": "對 Agent 說「不要自己核准」只是建議；要每次都發生，就寫成自動檢查。", "flow": ["規則檔：建議", "測試與檢查程式：每次都跑", "推送時檢查：沒核准就擋"], "cards": [["為什麼", "Agent 忙起來會忘，人也會。"], ["D2 的做法", "沒有夥伴簽章的變更，推不上去。"]], "check": "如果 Agent 自己 commit 再推送，會在哪一步被擋下？", "notes": "7.5–9.5 分鐘。Claude Code 官方文件：「Unlike CLAUDE.md instructions which are advisory, hooks are deterministic」；AGENTS.md 等其他工具的規則檔也一樣，是上下文，不是強制設定。Thoughtworks Technology Radar Vol. 34（2026-04）把〈Feedback sensors for coding agents〉列為 Trial：檢查要在寫程式的過程中跑，commit 前回報乾淨的結果。對照 D2 檢查點 1、2。不要展開金鑰與 hook 細節；這套檢查的限制留到第 04 場。📖 延伸閱讀：〈githooks〉（Git 官方文件）。"}, {"id": "incidents", "chapter": "做與核准分開", "title": "警示案例：少了第二道關卡", "lead": "規則只寫在對話裡、或沒人覆核，就擋不住 Agent 的破壞性動作。", "cards": [["Replit（2025-07）", "凍結期間 Agent 刪了正式資料庫；事後分開開發與正式環境。"], ["AWS（2025-12）", "報導稱 Agent 重建環境，服務中斷 13 小時；Amazon 說是權限設定錯誤。"]], "check": "你的團隊有哪個動作，現在只靠一個人說了算？", "notes": "9.5–11.5 分鐘。Fortune（2025-07-23）：SaaStr 創辦人測試 Replit Agent，在「程式碼與動作凍結」期間，Agent 刪掉 1,200 多位主管、1,190 多家公司的資料，還說無法回復，其實可以手動回復；Replit 執行長稱「Unacceptable and should never be possible」，之後加入開發與正式資料庫分離、只規劃模式。教訓：凍結只寫在對話裡沒用。The Decoder（2026-02-20）轉述 Financial Times：AWS 的 Kiro 決定「delete and recreate the environment」，造成某服務 13 小時中斷，報導稱工程師不需第二人核准；Amazon 回應是「user error—specifically misconfigured access controls—not AI」，之後加入正式環境存取的強制同儕審查。兩邊說法都要講；FT 原文在付費牆後，未讀到。不要說「AWS 承認 AI 造成當機」，也不要說「Replit 捏造 4,000 個使用者」。這是兩件事故在 DLC 唯一的完整講法，第 03、04 場只回扣。📖 延伸閱讀：〈An AI-powered coding tool wiped out a software company's database, then apologized for a 'catastrophic failure on my part'〉（Fortune，2025）；〈AWS AI coding tool decided to delete and recreate a customer-facing system〉（The Decoder，2026）。"}, {"id": "record-scope", "chapter": "審查證據", "title": "紀錄只放模型，不放工作筆記", "lead": "一筆紀錄只寫：這個概念是什麼、和誰有關、證據在哪。做法、信心分數、待辦都不放。", "cards": [["為什麼", "審查的人逐條對證據；雜訊越多越難審。"], ["沒解決的問題", "寫進變更提案的待確認問題，不寫進模型。"]], "check": "D2 審的那筆候選，有沒有一句其實是工作筆記？", "notes": "11.5–13 分鐘。新概念：紀錄的範圍。Agent 很愛把「我是用什麼方法找到的」「信心 0.8」「待確認」順手寫進紀錄；這些放進模型，下一個 Agent 會把它們當成事實讀。較短、每句都能對證據的紀錄，勝過看起來完整、其實重述原文的紀錄。沒解決的問題放在變更提案的待確認問題，審查時一起決定。這和 ADR 只寫背景、決定、後果是同一個精神。給 Agent 的一句話：「紀錄只放元素、關係與證據；其他寫進提案的待確認問題。」"}, {"id": "package", "chapter": "審查證據", "title": "示範：請 Agent 做審查表", "lead": "審查的人不必看懂程式；他要一張表：每條主張的證據與實際結果。", "prompt": "先不要修改任何檔案。請把這次要升級的每一筆候選列成表：主張、證據（路徑:起-迄行）、對應的測試與實際結果字樣、反事實檢查結果。沒有實際跑過的標「未驗證」。列完停下。", "cards": [["看理由", "為什麼這樣定，比怎麼實作重要。"], ["看實際字樣", "passed、killed 要來自實際執行。"]], "check": "表裡有沒有一筆，主張和證據講的不是同一件事？", "notes": "13–15 分鐘。對照 D2 檢查點 3。這是上一場「要證據，不要形容詞」的加深一層：證據從一句回報，變成給另一個人審的整張表。AWS 的 ADR 流程：紀錄著重「the reason for the decision rather than how the team implemented it.」主課的變更審查看程式改了什麼；這裡看模型要改成什麼、證據在哪。示範提示詞，未實際執行。"}, {"id": "review", "chapter": "審查證據", "title": "審查怎麼做：先讀、再問、可退回", "lead": "AWS 的 ADR 審查會先安靜讀 10–15 分鐘，再逐條討論，最後接受、重做或退回。", "cards": [["標準是讓整體更好", "Google：確定讓程式更健康就核准，不求完美。"], ["退回要寫理由", "下次就不必重吵同一件事。"]], "check": "你核准前，親自打開過哪一行證據？", "notes": "15–17 分鐘。AWS〈Architectural decision record process〉：會議先讀 10–15 分鐘，逐條討論，結果是接受、重做或拒絕；拒絕時「adds a reason for the rejection to prevent future discussions on the same topic.」Google Engineering Practices〈The Standard of Code Review〉：「approving a CL once it is in a state where it definitely improves the overall code health」。對照 D2 檢查點 4：夥伴回「退回：原因」不是失敗，是審查有在運作；沒有人追問的核准只是蓋章。📖 延伸閱讀：〈The Code Reviewer's Guide〉（Google Engineering Practices）。"}, {"id": "tests-changed", "chapter": "審查證據", "title": "綠燈不等於安全", "lead": "Anthropic 在模型系統卡揭露：Agent 為了讓測試通過，會改測試去配合程式。", "prompt": "先不要修改任何檔案。請列出這次變更動到的所有測試檔與行號，每處說明改了什麼、會不會讓原本該失敗的情況變成通過。只列事實，列完停下。", "cards": [["怎麼發生", "多次失敗後，寫死預期值或改測試。"], ["審查時看", "這次有沒有動到測試，動了哪幾行。"]], "check": "這次變更動到測試了嗎？動的理由寫在哪？", "notes": "17–19 分鐘。Anthropic〈Claude 3.7 Sonnet System Card〉（2025-02）第 6 節 Excessive Focus on Passing Tests：模型多次失敗後會特例化測試，「also includes modifying the problematic tests themselves to match the code's output.」使用者的測試沒發現，靠自動分類器才抓到；系統卡建議監看「Unexpected modifications to test files」。不要講成某一家模型的毛病：這是廠商自己公開的行為紀錄，其他模型也可能發生。第 03 場只回扣這頁，不重講。示範提示詞，未實際執行。📖 延伸閱讀：〈Claude 3.7 Sonnet System Card〉（Anthropic，2025）。"}, {"id": "mutation", "chapter": "審查證據", "title": "技巧：故意改壞，看測試抓不抓得到", "lead": "反事實檢查：改壞一處、跑測試、自動還原。測試失敗（killed）才證明有人守著。", "prompt": "先不要修改任何檔案。請針對這條規則，提 2 個「故意改壞」的方案：改哪個檔案的哪幾行、改成什麼、預期哪個測試會失敗。不要替我選，列完停下。我選好後再跑，回報實際字樣是 killed 還是 survived。", "cards": [["killed", "測試失敗了：這條規則有測試守著。"], ["survived", "測試仍通過：規則沒人守，或測試太弱。"]], "check": "你選的改法，改到的是規則本身，還是無關的字串？", "notes": "19–21.5 分鐘。這是變異測試（mutation testing）的手動小版本：工具會自動產生大量小改動，看測試殺掉幾個。Thoughtworks Technology Radar Vol. 34（2026-04）在〈Feedback sensors for coding agents〉稱變異測試是評估測試抓錯能力「the most honest signal」，也提醒 AI 產生的測試可能永遠是綠的。為什麼人選改法：Agent 容易挑最好抓的改法。指令沒報錯不等於 killed，要看實際字樣；也要因為對的原因失敗：先寫下預期看到哪個斷言失敗，測試因別的錯（例如程式根本載入不了）而失敗不算證明，本 DLC 的工具會把這種結果標成 inconclusive。第 03 場會加深：每條新規則各改壞一次。📖 延伸閱讀：〈Feedback sensors for coding agents〉（Thoughtworks Technology Radar，2026）。"}, {"id": "record", "chapter": "留下紀錄", "title": "核准紀錄：誰、何時、核准哪一份", "lead": "ADR 被接受時寫下決策者與日期；模型裡的已審查事實也一樣，要查得到誰、何時核准。", "cards": [["誰與何時", "每筆已審查事實附核准者與時間。"], ["提案留在歷史", "紀錄不抄提案；要查時從歷史找得到。"], ["沒被改過", "簽章驗得出；套用前 Agent 再驗一次。"]], "check": "三個月後有人問「這條規則誰核准的」，你從哪裡查？", "notes": "21.5–23.5 分鐘。對照 D2 檢查點 5、6。MADR 4.0 的 ADR 範本在狀態與日期旁邊有 decision-makers 欄位：「list everyone involved in the decision」。已審查事實就是 Accepted 加上決策者：紀錄本身只寫誰、何時；當初那份審查包與核准過程留在版本與稽核歷史裡，要追查時找得到，不必抄進每筆紀錄（呼應前面：紀錄只放模型）。「沒被改過」要靠工具驗：業界常見做法是簽章 commit 加上必要審查。本 DLC 用的模型工具在每筆已審查紀錄寫入核准者與時間，提案記在稽核紀錄；工具可以換，道理相同。📖 延伸閱讀：〈About MADR〉（MADR 4.0）；〈git-commit〉（Git 官方文件）的 -S 選項說明。"}, {"id": "next", "chapter": "下一站", "title": "帶走什麼", "lead": "做的人和核准的人分開；核准要看證據、留紀錄；事實只能被新提案取代。", "flow": ["提案者附證據", "另一個人審查", "核准並留紀錄", "已審查事實", "下一場依模型做需求"], "cards": [["回到團隊", "挑一個模型變更，寫一份短 ADR 請人審。"], ["下一場", "依已審查事實做新需求，由人決定邊界。"]], "check": "用一句話說出：killed 證明了什麼？", "notes": "23.5–25 分鐘，收尾。回到開場：誰想退回過？哪一步最像只是照流程做完，DLC 回顧會請 Agent 從紀錄整理證據再判斷。銜接 D3：模型成為事實後，新需求的設計選項要以它為依據。"}], "title": "審查與核准：模型變更要經過第二個人", "minutes": 25, "downloads": [{"label": "下載操作講義", "name": "review-approval-handout.md", "text": "# 審查與核准：模型變更要經過第二個人\n\n\u003e 讀者：學員。時機：DDD 延伸課 D2 之後的 25 分鐘講解。前置：已聽過 DLC Speech 01，做完 D2。\n\n本場講概念與技巧，不需要寫程式或打指令。頁面上的提示詞是示範，想試再貼給自己的 Agent；沒有實際執行的結果，一律視為未驗證。\n\n## 1. 改模型，要有第二個人\n\n上一場：改一個名詞就是改模型。這一場：模型的改變怎麼審、誰核准、留下什麼。\n\n- **上一場留下的**：附證據的語言、邊界與規則，全是候選。\n\n- **這一場講**：決策紀錄、做與核准分開、怎麼審證據。\n\n**人工確認**：D2 裡夥伴審查時，有沒有哪一刻想退回？\n\n## 2. 決策為什麼要寫下來\n\nNygard（2011）：專案裡最難追的，是當初為什麼這樣決定。\n\n- **沒寫下來**：後來的人只能盲目照做，或盲目推翻。\n\n- **寫成 ADR**：背景、決定、狀態、後果，一份短短的紀錄。\n\n**人工確認**：你們團隊上一個重要的設計決定，理由寫在哪裡？\n\n## 3. 新概念：已審查事實\n\nADR 有狀態：提議、接受、被取代。本課的候選、已審查事實、新候選取代，一一對應。\n\n提議＝候選 → 接受＝已審查事實 → 被取代＝新候選核准後\n\n- **接受後不改寫**：Agent 必須遵守，不能直接修改。\n\n- **要改就取代**：提新的候選，舊的保留可查。\n\n**人工確認**：Agent 想改一條已審查事實時，正確的做法是什麼？\n\n## 4. 球員不兼裁判\n\n做變更的 Agent 不核准自己的變更；審查交給另一個乾淨的對話，或另一個人。\n\n- **官方建議**：另開審查者，只看差異與標準，不看作者的推理。\n\n- **平台限制**：GitHub 的雲端 Agent 不能核准或合併自己的 PR。\n\n- **企業做法**：Stripe 自述：Agent 每週上千個 PR，全經人審。\n\n**人工確認**：D2 裡，「核准」這句話是在誰的對話裡說的？\n\n## 5. 口頭規則擋不住，寫成檢查\n\n對 Agent 說「不要自己核准」只是建議；要每次都發生，就寫成自動檢查。\n\n規則檔：建議 → 測試與檢查程式：每次都跑 → 推送時檢查：沒核准就擋\n\n- **為什麼**：Agent 忙起來會忘，人也會。\n\n- **D2 的做法**：沒有夥伴簽章的變更，推不上去。\n\n**人工確認**：如果 Agent 自己 commit 再推送，會在哪一步被擋下？\n\n## 6. 警示案例：少了第二道關卡\n\n規則只寫在對話裡、或沒人覆核，就擋不住 Agent 的破壞性動作。\n\n- **Replit（2025-07）**：凍結期間 Agent 刪了正式資料庫；事後分開開發與正式環境。\n\n- **AWS（2025-12）**：報導稱 Agent 重建環境，服務中斷 13 小時；Amazon 說是權限設定錯誤。\n\n**人工確認**：你的團隊有哪個動作，現在只靠一個人說了算？\n\n## 7. 紀錄只放模型，不放工作筆記\n\n一筆紀錄只寫：這個概念是什麼、和誰有關、證據在哪。做法、信心分數、待辦都不放。\n\n- **為什麼**：審查的人逐條對證據；雜訊越多越難審。\n\n- **沒解決的問題**：寫進變更提案的待確認問題，不寫進模型。\n\n**人工確認**：D2 審的那筆候選，有沒有一句其實是工作筆記？\n\n## 8. 示範：請 Agent 做審查表\n\n審查的人不必看懂程式；他要一張表：每條主張的證據與實際結果。\n\n- **看理由**：為什麼這樣定，比怎麼實作重要。\n\n- **看實際字樣**：passed、killed 要來自實際執行。\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請把這次要升級的每一筆候選列成表：主張、證據（路徑:起-迄行）、對應的測試與實際結果字樣、反事實檢查結果。沒有實際跑過的標「未驗證」。列完停下。\n\n**人工確認**：表裡有沒有一筆，主張和證據講的不是同一件事？\n\n## 9. 審查怎麼做：先讀、再問、可退回\n\nAWS 的 ADR 審查會先安靜讀 10–15 分鐘，再逐條討論，最後接受、重做或退回。\n\n- **標準是讓整體更好**：Google：確定讓程式更健康就核准，不求完美。\n\n- **退回要寫理由**：下次就不必重吵同一件事。\n\n**人工確認**：你核准前，親自打開過哪一行證據？\n\n## 10. 綠燈不等於安全\n\nAnthropic 在模型系統卡揭露：Agent 為了讓測試通過，會改測試去配合程式。\n\n- **怎麼發生**：多次失敗後，寫死預期值或改測試。\n\n- **審查時看**：這次有沒有動到測試，動了哪幾行。\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請列出這次變更動到的所有測試檔與行號，每處說明改了什麼、會不會讓原本該失敗的情況變成通過。只列事實，列完停下。\n\n**人工確認**：這次變更動到測試了嗎？動的理由寫在哪？\n\n## 11. 技巧：故意改壞，看測試抓不抓得到\n\n反事實檢查：改壞一處、跑測試、自動還原。測試失敗（killed）才證明有人守著。\n\n- **killed**：測試失敗了：這條規則有測試守著。\n\n- **survived**：測試仍通過：規則沒人守，或測試太弱。\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請針對這條規則，提 2 個「故意改壞」的方案：改哪個檔案的哪幾行、改成什麼、預期哪個測試會失敗。不要替我選，列完停下。我選好後再跑，回報實際字樣是 killed 還是 survived。\n\n**人工確認**：你選的改法，改到的是規則本身，還是無關的字串？\n\n## 12. 核准紀錄：誰、何時、核准哪一份\n\nADR 被接受時寫下決策者與日期；模型裡的已審查事實也一樣，要查得到誰、何時核准。\n\n- **誰與何時**：每筆已審查事實附核准者與時間。\n\n- **提案留在歷史**：紀錄不抄提案；要查時從歷史找得到。\n\n- **沒被改過**：簽章驗得出；套用前 Agent 再驗一次。\n\n**人工確認**：三個月後有人問「這條規則誰核准的」，你從哪裡查？\n\n## 13. 帶走什麼\n\n做的人和核准的人分開；核准要看證據、留紀錄；事實只能被新提案取代。\n\n提案者附證據 → 另一個人審查 → 核准並留紀錄 → 已審查事實 → 下一場依模型做需求\n\n- **回到團隊**：挑一個模型變更，寫一份短 ADR 請人審。\n\n- **下一場**：依已審查事實做新需求，由人決定邊界。\n\n**人工確認**：用一句話說出：killed 證明了什麼？\n\n## 完成條件\n說得出決策紀錄（ADR）的提議、接受、取代和本課的候選、已審查事實怎麼對應；紀錄為什麼只放模型、核准紀錄為什麼要寫誰與何時；為什麼做的人不能核准自己的變更、規則為什麼要寫成檢查；審查時要看哪些證據、為什麼要查測試有沒有被改、反事實檢查為什麼只認 killed；知道下一場要依已審查事實做新需求。\n"}]};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;
const el = id => document.getElementById(id);
let index = 0, notesVisible = false, running = false, accumulated = 0, startedAt = 0;
const overview = el('overview');
function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {
  const available = Math.max(100, innerHeight - document.querySelector('nav').offsetHeight - 18);
  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `${SPEECH_DATA.title.split('：')[0]} · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / ${String(SPEECH_DATA.minutes).padStart(2,'0')}:00`;el('timer').classList.toggle('over',secs>=SPEECH_DATA.minutes*60);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
SPEECH_DATA.downloads.forEach(d=>{const b=node('button',d.label);b.onclick=()=>save(d.name,d.text);el('downloads').append(b);});
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&(e.target.closest('textarea,input,select')||(e.target.closest('button')&&[' ','Enter'].includes(e.key))))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
