<!-- ===================== 休息 60–70 ===================== -->

<section class="slide" data-seg="dlc-break" data-title="休息 10 分鐘" data-minute="60" data-timer="10:00">
  <p class="kicker">休息 · 60–70</p>
  <h2 class="title">休息 10 分鐘</h2>
  <p class="lead">第 70 分鐘回來，輸入 D3a 解鎖碼。</p>
  <p class="callout warn">私鑰不要放進 Repo、不要貼給 Agent、不要截圖；Registry 還沒變成已審查的組，先找主持人。</p>
  <aside class="notes">
    <p><b>操作</b>：按 <b>T</b> 啟動 10:00 倒數（00:00＝第 60 分）。</p>
    <p><b>休息時處理</b>：D2 未完成的組，此時私下提供降級碼 <code data-code="dlc-rec-d2"></code>（若尚未發）；D1 未完成者可發 <code data-code="dlc-rec-d1"></code>。Recovery 不投影、不群組公布，不作為小組成果評分。</p>
    <p><b>回來之前</b>：確認每組 <code>validate --require-reviewed</code> 與 <code>verify-audit</code> 為 OK（或已改用 reviewed Registry），再進 D3a。</p>
  </aside>
</section>
