<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Smart Ticket 工作坊 Runbook</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('stw:theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
{{STYLE}}
</style>
</head>
<body>
<a class="rb-skip" href="#rb-main">跳到主要內容</a>

<header class="rb-header">
  <button type="button" class="rb-icon-btn rb-menu-btn" aria-label="開啟章節導覽" aria-controls="rb-sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="rb-brand" href="#" data-home>
    <span class="rb-brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>
    </span>
    <span class="rb-brand-text">Smart Ticket 工作坊 <b>Runbook</b></span>
  </a>
  <div class="rb-search" role="search">
    <svg class="rb-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input type="search" class="rb-search-input" placeholder="搜尋章節與內容" aria-label="搜尋章節與內容" autocomplete="off" spellcheck="false">
    <kbd class="rb-search-kbd" aria-hidden="true">/</kbd>
    <div class="rb-search-results" role="listbox" hidden></div>
  </div>
  <div class="rb-header-right">
    <div class="rb-progress" role="progressbar" aria-label="整體進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" title="已完成章節比例">
      <span class="rb-progress-label">進度</span>
      <span class="rb-progress-track"><span class="rb-progress-fill"></span></span>
      <span class="rb-progress-num">0%</span>
    </div>
    <button type="button" class="rb-icon-btn rb-export-btn" aria-label="下載全部填寫內容（ZIP）" title="下載全部填寫內容（ZIP）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    </button>
    <button type="button" class="rb-icon-btn rb-theme-btn" aria-label="切換淺色／深色主題" title="切換淺色／深色主題">
      <svg class="rb-ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="rb-ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="rb-shell">
  <aside class="rb-sidebar" id="rb-sidebar" aria-label="章節導覽">
    <div class="rb-sidebar-inner">
{{NAV}}
      <div class="rb-build-info">{{BUILD_INFO}}</div>
    </div>
  </aside>
  <div class="rb-scrim" hidden></div>

  <main class="rb-main" id="rb-main" tabindex="-1">
    <div class="rb-content">
      <nav class="rb-breadcrumb" aria-label="目前位置"></nav>
      <div class="rb-page-head">
        <h1 class="rb-page-title"></h1>
        <div class="rb-page-meta"></div>
      </div>
      <div class="rb-pages">
{{PAGES}}
      </div>
      <nav class="rb-pager" aria-label="上一頁／下一頁"></nav>
    </div>
  </main>

  <aside class="rb-toc" aria-label="本頁內容">
    <div class="rb-toc-inner">
      <div class="rb-toc-title">本頁內容</div>
      <ol class="rb-toc-list"></ol>
    </div>
  </aside>
</div>

<div class="rb-toasts" role="status" aria-live="polite"></div>

{{DATA}}
<script>
{{SCRIPT}}
</script>
</body>
</html>
