<style>:root{--ink:#1e3761;--blue:#0093c1;--teal:#008b82;--orange:#df6539;--muted:#536173;--line:#d5e1e6}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:#102036;color:var(--ink);font-family:"Microsoft JhengHei","Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid #c6dbe3;border-radius:7px;background:white;color:var(--ink);padding:7px 12px}
button:hover{background:#e2f3f9}button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}button:disabled{opacity:.4;cursor:default}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:10px;padding:16px 24px}
.card h2{font-size:28px;margin:0 0 8px}.card p{font-size:25px;line-height:1.4;margin:0;color:#34485d}
.flow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.flow span{font-size:24px;padding:13px 18px;background:#dff3f0;border-radius:8px;line-height:1.35}.flow b{color:var(--teal);font-size:25px}
pre{margin:0;padding:12px 22px;border-radius:10px;background:#152c43;color:#f2f6f7;font:22px/1.3 Consolas,"Microsoft JhengHei",monospace;white-space:pre-wrap;overflow:auto}
#prompt-box{padding:20px 26px;background:#e2f3f9;border-radius:10px;border-left:6px solid var(--blue);flex-shrink:0}
.label{display:flex;justify-content:space-between;align-items:center;font-size:24px}.label button{font-size:19px}
#prompt{font-size:25px;line-height:1.5;margin:10px 0 0;white-space:pre-wrap}#check{margin:0;padding:17px 23px;background:#fff0e7;border-left:6px solid var(--orange);font-size:24px;line-height:1.45;border-radius:5px;flex-shrink:0}
footer{margin-top:auto;display:flex;justify-content:space-between;font-size:19px;color:var(--muted)}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:7px;align-items:center;padding:9px 12px;background:#102036;color:white;flex-wrap:wrap;font-size:15px;z-index:5;transition:opacity .3s}

:fullscreen nav{opacity:0}:fullscreen nav:hover,:fullscreen nav:focus-within{opacity:1}
#timer{font-variant-numeric:tabular-nums;margin:0 6px}#timer.over{color:#ffaf85}
dialog{width:min(1100px,90vw);max-height:85vh;border:0;border-radius:14px;padding:28px;color:var(--ink);overflow:auto}dialog::backdrop{background:#102036bb}
#overview-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}#overview-list button{text-align:left;line-height:1.5;padding:15px}#overview-list button[aria-current=true]{border:2px solid var(--blue);background:#e2f3f9}
@media print{body{background:white;overflow:visible}nav,dialog,#notes{display:none!important}#stage{position:static;transform:none!important;width:100%;height:auto;padding:20px}h1{font-size:30px}.card p,#prompt,#check{font-size:16px}pre{font-size:14px}header,footer{font-size:12px}}

<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "開場", "title": "為什麼 Agent 會「越聊越笨」", "lead": "剛才你接手一個長了 12 個月的專案，並開了新對話。這一場講背後的原因：Agent 的工作桌有多大。", "cards": [["剛才做的", "開新對話、指名要讀的檔、記下起點、留交接檔。"], ["今天補上的", "脈絡視窗、Token 成本、壓縮與交接、規則檔，以及何時該重開。"]], "check": "想一次經驗：對話越拉越長之後，Agent 開始忘記或搞混什麼？", "explain": ["Agent 聊久了會忘記一開始講好的規則、搞混前後的決定，這不是錯覺，也不是某一套產品的毛病，而是所有 Coding Agent 共通的原理：它每次回答都只看得到一張有大小限制的「工作桌」。這一場的每個技巧，都是在管理這張桌子。"], "notes": "約 1.5 分鐘。只用一句話連回剛才的 Time Skip（時間快轉：專案已開發 12 個月，你剛接手），不重講任務。先問全場：有沒有遇過 Agent 聊久了，開始忘記一開始講好的規則？請兩三人舉例，最後一頁回來對照。本場講的是所有 Coding Agent 共通的原理，不是某一套產品的操作。📖 定義出處：本課程〈Time Skip：12 個月後〉"}, {"id": "window", "chapter": "01 脈絡視窗", "title": "脈絡視窗：是工作桌，不是倉庫", "lead": "Context Window（脈絡視窗）：Agent 這一次回答時「攤在桌上」的全部內容，有固定上限。", "flow": ["規則檔", "你的訊息", "讀過的檔案", "指令輸出", "Agent 的回答"], "cards": [["全部都佔位子", "不只你打的字；讀的每個檔、跑的每個測試輸出都算。"], ["滿得很快", "讀幾個大檔、貼一次長輸出，桌面就堆滿了。"], ["越滿越不準", "官方文件直說：視窗越滿，表現越差。"]], "check": "說出兩樣你沒有打字、卻也佔了 Agent 工作桌的東西。", "explain": ["除了你打的字，Agent 自己之前的回答也佔位子；而且你看不到的指令輸出和讀檔內容，往往最佔空間。", "Claude Code 官方文件直說：脈絡視窗很快就會滿，越滿表現越差。其他工具的官方文件也有同樣的章節。所以「視窗夠大」不代表可以隨便放：倉庫放得下，不代表每樣都拿在手上。"], "read": ["〈Best practices for Claude Code〉（Anthropic，官方文件）", "〈Context windows〉（Anthropic，官方文件）"], "notes": "約 2 分鐘。比喻：工作桌越堆越亂，找東西越慢；倉庫是放得下，但不是每樣都拿在手上。Claude Code 官方文件原話：Claude's context window fills up fast, and performance degrades as it fills.（脈絡視窗很快就滿，越滿表現越差。）其他工具的文件也有同樣的章節。要強調：學員看不到的指令輸出、讀檔內容，才是最佔位子的。📖 延伸閱讀：〈Best practices for Claude Code〉（Anthropic，持續更新）；〈Context windows〉（Anthropic，持續更新）"}, {"id": "rot", "chapter": "01 脈絡視窗", "title": "給越多越好？剛好相反", "lead": "Context Rot（脈絡劣化）：內容越多，Agent 越難在裡面找到真正重要的那幾句。", "cards": [["注意力有預算", "每多一段無關內容，就從重要內容那裡分走一點注意力。"], ["目標是「少而準」", "給最少、但最有用的資訊，而不是全部倒進去。"], ["大視窗不是解藥", "官方說每個模型都會劣化；能放得下，不代表讀得好。"]], "check": "下次想說「把整個專案讀一遍」時，改成說出哪三個檔最重要。", "explain": ["Anthropic〈Effective context engineering for AI agents〉（2025-09）用了兩個說法：模型有「注意力預算」，每多一段內容就分走一點注意力；所以目標是找出「最少、但訊號最強」的那一組內容。文中也指出，內容越多、越難準確想起其中細節的現象（脈絡劣化），在所有模型上都會發生。", "常見的誤解是「視窗越大越好，全部丟進去就好」。下週怎麼用：每貼一段內容前問自己「這段不給，Agent 會做錯嗎？」；想說「把整個專案讀一遍」時，改成指名最重要的三個檔。"], "read": ["〈Effective context engineering for AI agents〉（Anthropic，2025）"], "notes": "約 2 分鐘。Anthropic 工程文章〈Effective context engineering for AI agents〉（2025-09-29）提出兩個說法：attention budget（注意力預算），以及目標是 the smallest possible set of high-signal tokens（最少但訊號最強的內容）。常見誤解是「視窗越大越好，全部丟進去就好」，原文說 context rot 在所有模型都會發生。經驗法則：每貼一段內容前，問自己「這段不給，Agent 會做錯嗎？」📖 延伸閱讀：〈Effective context engineering for AI agents〉（Anthropic，2025）"}, {"id": "cost", "chapter": "02 Token 成本", "title": "長對話為什麼越來越貴", "lead": "Token（詞元）是計費單位。Agent 每回答一次，都要把整段對話歷史重新讀一遍。", "flow": ["第 1 問：讀 1 份", "第 10 問：讀 10 份歷史", "第 50 問：讀 50 份歷史"], "cards": [["成本跟著桌面變大", "官方文件：處理的脈絡越多，用掉的 Token 越多。"], ["量級參考", "某工具官方估計：每人每個工作日約十幾美元；價格常變。"], ["省錢＝省干擾", "同一招讓 Agent 更準，也讓帳單變小。"]], "check": "你的對話裡，哪一段長輸出其實只要一行結論就夠？", "explain": ["第 50 問的成本遠高於第 1 問，因為每次都要把整段歷史重讀。這就像計程車跳表，每多問一句，前面的路程都要再算一次（實際計費有快取等細節，這裡只講直覺）。", "Claude Code 官方〈Manage costs effectively〉說，Token 成本跟脈絡大小成正比；同一頁提到企業部署平均約每位開發者每個活躍日 13 美元、每月約 150–250 美元，90% 的使用者每天低於 30 美元。這只適用該產品，價格也會變，請當成量級參考，不要拿來推算你們公司要花多少。", "好消息是省錢和變準是同一件事：讓桌面保持乾淨的做法，同時讓帳單變小。"], "read": ["〈Manage costs effectively〉（Anthropic，官方文件）", "〈Token counting〉（Anthropic，官方文件）"], "notes": "約 2 分鐘。比喻：像計程車跳表，每多問一句，前面的路程都要再算一次（實際計費有快取等細節，這裡只講量級的直覺）。Claude Code 官方〈Manage costs effectively〉原話：Token costs scale with context size。同頁提到企業部署平均約每位開發者每個活躍日 13 美元、每月約 150–250 美元、90% 使用者每日低於 30 美元；只適用該產品，價格會變，所以投影片只寫「十幾美元」的量級。不要推算成「你們公司要花多少」。📖 延伸閱讀：〈Manage costs effectively〉（Anthropic，持續更新）；〈Token counting〉（Anthropic，持續更新）"}, {"id": "subagent", "chapter": "02 Token 成本", "title": "讀很多檔？請它先摘要再回來", "lead": "要找東西時，讓 Agent 在另一個對話裡讀，只把結論帶回主對話。", "cards": [["指名範圍", "你剛才說了只讀哪些檔，這就是最便宜的省法。"], ["子 Agent 探索", "有些工具能派子 Agent 去讀，只回傳一兩千 Token 的摘要。"], ["沒有子 Agent 時", "開一個新對話專門探索，把摘要貼回主對話。"]], "prompt": "先不要修改檔案。請另外探索 tests/ 資料夾，回來只給我：測試分成哪幾類、各自在測什麼，最多 8 行。不要貼原始輸出，最後列出你讀了哪些檔，然後停下。", "check": "回報裡有沒有混進整段原始輸出？讀了哪些檔有沒有列出來？", "explain": ["子 Agent 是主 Agent 派出去做一件事的另一個 Agent：它在自己的脈絡裡讀大量檔案，只把結論帶回來。Anthropic〈Effective context engineering for AI agents〉提到，子 Agent 通常只回傳約 1,000–2,000 個 Token 的濃縮摘要，主對話因此保持乾淨。", "不是每個工具都有子 Agent。沒有時，開一個新對話專門探索，請它寫摘要，再把摘要貼回主對話，效果相近。最便宜的省法則是你剛才做過的：指名只讀哪些檔。審摘要時看兩件事：有沒有混進整段原始輸出，以及有沒有列出讀了哪些檔，方便你追查。"], "read": ["〈Effective context engineering for AI agents〉（Anthropic，2025）"], "notes": "約 2 分鐘。第一張卡連回剛才指名要讀的檔，其餘是新內容。Anthropic〈Effective context engineering for AI agents〉（2025-09-29）提到子 Agent 在自己的脈絡裡大量讀檔，只回傳約 1,000–2,000 Token 的濃縮摘要，主對話保持乾淨。不是每個工具都有子 Agent，所以第三張卡給替代做法。示範提示詞只供示範，沒有實際執行就說未驗證。📖 延伸閱讀：〈Effective context engineering for AI agents〉（Anthropic，2025）"}, {"id": "fresh", "chapter": "03 何時重開", "title": "糾正兩次還錯，就重開", "lead": "對話裡累積的錯誤嘗試也佔位子，而且會一直誤導 Agent。", "cards": [["換任務就開新的", "兩件不相關的事，不要擠在同一段對話裡。"], ["同一問題糾正兩次", "還是錯，就停：先整理學到的，再開新對話重來。"], ["重開不是浪費", "乾淨對話加更好的提示詞，幾乎總是勝過越補越長的對話。"]], "prompt": "先停下，不要再修改。請整理成一份新的提示詞：目標、已確認的事實、試過但無效的做法、限制、完成條件。我會把它貼到新對話重新開始。", "check": "新提示詞裡有沒有寫出「試過但無效的做法」，避免新對話重蹈覆轍？", "explain": ["Claude Code 官方文件說：乾淨的對話加上更好的提示詞，幾乎總是勝過累積了一堆修正的長對話；並建議同一個問題糾正兩次還不對，就清掉重來。原因是錯誤的嘗試也留在脈絡裡佔位子，而且會一直把 Agent 往錯的方向拉。", "重開不等於從零開始。先請 Agent 用 Greenfield 學過的五段（目標、背景、限制、輸出格式、停止條件）整理成新的提示詞，再加上「試過但無效的做法」，新對話才不會重蹈覆轍。下週觀察自己：你通常糾正幾次才放棄？超過兩次就試試重開。"], "read": ["〈Best practices for Claude Code〉（Anthropic，官方文件）"], "notes": "約 2.5 分鐘。Claude Code 官方〈Best practices for Claude Code〉原話：A clean session with a better prompt almost always outperforms a long session with accumulated corrections.（乾淨的對話加更好的提示詞，幾乎總是勝過累積了一堆修正的長對話。）文件同時建議：糾正兩次還不對就清掉重來。提示詞五部分（目標／背景／限制／輸出格式／停止條件）在 Greenfield 學過，這裡把它當重開的工具。可問：你通常糾正幾次才放棄？📖 延伸閱讀：〈Best practices for Claude Code〉（Anthropic，持續更新）"}, {"id": "compact", "chapter": "03 何時重開", "title": "壓縮：快滿時，把對話摘要成一段", "lead": "Compaction（壓縮）：對話接近上限時，把歷史摘要成短版，帶到新的視窗繼續。", "cards": [["好處", "不用從零開始，桌面清出空間。"], ["代價", "摘要會丟細節；被丟掉的可能正好是那條規則。"], ["人的做法", "重要決定先寫進檔案，不要只活在對話裡。"]], "check": "如果現在對話被壓縮，哪一個決定一定要先寫進檔案？", "explain": ["Anthropic〈Effective context engineering for AI agents〉把長任務的做法分成兩種：壓縮，是把接近上限的對話摘要後帶到新的視窗；結構化筆記，是把待辦和重要決定寫在對話之外的檔案，需要時再讀回來。很多工具會在快滿時自動壓縮，也能手動要求，名稱各家不同。", "兩者最大的差別是誰決定留下什麼：壓縮由 Agent 判斷什麼重要，被丟掉的細節可能正好是那條規則；筆記檔則是你看得到、能檢查的。所以重要決定一做出來，就請 Agent 寫進檔案，不要只留在對話裡。"], "read": ["〈Effective context engineering for AI agents〉（Anthropic，2025）"], "notes": "約 2 分鐘。很多工具會在快滿時自動壓縮，也能手動要求；名稱各家不同，不必記指令。Anthropic〈Effective context engineering for AI agents〉（2025-09-29）把長任務的做法分成壓縮（把接近上限的對話摘要後帶到新視窗）與結構化筆記（把待辦或筆記寫在對話之外，之後再讀回）。重點在第三張卡：壓縮靠 Agent 判斷什麼重要，筆記檔是你能檢查的。📖 延伸閱讀：〈Effective context engineering for AI agents〉（Anthropic，2025）"}, {"id": "handoff", "chapter": "04 交接檔", "title": "交接檔：每個新對話都是新上班的人", "lead": "新對話不記得上一段做過什麼；能接上的，只有寫在檔案裡的東西。", "code": "notes/handoff.md\n  目前狀態：做到哪、測試幾個通過（附實際數字）\n  已做決定：選了什麼、為什麼\n  未驗證：沒實際執行過的事\n  下一步：下一段先做哪一件（只寫一件）\n  怎麼驗證：用什麼證明下一步做完了", "cards": [["像輪班交接本", "上一班沒寫下的事，下一班就不知道。"], ["人查三件事", "數字有依據、未驗證有列出、下一步只有一件。"]], "check": "挑交接檔裡一個數字追問：這是實際執行看到的，還是推測的？", "explain": ["Anthropic〈Effective harnesses for long-running agents〉（2025-11）描述長時間任務的做法：每個新對話一開始都不記得之前發生的事，所以他們用進度檔、版本紀錄和功能清單交接，並規定一次只做一個功能。就像輪班工程師，上一班沒寫進交接本的事，下一班就不知道。", "交接檔最容易出問題的是數字和「完成」。人要查三件事：數字是不是實際執行看到的、沒執行過的有沒有列成未驗證、下一步是不是只有一件。檔名 notes/handoff.md 只是示意，用你們團隊既有的位置即可；剛才 Time Skip 寫的 notes/ 起點紀錄，就是交接檔的一種。"], "read": ["〈Effective harnesses for long-running agents〉（Anthropic，2025）"], "notes": "約 2.5 分鐘。剛才 Time Skip 寫的 notes/ 起點紀錄，就是交接檔的一種。Anthropic〈Effective harnesses for long-running agents〉（2025-11-26）描述：每個新對話 begins with no memory of what came before（一開始不記得之前發生什麼）；他們用進度檔、版本紀錄與功能清單交接，並規定一次只做一個功能。比喻就是輪班工程師。檔名 notes/handoff.md 只是示意，用你們團隊既有的位置即可。📖 延伸閱讀：〈Effective harnesses for long-running agents〉（Anthropic，2025）"}, {"id": "cases", "chapter": "04 交接檔", "title": "案例：把狀態寫在檔案，不寫在對話", "lead": "兩個公開的長任務實驗，都靠檔案而不是長對話撐下來。", "cards": [["功能清單只准改一欄", "長任務實驗：清單一開始全標未通過，Agent 只能改「是否通過」。"], ["中斷也能接著跑", "大型遷移：每次從檔案重建待辦；輸出檔已存在就算完成。"], ["要留意", "兩者都是工具廠商自己的案例；做法可參考，成效別直接套用。"]], "check": "你手上的長任務，中斷後靠什麼知道做到哪裡？", "explain": ["第一個案例出自同一篇長時間任務文章：功能清單用結構化格式，一開始全部標為未通過，Agent 只能改「是否通過」那一欄；選結構化格式，是因為模型比較不會亂改。他們也發現 Agent 常在只跑單元測試後就宣告完成，改成像使用者一樣做端到端測試後，表現明顯變好。這就是交接檔要寫「怎麼驗證」的原因。", "第二個案例是第一場提過的大型程式遷移（Anthropic，2026-07）：批次腳本每次都從磁碟上的檔案重建待辦清單，輸出檔已經存在就算完成，所以中斷後能接著跑。兩個都是工具廠商自家的案例，做法可以參考，成效不要直接套用。"], "read": ["〈Effective harnesses for long-running agents〉（Anthropic，2025）", "〈How Anthropic runs large-scale code migrations with Claude Code〉（Anthropic，2026）"], "notes": "約 2 分鐘。案例一：Anthropic〈Effective harnesses for long-running agents〉（2025-11-26）。功能清單用結構化格式，初始全標未通過，Agent 只能改 passes 欄位；選結構化格式是因為模型比較不會亂改。另一個發現：Agent 常在只跑單元測試後就宣告完成，改成像使用者一樣端到端測試後明顯變好——交接檔裡「怎麼驗證」那一欄就是為此。案例二：Speech 01 看過的大型遷移文章，這裡只補另一個角度：它的批次腳本每次從磁碟重建待辦佇列，輸出檔存在就算完成，所以中斷後能續跑。平衡提醒：兩篇都是廠商自家文章。📖 延伸閱讀：〈Effective harnesses for long-running agents〉（Anthropic，2025）"}, {"id": "rules-file", "chapter": "05 規則檔", "title": "規則檔：每次對話都會先讀的那一份", "lead": "把每次都要講的事寫成一份規則檔，Agent 每開一次新對話就自動讀進來。", "cards": [["開放慣例 AGENTS.md", "像給 Agent 的 README；由 Linux 基金會旗下組織維護，多數 Coding Agent 都讀。"], ["各家也有自己的", "例如 CLAUDE.md、GEMINI.md；多半可以改讀 AGENTS.md。"], ["越近越優先", "多數工具由根目錄往下合併，離工作檔案越近的規則越優先。"]], "check": "你團隊每次開工都要重講的一句話是什麼？它適合放進規則檔嗎？", "explain": ["AGENTS.md 是跨工具的開放慣例，官網稱它是「給 Agent 的 README」，現由 Linux 基金會旗下的 Agentic AI Foundation 維護，超過 6 萬個開源專案使用。", "規則可以分層：OpenAI Codex 文件說明，規則檔由根目錄往下合併，離工作檔案越近的越優先，合併後超過預設上限就不再加入；Gemini CLI 則分全域、專案、子目錄三層。提醒：規則檔仍然只是脈絡，不是鎖（第一場講過）。"], "read": ["〈Custom instructions with AGENTS.md〉（OpenAI，官方文件）", "〈How Claude remembers your project〉（Anthropic，官方文件）", "〈GEMINI.md〉（Google，官方文件）"], "notes": "約 2.5 分鐘。AGENTS.md 官網說明它現由 Linux Foundation 旗下的 Agentic AI Foundation 維護，自稱 README for agents，超過 6 萬個開源專案使用。OpenAI Codex 文件：由根目錄往下合併，越靠近的檔優先，合併後超過預設上限就不再加入。Gemini CLI 有全域、專案、子目錄三層，檔名可設成 AGENTS.md。「規則是脈絡，不是鎖」Speech 01 講過，這裡不重講，只補它怎麼每次自動被讀進來。工作坊的 skills/team-rules.md 下一場會出現，這裡不先講。📖 延伸閱讀：〈Custom instructions with AGENTS.md〉（OpenAI，持續更新）；〈How Claude remembers your project〉（Anthropic，持續更新）；〈GEMINI.md〉（Google，持續更新）"}, {"id": "bloat", "chapter": "05 規則檔", "title": "規則檔要短：每一行都在佔桌面", "lead": "規則檔每次對話都整份讀進來，寫越長，越擠掉真正的工作內容。", "cards": [["逐行自問", "「刪掉這行，Agent 會做錯嗎？」不會，就刪。"], ["會互相打架", "兩條規則矛盾時，Agent 可能任選一條照做。"], ["業界評估", "技術雷達：規則檔膨脹列為警示；團隊共同維護的規則列為建議採用。"]], "prompt": "先不要修改檔案。請逐行檢查我們的規則檔：哪些行刪掉也不會讓你做錯、哪些互相矛盾、哪些應該改成自動檢查。用表格列出（行號、問題、建議），然後停下等我決定。", "check": "刪不刪由人決定；被建議刪掉的那行，真的沒有出過錯嗎？", "explain": ["規則檔每次對話都整份讀進來，所以每一行都在佔桌面。Claude Code 官方文件建議每個規則檔低於 200 行，並給了逐行自問的標準：「刪掉這行，Agent 會做錯嗎？」不會，就刪。文件也提醒，兩條規則互相矛盾時，Agent 可能任選一條照做。", "Thoughtworks 技術雷達第 34 期（2026-04）把「規則檔膨脹」列為警示，同時把「團隊精選、共同維護的規則」列為建議採用。兩者不衝突：要共用，也要修剪。一定要發生的事，與其多寫一行，不如改成自動檢查。下週可以貼上方的提示詞請 Agent 逐行檢查，但刪不刪由你決定。"], "read": ["〈How Claude remembers your project〉（Anthropic，官方文件）", "〈Technology Radar Vol. 34〉（Thoughtworks，2026）"], "notes": "約 2.5 分鐘。Claude Code 官方〈How Claude remembers your project〉建議每個規則檔低於 200 行；〈Best practices for Claude Code〉的逐行自問：Would removing this cause Claude to make mistakes? If not, cut it. Thoughtworks Technology Radar Vol. 34（2026-04）把 Agent instruction bloat（規則檔膨脹）列為 Caution（警示），把 Curated shared instructions for software teams（團隊精選、共同維護的規則）列為 Adopt（建議採用）。兩者不衝突：要共用，也要修剪。團隊怎麼一起維護，下一場會加深。📖 延伸閱讀：〈How Claude remembers your project〉（Anthropic，持續更新）；〈Technology Radar Vol. 34〉（Thoughtworks，2026）"}, {"id": "next", "chapter": "收尾", "title": "帶走五個習慣", "lead": "這些不是省錢技巧而已，是讓 Agent 保持準確的基本功。", "flow": ["少而準的脈絡", "大量讀檔先摘要", "糾正兩次就重開", "決定寫進交接檔", "規則檔保持短"], "cards": [["下一場", "Brownfield（既有專案）／Teammate（隊友）：讀懂舊系統、選模型與推論強度、把團隊做法寫成 Skill。"]], "check": "選一個習慣，說出你下週第一次會在哪個工作情境用上。", "explain": ["五個習慣其實是同一件事：Agent 的工作桌上只放有用的東西，重要的事寫進檔案。回想開場「越聊越笨」的例子，通常是桌面太滿（第 1、2 個習慣）、錯誤嘗試累積（第 3 個），或重要規則被壓縮掉（第 4、5 個）。"], "notes": "約 1.5 分鐘。回到開場的「越聊越笨」：每個例子對應到哪個習慣？通常是桌面太滿（第 1、2 個）、錯誤嘗試累積（第 3 個）、或重要規則被壓縮掉（第 4、5 個）。只預告下一場主題，不先講內容。"}], "title": "Time Skip：系統演化與接手", "minutes": 25, "downloads": [{"label": "下載操作講義", "name": "time-skip-handout.md", "text": "# Time Skip：系統演化與接手\n\n\u003e 讀者：學員。時機：25 分鐘觀念與技巧講解。前置：已聽過 Greenfield 講解，備妥可用的 Coding Agent（能讀寫檔案、協助寫程式的 AI 助手）。\n\n本段不寫程式、不打指令。提示詞只供示範；沒有實際執行的結果，一律標為未驗證。\n\n**這一段帶走什麼**\n\n- 脈絡視窗是工作桌：越滿越不準，也越貴\n- 給少而準的脈絡；大量讀檔先摘要\n- 糾正兩次還錯就重開，重要決定寫進檔案\n- 規則檔每次都會讀，所以要短、要修剪\n\n## 1. 為什麼 Agent 會「越聊越笨」\n\n剛才你接手一個長了 12 個月的專案，並開了新對話。這一場講背後的原因：Agent 的工作桌有多大。\n\n- **剛才做的**：開新對話、指名要讀的檔、記下起點、留交接檔。\n\n- **今天補上的**：脈絡視窗、Token 成本、壓縮與交接、規則檔，以及何時該重開。\n\nAgent 聊久了會忘記一開始講好的規則、搞混前後的決定，這不是錯覺，也不是某一套產品的毛病，而是所有 Coding Agent 共通的原理：它每次回答都只看得到一張有大小限制的「工作桌」。這一場的每個技巧，都是在管理這張桌子。\n\n**人工確認**：想一次經驗：對話越拉越長之後，Agent 開始忘記或搞混什麼？\n\n## 2. 脈絡視窗：是工作桌，不是倉庫\n\nContext Window（脈絡視窗）：Agent 這一次回答時「攤在桌上」的全部內容，有固定上限。\n\n規則檔 → 你的訊息 → 讀過的檔案 → 指令輸出 → Agent 的回答\n\n- **全部都佔位子**：不只你打的字；讀的每個檔、跑的每個測試輸出都算。\n\n- **滿得很快**：讀幾個大檔、貼一次長輸出，桌面就堆滿了。\n\n- **越滿越不準**：官方文件直說：視窗越滿，表現越差。\n\n除了你打的字，Agent 自己之前的回答也佔位子；而且你看不到的指令輸出和讀檔內容，往往最佔空間。\n\nClaude Code 官方文件直說：脈絡視窗很快就會滿，越滿表現越差。其他工具的官方文件也有同樣的章節。所以「視窗夠大」不代表可以隨便放：倉庫放得下，不代表每樣都拿在手上。\n\n📖 延伸閱讀：〈Best practices for Claude Code〉（Anthropic，官方文件）；〈Context windows〉（Anthropic，官方文件）\n\n**人工確認**：說出兩樣你沒有打字、卻也佔了 Agent 工作桌的東西。\n\n## 3. 給越多越好？剛好相反\n\nContext Rot（脈絡劣化）：內容越多，Agent 越難在裡面找到真正重要的那幾句。\n\n- **注意力有預算**：每多一段無關內容，就從重要內容那裡分走一點注意力。\n\n- **目標是「少而準」**：給最少、但最有用的資訊，而不是全部倒進去。\n\n- **大視窗不是解藥**：官方說每個模型都會劣化；能放得下，不代表讀得好。\n\nAnthropic〈Effective context engineering for AI agents〉（2025-09）用了兩個說法：模型有「注意力預算」，每多一段內容就分走一點注意力；所以目標是找出「最少、但訊號最強」的那一組內容。文中也指出，內容越多、越難準確想起其中細節的現象（脈絡劣化），在所有模型上都會發生。\n\n常見的誤解是「視窗越大越好，全部丟進去就好」。下週怎麼用：每貼一段內容前問自己「這段不給，Agent 會做錯嗎？」；想說「把整個專案讀一遍」時，改成指名最重要的三個檔。\n\n📖 延伸閱讀：〈Effective context engineering for AI agents〉（Anthropic，2025）\n\n**人工確認**：下次想說「把整個專案讀一遍」時，改成說出哪三個檔最重要。\n\n## 4. 長對話為什麼越來越貴\n\nToken（詞元）是計費單位。Agent 每回答一次，都要把整段對話歷史重新讀一遍。\n\n第 1 問：讀 1 份 → 第 10 問：讀 10 份歷史 → 第 50 問：讀 50 份歷史\n\n- **成本跟著桌面變大**：官方文件：處理的脈絡越多，用掉的 Token 越多。\n\n- **量級參考**：某工具官方估計：每人每個工作日約十幾美元；價格常變。\n\n- **省錢＝省干擾**：同一招讓 Agent 更準，也讓帳單變小。\n\n第 50 問的成本遠高於第 1 問，因為每次都要把整段歷史重讀。這就像計程車跳表，每多問一句，前面的路程都要再算一次（實際計費有快取等細節，這裡只講直覺）。\n\nClaude Code 官方〈Manage costs effectively〉說，Token 成本跟脈絡大小成正比；同一頁提到企業部署平均約每位開發者每個活躍日 13 美元、每月約 150–250 美元，90% 的使用者每天低於 30 美元。這只適用該產品，價格也會變，請當成量級參考，不要拿來推算你們公司要花多少。\n\n好消息是省錢和變準是同一件事：讓桌面保持乾淨的做法，同時讓帳單變小。\n\n📖 延伸閱讀：〈Manage costs effectively〉（Anthropic，官方文件）；〈Token counting〉（Anthropic，官方文件）\n\n**人工確認**：你的對話裡，哪一段長輸出其實只要一行結論就夠？\n\n## 5. 讀很多檔？請它先摘要再回來\n\n要找東西時，讓 Agent 在另一個對話裡讀，只把結論帶回主對話。\n\n- **指名範圍**：你剛才說了只讀哪些檔，這就是最便宜的省法。\n\n- **子 Agent 探索**：有些工具能派子 Agent 去讀，只回傳一兩千 Token 的摘要。\n\n- **沒有子 Agent 時**：開一個新對話專門探索，把摘要貼回主對話。\n\n### 交給 Agent 的指令\n\n先不要修改檔案。請另外探索 tests/ 資料夾，回來只給我：測試分成哪幾類、各自在測什麼，最多 8 行。不要貼原始輸出，最後列出你讀了哪些檔，然後停下。\n\n子 Agent 是主 Agent 派出去做一件事的另一個 Agent：它在自己的脈絡裡讀大量檔案，只把結論帶回來。Anthropic〈Effective context engineering for AI agents〉提到，子 Agent 通常只回傳約 1,000–2,000 個 Token 的濃縮摘要，主對話因此保持乾淨。\n\n不是每個工具都有子 Agent。沒有時，開一個新對話專門探索，請它寫摘要，再把摘要貼回主對話，效果相近。最便宜的省法則是你剛才做過的：指名只讀哪些檔。審摘要時看兩件事：有沒有混進整段原始輸出，以及有沒有列出讀了哪些檔，方便你追查。\n\n📖 延伸閱讀：〈Effective context engineering for AI agents〉（Anthropic，2025）\n\n**人工確認**：回報裡有沒有混進整段原始輸出？讀了哪些檔有沒有列出來？\n\n## 6. 糾正兩次還錯，就重開\n\n對話裡累積的錯誤嘗試也佔位子，而且會一直誤導 Agent。\n\n- **換任務就開新的**：兩件不相關的事，不要擠在同一段對話裡。\n\n- **同一問題糾正兩次**：還是錯，就停：先整理學到的，再開新對話重來。\n\n- **重開不是浪費**：乾淨對話加更好的提示詞，幾乎總是勝過越補越長的對話。\n\n### 交給 Agent 的指令\n\n先停下，不要再修改。請整理成一份新的提示詞：目標、已確認的事實、試過但無效的做法、限制、完成條件。我會把它貼到新對話重新開始。\n\nClaude Code 官方文件說：乾淨的對話加上更好的提示詞，幾乎總是勝過累積了一堆修正的長對話；並建議同一個問題糾正兩次還不對，就清掉重來。原因是錯誤的嘗試也留在脈絡裡佔位子，而且會一直把 Agent 往錯的方向拉。\n\n重開不等於從零開始。先請 Agent 用 Greenfield 學過的五段（目標、背景、限制、輸出格式、停止條件）整理成新的提示詞，再加上「試過但無效的做法」，新對話才不會重蹈覆轍。下週觀察自己：你通常糾正幾次才放棄？超過兩次就試試重開。\n\n📖 延伸閱讀：〈Best practices for Claude Code〉（Anthropic，官方文件）\n\n**人工確認**：新提示詞裡有沒有寫出「試過但無效的做法」，避免新對話重蹈覆轍？\n\n## 7. 壓縮：快滿時，把對話摘要成一段\n\nCompaction（壓縮）：對話接近上限時，把歷史摘要成短版，帶到新的視窗繼續。\n\n- **好處**：不用從零開始，桌面清出空間。\n\n- **代價**：摘要會丟細節；被丟掉的可能正好是那條規則。\n\n- **人的做法**：重要決定先寫進檔案，不要只活在對話裡。\n\nAnthropic〈Effective context engineering for AI agents〉把長任務的做法分成兩種：壓縮，是把接近上限的對話摘要後帶到新的視窗；結構化筆記，是把待辦和重要決定寫在對話之外的檔案，需要時再讀回來。很多工具會在快滿時自動壓縮，也能手動要求，名稱各家不同。\n\n兩者最大的差別是誰決定留下什麼：壓縮由 Agent 判斷什麼重要，被丟掉的細節可能正好是那條規則；筆記檔則是你看得到、能檢查的。所以重要決定一做出來，就請 Agent 寫進檔案，不要只留在對話裡。\n\n📖 延伸閱讀：〈Effective context engineering for AI agents〉（Anthropic，2025）\n\n**人工確認**：如果現在對話被壓縮，哪一個決定一定要先寫進檔案？\n\n## 8. 交接檔：每個新對話都是新上班的人\n\n新對話不記得上一段做過什麼；能接上的，只有寫在檔案裡的東西。\n\n- **像輪班交接本**：上一班沒寫下的事，下一班就不知道。\n\n- **人查三件事**：數字有依據、未驗證有列出、下一步只有一件。\n\n```text\nnotes/handoff.md\n  目前狀態：做到哪、測試幾個通過（附實際數字）\n  已做決定：選了什麼、為什麼\n  未驗證：沒實際執行過的事\n  下一步：下一段先做哪一件（只寫一件）\n  怎麼驗證：用什麼證明下一步做完了\n```\n\nAnthropic〈Effective harnesses for long-running agents〉（2025-11）描述長時間任務的做法：每個新對話一開始都不記得之前發生的事，所以他們用進度檔、版本紀錄和功能清單交接，並規定一次只做一個功能。就像輪班工程師，上一班沒寫進交接本的事，下一班就不知道。\n\n交接檔最容易出問題的是數字和「完成」。人要查三件事：數字是不是實際執行看到的、沒執行過的有沒有列成未驗證、下一步是不是只有一件。檔名 notes/handoff.md 只是示意，用你們團隊既有的位置即可；剛才 Time Skip 寫的 notes/ 起點紀錄，就是交接檔的一種。\n\n📖 延伸閱讀：〈Effective harnesses for long-running agents〉（Anthropic，2025）\n\n**人工確認**：挑交接檔裡一個數字追問：這是實際執行看到的，還是推測的？\n\n## 9. 案例：把狀態寫在檔案，不寫在對話\n\n兩個公開的長任務實驗，都靠檔案而不是長對話撐下來。\n\n- **功能清單只准改一欄**：長任務實驗：清單一開始全標未通過，Agent 只能改「是否通過」。\n\n- **中斷也能接著跑**：大型遷移：每次從檔案重建待辦；輸出檔已存在就算完成。\n\n- **要留意**：兩者都是工具廠商自己的案例；做法可參考，成效別直接套用。\n\n第一個案例出自同一篇長時間任務文章：功能清單用結構化格式，一開始全部標為未通過，Agent 只能改「是否通過」那一欄；選結構化格式，是因為模型比較不會亂改。他們也發現 Agent 常在只跑單元測試後就宣告完成，改成像使用者一樣做端到端測試後，表現明顯變好。這就是交接檔要寫「怎麼驗證」的原因。\n\n第二個案例是第一場提過的大型程式遷移（Anthropic，2026-07）：批次腳本每次都從磁碟上的檔案重建待辦清單，輸出檔已經存在就算完成，所以中斷後能接著跑。兩個都是工具廠商自家的案例，做法可以參考，成效不要直接套用。\n\n📖 延伸閱讀：〈Effective harnesses for long-running agents〉（Anthropic，2025）；〈How Anthropic runs large-scale code migrations with Claude Code〉（Anthropic，2026）\n\n**人工確認**：你手上的長任務，中斷後靠什麼知道做到哪裡？\n\n## 10. 規則檔：每次對話都會先讀的那一份\n\n把每次都要講的事寫成一份規則檔，Agent 每開一次新對話就自動讀進來。\n\n- **開放慣例 AGENTS.md**：像給 Agent 的 README；由 Linux 基金會旗下組織維護，多數 Coding Agent 都讀。\n\n- **各家也有自己的**：例如 CLAUDE.md、GEMINI.md；多半可以改讀 AGENTS.md。\n\n- **越近越優先**：多數工具由根目錄往下合併，離工作檔案越近的規則越優先。\n\nAGENTS.md 是跨工具的開放慣例，官網稱它是「給 Agent 的 README」，現由 Linux 基金會旗下的 Agentic AI Foundation 維護，超過 6 萬個開源專案使用。\n\n規則可以分層：OpenAI Codex 文件說明，規則檔由根目錄往下合併，離工作檔案越近的越優先，合併後超過預設上限就不再加入；Gemini CLI 則分全域、專案、子目錄三層。提醒：規則檔仍然只是脈絡，不是鎖（第一場講過）。\n\n📖 延伸閱讀：〈Custom instructions with AGENTS.md〉（OpenAI，官方文件）；〈How Claude remembers your project〉（Anthropic，官方文件）；〈GEMINI.md〉（Google，官方文件）\n\n**人工確認**：你團隊每次開工都要重講的一句話是什麼？它適合放進規則檔嗎？\n\n## 11. 規則檔要短：每一行都在佔桌面\n\n規則檔每次對話都整份讀進來，寫越長，越擠掉真正的工作內容。\n\n- **逐行自問**：「刪掉這行，Agent 會做錯嗎？」不會，就刪。\n\n- **會互相打架**：兩條規則矛盾時，Agent 可能任選一條照做。\n\n- **業界評估**：技術雷達：規則檔膨脹列為警示；團隊共同維護的規則列為建議採用。\n\n### 交給 Agent 的指令\n\n先不要修改檔案。請逐行檢查我們的規則檔：哪些行刪掉也不會讓你做錯、哪些互相矛盾、哪些應該改成自動檢查。用表格列出（行號、問題、建議），然後停下等我決定。\n\n規則檔每次對話都整份讀進來，所以每一行都在佔桌面。Claude Code 官方文件建議每個規則檔低於 200 行，並給了逐行自問的標準：「刪掉這行，Agent 會做錯嗎？」不會，就刪。文件也提醒，兩條規則互相矛盾時，Agent 可能任選一條照做。\n\nThoughtworks 技術雷達第 34 期（2026-04）把「規則檔膨脹」列為警示，同時把「團隊精選、共同維護的規則」列為建議採用。兩者不衝突：要共用，也要修剪。一定要發生的事，與其多寫一行，不如改成自動檢查。下週可以貼上方的提示詞請 Agent 逐行檢查，但刪不刪由你決定。\n\n📖 延伸閱讀：〈How Claude remembers your project〉（Anthropic，官方文件）；〈Technology Radar Vol. 34〉（Thoughtworks，2026）\n\n**人工確認**：刪不刪由人決定；被建議刪掉的那行，真的沒有出過錯嗎？\n\n## 12. 帶走五個習慣\n\n這些不是省錢技巧而已，是讓 Agent 保持準確的基本功。\n\n少而準的脈絡 → 大量讀檔先摘要 → 糾正兩次就重開 → 決定寫進交接檔 → 規則檔保持短\n\n- **下一場**：Brownfield（既有專案）／Teammate（隊友）：讀懂舊系統、選模型與推論強度、把團隊做法寫成 Skill。\n\n五個習慣其實是同一件事：Agent 的工作桌上只放有用的東西，重要的事寫進檔案。回想開場「越聊越笨」的例子，通常是桌面太滿（第 1、2 個習慣）、錯誤嘗試累積（第 3 個），或重要規則被壓縮掉（第 4、5 個）。\n\n**人工確認**：選一個習慣，說出你下週第一次會在哪個工作情境用上。\n\n## 完成條件\n能用自己的話說明：為什麼對話越長 Agent 越不準也越貴；何時該開新對話、何時讓它先摘要；交接檔要寫哪幾項、人要查哪幾項；規則檔為什麼要短、一定要發生的事為什麼要交給自動檢查。\n\n**下週可以做的事**\n\n- 想說「讀整個專案」時，改成指名最重要的三個檔\n- 長任務告一段落時，請 Agent 寫一份交接檔，抽一個數字追問依據\n- 請 Agent 逐行檢查團隊的規則檔，由你決定刪哪幾行\n\n## 延伸閱讀\n- 〈Best practices for Claude Code〉（Anthropic，官方文件）\n- 〈Context windows〉（Anthropic，官方文件）\n- 〈Effective context engineering for AI agents〉（Anthropic，2025）\n- 〈Manage costs effectively〉（Anthropic，官方文件）\n- 〈Token counting〉（Anthropic，官方文件）\n- 〈Effective harnesses for long-running agents〉（Anthropic，2025）\n- 〈How Anthropic runs large-scale code migrations with Claude Code〉（Anthropic，2026）\n- 〈Custom instructions with AGENTS.md〉（OpenAI，官方文件）\n- 〈How Claude remembers your project〉（Anthropic，官方文件）\n- 〈GEMINI.md〉（Google，官方文件）\n- 〈Technology Radar Vol. 34〉（Thoughtworks，2026）\n"}]};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;

function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {

  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `${SPEECH_DATA.title.split('：')[0]} · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / ${String(SPEECH_DATA.minutes).padStart(2,'0')}:00`;el('timer').classList.toggle('over',secs>=SPEECH_DATA.minutes*60);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
SPEECH_DATA.downloads.forEach(d=>{const b=node('button',d.label);b.onclick=()=>save(d.name,d.text);el('downloads').append(b);});
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&(e.target.closest('textarea,input,select')||(e.target.closest('button')&&[' ','Enter'].includes(e.key))))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
</body>
</html>
