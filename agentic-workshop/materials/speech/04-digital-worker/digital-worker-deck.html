<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "回看 B3", "title": "把整件任務交出去，人只守關卡", "lead": "第四段 · Digital Worker（數位員工：在核准範圍內獨立完成整件任務的 Agent，即 AI 助手） · 回看 B3（Brownfield 最後一個大任務：團體訂票） · 概念講解", "cards": [["今天談四件事", "工作單怎麼授權、三道 Gate（核准關卡）看什麼、例外怎麼判斷、交付憑什麼證據。"], ["怎麼聽", "對照你剛才的 notes/b3.md，也想一件工作上可以這樣委派的事。"]], "check": "手邊打開自己的 notes/b3.md；沒有的，記下你最想退回的那一道 Gate。", "notes": "約 1 分鐘，只講路線。本段在 B3 與交付之後。不重做 B3，也不揭曉任何實作做法或例外事件內容。請聽眾心裡選一件工作上的任務，後面每頁拿來對照。"}, {"id": "three-modes", "chapter": "回看 B3", "title": "差別在人什麼時候介入", "lead": "三段都不寫程式；變的是人介入的方式，責任沒有消失，而是重新分配。", "flow": ["Tool：人逐步下指令、每步驗收", "Teammate：一起分析、人核准計畫", "Digital Worker：Agent 自己往前走、人只在 Gate 決定"], "cards": [["人負責", "設邊界、核准或退回、質疑、要求補證據，承擔最終交付責任。"], ["Agent 負責", "分析、設計、改程式、測試、文件，並把紀錄寫進 notes/b3.md。"]], "check": "說得出 B3 裡人「不做」的事：不寫、不讀、不改程式，也不跳過 Gate。", "notes": "約 3 分鐘。來源：Digital Worker 操作規則。Greenfield 是 Tool、Brownfield 是 Teammate、B3 是 Digital Worker。強調放手不是不管：人把注意力從每一步移到三個決策點。📖 定義出處：本課程〈歡迎與使用方式〉（三階段）、〈Digital Worker 操作規則〉。📖 延伸閱讀：Anthropic Engineering〈Building effective agents〉（談 Agent 的運作方式，並未定義這三階段）。"}, {"id": "work-order", "chapter": "工作單：一次授權", "title": "工作單：五部分放大到整件任務", "lead": "Work Order（工作單）就是提示詞五部分，從一個步驟放大成一整件任務（加深一層）。", "flow": ["目標：已核准的需求", "背景：已核准背景", "限制：允許／禁止修改的範圍", "輸出格式：Gate 回報格式", "停止條件：停止與升級條件、三道 Gate"], "check": "拿自己的工作單對照：五部分每一項都找得到原文嗎？", "notes": "約 2.5 分鐘。五部分在 Greenfield 第一次用在計畫提示詞；這裡是同一個結構放大，不是新技巧。工作單另含規則編號、必須交付的成果、必須有的測試與時間安排，讓 Agent 自己往前走時不必回頭問。📖 定義出處：本課程〈Digital Worker Work Order〉。📖 延伸閱讀：Anthropic 官方文件〈Prompting best practices〉、OpenAI 官方文件〈Prompt engineering〉。"}, {"id": "scope", "chapter": "工作單：一次授權", "title": "授權範圍：寫下能動哪裡、不能動哪裡", "lead": "授權不是一句「交給你」，而是事先寫好的邊界；Gate 2 再把邊界縮到具體檔案。", "cards": [["允許的種類", "團體流程需要的 API（應用程式介面）、業務模型、應用流程、測試與文件。"], ["禁止", "全面重寫一般訂票、改無關 API、移除既有功能或回歸測試、自行改商業規則。"], ["要先核准", "改 API 合約、修改 Gate 2 清單以外的檔案。"]], "check": "每個預計修改的檔案，Agent 都先說明了為什麼要改嗎？", "notes": "約 2.5 分鐘。來源：工作單「允許修改的範圍」「禁止修改的範圍」。工作單只列種類；實際範圍由人在 Gate 2 決定，Agent 照原文寫進 notes/b3.md「Gate 2」段落。這頁不展開禁止清單的每一項，留給學員自己對照原文。回到聽眾的工作：你的任務，哪些是絕對不能動的？"}, {"id": "escalation", "chapter": "工作單：一次授權", "title": "停止條件：Agent 何時該停下來問你", "lead": "Escalation（升級處理）：遇到停止條件，只停受影響的動作，附證據交給人決定。", "cards": [["典型情況", "需求和規則互相矛盾、要改範圍外的 API 或檔案、新增外部套件、測試出現無關失敗、時間不夠。"], ["回報六標題", "觸發原因（Trigger）、證據（Evidence）、影響（Impact）、選項（Options）、建議（Recommendation）、需決定的事（Decision Needed）。"]], "check": "Agent 停下來時，你看得出觸發原因、證據與需要你決定的事嗎？", "notes": "約 2.5 分鐘。工作單列了 10 條停止與升級條件，這頁只舉代表。六標題依序是觸發原因、證據、影響、選項、建議、需要人決定的事。重點：不是全部停工，其他已核准、不受影響的工作可以繼續。沒有停止條件，Agent 只會自己猜一個答案往下做。"}, {"id": "skill", "chapter": "工作單：一次授權", "title": "工作單存成 Skill，之後只說一句", "lead": "把工作單連同 Gate 回報格式存成 skills/b3-work-order.md（Skill 技能檔，加深一層；本課程用簡化版，是 skills/ 裡的 Markdown 說明檔）。", "cards": [["為什麼存檔", "Agent 自己往前走時隨時回頭查；人每道 Gate 只說「依 skills/b3-work-order.md」。"], ["開工前三件事", "開新對話、選推論較強的模型、先存一版（Commit）「B3 起點」當比較基準。"]], "check": "notes/b3.md「已核准背景」記了起點測試數與模型；工具沒有這個設定時寫「預設」。", "notes": "約 2 分鐘。Skill 與模型選擇已在前面講過（這裡的 Skill 是簡化版，工具內建的 Skill 另有固定格式），這裡只加深：Skill 從團隊規則、修 Bug 流程放大到整件任務；模型選擇在委派整件任務時選較強的，因為要自己做取捨。新對話是 Token 節費。📖 延伸閱讀：Anthropic 官方文件〈Agent Skills〉、〈Choosing the right model〉；你所用工具的官方文件通常有同名章節。"}, {"id": "timeline", "chapter": "三道 Gate", "title": "13 分鐘裡的三個決策點", "lead": "Gate 之間讓 Agent 自己往前走；每道 Gate 控制在 1–3 分鐘。", "flow": ["第 63 分：交工作單", "第 66 分：Gate 1 需求理解", "第 69 分：Gate 2 影響分析與設計", "第 69–70 分：例外事件", "第 74 分：停止擴充", "第 75 分：Gate 3 交付審查", "第 76 分：B3 結束"], "check": "先過 Gate 1 才設計；Gate 2 核准且條件解除才改程式；Gate 3 由人決定交不交付。", "notes": "約 2 分鐘。時間照工作單「時間安排」：段內第 3／6／7／11／12／13 分鐘對應全場第 66／69／70／74／75／76 分；交付摘要在第 76–78 分。例外判斷含在時間內，不另外加時。📖 定義出處：本課程〈B3 人員核准 Gate〉。"}, {"id": "gate-report", "chapter": "三道 Gate", "title": "Gate 回報格式：每道 Gate 同一組標題", "lead": "結構化輸出（加深一層）：固定標題讓你 1–3 分鐘看完，也能和上一道 Gate 比對。", "code": "Gate：Gate 1／Gate 2／Gate 3\n建議結論：APPROVE | APPROVE WITH CONDITIONS | REJECT AND REVISE（一句理由）\n證據：是非題清單，每題「是／否／不確定」＋依據位置\n風險：最沒把握的地方、失敗或未驗證項目\n需要人決定的事：每題附建議答案；查不到依據的標「待小組確認」", "check": "每個是非題都附了依據位置（任務卡、工作單、notes/b3.md、測試名稱或實際指令）。", "notes": "約 2.5 分鐘。來源：B3 人員核准 Gate「Gate 回報格式」。從 Greenfield 的驗收對照表、B2 的比較表，到這裡的 Gate 卡：同一個技巧越用越嚴格。完整內容寫進 notes/b3.md，對話只給摘要，也省 Token。固定標題是用提示詞要求的；要交給程式處理時可改用 JSON，欄位相同。📖 延伸閱讀：Anthropic 官方文件〈Structured outputs〉、OpenAI 官方文件〈Structured model outputs〉。"}, {"id": "decision", "chapter": "三道 Gate", "title": "決策由人說，Agent 照原文記", "lead": "人回一句話：決策、條件、核准人、第幾分鐘；Agent 不代人填核准。", "cards": [["三種結論", "APPROVE 核准；APPROVE WITH CONDITIONS 附條件核准，條件解除後才續行；REJECT AND REVISE 退回修正。"], ["核准不等於通過", "核准是決策；通過要看驗收對照表與測試。"], ["形式性核准", "照單接受建議，卻說不出核對了哪一題。"]], "check": "你說得出這次核准時，自己核對了哪一題嗎？", "notes": "約 2.5 分鐘。來源：B3 人員核准 Gate「Gate 決策紀錄」。附條件核准要寫出條件怎樣才算滿足、要回到哪一道 Gate。有建議答案的題目說「照你的建議」可以，但標「待小組確認」的一定由人回答。提問：誰看過你們的決策紀錄，就能知道當時憑什麼核准？"}, {"id": "gate1", "chapter": "三道 Gate", "title": "Gate 1：先確認 Agent 懂需求", "lead": "需求理解錯了，後面做得再快都是白做。逐題對照任務卡原文。", "cards": [["人核對", "5–20 人邊界、同班次與同車廂連續座位、不允許部分成功、付款失敗整筆取消並釋放座位、沿用 B2（上一個任務）的優惠規則。"], ["人決定", "標「待小組確認」的問題，例如任務卡沒寫的數值，不讓 Agent 自己假設。"]], "check": "5 個是非題都對得上任務卡才核准；看不懂就請 Agent 換個說法。", "notes": "約 2.5 分鐘。這五點是任務卡上的需求，不是做法。Gate 1 也要求列出「不做的範圍」（Out of Scope），讓範圍從一開始就寫下來。提問：你們有沒有哪一題請 Agent 換說法？📖 定義出處：本課程〈B3 任務卡 TASK-B3-001〉。"}, {"id": "gate2", "chapter": "三道 Gate", "title": "Gate 2：你核准的範圍，就是授權邊界", "lead": "Agent 只提設計、不改程式；不能因為方案「看起來合理」就核准。", "cards": [["人核對", "範圍只限團體流程、沒有全面重寫、建立失敗與付款失敗都有處理、既有測試保留、沒有未核准的外部依賴。"], ["之後", "Agent 做的和核准的不一樣時，要補證據或回到 Gate 2 重新核准。"]], "check": "每個是非題的答案都落在工作單允許的範圍內，再核准。", "notes": "約 2.5 分鐘。Gate 2 是整段最關鍵的授權點：它把工作單的「種類」縮成具體的檔案清單與明確不改的部分。附條件核准時，條件沒解除的部分先不動。不要在這頁討論具體設計做法。"}, {"id": "exception", "chapter": "例外處理", "title": "例外事件：60 秒判斷範圍", "lead": "例外編號 EXCEPTION-DW-001：一個會把 Agent 帶出 Gate 2 核准範圍的提議。", "flow": ["先停止所有修改", "寫下提議、影響與工作單原文", "判斷：在核准範圍內嗎（是／否／不確定）", "決定：核准／附條件核准／拒絕", "告訴 Agent 下一步與要回到哪道 Gate"], "check": "你的判斷能指出工作單或 Gate 2 的哪一句原文當依據。", "notes": "約 2.5 分鐘。來源：例外回應卡（照原樣描述，不改）。只談判斷方法，不說出事件內容與該怎麼回答，聽眾可能是之後的學員。時間緊可 30 秒口頭判斷，再請 Agent 補一行紀錄。這不是第二種 Escalation：平常的停止條件用六標題升級格式，例外事件照例外回應卡處理。資訊不夠時不猜測是否有授權。"}, {"id": "exception-reflect", "chapter": "例外處理", "title": "沒有工作單，例外會變成什麼？", "lead": "例外提議常常聽起來很合理；能擋下越界的是事先寫好的邊界，不是當下的直覺。", "cards": [["有工作單", "對照原文就能判斷，60 秒內做完決定並留下紀錄。"], ["沒有工作單", "只能憑感覺，或讓 Agent 自己決定，事後也查不到為什麼。"], ["拒絕提議", "不等於終止任務；回到核准範圍繼續做。"]], "check": "想一件你的工作：哪一條邊界最需要事先寫進工作單？", "notes": "約 3.5 分鐘，討論頁。請兩三位分享：例外時靠工作單哪一句做決定（不要說出事件內容與答案，只說用了哪一類依據）。附條件核准時，條件必須具體、可驗證，而且先解除才續行。"}, {"id": "execute", "chapter": "放手與收手", "title": "放手執行：只在它停下來問時介入", "lead": "Gate 2 後 Agent 自己改程式、跑測試、更新文件；你不逐步下指令。", "cards": [["偏差先停", "與 Gate 2 計畫不同時先停下回報，等人核准。"], ["Token（詞元）節費", "細節寫進 notes/b3.md，對話只回 5 行白話摘要。"]], "check": "Agent 停下來時，讀它的選項與建議，回一句決定，再請它照原文記錄。", "notes": "約 2 分鐘。放手執行最耗 Token；交付時 Agent 直接讀 notes，不用翻對話（加深一層）。忍住逐步下指令的衝動：那會退回 Tool 模式。📖 延伸閱讀：Anthropic Engineering〈Effective context engineering for AI agents〉、Anthropic 官方文件〈Context windows〉。"}, {"id": "stop-expand", "chapter": "放手與收手", "title": "何時停止、何時擴大範圍", "lead": "第 74 分鐘停止擴充：不論做到哪裡，停下來整理證據。", "cards": [["要停止", "時間到、碰到停止條件、條件未解除、與核准計畫有偏差。"], ["要擴大範圍", "不能自己擴；回到 Gate 2 由人重新核准，並記下原因。"], ["沒做完", "列為未驗證，依證據如實交付。"]], "check": "不因時間壓力跳過 Gate，也不接受沒驗證過的說法。", "notes": "約 2.5 分鐘。停止擴充的提示詞同時要求驗收對照表、變更審查、Gate 3 資料與補驗文件範例。擴大範圍只有一條路：回到 Gate。時間不足時 Gate 1、Gate 2 照常做，Gate 3 至少看驗收對照表與未完成事項；只完成分析也可以交付 Level 1。"}, {"id": "gate3", "chapter": "交付與證據", "title": "Gate 3：不看程式，看三題與對照表", "lead": "變更審查三題都答「是」，失敗與未驗證項目都列出來，才核准。", "cards": [["(1) 範圍", "改的檔案都在 Gate 2 核准範圍內？"], ["(2) 測試數", "沒有比 B3 起點少，也沒有新增跳過或預期失敗？"], ["(3) 期待值", "沒有刪測試，也沒有改既有測試的期待值？"]], "check": "有一題是「否」或「不確定」就不核准，請 Agent 解釋或修正。", "notes": "約 2.5 分鐘。每題要附實際執行的指令與結果摘要。驗收對照表依主題合併成 7 列，合併列取最差結果。有時間就在 /docs 試一次主要行為。盲點：只看證據不看程式，抓不到「測試全過但寫法有問題」，留到回顧討論。📖 延伸閱讀：Google Engineering Practices〈Google's Code Review Guidelines〉。"}, {"id": "levels", "chapter": "交付與證據", "title": "完成等級：依證據擇一", "lead": "Gate 3 時 Agent 建議一個完成等級（Level）；你依證據擇一，不自動選 Level 3。", "cards": [["Level 1：分析完成（Analysis Complete）", "Gate 1／2 完成，影響分析合理、測試策略完整，程式尚未完成。"], ["Level 2：核心流程完成（Core Flow Complete）", "團體建立與連續座位完成、主要單元測試通過，付款失敗的補償（Compensation）或文件仍有缺項。"], ["Level 3：完整交付（Delivery Complete）", "建立、付款成功與付款失敗的補償都完成，回歸測試（Regression）通過，文件與交付摘要都完整。"]], "check": "選定的等級，每一句都指得出證據；Level 1 也要明記「無修改／未執行」與原因。", "notes": "約 2.5 分鐘。文字照 Delivery Summary 原文，不改寫。Level 1／2 可以如實當作活動成果，但不得冒稱完整程式交付。提問：Agent 一開始建議的 Level，和你們最後選的一樣嗎？📖 定義出處：本課程〈B3 任務卡 TASK-B3-001〉。"}, {"id": "delivery", "chapter": "交付與證據", "title": "交付摘要本身就是證據", "lead": "十二個固定標題、每欄附證據位置；沒有證據的寫「未驗證」（結構化輸出，加深一層）。", "cards": [["人核對三句話", "建議的 Level、測試結果、修改範圍，各自引用得出證據原文。"], ["和紀錄一致", "Gate 決策照 notes/b3.md 原文；沒有偏差也要明寫。"]], "prompt": "請只讀 notes/delivery.md 與 notes/b3.md，不要修改任何檔案。逐欄列出：這一欄的結論、引用的證據原文與位置；找不到證據的標「應改為未驗證」。最後用一句話說明哪一欄最需要人再確認。", "check": "抽查時一欄一欄問「證據在哪？」；引用不出的改成未驗證。", "notes": "約 2.5 分鐘。固定標題同樣是用提示詞要求的（本課程的結構化輸出）。這段提示詞是選用示範，不屬於主課程步驟，沒有在現場保證執行；貼給學員自己的 Agent，結果由學員檢查。交付審查檢核表（需求、範圍、品質、證據四類）需要逐項核對時才用：Agent 自評、人抽查，沒有證據一律未驗證。提問：回到公司，誰應該替這份交付簽名？📖 定義出處：本課程〈Digital Worker Delivery Summary〉、〈B3 交付審查檢核表〉。"}, {"id": "handoff", "chapter": "交接", "title": "下一段：把做法帶回團隊", "lead": "第五段回顧：從今天的紀錄，決定回去先試哪一件事。", "cards": [["帶著走", "notes/b3.md、notes/delivery.md 與 skills/b3-work-order.md。"], ["先想好", "工作上一件可以委派的事：邊界、停止條件、Gate 各設在哪。"]], "check": "能說出一個你會設的 Gate，以及在那道 Gate 你要看的證據。", "notes": "約 1.5 分鐘。交接到 Speech 05 回顧與組織導入。不在這裡展開組織導入或平台需求，留給下一段。提醒：Tool → Teammate → Digital Worker 是介入方式的階梯，風險高、難復原的工作可以退回前一種方式。"}], "title": "Digital Worker：工作授權、審查與治理", "minutes": 45, "downloads": [{"label": "下載操作講義", "name": "digital-worker-handout.md", "text": "# Digital Worker：工作授權、審查與治理\n\n\u003e 讀者：學員。時機：B3 與交付之後的 45 分鐘概念講解。前置：做過 B3，或手邊有自己的 `notes/b3.md`、`notes/delivery.md` 與 `skills/b3-work-order.md`。\n\n本段講概念與判斷，不寫程式、不打指令。範例提示詞是選用示範，貼給你自己的 Coding Agent，結果由你檢查；沒有實際執行的，一律當作未驗證。\n\n## 1. 把整件任務交出去，人只守關卡\n\n第四段 · Digital Worker（數位員工：在核准範圍內獨立完成整件任務的 Agent，即 AI 助手） · 回看 B3（Brownfield 最後一個大任務：團體訂票） · 概念講解\n\n- **今天談四件事**：工作單怎麼授權、三道 Gate（核准關卡）看什麼、例外怎麼判斷、交付憑什麼證據。\n\n- **怎麼聽**：對照你剛才的 notes/b3.md，也想一件工作上可以這樣委派的事。\n\n**人工確認**：手邊打開自己的 notes/b3.md；沒有的，記下你最想退回的那一道 Gate。\n\n## 2. 差別在人什麼時候介入\n\n三段都不寫程式；變的是人介入的方式，責任沒有消失，而是重新分配。\n\nTool：人逐步下指令、每步驗收 → Teammate：一起分析、人核准計畫 → Digital Worker：Agent 自己往前走、人只在 Gate 決定\n\n- **人負責**：設邊界、核准或退回、質疑、要求補證據，承擔最終交付責任。\n\n- **Agent 負責**：分析、設計、改程式、測試、文件，並把紀錄寫進 notes/b3.md。\n\n**人工確認**：說得出 B3 裡人「不做」的事：不寫、不讀、不改程式，也不跳過 Gate。\n\n## 3. 工作單：五部分放大到整件任務\n\nWork Order（工作單）就是提示詞五部分，從一個步驟放大成一整件任務（加深一層）。\n\n目標：已核准的需求 → 背景：已核准背景 → 限制：允許／禁止修改的範圍 → 輸出格式：Gate 回報格式 → 停止條件：停止與升級條件、三道 Gate\n\n**人工確認**：拿自己的工作單對照：五部分每一項都找得到原文嗎？\n\n## 4. 授權範圍：寫下能動哪裡、不能動哪裡\n\n授權不是一句「交給你」，而是事先寫好的邊界；Gate 2 再把邊界縮到具體檔案。\n\n- **允許的種類**：團體流程需要的 API（應用程式介面）、業務模型、應用流程、測試與文件。\n\n- **禁止**：全面重寫一般訂票、改無關 API、移除既有功能或回歸測試、自行改商業規則。\n\n- **要先核准**：改 API 合約、修改 Gate 2 清單以外的檔案。\n\n**人工確認**：每個預計修改的檔案，Agent 都先說明了為什麼要改嗎？\n\n## 5. 停止條件：Agent 何時該停下來問你\n\nEscalation（升級處理）：遇到停止條件，只停受影響的動作，附證據交給人決定。\n\n- **典型情況**：需求和規則互相矛盾、要改範圍外的 API 或檔案、新增外部套件、測試出現無關失敗、時間不夠。\n\n- **回報六標題**：觸發原因（Trigger）、證據（Evidence）、影響（Impact）、選項（Options）、建議（Recommendation）、需決定的事（Decision Needed）。\n\n**人工確認**：Agent 停下來時，你看得出觸發原因、證據與需要你決定的事嗎？\n\n## 6. 工作單存成 Skill，之後只說一句\n\n把工作單連同 Gate 回報格式存成 skills/b3-work-order.md（Skill 技能檔，加深一層；本課程用簡化版，是 skills/ 裡的 Markdown 說明檔）。\n\n- **為什麼存檔**：Agent 自己往前走時隨時回頭查；人每道 Gate 只說「依 skills/b3-work-order.md」。\n\n- **開工前三件事**：開新對話、選推論較強的模型、先存一版（Commit）「B3 起點」當比較基準。\n\n**人工確認**：notes/b3.md「已核准背景」記了起點測試數與模型；工具沒有這個設定時寫「預設」。\n\n## 7. 13 分鐘裡的三個決策點\n\nGate 之間讓 Agent 自己往前走；每道 Gate 控制在 1–3 分鐘。\n\n第 63 分：交工作單 → 第 66 分：Gate 1 需求理解 → 第 69 分：Gate 2 影響分析與設計 → 第 69–70 分：例外事件 → 第 74 分：停止擴充 → 第 75 分：Gate 3 交付審查 → 第 76 分：B3 結束\n\n**人工確認**：先過 Gate 1 才設計；Gate 2 核准且條件解除才改程式；Gate 3 由人決定交不交付。\n\n## 8. Gate 回報格式：每道 Gate 同一組標題\n\n結構化輸出（加深一層）：固定標題讓你 1–3 分鐘看完，也能和上一道 Gate 比對。\n\n```text\nGate：Gate 1／Gate 2／Gate 3\n建議結論：APPROVE | APPROVE WITH CONDITIONS | REJECT AND REVISE（一句理由）\n證據：是非題清單，每題「是／否／不確定」＋依據位置\n風險：最沒把握的地方、失敗或未驗證項目\n需要人決定的事：每題附建議答案；查不到依據的標「待小組確認」\n```\n\n**人工確認**：每個是非題都附了依據位置（任務卡、工作單、notes/b3.md、測試名稱或實際指令）。\n\n## 9. 決策由人說，Agent 照原文記\n\n人回一句話：決策、條件、核准人、第幾分鐘；Agent 不代人填核准。\n\n- **三種結論**：APPROVE 核准；APPROVE WITH CONDITIONS 附條件核准，條件解除後才續行；REJECT AND REVISE 退回修正。\n\n- **核准不等於通過**：核准是決策；通過要看驗收對照表與測試。\n\n- **形式性核准**：照單接受建議，卻說不出核對了哪一題。\n\n**人工確認**：你說得出這次核准時，自己核對了哪一題嗎？\n\n## 10. Gate 1：先確認 Agent 懂需求\n\n需求理解錯了，後面做得再快都是白做。逐題對照任務卡原文。\n\n- **人核對**：5–20 人邊界、同班次與同車廂連續座位、不允許部分成功、付款失敗整筆取消並釋放座位、沿用 B2（上一個任務）的優惠規則。\n\n- **人決定**：標「待小組確認」的問題，例如任務卡沒寫的數值，不讓 Agent 自己假設。\n\n**人工確認**：5 個是非題都對得上任務卡才核准；看不懂就請 Agent 換個說法。\n\n## 11. Gate 2：你核准的範圍，就是授權邊界\n\nAgent 只提設計、不改程式；不能因為方案「看起來合理」就核准。\n\n- **人核對**：範圍只限團體流程、沒有全面重寫、建立失敗與付款失敗都有處理、既有測試保留、沒有未核准的外部依賴。\n\n- **之後**：Agent 做的和核准的不一樣時，要補證據或回到 Gate 2 重新核准。\n\n**人工確認**：每個是非題的答案都落在工作單允許的範圍內，再核准。\n\n## 12. 例外事件：60 秒判斷範圍\n\n例外編號 EXCEPTION-DW-001：一個會把 Agent 帶出 Gate 2 核准範圍的提議。\n\n先停止所有修改 → 寫下提議、影響與工作單原文 → 判斷：在核准範圍內嗎（是／否／不確定） → 決定：核准／附條件核准／拒絕 → 告訴 Agent 下一步與要回到哪道 Gate\n\n**人工確認**：你的判斷能指出工作單或 Gate 2 的哪一句原文當依據。\n\n## 13. 沒有工作單，例外會變成什麼？\n\n例外提議常常聽起來很合理；能擋下越界的是事先寫好的邊界，不是當下的直覺。\n\n- **有工作單**：對照原文就能判斷，60 秒內做完決定並留下紀錄。\n\n- **沒有工作單**：只能憑感覺，或讓 Agent 自己決定，事後也查不到為什麼。\n\n- **拒絕提議**：不等於終止任務；回到核准範圍繼續做。\n\n**人工確認**：想一件你的工作：哪一條邊界最需要事先寫進工作單？\n\n## 14. 放手執行：只在它停下來問時介入\n\nGate 2 後 Agent 自己改程式、跑測試、更新文件；你不逐步下指令。\n\n- **偏差先停**：與 Gate 2 計畫不同時先停下回報，等人核准。\n\n- **Token（詞元）節費**：細節寫進 notes/b3.md，對話只回 5 行白話摘要。\n\n**人工確認**：Agent 停下來時，讀它的選項與建議，回一句決定，再請它照原文記錄。\n\n## 15. 何時停止、何時擴大範圍\n\n第 74 分鐘停止擴充：不論做到哪裡，停下來整理證據。\n\n- **要停止**：時間到、碰到停止條件、條件未解除、與核准計畫有偏差。\n\n- **要擴大範圍**：不能自己擴；回到 Gate 2 由人重新核准，並記下原因。\n\n- **沒做完**：列為未驗證，依證據如實交付。\n\n**人工確認**：不因時間壓力跳過 Gate，也不接受沒驗證過的說法。\n\n## 16. Gate 3：不看程式，看三題與對照表\n\n變更審查三題都答「是」，失敗與未驗證項目都列出來，才核准。\n\n- **(1) 範圍**：改的檔案都在 Gate 2 核准範圍內？\n\n- **(2) 測試數**：沒有比 B3 起點少，也沒有新增跳過或預期失敗？\n\n- **(3) 期待值**：沒有刪測試，也沒有改既有測試的期待值？\n\n**人工確認**：有一題是「否」或「不確定」就不核准，請 Agent 解釋或修正。\n\n## 17. 完成等級：依證據擇一\n\nGate 3 時 Agent 建議一個完成等級（Level）；你依證據擇一，不自動選 Level 3。\n\n- **Level 1：分析完成（Analysis Complete）**：Gate 1／2 完成，影響分析合理、測試策略完整，程式尚未完成。\n\n- **Level 2：核心流程完成（Core Flow Complete）**：團體建立與連續座位完成、主要單元測試通過，付款失敗的補償（Compensation）或文件仍有缺項。\n\n- **Level 3：完整交付（Delivery Complete）**：建立、付款成功與付款失敗的補償都完成，回歸測試（Regression）通過，文件與交付摘要都完整。\n\n**人工確認**：選定的等級，每一句都指得出證據；Level 1 也要明記「無修改／未執行」與原因。\n\n## 18. 交付摘要本身就是證據\n\n十二個固定標題、每欄附證據位置；沒有證據的寫「未驗證」（結構化輸出，加深一層）。\n\n- **人核對三句話**：建議的 Level、測試結果、修改範圍，各自引用得出證據原文。\n\n- **和紀錄一致**：Gate 決策照 notes/b3.md 原文；沒有偏差也要明寫。\n\n### 交給 Agent 的指令\n\n請只讀 notes/delivery.md 與 notes/b3.md，不要修改任何檔案。逐欄列出：這一欄的結論、引用的證據原文與位置；找不到證據的標「應改為未驗證」。最後用一句話說明哪一欄最需要人再確認。\n\n**人工確認**：抽查時一欄一欄問「證據在哪？」；引用不出的改成未驗證。\n\n## 19. 下一段：把做法帶回團隊\n\n第五段回顧：從今天的紀錄，決定回去先試哪一件事。\n\n- **帶著走**：notes/b3.md、notes/delivery.md 與 skills/b3-work-order.md。\n\n- **先想好**：工作上一件可以委派的事：邊界、停止條件、Gate 各設在哪。\n\n**人工確認**：能說出一個你會設的 Gate，以及在那道 Gate 你要看的證據。\n\n## 完成條件\n能說出：一份工作單的五個部分與授權邊界、每道 Gate 你要核對什麼、例外提議怎麼判斷範圍、交付時憑哪些證據選完成等級；並想好工作上一件可以這樣委派的事，以及 Gate 要設在哪裡。\n"}]};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;
const el = id => document.getElementById(id);
let index = 0, notesVisible = false, running = false, accumulated = 0, startedAt = 0;
const overview = el('overview');
function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {
  const available = Math.max(100, innerHeight - document.querySelector('nav').offsetHeight - 18);
  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `${SPEECH_DATA.title.split('：')[0]} · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / ${String(SPEECH_DATA.minutes).padStart(2,'0')}:00`;el('timer').classList.toggle('over',secs>=SPEECH_DATA.minutes*60);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
SPEECH_DATA.downloads.forEach(d=>{const b=node('button',d.label);b.onclick=()=>save(d.name,d.text);el('downloads').append(b);});
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&(e.target.closest('textarea,input,select')||(e.target.closest('button')&&[' ','Enter'].includes(e.key))))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
