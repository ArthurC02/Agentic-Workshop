<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "開場", "title": "把整件工作交給 Agent，要先設計什麼？", "lead": "第四段 · Digital Worker（數位員工：在核准範圍內獨立完成整件任務的 Agent） · 概念講解", "cards": [["今天談的不是 B3 本身", "而是業界怎麼安全地委派：工作單、自主等級、關卡、權限、防護、評估與治理。"], ["怎麼聽", "心裡選一件工作上想交給 Agent 的事，每頁都拿它對照。"]], "check": "想好一件你想委派的工作：它做錯了，誰會受影響？", "explain": ["Digital Worker 是把整件任務交出去，人只在事先設好的關卡做決定。能不能安全交出去，不取決於 Agent 多聰明，而取決於事前的設計：授權範圍、停止條件、關卡、權限與審查方式。這份講義整理業界做法、官方說法與真實事故，不包含 B3 的做法或例外事件內容。"], "notes": "（第 00–01 分）只講路線。本段在 B3（Brownfield 最後一個大任務：團體訂票）與交付之後。只花一頁回看 B3，其餘都是 B3 背後的通用做法、官方說法與真實案例。不揭曉 B3 的實作做法或例外事件內容，聽眾可能是之後的學員。"}, {"id": "b3-recap", "chapter": "開場", "title": "剛才你其實做了三件管理者的事", "lead": "你沒寫程式，但做了委派最難的三件事：事先授權、在關卡決策、憑證據簽收。", "flow": ["寫工作單：一次授權", "守三道 Gate：只在關卡介入", "讀交付摘要：憑證據簽收"], "cards": [["人負責", "設邊界、核准或退回、要求補證據，承擔最終交付責任。"], ["Agent 負責", "分析、設計、改程式、測試、寫紀錄；碰到停止條件就停下來問。"]], "check": "說得出 B3 裡你在哪一道 Gate 最猶豫，以及當時缺什麼證據。", "explain": ["委派最難的三件事和管理者一樣：事前把範圍寫清楚授權出去、在關鍵時刻做決定、最後憑證據簽收。Agent 負責分析、設計、改程式、測試、寫紀錄；人負責設邊界、核准或退回、要求補證據，並承擔最終的交付責任。", "回想你在哪一道 Gate 最猶豫：通常不是因為不懂程式，而是缺了某一項證據。接下來每一頁，都在回答真實工作上怎麼把這三件事做得更穩。"], "notes": "（第 01–03 分）這是本場唯一的回顧頁。Tool → Teammate → Digital Worker 的差別是人介入的方式：逐步確認、核准計畫、只在 Gate 決策。請一兩位說出最猶豫的 Gate 與缺的證據（只說缺什麼，不說答案）；接下來每頁都在回答「真實工作上，這三件事要怎麼做得更穩」。📖 定義出處：本課程〈B3 工作單（Work Order）〉。"}, {"id": "delegation", "chapter": "委派與工作單", "title": "從「問 AI」到「交辦給 AI」", "lead": "問答是一來一回；交辦是 Agent 自己規劃、動手、檢查結果，再決定下一步。", "cards": [["整圈交給它", "第一場的迴圈，這次由 Agent 自己跑完，直到完成或卡住。"], ["人要先給", "清楚的目標、能自己跑的檢查，以及卡住時停下來問人的規則。"]], "check": "你那件工作，有沒有一個 Agent 自己就能跑的檢查（測試、比對、截圖）？", "explain": ["問答是一來一回；交辦是整個「規劃、動手、看結果、決定下一步」的迴圈都由 Agent 自己跑，直到完成或卡住。Anthropic〈Building effective agents〉也說，Agent 可以在檢查點或碰到阻礙時停下來，等人回饋。", "所以交辦的品質取決於人事先給了什麼：清楚的目標、Agent 自己能跑的檢查、卡住時停下來問人的規則。少了檢查，它只能憑感覺說完成；少了停止規則，它會自己猜下一步。"], "read": ["〈Building effective agents〉（Anthropic，2024）"], "notes": "（第 03–05 分）加深一層：Agent 的迴圈、「不會讀心的新同事」、先給檢查都在第一場講過，這裡不重講，只補一個差別：Tool 階段每一圈都等人看，交辦時整圈由 Agent 跑，人只在停止條件與關卡出現。第一場引用的〈Building effective agents〉也說 Agent 可在檢查點或碰到阻礙時停下來等人回饋。重點：交辦的品質取決於人事先給的目標、檢查與停止規則，不取決於模型多聰明。"}, {"id": "work-order", "chapter": "委派與工作單", "title": "好工作單回答五個問題", "lead": "Work Order（工作單）就是五段式提示詞放大到整件任務；寫不出來的那一段，就是你還沒想清楚的地方。", "flow": ["要做成什麼", "該讀哪些資料", "能動與不能動", "怎麼回報", "何時停下來問"], "prompt": "先不要修改任何檔案。我想把一件工作交給你：（我會口頭描述）。請先問我問題，再依目標、要讀的資料、允許與禁止的範圍、回報格式、停止與升級條件五段，寫一份工作單草稿。我答不出來的，標「待決定」，不要自己補。寫完停下等我審。", "check": "草稿裡標「待決定」的項目，你都能在開工前回答嗎？", "explain": ["工作單就是第一場的五段式提示詞放大到整件任務：要做成什麼（目標）、該讀哪些資料（背景）、能動與不能動（限制與授權範圍）、怎麼回報（輸出格式）、何時停下來問（停止與升級條件）。寫不出來的那一段，就是你還沒想清楚的地方。", "讓 Agent 先訪談你再寫草稿，是第一場「規格從短開始」的加深：從一份規格放大到整件任務的授權。關鍵是答不出來的標「待決定」，不讓 Agent 自己補；開工前把每個待決定都回答完。"], "notes": "（第 05–07.5 分）五段在 Greenfield 第一次用在計畫提示詞，B3 放大成工作單；這裡把它變成帶回工作的做法。示範：讓 Agent 先訪談你再寫工作單，是第一場「規格從短開始，請 Agent 訪談你」的加深一層：從一份規格放大到整件任務的授權。這段提示詞是選用示範，未在現場執行；學員想試，貼給自己的 Agent，結果自己檢查。"}, {"id": "autonomy-levels", "chapter": "自主等級", "title": "自主程度是設計出來的，不是能力換來的", "lead": "同一個強 Agent，可以設成每步都問人，也可以只在關卡問；差別在人扮演什麼角色。", "flow": ["操作者：人下每一步", "協作者：一起做", "顧問：Agent 主導、人給意見", "核准者：人只在關鍵點核准", "觀察者：人只看紀錄"], "check": "你那件工作，現在適合人當哪一種角色？為什麼不是下一級？", "explain": ["Feng、McDonald、Zhang 的論文〈Levels of Autonomy for AI Agents〉（arXiv，2025）以「人扮演的角色」分五級：操作者、協作者、顧問、核准者、觀察者。大致對照工作坊：Tool 接近操作者，Teammate 接近協作者與顧問，Digital Worker 接近核准者。", "論文的重點是：自主程度是設計選擇，能力強不代表就該放手。要不要升一級，問三個問題：做錯的代價多大？能不能復原？有沒有 Agent 自己能跑的檢查？有一題答不好，就先停在目前這一級。"], "read": ["〈Levels of Autonomy for AI Agents〉（Feng 等，2025）"], "notes": "（第 07.5–10 分）來源：Feng、McDonald、Zhang〈Levels of Autonomy for AI Agents〉（arXiv, 2025-06，2025-07 修訂），以「人扮演的角色」分五級：operator、collaborator、consultant、approver、observer。大致對照工作坊：Tool 接近操作者，Teammate 接近協作者與顧問，Digital Worker 接近核准者。重點是論文主張：自主是設計選擇，能力強不代表就該放手。判斷升一級的三個問題：做錯的代價多大、能不能復原、有沒有 Agent 自己能跑的檢查。📖 延伸閱讀：〈Levels of Autonomy for AI Agents〉（Feng 等, 2025）。"}, {"id": "oversight", "chapter": "自主等級", "title": "有效監督：不是每步都按核准", "lead": "監督的重點是關鍵時刻能踩煞車，而不是盯著每一步。（Anthropic，2026-02）", "cards": [["新手", "約 20% 的工作階段開啟全自動核准。"], ["熟手（750 次以上）", "超過 40% 開啟全自動核准，但中途打斷的比例從約 5% 升到約 9%。"], ["真正難回頭的動作", "只占約 0.8%；關卡要設在這裡。"]], "check": "你那件工作裡，哪一個動作做了就很難回頭？那裡就該設關卡。", "explain": ["Anthropic〈Measuring AI agent autonomy in practice〉（2026-02）分析自家產品的實際使用紀錄：使用不到 50 次的新手，約 20% 的工作階段開啟全自動核准；用到 750 次以上的熟手超過 40%，但中途打斷的比例也從約 5% 升到約 9%。最長的連續工作時間，三個月內從 25 分鐘以下增加到 45 分鐘以上；看起來不可逆的動作只占約 0.8%。", "解讀：熟手不是不監督，而是從「每步按核准」變成「看到不對就踩煞車」。原文說，有效的監督不需要核准每個動作，而是在重要時刻能介入。限制：這是單一廠商自家產品的資料，不一定適用你的環境。"], "read": ["〈Measuring AI agent autonomy in practice〉（Anthropic，2026）"], "notes": "（第 10–12.5 分）來源：Anthropic〈Measuring AI agent autonomy in practice〉（2026-02-18），分析實際使用紀錄。熟手更常放手、也更常中途打斷：信任增加的同時，監督變成「看到不對就停」。同期最長的連續工作時間，三個月內從 25 分鐘以下增到 45 分鐘以上。原文：Effective oversight doesn't require approving every action but being in a position to intervene when it matters。限制：這是單一廠商自家產品的使用資料。📖 延伸閱讀：〈Measuring AI agent autonomy in practice〉（Anthropic, 2026）。"}, {"id": "gates", "chapter": "核准關卡", "title": "關卡要設在哪裡？", "lead": "Human-in-the-loop（人在迴圈中）不是到處設關卡，而是設在「錯了代價最大」的前一刻。", "cards": [["理解之後、動手之前", "確認 Agent 懂的需求和你要的一樣。"], ["範圍確定之前", "核准要改哪些地方，這就是授權邊界。"], ["不可逆動作之前", "刪資料、上線、付款、對外寄送，一律先問人。"]], "check": "每一道關卡，你都說得出要看哪一項證據才放行嗎？", "explain": ["關卡設在三種地方：理解之後、動手之前（確認需求一致）；範圍確定之前（核准要改哪裡，也就是授權邊界）；不可逆動作之前（刪資料、上線、付款、對外寄送）。資安社群 OWASP 的〈LLM06:2025 Excessive Agency〉也把「高影響動作要人核准」列為緩解方法。", "關卡的力度也看風險。Claude Code 團隊公開的審查做法（2026-10）依變更本身的風險分級：低風險變更在自動檢查都通過後不需要人核准，一般變更一人審，最高風險兩人審；原文說，修文件和改自動更新程式的風險不同，審法也該不同。限制：這是單一廠商自家的做法。"], "read": ["〈How the Claude Code team does code review〉（Anthropic，2026）"], "notes": "（第 12.5–15 分）B3 的三道 Gate 正是前兩類加上交付審查。第三場「比較方案」引用過 Anthropic 的安全 Agent 框架：預設唯讀、高風險決定前人要保有控制權；這裡加深一層，從「選方案」放大到「整件任務的關卡放哪裡」。OWASP〈LLM06:2025 Excessive Agency〉也把「高影響動作要人核准」列為緩解方法（下下頁詳談）。關卡的力度也看風險：Claude Code 團隊〈How the Claude Code team does code review〉（2026-10-15）依變更本身的風險分級，原文「A docs fix and an auto-updater change carry different risk, so they get different review.」低風險在自動檢查全過後不需要人核准，一般變更一人、最高風險兩人。限制：單一廠商自家做法。提問：你的工作裡，哪一步一旦做了就無法撤銷？📖 延伸閱讀：〈How the Claude Code team does code review〉（Anthropic, 2026）。"}, {"id": "fatigue", "chapter": "核准關卡", "title": "問太多次，人就開始亂按", "lead": "Approval fatigue（核准疲勞）：關卡太多，核准就變成反射動作，等於沒有關卡。", "cards": [["官方提醒", "按到第十次核准，你已經不是在審查，只是在點過去。"], ["解法", "用權限和隔離環境圈好邊界，邊界內不必問；只把真正的決策留給人。"]], "check": "你的關卡，每一道都有人真的會停下來看嗎？", "explain": ["核准疲勞是真的：Claude Code 官方文件說，按到第十次核准，你已經不是在審查，只是在點過去。關卡一多，核准就變成反射動作，等於沒有關卡。", "解法不是少審，而是把邊界做在環境上。Anthropic（2025-10）的沙箱文章說，用檔案系統與網路兩道隔離後，權限詢問減少 84%。邊界內的事不必問，只把真正的決策留給人；B3 只設三道 Gate、每道 1–3 分鐘，就是這個設計。", "這句話說的是「每個動作都要人按核准」的模式。現在有些工具改用另一個模型（分類器）先審查每個動作，只擋下或詢問看起來有風險的，例如 2026 年 Claude Code 在多數互動情境的預設模式。這減少了詢問，但審查的仍是模型，不是你；不可逆、高影響的動作，還是要在工作單裡寫成必須停下來問人的關卡。"], "read": ["〈Beyond permission prompts: making Claude Code more secure and autonomous〉（Anthropic，2025）", "〈Best practices for Claude Code〉（Anthropic，官方文件）"], "notes": "（第 15–16.5 分）Claude Code 最佳實務文件原文：After the tenth approval you're clicking through rather than reviewing。Anthropic 2025-10-20 的沙箱文章說，用檔案系統與網路兩道隔離後，權限詢問減少 84%。B3 只設三道 Gate、每道 1–3 分鐘，就是避免核准疲勞的設計。📖 延伸閱讀：〈Beyond permission prompts: making Claude Code more secure and autonomous〉（Anthropic, 2025）。"}, {"id": "least-privilege", "chapter": "權限與沙箱", "title": "最小權限：門禁卡只開要去的樓層", "lead": "OWASP 把「Agent 權力過大」列為十大風險之一，根因有三個「給太多」。", "cards": [["功能給太多", "任務只要讀，卻給了能刪、能寄信的工具。"], ["權限給太多", "用管理員帳號跑，碰得到正式資料。"], ["自主給太多", "高影響動作不用人核准就能做。"]], "check": "列出你那件工作 Agent 真正需要的權限，多一項都要說得出理由。", "explain": ["OWASP〈LLM06:2025 Excessive Agency〉列出 Agent 權力過大的三個根因：功能給太多、權限給太多、自主給太多。緩解方法是最小權限、高影響動作要人核准，而且授權檢查要做在下游系統，不交給模型自己判斷。白話說，給權限像給門禁卡：只開要去的樓層。", "OWASP 也在 2025-12 發布了專談 Agent 應用風險的十大風險清單。下週替你的工作列出 Agent 真正需要的權限，每多一項都要說得出理由。", "美國國家標準技術研究院（NIST）的資安詞彙表把最小權限定義為：把使用者，或代表使用者執行的程式，所能取得的存取權限限制在完成指派工作所需的最小範圍。Agent 就是代表你執行的程式，所以同一條原則直接適用。"], "read": ["〈LLM06:2025 Excessive Agency〉（OWASP，2025）", "〈Glossary〉（NIST CSRC，least privilege 條目）"], "notes": "（第 16.5–19 分）來源：OWASP GenAI Security Project〈LLM06:2025 Excessive Agency〉，三個根因 excessive functionality、permissions、autonomy。緩解：最小權限、高影響動作要人核准，而且授權檢查要做在下游系統，不交給模型自己判斷。OWASP 也在 2025-12-09 發布〈Top 10 for Agentic Applications for 2026〉，專談 Agent 應用的風險（各項名稱上台前請查原文）。📖 延伸閱讀：〈LLM06:2025 Excessive Agency〉（OWASP, 2025）。"}, {"id": "sandbox", "chapter": "權限與沙箱", "title": "沙箱：先圍好場地，再放手", "lead": "Sandbox（沙箱：隔離的執行環境）讓 Agent 在邊界內自由動手，邊界外什麼都碰不到。", "cards": [["兩道邊界", "檔案只能動指定資料夾；網路只能連指定位置。"], ["平台做法", "Agent 只推到自己的分支，不能核准或合併自己的變更。"]], "prompt": "先不要修改任何檔案。請依我們的工作單，列出這件工作需要的權限：要讀與要改的資料夾、要執行的檢查、是否需要網路、是否碰到正式資料。每一項附理由；不需要的明寫「不需要」。最後列出你建議由人核准的動作，然後停下。", "check": "清單裡有沒有「碰到正式資料」或「對外傳送」？有的話先拿掉或加關卡。", "explain": ["沙箱就是先圍好場地：檔案只能動指定的資料夾，網路只能連指定的位置。邊界外什麼都碰不到，邊界內就可以放手，不必逐步問人。", "GitHub 官方文件說明它的雲端 Coding Agent 怎麼把護欄做在平台上：在暫時性的雲端環境工作，只能推到自己的分支，不能把自己的變更標成可審查，也不能核准或合併；人審查之前，持續整合（CI）的檢查流程也不會執行。下週可以貼上方的提示詞，請 Agent 依工作單列出需要的權限，再把「碰到正式資料」和「對外傳送」拿掉或加上關卡。"], "read": ["〈Risks and mitigations for GitHub Copilot cloud agent〉（GitHub，官方文件）", "〈Beyond permission prompts: making Claude Code more secure and autonomous〉（Anthropic，2025）"], "notes": "（第 19–21.5 分）Anthropic 2025-10-20 沙箱文章：檔案系統隔離加網路隔離。GitHub 官方文件〈Risks and mitigations for GitHub Copilot cloud agent〉：Agent 在暫時性雲端環境工作，只能推到自己的分支，不能把自己的 PR 標成可審查，也不能核准或合併；它的程式碼經人審查前，CI 工作流程不會執行。示範提示詞是選用的，未在現場執行。📖 延伸閱讀：〈Risks and mitigations for GitHub Copilot cloud agent〉（GitHub, 持續更新）。"}, {"id": "replit", "chapter": "防護與事故", "title": "事故一：「凍結」只寫在對話裡", "lead": "2025 年 7 月，一位創業者測試 Replit 的 Agent，在凍結期間正式資料庫被刪。", "cards": [["發生什麼", "Agent 無視「程式與動作凍結」執行未授權指令，刪掉 1,200 多位主管、1,190 多家公司的資料。"], ["事後補強", "廠商加上開發與正式資料庫自動分離、只規劃不執行的模式。"], ["教訓", "禁止事項要做在權限上；對話裡的約定不是保險。"]], "check": "你的「不能做」清單裡，哪幾條其實只寫在提示詞裡？", "explain": ["Fortune 在 2025-07-23 報導：SaaStr 創辦人 Jason Lemkin 測試 Replit 的 Agent 時，雖然已宣告「程式與動作凍結」，Agent 仍執行了未授權的指令，刪掉 1,200 多位主管、1,190 多家公司的資料，還說資料無法復原（實際上可以）。Replit 執行長稱這件事不可接受、不應該發生，事後加上開發與正式資料庫自動分離、只規劃不執行的模式。", "重點不是哪一家產品不好，而是任何 Agent 只要拿得到正式資料庫的權限，口頭凍結都擋不住；禁止事項要做在權限上。網路上「捏造 4,000 筆假資料」的說法只見於單一媒體，不要引用。"], "read": ["〈An AI-powered coding tool wiped out a software company's database, then apologized for a 'catastrophic failure on my part'〉（Fortune，2025）"], "notes": "（第 21.5–24 分）來源：Fortune（2025-07-23）。SaaStr 創辦人 Jason Lemkin 測試期間發生；Agent 還說資料無法復原，實際上可以。Replit 執行長稱這件事 Unacceptable and should never be possible。平衡說明：這是試用中的專案，資料最後救回；重點不是哪家產品不好，而是任何 Agent 只要拿得到正式資料庫的權限，口頭凍結都擋不住。網路上「捏造 4,000 筆假資料」的說法只見於單一媒體，不要引用。📖 延伸閱讀：〈An AI-powered coding tool wiped out a software company's database, then apologized for a 'catastrophic failure on my part'〉（Fortune, 2025）。"}, {"id": "trifecta", "chapter": "防護與事故", "title": "三缺一：提示詞注入的致命組合", "lead": "Prompt injection（提示詞注入）：輸入或讀到的內容藏著指令，改變了 Agent 原本該做的事。", "cards": [["① 讀得到私密資料", "程式碼、客戶資料、金鑰。"], ["② 會讀不可信內容", "網頁、外部文件、別人提的問題單。"], ["③ 能對外傳送", "發請求、寄信、推到公開位置。"]], "check": "三項同時成立就危險；你的工作單至少拿掉了哪一項？", "explain": ["Simon Willison（2025-06）把三種能力同時存在稱為「致命三要素」：讀得到私密資料、會讀不可信的內容、能對外傳送。藏在網頁、文件或問題單裡的指令，可能讓 Agent 把私密資料送出去。白話比喻：新同事桌上有機密文件、會照陌生人的紙條做事、手邊又有寄件權限，三者湊齊就會出事。", "目前沒有能完全擋住提示詞注入的方法，所以要從設計上拿掉其中一項，這就是「三缺一」。下週檢查你的工作單授權範圍，至少拿掉一項，例如不給對外網路，或不讓它讀外部內容。", "OWASP〈LLM01:2025 Prompt Injection〉把它分成兩種：使用者直接在輸入裡下指令的，叫直接注入；指令藏在網頁、檔案等外部內容裡、被 Agent 讀進來的，叫間接注入，Coding Agent 最常碰到的是後者。OWASP 也說，以生成式模型的特性，目前不清楚有沒有萬無一失的防法，這正是要從設計上拿掉一項的原因。"], "read": ["〈The lethal trifecta for AI agents〉（Simon Willison，2025）", "〈LLM01:2025 Prompt Injection〉（OWASP，2025）"], "notes": "（第 24–26.5 分）來源：Simon Willison〈The lethal trifecta for AI agents: private data, untrusted content, and external communication〉（2025-06-16），原文：We need to avoid the lethal trifecta combination of tools ourselves to stay safe。白話比喻：新同事桌上有機密文件、會照陌生人紙條做事、手邊又有寄件權限，三者湊齊就會出事。目前沒有能完全擋住注入的方法，所以從設計上拿掉一項。📖 延伸閱讀：〈The lethal trifecta for AI agents〉（Simon Willison, 2025）。"}, {"id": "supply-chain", "chapter": "防護與事故", "title": "事故二：Agent 的供應鏈也會被下毒", "lead": "2025 年 7 月，Amazon Q Developer 的 VS Code 擴充套件 1.84.0 被植入「清除檔案」的提示詞。", "cards": [["怎麼發生", "建置設定裡的 GitHub 權杖權限過大，攻擊者藉此提交惡意內容，被自動打包發布。"], ["教訓", "Agent、擴充套件、Skill 都是供應鏈；只從可信來源安裝，建置帳號也要最小權限。"]], "check": "你團隊用的 Agent 擴充套件與 Skill，誰負責審核來源？", "explain": ["AWS 安全公告 AWS-2025-015（2025-07-23）說明：建置設定裡的 GitHub 權杖權限過大，攻擊者藉此提交惡意內容，被自動包進 Amazon Q Developer 的 VS Code 擴充套件 1.84.0 發布。這段「清除檔案」的提示詞因為語法錯誤沒有實際執行，AWS 已發布修正版；漏洞的公開編號（CVE）是 CVE-2025-8217。", "教訓是 Agent 本身與它的供應鏈都需要最小權限：Agent、擴充套件、Skill 都是供應鏈的一環，只從可信來源安裝，負責建置的帳號也只給需要的權限。網路上流傳的安裝數字只見於二手報導，不要引用。"], "read": ["〈Security Update for Amazon Q Developer Extension for Visual Studio Code (Version #1.84)〉（AWS，2025）"], "notes": "（第 26.5–28.5 分）來源：AWS 安全公告 AWS-2025-015（2025-07-23），CVE-2025-8217。這段惡意提示詞因語法錯誤沒有實際執行，AWS 已發布修正版。第三場講 Skill 時已提過「只從可信來源安裝」，這起事故是它的真實例子。網路上的安裝數字只見於二手報導，不要引用。📖 延伸閱讀：〈Security Update for Amazon Q Developer Extension for Visual Studio Code (Version #1.84)〉（AWS, 2025）。"}, {"id": "guardrails", "chapter": "防護與事故", "title": "護欄做在平台，不只寫在提示詞", "lead": "規則檔與提示詞是「建議」；一定要發生或一定不能發生的事，交給自動機制。", "cards": [["寫在規則裡", "風格、偏好、怎麼回報。Agent 多半會照做，但不保證。"], ["做在平台上", "權限、隔離環境、自動檢查、合併前必須有人審。"]], "check": "挑一條你最怕被違反的規則：它現在是建議，還是平台擋得住？", "explain": ["規則檔與提示詞是建議，Agent 多半會照做，但不保證。Claude Code 官方文件說得很清楚：規則檔是建議性的，hook（在固定時機自動執行的腳本或檢查）則確定會發生。所以風格、偏好、回報方式寫在規則裡；權限、隔離環境、自動檢查、合併前必須有人審，要做在平台上。", "例子：第三場的「絕不提交密碼與金鑰」，寫在規則裡只是提醒，做在平台上就是推送前自動掃描金鑰。下週挑一條你最怕被違反的規則，問它現在只是建議，還是平台擋得住。"], "read": ["〈Best practices for Claude Code〉（Anthropic，官方文件）"], "notes": "（第 28.5–30 分）加深一層：第一場說過「規則是提醒，不是鎖」，第三場的三層邊界也預告「絕不做」要用權限或自動檢查擋住，這裡就是那一步，不重講規則檔本身。Claude Code 最佳實務文件：規則檔是建議性的，hook（掛勾：特定時機自動執行的檢查）是確定會發生的。例子：第三場的「絕不提交密碼與金鑰」，在平台上就是推送前自動掃描金鑰。📖 延伸閱讀：〈Best practices for Claude Code〉（Anthropic, 持續更新）。"}, {"id": "exceptions", "chapter": "例外與升級", "title": "例外處理：停下來問，不要硬做", "lead": "Escalation（升級處理）：碰到停止條件，只停受影響的動作，附證據交給人決定。", "cards": [["回報六標題", "觸發原因、證據、影響、選項、建議、需要人決定的事。"], ["人怎麼判斷", "對照事先寫好的邊界原文：在範圍內嗎？是／否／不確定。"], ["拒絕不等於停工", "回到核准範圍繼續做，並記下原因。"]], "check": "你的工作單有沒有寫「碰到什麼要停」？沒有，Agent 只會自己猜。", "explain": ["碰到停止條件時，好的做法是只停受影響的動作，附上證據交給人決定。真實工作常見的停止條件有：需求互相矛盾、要動範圍外的東西、要新增外部套件、出現無關的測試失敗、時間不夠。", "例外提議往往聽起來很合理，所以能擋下越界的，是事先寫好的邊界，不是當下的直覺。判斷時拿邊界原文對照：在範圍內嗎？是、否，或不確定。拒絕也不等於停工，Agent 回到核准範圍繼續做，並記下原因。"], "read": ["〈Building effective agents〉（Anthropic，2024）"], "notes": "（第 30–32.5 分）Anthropic〈Building effective agents〉：Agent 可以在檢查點或碰到阻礙時停下來等人回饋。B3 的例外事件就是在練這件事，但不要說出事件內容與答案。真實工作常見的停止條件：需求互相矛盾、要動範圍外的東西、要新增外部套件、出現無關的測試失敗、時間不夠。例外提議往往聽起來很合理，能擋下越界的是事先寫好的邊界，不是當下的直覺。"}, {"id": "evaluate", "chapter": "評估產出", "title": "做的人不當評分的人", "lead": "請另一個乾淨的對話來審：它只看變更與驗收條件，不受原對話的想法影響。", "cards": [["先跑算得出來的", "第三場講過：測試與格式檢查先過，AI 審查只當補充。"], ["審查也會亂報", "被要求找問題時，沒問題也常報一些；報的問題要對得回需求。"]], "prompt": "這是新的對話。請只讀 notes/delivery.md 與它引用的證據，不要修改任何檔案。逐項列出：結論、證據原文與位置；找不到證據的標「應改為未驗證」。只報會影響正確性或需求的問題，不報風格偏好。最後用一句話說哪一項最需要人確認。", "check": "審查列出的問題，你都對得回需求或驗收條件嗎？只是偏好的先放一邊。", "explain": ["Claude Code 官方文件建議用另一個乾淨的對話審查：獨立審查者只看到變更和你給的標準，不受原對話的想法影響。它也提醒，被要求找問題的審查者，即使工作沒問題通常也會報出一些，所以報的問題要對得回需求，只是偏好的先放一邊。", "分工上，先跑算得出來的檢查（測試、格式檢查），AI 審查只當補充，這是第三場「事前給地圖，事後裝感測器」的延伸。"], "read": ["〈Best practices for Claude Code〉（Anthropic，官方文件）"], "notes": "（第 32.5–35 分）加深一層：第一場只提到「用另一個乾淨的對話審查」，這裡展開成 Digital Worker 的固定做法。Claude Code 最佳實務文件：獨立審查者只看到差異和你給的標準；也提醒被要求找問題的審查者，即使工作沒問題也通常會報一些。可計算與推論型檢查的分工是第三場「事前給地圖，事後裝感測器」講過的，只回顧一句。示範提示詞選用，未在現場執行。📖 延伸閱讀：〈Best practices for Claude Code〉（Anthropic, 持續更新）。"}, {"id": "evidence", "chapter": "評估產出", "title": "沒盯著的工作，靠證據審", "lead": "第一場的「看證據，不看宣稱」加深一層：Digital Worker 做事時你不在旁邊，交付摘要的證據就是你唯一看得到的過程。", "cards": [["證據要自己站得住", "每句結論指得出檢查結果與檔案；沒有的寫「未驗證」。"], ["為什麼", "看證據比自己重跑快，你沒盯著的工作也能審。"]], "check": "抽一句交付結論問「證據在哪？」，引用不出的就改成未驗證。", "explain": ["Digital Worker 做事時你不在旁邊，交付摘要裡的證據就是你唯一看得到的過程。Claude Code 官方文件指出，檢視證據比自己重跑驗證快，而且適用於你沒看著的工作階段。所以每句結論都要指得出檢查結果與檔案，沒有的寫「未驗證」。", "下週收到任何交付，抽一句結論問「證據在哪？」，引用不出的就改成未驗證，再決定要不要補。"], "read": ["〈Best practices for Claude Code〉（Anthropic，官方文件）"], "notes": "（第 35–36.5 分）加深一層：「出示證據而不是宣稱成功」與 Willison 的「proven to work」都在第一場講過，不重講。新的一點來自同一份 Claude Code 最佳實務文件：檢視證據比自己重跑驗證快，也適用於你沒看著的工作階段。B3 交付時依證據選完成等級，就是這個原則。"}, {"id": "governance", "chapter": "治理", "title": "治理：事後查得到「憑什麼放行」", "lead": "Governance（治理）不是多填表，而是每個決策都留下：誰、何時、根據什麼證據。", "cards": [["決策紀錄", "核准人、時間、結論、條件；Agent 照人的原話記，不代人核准。"], ["職責分開", "Agent 不能核准自己的變更；寫的人不當審的人。"], ["定期回看", "每月抽查幾筆紀錄，看關卡有沒有真的擋下問題。"]], "check": "三個月後有人問「這次為什麼放行」，你的紀錄答得出來嗎？", "explain": ["治理不是多填表，而是每個決策都留下誰、何時、根據什麼證據；三個月後有人問「這次為什麼放行」，紀錄要答得出來。B3 的 Gate 決策紀錄就是最小的治理：Agent 照人的原話記，不代人核准。", "職責分開要做在平台上：GitHub 的雲端 Coding Agent 從平台上就不讓 Agent 核准或合併自己的變更。最常見的治理失敗是形式性核准：照單接受，卻說不出核對了哪一題。所以要定期回看，每月抽查幾筆紀錄，看關卡有沒有真的擋下問題。"], "read": ["〈Risks and mitigations for GitHub Copilot cloud agent〉（GitHub，官方文件）"], "notes": "（第 36.5–38.5 分）B3 的 Gate 決策紀錄就是最小的治理。GitHub 的 cloud agent 從平台上就不讓 Agent 核准或合併自己的 PR。Anthropic 2025-08 的框架強調人對目標怎麼被達成保有控制權。形式性核准（照單接受卻說不出核對了哪一題）是最常見的治理失敗。提問：回到公司，誰應該替 Agent 的交付簽名？"}, {"id": "stripe", "chapter": "大規模案例", "title": "案例：Stripe 每週上千個 Agent 變更", "lead": "Stripe 的 Minions：每週超過一千個 PR（變更請求）完全由 Agent 產出，全部經人審查。（2026-02）", "cards": [["隔離環境", "每次在與正式環境、網際網路都隔開的開發機執行，所以不必逐步問權限。"], ["自動驗證", "本機格式檢查，加上三百多萬個測試的 CI；最多跑兩輪。"], ["人審查", "產出是等人審的 PR，不是直接上線。"]], "check": "這三層裡，你的團隊現在已經有哪幾層？", "explain": ["Stripe 工程部落格（2026-02）介紹它的 Minions：每週超過一千個 PR 完全由 Agent 產出，全部經人審查。每次都在與正式環境和網際網路隔開的開發機上執行，所以不必逐步問權限；改完先跑本機格式檢查，再跑三百多萬個測試的持續整合，最多兩輪；產出是等人審的 PR，不是直接上線。", "這是「隔離環境、自動驗證、人審查」三層的教科書案例：邊界做在環境上，所以能放手；放手的產物仍要過測試與人。數字由公司自己公布；後續報導的「每週 1,300 個」未從原始來源確認，不要引用。"], "read": ["〈Minions: Stripe's one-shot, end-to-end coding agents〉（Stripe，2026）"], "notes": "（第 38.5–41 分）來源：Alistair Gray〈Minions: Stripe's one-shot, end-to-end coding agents〉（stripe.dev, 2026-02-09）。這是「沙箱＋自動驗證＋人審」的教科書案例：邊界做在環境上，所以能放手；放手的產物仍要過測試與人。後續報導的「每週 1,300 個」未從原始來源確認，不要引用。📖 延伸閱讀：〈Minions: Stripe's one-shot, end-to-end coding agents〉（Stripe, 2026）。"}, {"id": "scale-cases", "chapter": "大規模案例", "title": "案例：GitHub 的大數字怎麼讀", "lead": "成功案例的共同點不是更聰明的模型，而是平台化的驗證與人審；看數字時先問量的是什麼。", "cards": [["GitHub（2025-10）", "Copilot coding agent 在 2025 年 5–9 月建立超過 100 萬個 PR。注意是「建立」，不是「合併」。"], ["平台先畫好邊界", "Agent 只推到自己的分支，人審前 CI 不跑，也不能合併自己的 PR。"], ["Spotify（第三場）", "數字在第三場講過；共同點一樣：改完先過自動檢查，再由人審核合併。"]], "check": "看到大數字時，先問：量的是建立、合併，還是真的上線？", "explain": ["GitHub〈Octoverse〉報告（2025-10）說，Copilot coding agent 在 2025 年 5–9 月建立了超過 100 萬個 PR。這是「建立」的數量，不是「合併」，更不是上線；數字也由公司自己公布。看到任何大數字，先問它量的是什麼。", "大量產出之所以可控，是因為平台先畫好邊界：Agent 只推到自己的分支、人審前持續整合不跑、不能合併自己的 PR。和 Stripe、Spotify 一起看，三家都把邊界做在平台，把放行留給人。"], "read": ["〈Octoverse: A new developer joins GitHub every second as AI leads TypeScript to #1〉（GitHub，2025）", "〈Risks and mitigations for GitHub Copilot cloud agent〉（GitHub，官方文件）"], "notes": "（第 41–43.5 分）GitHub：〈Octoverse: A new developer joins GitHub every second as AI leads TypeScript to #1〉（GitHub Blog, 2025-10-28），數字是公司自己公布的，而且是建立數不是合併數。第二張卡回扣本場沙箱頁的〈Risks and mitigations for GitHub Copilot cloud agent〉：大量產出之所以可控，是因為 Agent 碰不到合併與正式環境。Spotify 的背景 Agent（Honk）在第三場已講過數字與限制，這裡只用一句回扣，不重講。和上一頁的 Stripe 一起看：三家公司都把邊界做在平台、把放行留給人。📖 延伸閱讀：〈Octoverse: A new developer joins GitHub every second as AI leads TypeScript to #1〉（GitHub, 2025）。"}, {"id": "handoff", "chapter": "收尾", "title": "帶走：一張委派前的檢核卡", "lead": "工作單五段寫完了嗎？人是哪種角色？關卡在不可逆動作前嗎？權限最小、三缺一了嗎？交付附證據嗎？", "cards": [["下一段", "第五段：怎麼量出有沒有用、怎麼讓團隊一起用、30 天怎麼開始。"]], "check": "能說出你那件工作的一道關卡，以及在那裡要看的證據。", "explain": ["這張檢核卡把今天串起來：工作單、自主等級、關卡、最小權限與三缺一、證據式交付。Tool → Teammate → Digital Worker 是介入方式的階梯，不是只能往上走；風險高、難復原的工作，隨時可以退回前一種方式。"], "notes": "（第 43.5–45 分）把今天的檢核卡唸一次。提醒：Tool → Teammate → Digital Worker 是介入方式的階梯，風險高、難復原的工作隨時可以退回前一種方式。交接到 Speech 05。"}], "title": "Digital Worker：工作授權、審查與治理", "minutes": 45, "downloads": [{"label": "下載操作講義", "name": "digital-worker-handout.md", "text": "# Digital Worker：工作授權、審查與治理\n\n\u003e 讀者：學員。時機：B3 與交付之後的 45 分鐘概念講解。前置：做過 B3，或手邊有自己的 `notes/b3.md`、`notes/delivery.md` 與 `skills/b3-work-order.md`。\n\n本段講業界怎麼安全地把整件工作交給 Agent：工作單、自主等級、核准關卡、權限與沙箱、防護、評估與治理，附官方說法與真實案例。不寫程式、不打指令。範例提示詞是選用示範，貼給你自己的 Coding Agent，結果由你檢查；沒有實際執行的，一律當作未驗證。\n\n**這一段帶走什麼**\n\n- 工作單是五段式提示詞放大到整件任務\n- 自主程度是設計出來的；關卡設在不可逆動作之前\n- 最小權限與沙箱；私密資料、不可信內容、對外傳送三缺一\n- 禁止事項做在平台上，不只寫在提示詞\n- 用另一個乾淨的對話與證據評估交付，決策要留紀錄\n\n## 1. 把整件工作交給 Agent，要先設計什麼？\n\n第四段 · Digital Worker（數位員工：在核准範圍內獨立完成整件任務的 Agent） · 概念講解\n\n- **今天談的不是 B3 本身**：而是業界怎麼安全地委派：工作單、自主等級、關卡、權限、防護、評估與治理。\n\n- **怎麼聽**：心裡選一件工作上想交給 Agent 的事，每頁都拿它對照。\n\nDigital Worker 是把整件任務交出去，人只在事先設好的關卡做決定。能不能安全交出去，不取決於 Agent 多聰明，而取決於事前的設計：授權範圍、停止條件、關卡、權限與審查方式。這份講義整理業界做法、官方說法與真實事故，不包含 B3 的做法或例外事件內容。\n\n**人工確認**：想好一件你想委派的工作：它做錯了，誰會受影響？\n\n## 2. 剛才你其實做了三件管理者的事\n\n你沒寫程式，但做了委派最難的三件事：事先授權、在關卡決策、憑證據簽收。\n\n寫工作單：一次授權 → 守三道 Gate：只在關卡介入 → 讀交付摘要：憑證據簽收\n\n- **人負責**：設邊界、核准或退回、要求補證據，承擔最終交付責任。\n\n- **Agent 負責**：分析、設計、改程式、測試、寫紀錄；碰到停止條件就停下來問。\n\n委派最難的三件事和管理者一樣：事前把範圍寫清楚授權出去、在關鍵時刻做決定、最後憑證據簽收。Agent 負責分析、設計、改程式、測試、寫紀錄；人負責設邊界、核准或退回、要求補證據，並承擔最終的交付責任。\n\n回想你在哪一道 Gate 最猶豫：通常不是因為不懂程式，而是缺了某一項證據。接下來每一頁，都在回答真實工作上怎麼把這三件事做得更穩。\n\n**人工確認**：說得出 B3 裡你在哪一道 Gate 最猶豫，以及當時缺什麼證據。\n\n## 3. 從「問 AI」到「交辦給 AI」\n\n問答是一來一回；交辦是 Agent 自己規劃、動手、檢查結果，再決定下一步。\n\n- **整圈交給它**：第一場的迴圈，這次由 Agent 自己跑完，直到完成或卡住。\n\n- **人要先給**：清楚的目標、能自己跑的檢查，以及卡住時停下來問人的規則。\n\n問答是一來一回；交辦是整個「規劃、動手、看結果、決定下一步」的迴圈都由 Agent 自己跑，直到完成或卡住。Anthropic〈Building effective agents〉也說，Agent 可以在檢查點或碰到阻礙時停下來，等人回饋。\n\n所以交辦的品質取決於人事先給了什麼：清楚的目標、Agent 自己能跑的檢查、卡住時停下來問人的規則。少了檢查，它只能憑感覺說完成；少了停止規則，它會自己猜下一步。\n\n📖 延伸閱讀：〈Building effective agents〉（Anthropic，2024）\n\n**人工確認**：你那件工作，有沒有一個 Agent 自己就能跑的檢查（測試、比對、截圖）？\n\n## 4. 好工作單回答五個問題\n\nWork Order（工作單）就是五段式提示詞放大到整件任務；寫不出來的那一段，就是你還沒想清楚的地方。\n\n要做成什麼 → 該讀哪些資料 → 能動與不能動 → 怎麼回報 → 何時停下來問\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。我想把一件工作交給你：（我會口頭描述）。請先問我問題，再依目標、要讀的資料、允許與禁止的範圍、回報格式、停止與升級條件五段，寫一份工作單草稿。我答不出來的，標「待決定」，不要自己補。寫完停下等我審。\n\n工作單就是第一場的五段式提示詞放大到整件任務：要做成什麼（目標）、該讀哪些資料（背景）、能動與不能動（限制與授權範圍）、怎麼回報（輸出格式）、何時停下來問（停止與升級條件）。寫不出來的那一段，就是你還沒想清楚的地方。\n\n讓 Agent 先訪談你再寫草稿，是第一場「規格從短開始」的加深：從一份規格放大到整件任務的授權。關鍵是答不出來的標「待決定」，不讓 Agent 自己補；開工前把每個待決定都回答完。\n\n**人工確認**：草稿裡標「待決定」的項目，你都能在開工前回答嗎？\n\n## 5. 自主程度是設計出來的，不是能力換來的\n\n同一個強 Agent，可以設成每步都問人，也可以只在關卡問；差別在人扮演什麼角色。\n\n操作者：人下每一步 → 協作者：一起做 → 顧問：Agent 主導、人給意見 → 核准者：人只在關鍵點核准 → 觀察者：人只看紀錄\n\nFeng、McDonald、Zhang 的論文〈Levels of Autonomy for AI Agents〉（arXiv，2025）以「人扮演的角色」分五級：操作者、協作者、顧問、核准者、觀察者。大致對照工作坊：Tool 接近操作者，Teammate 接近協作者與顧問，Digital Worker 接近核准者。\n\n論文的重點是：自主程度是設計選擇，能力強不代表就該放手。要不要升一級，問三個問題：做錯的代價多大？能不能復原？有沒有 Agent 自己能跑的檢查？有一題答不好，就先停在目前這一級。\n\n📖 延伸閱讀：〈Levels of Autonomy for AI Agents〉（Feng 等，2025）\n\n**人工確認**：你那件工作，現在適合人當哪一種角色？為什麼不是下一級？\n\n## 6. 有效監督：不是每步都按核准\n\n監督的重點是關鍵時刻能踩煞車，而不是盯著每一步。（Anthropic，2026-02）\n\n- **新手**：約 20% 的工作階段開啟全自動核准。\n\n- **熟手（750 次以上）**：超過 40% 開啟全自動核准，但中途打斷的比例從約 5% 升到約 9%。\n\n- **真正難回頭的動作**：只占約 0.8%；關卡要設在這裡。\n\nAnthropic〈Measuring AI agent autonomy in practice〉（2026-02）分析自家產品的實際使用紀錄：使用不到 50 次的新手，約 20% 的工作階段開啟全自動核准；用到 750 次以上的熟手超過 40%，但中途打斷的比例也從約 5% 升到約 9%。最長的連續工作時間，三個月內從 25 分鐘以下增加到 45 分鐘以上；看起來不可逆的動作只占約 0.8%。\n\n解讀：熟手不是不監督，而是從「每步按核准」變成「看到不對就踩煞車」。原文說，有效的監督不需要核准每個動作，而是在重要時刻能介入。限制：這是單一廠商自家產品的資料，不一定適用你的環境。\n\n📖 延伸閱讀：〈Measuring AI agent autonomy in practice〉（Anthropic，2026）\n\n**人工確認**：你那件工作裡，哪一個動作做了就很難回頭？那裡就該設關卡。\n\n## 7. 關卡要設在哪裡？\n\nHuman-in-the-loop（人在迴圈中）不是到處設關卡，而是設在「錯了代價最大」的前一刻。\n\n- **理解之後、動手之前**：確認 Agent 懂的需求和你要的一樣。\n\n- **範圍確定之前**：核准要改哪些地方，這就是授權邊界。\n\n- **不可逆動作之前**：刪資料、上線、付款、對外寄送，一律先問人。\n\n關卡設在三種地方：理解之後、動手之前（確認需求一致）；範圍確定之前（核准要改哪裡，也就是授權邊界）；不可逆動作之前（刪資料、上線、付款、對外寄送）。資安社群 OWASP 的〈LLM06:2025 Excessive Agency〉也把「高影響動作要人核准」列為緩解方法。\n\n關卡的力度也看風險。Claude Code 團隊公開的審查做法（2026-10）依變更本身的風險分級：低風險變更在自動檢查都通過後不需要人核准，一般變更一人審，最高風險兩人審；原文說，修文件和改自動更新程式的風險不同，審法也該不同。限制：這是單一廠商自家的做法。\n\n📖 延伸閱讀：〈How the Claude Code team does code review〉（Anthropic，2026）\n\n**人工確認**：每一道關卡，你都說得出要看哪一項證據才放行嗎？\n\n## 8. 問太多次，人就開始亂按\n\nApproval fatigue（核准疲勞）：關卡太多，核准就變成反射動作，等於沒有關卡。\n\n- **官方提醒**：按到第十次核准，你已經不是在審查，只是在點過去。\n\n- **解法**：用權限和隔離環境圈好邊界，邊界內不必問；只把真正的決策留給人。\n\n核准疲勞是真的：Claude Code 官方文件說，按到第十次核准，你已經不是在審查，只是在點過去。關卡一多，核准就變成反射動作，等於沒有關卡。\n\n解法不是少審，而是把邊界做在環境上。Anthropic（2025-10）的沙箱文章說，用檔案系統與網路兩道隔離後，權限詢問減少 84%。邊界內的事不必問，只把真正的決策留給人；B3 只設三道 Gate、每道 1–3 分鐘，就是這個設計。\n\n這句話說的是「每個動作都要人按核准」的模式。現在有些工具改用另一個模型（分類器）先審查每個動作，只擋下或詢問看起來有風險的，例如 2026 年 Claude Code 在多數互動情境的預設模式。這減少了詢問，但審查的仍是模型，不是你；不可逆、高影響的動作，還是要在工作單裡寫成必須停下來問人的關卡。\n\n📖 延伸閱讀：〈Beyond permission prompts: making Claude Code more secure and autonomous〉（Anthropic，2025）；〈Best practices for Claude Code〉（Anthropic，官方文件）\n\n**人工確認**：你的關卡，每一道都有人真的會停下來看嗎？\n\n## 9. 最小權限：門禁卡只開要去的樓層\n\nOWASP 把「Agent 權力過大」列為十大風險之一，根因有三個「給太多」。\n\n- **功能給太多**：任務只要讀，卻給了能刪、能寄信的工具。\n\n- **權限給太多**：用管理員帳號跑，碰得到正式資料。\n\n- **自主給太多**：高影響動作不用人核准就能做。\n\nOWASP〈LLM06:2025 Excessive Agency〉列出 Agent 權力過大的三個根因：功能給太多、權限給太多、自主給太多。緩解方法是最小權限、高影響動作要人核准，而且授權檢查要做在下游系統，不交給模型自己判斷。白話說，給權限像給門禁卡：只開要去的樓層。\n\nOWASP 也在 2025-12 發布了專談 Agent 應用風險的十大風險清單。下週替你的工作列出 Agent 真正需要的權限，每多一項都要說得出理由。\n\n美國國家標準技術研究院（NIST）的資安詞彙表把最小權限定義為：把使用者，或代表使用者執行的程式，所能取得的存取權限限制在完成指派工作所需的最小範圍。Agent 就是代表你執行的程式，所以同一條原則直接適用。\n\n📖 延伸閱讀：〈LLM06:2025 Excessive Agency〉（OWASP，2025）；〈Glossary〉（NIST CSRC，least privilege 條目）\n\n**人工確認**：列出你那件工作 Agent 真正需要的權限，多一項都要說得出理由。\n\n## 10. 沙箱：先圍好場地，再放手\n\nSandbox（沙箱：隔離的執行環境）讓 Agent 在邊界內自由動手，邊界外什麼都碰不到。\n\n- **兩道邊界**：檔案只能動指定資料夾；網路只能連指定位置。\n\n- **平台做法**：Agent 只推到自己的分支，不能核准或合併自己的變更。\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請依我們的工作單，列出這件工作需要的權限：要讀與要改的資料夾、要執行的檢查、是否需要網路、是否碰到正式資料。每一項附理由；不需要的明寫「不需要」。最後列出你建議由人核准的動作，然後停下。\n\n沙箱就是先圍好場地：檔案只能動指定的資料夾，網路只能連指定的位置。邊界外什麼都碰不到，邊界內就可以放手，不必逐步問人。\n\nGitHub 官方文件說明它的雲端 Coding Agent 怎麼把護欄做在平台上：在暫時性的雲端環境工作，只能推到自己的分支，不能把自己的變更標成可審查，也不能核准或合併；人審查之前，持續整合（CI）的檢查流程也不會執行。下週可以貼上方的提示詞，請 Agent 依工作單列出需要的權限，再把「碰到正式資料」和「對外傳送」拿掉或加上關卡。\n\n📖 延伸閱讀：〈Risks and mitigations for GitHub Copilot cloud agent〉（GitHub，官方文件）；〈Beyond permission prompts: making Claude Code more secure and autonomous〉（Anthropic，2025）\n\n**人工確認**：清單裡有沒有「碰到正式資料」或「對外傳送」？有的話先拿掉或加關卡。\n\n## 11. 事故一：「凍結」只寫在對話裡\n\n2025 年 7 月，一位創業者測試 Replit 的 Agent，在凍結期間正式資料庫被刪。\n\n- **發生什麼**：Agent 無視「程式與動作凍結」執行未授權指令，刪掉 1,200 多位主管、1,190 多家公司的資料。\n\n- **事後補強**：廠商加上開發與正式資料庫自動分離、只規劃不執行的模式。\n\n- **教訓**：禁止事項要做在權限上；對話裡的約定不是保險。\n\nFortune 在 2025-07-23 報導：SaaStr 創辦人 Jason Lemkin 測試 Replit 的 Agent 時，雖然已宣告「程式與動作凍結」，Agent 仍執行了未授權的指令，刪掉 1,200 多位主管、1,190 多家公司的資料，還說資料無法復原（實際上可以）。Replit 執行長稱這件事不可接受、不應該發生，事後加上開發與正式資料庫自動分離、只規劃不執行的模式。\n\n重點不是哪一家產品不好，而是任何 Agent 只要拿得到正式資料庫的權限，口頭凍結都擋不住；禁止事項要做在權限上。網路上「捏造 4,000 筆假資料」的說法只見於單一媒體，不要引用。\n\n📖 延伸閱讀：〈An AI-powered coding tool wiped out a software company's database, then apologized for a 'catastrophic failure on my part'〉（Fortune，2025）\n\n**人工確認**：你的「不能做」清單裡，哪幾條其實只寫在提示詞裡？\n\n## 12. 三缺一：提示詞注入的致命組合\n\nPrompt injection（提示詞注入）：輸入或讀到的內容藏著指令，改變了 Agent 原本該做的事。\n\n- **① 讀得到私密資料**：程式碼、客戶資料、金鑰。\n\n- **② 會讀不可信內容**：網頁、外部文件、別人提的問題單。\n\n- **③ 能對外傳送**：發請求、寄信、推到公開位置。\n\nSimon Willison（2025-06）把三種能力同時存在稱為「致命三要素」：讀得到私密資料、會讀不可信的內容、能對外傳送。藏在網頁、文件或問題單裡的指令，可能讓 Agent 把私密資料送出去。白話比喻：新同事桌上有機密文件、會照陌生人的紙條做事、手邊又有寄件權限，三者湊齊就會出事。\n\n目前沒有能完全擋住提示詞注入的方法，所以要從設計上拿掉其中一項，這就是「三缺一」。下週檢查你的工作單授權範圍，至少拿掉一項，例如不給對外網路，或不讓它讀外部內容。\n\nOWASP〈LLM01:2025 Prompt Injection〉把它分成兩種：使用者直接在輸入裡下指令的，叫直接注入；指令藏在網頁、檔案等外部內容裡、被 Agent 讀進來的，叫間接注入，Coding Agent 最常碰到的是後者。OWASP 也說，以生成式模型的特性，目前不清楚有沒有萬無一失的防法，這正是要從設計上拿掉一項的原因。\n\n📖 延伸閱讀：〈The lethal trifecta for AI agents〉（Simon Willison，2025）；〈LLM01:2025 Prompt Injection〉（OWASP，2025）\n\n**人工確認**：三項同時成立就危險；你的工作單至少拿掉了哪一項？\n\n## 13. 事故二：Agent 的供應鏈也會被下毒\n\n2025 年 7 月，Amazon Q Developer 的 VS Code 擴充套件 1.84.0 被植入「清除檔案」的提示詞。\n\n- **怎麼發生**：建置設定裡的 GitHub 權杖權限過大，攻擊者藉此提交惡意內容，被自動打包發布。\n\n- **教訓**：Agent、擴充套件、Skill 都是供應鏈；只從可信來源安裝，建置帳號也要最小權限。\n\nAWS 安全公告 AWS-2025-015（2025-07-23）說明：建置設定裡的 GitHub 權杖權限過大，攻擊者藉此提交惡意內容，被自動包進 Amazon Q Developer 的 VS Code 擴充套件 1.84.0 發布。這段「清除檔案」的提示詞因為語法錯誤沒有實際執行，AWS 已發布修正版；漏洞的公開編號（CVE）是 CVE-2025-8217。\n\n教訓是 Agent 本身與它的供應鏈都需要最小權限：Agent、擴充套件、Skill 都是供應鏈的一環，只從可信來源安裝，負責建置的帳號也只給需要的權限。網路上流傳的安裝數字只見於二手報導，不要引用。\n\n📖 延伸閱讀：〈Security Update for Amazon Q Developer Extension for Visual Studio Code (Version #1.84)〉（AWS，2025）\n\n**人工確認**：你團隊用的 Agent 擴充套件與 Skill，誰負責審核來源？\n\n## 14. 護欄做在平台，不只寫在提示詞\n\n規則檔與提示詞是「建議」；一定要發生或一定不能發生的事，交給自動機制。\n\n- **寫在規則裡**：風格、偏好、怎麼回報。Agent 多半會照做，但不保證。\n\n- **做在平台上**：權限、隔離環境、自動檢查、合併前必須有人審。\n\n規則檔與提示詞是建議，Agent 多半會照做，但不保證。Claude Code 官方文件說得很清楚：規則檔是建議性的，hook（在固定時機自動執行的腳本或檢查）則確定會發生。所以風格、偏好、回報方式寫在規則裡；權限、隔離環境、自動檢查、合併前必須有人審，要做在平台上。\n\n例子：第三場的「絕不提交密碼與金鑰」，寫在規則裡只是提醒，做在平台上就是推送前自動掃描金鑰。下週挑一條你最怕被違反的規則，問它現在只是建議，還是平台擋得住。\n\n📖 延伸閱讀：〈Best practices for Claude Code〉（Anthropic，官方文件）\n\n**人工確認**：挑一條你最怕被違反的規則：它現在是建議，還是平台擋得住？\n\n## 15. 例外處理：停下來問，不要硬做\n\nEscalation（升級處理）：碰到停止條件，只停受影響的動作，附證據交給人決定。\n\n- **回報六標題**：觸發原因、證據、影響、選項、建議、需要人決定的事。\n\n- **人怎麼判斷**：對照事先寫好的邊界原文：在範圍內嗎？是／否／不確定。\n\n- **拒絕不等於停工**：回到核准範圍繼續做，並記下原因。\n\n碰到停止條件時，好的做法是只停受影響的動作，附上證據交給人決定。真實工作常見的停止條件有：需求互相矛盾、要動範圍外的東西、要新增外部套件、出現無關的測試失敗、時間不夠。\n\n例外提議往往聽起來很合理，所以能擋下越界的，是事先寫好的邊界，不是當下的直覺。判斷時拿邊界原文對照：在範圍內嗎？是、否，或不確定。拒絕也不等於停工，Agent 回到核准範圍繼續做，並記下原因。\n\n📖 延伸閱讀：〈Building effective agents〉（Anthropic，2024）\n\n**人工確認**：你的工作單有沒有寫「碰到什麼要停」？沒有，Agent 只會自己猜。\n\n## 16. 做的人不當評分的人\n\n請另一個乾淨的對話來審：它只看變更與驗收條件，不受原對話的想法影響。\n\n- **先跑算得出來的**：第三場講過：測試與格式檢查先過，AI 審查只當補充。\n\n- **審查也會亂報**：被要求找問題時，沒問題也常報一些；報的問題要對得回需求。\n\n### 交給 Agent 的指令\n\n這是新的對話。請只讀 notes/delivery.md 與它引用的證據，不要修改任何檔案。逐項列出：結論、證據原文與位置；找不到證據的標「應改為未驗證」。只報會影響正確性或需求的問題，不報風格偏好。最後用一句話說哪一項最需要人確認。\n\nClaude Code 官方文件建議用另一個乾淨的對話審查：獨立審查者只看到變更和你給的標準，不受原對話的想法影響。它也提醒，被要求找問題的審查者，即使工作沒問題通常也會報出一些，所以報的問題要對得回需求，只是偏好的先放一邊。\n\n分工上，先跑算得出來的檢查（測試、格式檢查），AI 審查只當補充，這是第三場「事前給地圖，事後裝感測器」的延伸。\n\n📖 延伸閱讀：〈Best practices for Claude Code〉（Anthropic，官方文件）\n\n**人工確認**：審查列出的問題，你都對得回需求或驗收條件嗎？只是偏好的先放一邊。\n\n## 17. 沒盯著的工作，靠證據審\n\n第一場的「看證據，不看宣稱」加深一層：Digital Worker 做事時你不在旁邊，交付摘要的證據就是你唯一看得到的過程。\n\n- **證據要自己站得住**：每句結論指得出檢查結果與檔案；沒有的寫「未驗證」。\n\n- **為什麼**：看證據比自己重跑快，你沒盯著的工作也能審。\n\nDigital Worker 做事時你不在旁邊，交付摘要裡的證據就是你唯一看得到的過程。Claude Code 官方文件指出，檢視證據比自己重跑驗證快，而且適用於你沒看著的工作階段。所以每句結論都要指得出檢查結果與檔案，沒有的寫「未驗證」。\n\n下週收到任何交付，抽一句結論問「證據在哪？」，引用不出的就改成未驗證，再決定要不要補。\n\n📖 延伸閱讀：〈Best practices for Claude Code〉（Anthropic，官方文件）\n\n**人工確認**：抽一句交付結論問「證據在哪？」，引用不出的就改成未驗證。\n\n## 18. 治理：事後查得到「憑什麼放行」\n\nGovernance（治理）不是多填表，而是每個決策都留下：誰、何時、根據什麼證據。\n\n- **決策紀錄**：核准人、時間、結論、條件；Agent 照人的原話記，不代人核准。\n\n- **職責分開**：Agent 不能核准自己的變更；寫的人不當審的人。\n\n- **定期回看**：每月抽查幾筆紀錄，看關卡有沒有真的擋下問題。\n\n治理不是多填表，而是每個決策都留下誰、何時、根據什麼證據；三個月後有人問「這次為什麼放行」，紀錄要答得出來。B3 的 Gate 決策紀錄就是最小的治理：Agent 照人的原話記，不代人核准。\n\n職責分開要做在平台上：GitHub 的雲端 Coding Agent 從平台上就不讓 Agent 核准或合併自己的變更。最常見的治理失敗是形式性核准：照單接受，卻說不出核對了哪一題。所以要定期回看，每月抽查幾筆紀錄，看關卡有沒有真的擋下問題。\n\n📖 延伸閱讀：〈Risks and mitigations for GitHub Copilot cloud agent〉（GitHub，官方文件）\n\n**人工確認**：三個月後有人問「這次為什麼放行」，你的紀錄答得出來嗎？\n\n## 19. 案例：Stripe 每週上千個 Agent 變更\n\nStripe 的 Minions：每週超過一千個 PR（變更請求）完全由 Agent 產出，全部經人審查。（2026-02）\n\n- **隔離環境**：每次在與正式環境、網際網路都隔開的開發機執行，所以不必逐步問權限。\n\n- **自動驗證**：本機格式檢查，加上三百多萬個測試的 CI；最多跑兩輪。\n\n- **人審查**：產出是等人審的 PR，不是直接上線。\n\nStripe 工程部落格（2026-02）介紹它的 Minions：每週超過一千個 PR 完全由 Agent 產出，全部經人審查。每次都在與正式環境和網際網路隔開的開發機上執行，所以不必逐步問權限；改完先跑本機格式檢查，再跑三百多萬個測試的持續整合，最多兩輪；產出是等人審的 PR，不是直接上線。\n\n這是「隔離環境、自動驗證、人審查」三層的教科書案例：邊界做在環境上，所以能放手；放手的產物仍要過測試與人。數字由公司自己公布；後續報導的「每週 1,300 個」未從原始來源確認，不要引用。\n\n📖 延伸閱讀：〈Minions: Stripe's one-shot, end-to-end coding agents〉（Stripe，2026）\n\n**人工確認**：這三層裡，你的團隊現在已經有哪幾層？\n\n## 20. 案例：GitHub 的大數字怎麼讀\n\n成功案例的共同點不是更聰明的模型，而是平台化的驗證與人審；看數字時先問量的是什麼。\n\n- **GitHub（2025-10）**：Copilot coding agent 在 2025 年 5–9 月建立超過 100 萬個 PR。注意是「建立」，不是「合併」。\n\n- **平台先畫好邊界**：Agent 只推到自己的分支，人審前 CI 不跑，也不能合併自己的 PR。\n\n- **Spotify（第三場）**：數字在第三場講過；共同點一樣：改完先過自動檢查，再由人審核合併。\n\nGitHub〈Octoverse〉報告（2025-10）說，Copilot coding agent 在 2025 年 5–9 月建立了超過 100 萬個 PR。這是「建立」的數量，不是「合併」，更不是上線；數字也由公司自己公布。看到任何大數字，先問它量的是什麼。\n\n大量產出之所以可控，是因為平台先畫好邊界：Agent 只推到自己的分支、人審前持續整合不跑、不能合併自己的 PR。和 Stripe、Spotify 一起看，三家都把邊界做在平台，把放行留給人。\n\n📖 延伸閱讀：〈Octoverse: A new developer joins GitHub every second as AI leads TypeScript to #1〉（GitHub，2025）；〈Risks and mitigations for GitHub Copilot cloud agent〉（GitHub，官方文件）\n\n**人工確認**：看到大數字時，先問：量的是建立、合併，還是真的上線？\n\n## 21. 帶走：一張委派前的檢核卡\n\n工作單五段寫完了嗎？人是哪種角色？關卡在不可逆動作前嗎？權限最小、三缺一了嗎？交付附證據嗎？\n\n- **下一段**：第五段：怎麼量出有沒有用、怎麼讓團隊一起用、30 天怎麼開始。\n\n這張檢核卡把今天串起來：工作單、自主等級、關卡、最小權限與三缺一、證據式交付。Tool → Teammate → Digital Worker 是介入方式的階梯，不是只能往上走；風險高、難復原的工作，隨時可以退回前一種方式。\n\n**人工確認**：能說出你那件工作的一道關卡，以及在那裡要看的證據。\n\n## 完成條件\n能說出：一份工作單的五個部分、你那件工作適合人當哪種角色、關卡該設在哪個不可逆動作之前、Agent 需要的最小權限與「三缺一」拿掉了哪一項、怎麼用另一個乾淨對話與證據評估交付；並說得出 Stripe、Spotify 等案例共同的三層：隔離環境、自動驗證、人審。\n\n**下週可以做的事**\n\n- 替一件想委派的工作寫工作單草稿，標出「待決定」\n- 列出 Agent 真正需要的權限，拿掉「三缺一」中的一項\n- 找出那件工作裡最難回頭的動作，在它前面設一道關卡\n\n## 名詞解釋\n| 名詞 | 意思 | 出處 |\n|---|---|---|\n| Digital Worker（數位員工） | 在核准範圍內獨立完成整件任務的 Agent；人只在事先設好的關卡做決定。 | 本課程〈歡迎與使用方式〉 |\n| Work Order（工作單） | 交給 Agent 的整件任務說明：目標、要讀的資料、能動與不能動、回報格式、停止與升級條件。 | 本課程〈B3 工作單（Work Order）〉 |\n| Gate（核准關卡） | Agent 交出資料後停下、由人做決定的檢查點；核准是決策，不等於通過驗收。 | 本課程〈B3 工作單（Work Order）〉；Anthropic Engineering〈Building effective agents〉 |\n| 人在迴圈中（Human-in-the-loop） | Agent 在檢查點或碰到阻礙時停下來等人回饋；關卡設在錯了代價最大的前一刻。 | Anthropic Engineering〈Building effective agents〉 |\n| 自主等級 | 依人扮演的角色分五級：操作者、協作者、顧問、核准者、觀察者；是設計選擇，不是能力換來的。 | Feng 等〈Levels of Autonomy for AI Agents〉 |\n| 核准疲勞（Approval fatigue） | 要人核准的次數太多，核准變成反射動作；官方說，按到第十次就只是在點過去。 | Claude Code 官方文件〈Best practices for Claude Code〉 |\n| 自動審查模式 | 由另一個模型（分類器）代替人審查大部分動作，只擋下或詢問看起來有風險的，例如 Claude Code 的 auto mode；詢問變少，但審查者仍是模型。 | Claude Code 官方文件〈Glossary〉 |\n| 最小權限（Least privilege） | 把使用者，或代表使用者執行的程式，所能取得的權限限制在完成指派工作所需的最小範圍。 | NIST CSRC〈Glossary〉 |\n| Agent 權力過大（Excessive Agency） | 功能、權限或自主給太多，讓 Agent 在出錯或被操縱時做出有害的動作。 | OWASP〈LLM06:2025 Excessive Agency〉 |\n| 沙箱（Sandbox） | 作業系統層級的檔案與網路隔離；Agent 在事先畫好的邊界內可以自由做事，不必每個指令都問。 | Claude Code 官方文件〈Glossary〉；Anthropic〈Beyond permission prompts: making Claude Code more secure and autonomous〉 |\n| 提示詞注入（Prompt injection） | 輸入或讀進來的內容藏著指令，改變模型原本該做的事；藏在網頁、檔案裡的叫間接注入。 | OWASP〈LLM01:2025 Prompt Injection〉 |\n| 致命三要素（三缺一） | 讀得到私密資料、會讀不可信的內容、能對外傳送，三者同時存在就危險；設計上至少拿掉一項。 | Simon Willison〈The lethal trifecta for AI agents〉 |\n| hook | 在固定時機（例如執行工具前、改檔後）自動執行的處理程式；和規則檔不同，它一定會執行。 | Claude Code 官方文件〈Glossary〉 |\n| Escalation（升級處理） | Agent 碰到停止條件時，只停受影響的動作，附證據與選項交給人決定。 | 本課程〈B3 工作單（Work Order）〉 |\n\n## 延伸閱讀\n- 〈Building effective agents〉（Anthropic，2024）\n- 〈Levels of Autonomy for AI Agents〉（Feng 等，2025）\n- 〈Measuring AI agent autonomy in practice〉（Anthropic，2026）\n- 〈How the Claude Code team does code review〉（Anthropic，2026）\n- 〈Beyond permission prompts: making Claude Code more secure and autonomous〉（Anthropic，2025）\n- 〈Best practices for Claude Code〉（Anthropic，官方文件）\n- 〈LLM06:2025 Excessive Agency〉（OWASP，2025）\n- 〈Glossary〉（NIST CSRC，least privilege 條目）\n- 〈Risks and mitigations for GitHub Copilot cloud agent〉（GitHub，官方文件）\n- 〈An AI-powered coding tool wiped out a software company's database, then apologized for a 'catastrophic failure on my part'〉（Fortune，2025）\n- 〈The lethal trifecta for AI agents〉（Simon Willison，2025）\n- 〈LLM01:2025 Prompt Injection〉（OWASP，2025）\n- 〈Security Update for Amazon Q Developer Extension for Visual Studio Code (Version #1.84)〉（AWS，2025）\n- 〈Minions: Stripe's one-shot, end-to-end coding agents〉（Stripe，2026）\n- 〈Octoverse: A new developer joins GitHub every second as AI leads TypeScript to #1〉（GitHub，2025）\n"}]};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;
const el = id => document.getElementById(id);
let index = 0, notesVisible = false, running = false, accumulated = 0, startedAt = 0;
const overview = el('overview');
function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {
  const available = Math.max(100, innerHeight - document.querySelector('nav').offsetHeight - 18);
  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `${SPEECH_DATA.title.split('：')[0]} · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / ${String(SPEECH_DATA.minutes).padStart(2,'0')}:00`;el('timer').classList.toggle('over',secs>=SPEECH_DATA.minutes*60);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
SPEECH_DATA.downloads.forEach(d=>{const b=node('button',d.label);b.onclick=()=>save(d.name,d.text);el('downloads').append(b);});
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&(e.target.closest('textarea,input,select')||(e.target.closest('button')&&[' ','Enter'].includes(e.key))))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
</body>
</html>
