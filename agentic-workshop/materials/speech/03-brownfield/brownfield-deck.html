<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "開場", "title": "接手既有系統：Agent 當隊友", "lead": "第三階段 · Brownfield（已有程式碼的既有專案）／Teammate（隊友：與 Agent，也就是 AI 助手，一起工作） · 概念與技巧", "cards": [["今天回看", "個人分析、共同脈絡、B1（第一個變更任務：修 Bug）、B2（第二個：改規則）：四段各用了什麼技巧。"], ["今天帶走", "接手陌生系統、讓團隊共用規則、修 Bug 與改規則時，人該在哪裡判斷。"]], "check": "能說出剛才四段裡，自己核准過的一份計畫或選過的一個方案。", "notes": "0–2 分鐘。這是講解，不是重做任務：學員不讀程式、不打指令。投影片上的指令是示範用，講者可視時間貼給自己的 Agent，結果沒跑就說未驗證。本場不揭露 B1 原因與 B2 計算結果，未來梯次也會看到這份簡報。先問一句：剛才哪一段最不放心交給 Agent？記下答案，最後一頁回來對照。Brownfield 的定義出處：本課程〈詞彙表〉。"}, {"id": "teammate", "chapter": "開場", "title": "Tool → Teammate：人改成核准計畫", "lead": "差別不在 Agent 多聰明，而在人怎麼介入：Tool 逐步下指令，Teammate 先一起分析，人核准計畫後才動手。", "flow": ["Tool：人逐步下指令", "Teammate：一起分析，人核准計畫", "Digital Worker（數位員工）：下一場"], "cards": [["Agent 多做的", "讀檔、跑測試、比較做法、寫紀錄，附來源回報。"], ["人保留的", "選哪份計畫、範圍多大、證據夠不夠、接不接受。"]], "check": "每段開始動手前，都有一個由人說「核准」的時間點。", "notes": "2–4 分鐘。定義對照課程詞彙表：Tool 由人逐步下指令；Teammate 由人與 Agent 共同分析、比較，人核准計畫；Digital Worker 留到下一場。強調「核准計畫」不是放手：計畫要小、要附證據、要寫出不改哪些地方。📖 定義出處：本課程〈歡迎與使用方式〉；📖 延伸閱讀：Anthropic Engineering〈Building effective agents〉（談 Agent 的運作方式，並未定義這三階段）。"}, {"id": "map-first", "chapter": "01 讀懂既有系統", "title": "先要一張地圖，不先問 Bug 在哪", "lead": "接手陌生專案，第一個問題是「分幾塊、規則在哪、測試現況」，不是「哪裡壞了」。", "cards": [["系統地圖", "各部分負責什麼業務、依賴誰；不是一串檔名。"], ["規則在哪", "商業規則寫在哪份文件、對應到哪一部分。"], ["測試現況", "通過、失敗、跳過各幾個；先不推論原因。"]], "prompt": "先不要修改程式。請帶我讀這個專案：先列資料夾結構，只挑必要的重點檔讀。用白話說明系統分哪幾部分、規則寫在哪、測試現況，每個結論標事實、假設或缺口，最後列出你讀了哪些檔，然後停下。", "check": "地圖說得出「誰負責什麼、依賴誰」；Agent 列得出實際讀了哪些檔。", "notes": "4–7 分鐘。對照 Runbook「個人 Agent 分析」檢查點 1。先問「Bug 在哪」會讓 Agent 直接猜原因，反而跳過理解；先要地圖，後面每個結論才有位置可以放。課程用固定五個標題寫 notes/analysis.md（系統地圖／規則在哪／測試現況／文件與程式不一致處／還不確定的事），這也是結構化輸出（用提示詞要求固定標題）：小組之後才比得起來。"}, {"id": "model-effort", "chapter": "01 讀懂既有系統", "title": "技巧：模型選擇與推論強度", "lead": "分析陌生程式要想深一點：選較強的模型、調高推論強度。機械性工作用快速、便宜的模型就夠。", "cards": [["模型選擇", "跑測試、整理格式用快速模型；分析、比較取捨用較強模型。"], ["推論強度（Reasoning Effort）", "同一個模型「想多深」；越深越慢，也越耗 Token（詞元）。"], ["沒有推論強度設定時", "有設定就直接調整；沒有，才在提示詞寫「先仔細想過再回答」替代。"]], "check": "說得出剛才分析時用的是哪一種設定，以及為什麼。", "notes": "7–9 分鐘。這是本課程第一次正式介紹這個技巧；Greenfield 只在提示詞裡寫「先仔細想過再回答」。工具有模型選單或推論強度設定是加分，不是必要；沒有推論強度設定時，才在提示詞加上「先仔細想過再回答」作為替代；不要點名特定產品。B2 會再加深：比較時調高、實作時調回。📖 延伸閱讀：Anthropic〈Choosing the right model〉、〈Effort〉；OpenAI〈Reasoning models〉。"}, {"id": "named-files", "chapter": "01 讀懂既有系統", "title": "Token 節費（加深一層）：指名檔案，只要摘要", "lead": "Speech 02 學過開新對話與指名要讀的檔；陌生專案還不知道該指名哪些，就先列目錄、挑重點檔。", "cards": [["先列目錄再挑", "先讀 README、架構文件與決策紀錄，回報讀了哪些；其他需要時才讀。"], ["只要摘要", "測試結果只報通過／失敗／跳過數，不貼完整輸出。"], ["交接用摘要", "給別人的 Agent 用 5 行摘要，是 Speech 02 交接檔的短版。"]], "check": "Agent 回報裡有「讀了哪些檔」；沒有出現整段原始輸出。", "notes": "9–11 分鐘。讀整個專案最耗 Token，也最容易讀到後面忘了前面，結論反而更模糊。這一頁深化 02 Time Skip 的節費技巧，不重講開新對話與指名要讀的檔。可以問學員：剛才 Agent 讀了幾個檔？有沒有人看到它一次讀很多？📖 延伸閱讀：Anthropic Engineering〈Effective context engineering for AI agents〉、Anthropic〈Context windows〉。"}, {"id": "fact-label", "chapter": "01 讀懂既有系統", "title": "文件是線索，不是結論", "lead": "Speech 02 的三方對照（文件、測試、程式），這裡落到每個結論：標出它是哪一種。", "cards": [["事實", "附文件位置、測試名稱或實際執行過的指令。"], ["假設", "說明依據，以及還缺什麼證據。"], ["缺口", "查不清楚，需要問人。"]], "prompt": "我要追問第 2 條事實：請引用規則或文件原文、測試名稱，並重新執行相關測試貼出結果摘要。拿不出證據就改標為假設，告訴我改了什麼，然後停下。", "check": "挑一個「事實」追問證據；說「可能」「應該」的地方已改標為假設。", "notes": "11–14 分鐘。這是分析段最重要的人工動作：不是讀 Agent 的結論，而是挑一條追問。Runbook 讓 Agent 先列編號，學員只回「追問第 N 個」。示範時可問：有沒有哪條一追問就改標假設？那就是本來會被當成事實帶進修改計畫的風險。不要在這頁講出不一致的具體內容。"}, {"id": "compare", "chapter": "02 共同脈絡", "title": "幾個 Agent 讀同一份系統，說法不同怎麼辦", "lead": "每人的 Agent 先濃縮成 5 行摘要，小組才比得起來；比的是證據，不是誰的語氣最肯定。", "flow": ["各自 5 行摘要", "說法一樣且附來源：共同事實", "說法不同或沒證據：分歧", "寫下用什麼驗證分歧"], "cards": [["主要 Agent", "小組選定、代表全組執行工作的那一個 Agent。"], ["人員核准者", "小組指定說「核准」的人；之後的紀錄都記他。"]], "check": "說得出一條附來源的共同事實、一個分歧，以及要重跑哪個測試才分得出對錯。", "notes": "14–16 分鐘。5 行摘要同時是結構化輸出（用提示詞要求固定五項）與 Token 節費（摘要不貼全文）。選一個主要 Agent，是避免大家各自叫 Agent 改同一份程式。分歧不需要當場解決，寫下驗證方式就好。📖 定義出處：本課程〈Shared Context：把共識寫成檔案給 Agent〉。"}, {"id": "shared-file", "chapter": "02 共同脈絡", "title": "口頭講過的，Agent 下次就忘了", "lead": "共同脈絡（Shared Context）：小組的共同事實、分歧與待決事項，由主要 Agent 寫成檔案。", "code": "notes/shared-context.md\n  ## 共同事實      多人一致，附來源\n  ## 仍有分歧      附驗證方式\n  ## 已知限制      只記限制，不預先核准修改\n  ## 待決事項      要等任務揭露才能決定\n  ## 分工          主要 Agent 與核准者", "check": "主要 Agent 複述時，沒有把分歧或假設說成事實，也沒有自己加修改計畫。", "notes": "16–18 分鐘。關鍵是「寫成檔案」：換人、開新對話，Agent 都能先讀它接上。這段刻意不提修改計畫，因為任務還沒揭露；先核准計畫等於替還不知道的問題預先放行。複述是人的檢查點：聽 3 句複述，比讀整份檔快。"}, {"id": "team-rules", "chapter": "02 共同脈絡", "title": "技巧：Skill，把規則寫成開工先讀的檔", "lead": "Skill（技能檔）：本課程用簡化版，就是 skills/ 裡一份 Markdown 說明檔；工具內建的 Skill 另有固定格式。", "code": "skills/team-rules.md\n  ## 開工先讀    notes/shared-context.md\n  ## 工作規則    7 條，含過時期待值須經核准才更新\n  ## 回報格式    驗收對照表、改了哪些檔與原因", "cards": [["之後每段的第一句", "「請先讀 skills/team-rules.md」，不再整段重貼規則。"]], "check": "說得出 team-rules.md 的三節；之後的提示詞都以它開頭。", "notes": "18–21 分鐘。Skill 第一次出現。重點：規則從口頭、到每次重貼、到一個檔案，這是 Token 節費也是一致性。工具內建的 Skill（官方 Agent Skills）是含 SKILL.md 的資料夾，檔頭要有 name 與 description，另有固定格式，今天不需要；一份放在專案裡的 Markdown 就夠。之後只要說「請先讀它並照做」，不用重貼。請學員想一條自己團隊「每次都要重講」的規則。📖 延伸閱讀：Anthropic〈Agent Skills〉；OpenAI Codex〈Custom instructions with AGENTS.md〉；GitHub〈Adding repository custom instructions for GitHub Copilot〉。"}, {"id": "test-first", "chapter": "03 B1 修 Bug", "title": "用失敗測試找 Bug", "lead": "「修前失敗、修後通過」是你不讀程式也能信任的證據。先重現，才算找到 Bug。", "flow": ["重現：一個現在會失敗的測試", "定位：分開事實與推論", "最小修正：只做核准的步驟", "驗證：同一批測試變成通過"], "check": "修好的證據是同一批測試的前後對照，而不是 Agent 說「完成了」。", "notes": "21–24 分鐘。不要講 B1 的原因或修了哪裡；講方法。跳過重現、直接叫 Agent「修好學生票」，修完沒有辦法知道真的修好、也沒改壞成人票。幾個測試同時失敗不代表有幾個 Bug，先問它們是不是同一個原因。📖 延伸閱讀：pytest 官方文件〈Get Started〉；Claude Code 官方文件〈Best practices for Claude Code〉。"}, {"id": "approve-plan", "chapter": "03 B1 修 Bug", "title": "人核准的是一份小計畫", "lead": "Teammate 的介入點：Agent 先交原因與計畫，人看證據夠不夠、範圍夠不夠小，再說核准或退回。", "cards": [["原因分兩欄", "有規則或測試證據的事實，和還只是推論的部分。"], ["計畫最多 3 步", "每步標規則編號（Rule ID）或驗收條件（AC，Acceptance Criteria）。"], ["寫出不改什麼", "其他票種、既有優惠與順序都不動。"]], "prompt": "先不要核准，也不要修改程式。請補證據：你的原因有沒有規則原文或測試結果支持？說不出依據的標成「推論」，計畫裡超出任務卡範圍的步驟刪掉，再告訴我改了哪裡，然後停下等我。", "check": "證據夠、範圍小才核准；證據不足或計畫太大就退回補證據。", "notes": "24–26 分鐘。AC（Acceptance Criteria，驗收條件）、Rule ID（規則編號）在前面階段已介紹，這裡只提醒。退回不是失敗，是 Teammate 正常的工作方式。可問：核准前，有沒有哪句推論差點被當成事實？"}, {"id": "change-review", "chapter": "03 B1 修 Bug", "title": "改完先停：變更審查三題", "lead": "Greenfield 的四題審查，B1 留前三題；只看答案與附上的指令，三題都是「是」才放行。", "cards": [["1. 範圍", "改的檔案都在核准計畫裡。"], ["2. 測試沒變少", "總數沒少，也沒新增跳過（skip）或預期失敗（xfail）。"], ["3. 期待值沒被動", "沒刪測試、沒改既有期待值，用變更內容（Diff）核對。"]], "check": "任一題是「否」或「不確定」，就請 Agent 解釋並還原超出範圍的修改，不放行。", "notes": "26–29 分鐘。最危險的「修好」是把正確的期待值改成符合錯誤輸出，測試全綠但 Bug 還在；第 3 題就是防這件事。每題要附實際執行的指令與結果摘要，沒跑的標未驗證。📖 延伸閱讀：Google Engineering Practices〈Google's Code Review Guidelines〉；Git 官方文件〈git-diff〉；pytest 官方文件〈How to use skip and xfail to deal with tests that cannot succeed〉。"}, {"id": "fix-skill", "chapter": "03 B1 修 Bug", "title": "Skill（加深一層）：存的是一套做法", "lead": "重複的程序就該長成 Skill。team-rules.md 存規則；fix-bug-with-test.md 存修 Bug 的做法。", "code": "skills/\n  team-rules.md          規則：每段開工先讀\n  fix-bug-with-test.md   做法：重現 → 定位 → 最小修正 → 驗證\n                         每步要交的證據、禁止事項、回報格式", "check": "fix-bug-with-test.md 是通用說明，沒有寫進這次 Bug 的原因或修改內容。", "notes": "29–31 分鐘。這裡的 Skill 同樣是簡化版。Skill 不是一開始就設計好的，是做過一次、確認可行後才整理。寫進這次原因會讓它變成一次性的筆記，下次反而誤導。下次遇到 Bug，只要說「請先讀 skills/fix-bug-with-test.md 並照做」。📖 延伸閱讀：Anthropic〈Agent Skills〉。"}, {"id": "options", "chapter": "04 B2 改規則", "title": "改規則時，不接受第一個答案", "lead": "修 Bug 有明確的對錯；改規則常有不只一種做法。請 Agent 提 2–3 個可行方案，人來選。", "cards": [["真的可行", "不是一個方案配兩個陪襯。"], ["對照禁止事項", "違反任務卡禁止事項的方案直接標出來。"], ["假設附依據", "沒有依據的標「未確認」，再決定要不要追問。"]], "check": "選方案前，至少問過一次：哪個「未確認」的假設錯了會改變選擇？", "notes": "31–33 分鐘。只要一個做法就開工，風險通常在實作一半才冒出來；先比較，風險在選之前就攤開。不要在這頁講任何方案的具體內容或優惠計算結果。可問：你工作上哪一類決定值得先要 2–3 個方案？"}, {"id": "comparison-table", "chapter": "04 B2 改規則", "title": "結構化輸出（加深一層）：固定欄位的比較表", "lead": "Greenfield 用固定欄位寫驗收表；這裡用同樣方法並排比較方案，幾個方案才能逐欄對照。", "code": "| 方案 | 改動範圍 | 風險 | 測試影響 | 建議 |\n|------|----------|------|----------|------|\n| A    | 一定要改／可能影響／不應改，附證據 | … | … | … |\n| B    | …        | …    | …        | …    |", "check": "每個方案都填滿同一組欄位；改動範圍附檔案或測試名稱當證據。", "notes": "33–36 分鐘。改動範圍那欄就是影響分析（Impact Analysis）：一定要改、可能影響、不應改。欄位固定，人才能一欄一欄看，而不是讀三段各說各話的散文。欄位是用提示詞要求的固定格式（本課程的結構化輸出），不是 API 的強制輸出功能。表格內容只是格式示意，不代表任何組的實際方案。📖 延伸閱讀：Anthropic〈Structured outputs〉；OpenAI〈Structured model outputs〉；ISTQB〈Glossary〉（impact analysis）。"}, {"id": "effort-switch", "chapter": "04 B2 改規則", "title": "推論強度（加深一層）：比較調高，實作調回", "lead": "同一個任務的不同階段，需要的「想多深」不一樣。用對地方，既準又省。", "flow": ["比較方案、找風險：調高", "人選方案並核准", "小步實作：調回低或預設"], "cards": [["為什麼實作調回", "核准後是照計畫的小步修改，想太深只是更慢、更耗 Token。"]], "check": "比較方案時有調高（沒有這項設定才改用提示詞），核准後有調回。", "notes": "36–38 分鐘。這是分析段那張卡的加深：不只是「分析時調高」，而是同一段工作裡切換。工具有推論強度設定就直接調整；沒有這項設定時，才在比較時加上「先仔細想過再回答」作為替代，實作時不寫。📖 延伸閱讀：Anthropic〈Effort〉、〈Thinking〉；OpenAI〈Reasoning models〉。"}, {"id": "outdated-expectation", "chapter": "04 B2 改規則", "title": "規則改了，舊測試怎麼辦", "lead": "有些既有測試只在舊規則下才對。Agent 要先停下列出來，人核准後才更新；其他期待值一律不改。", "cards": [["三點都成立才核准", "舊期待只在舊規則下才對；新規則要求不同結果；附了 Rule ID。"], ["變更審查多兩題", "政策不放在 API 路由層，訂票與改票共用同一套；挑一位多優惠旅客實際驗證。"], ["核對到每位旅客", "看每人採用的優惠類型與折扣率，不只核對總額。"]], "check": "改過的既有期待值，每一處都附 Rule ID 和小組的核准紀錄。", "notes": "38–41 分鐘。這頁接回 team-rules.md 第 4 條：過時期待值須列測試名稱與 Rule ID，經人核准才更新。說不出 Rule ID 的，請 Agent 改程式，不要改測試。不要在這頁說出是哪個測試、舊值或新值。ISTQB 的迴歸測試（regression testing）只管「改動後既有功能不能壞」；「附 Rule ID 並經人核准才更新」是本課程規則。📖 定義出處：本課程〈詞彙表〉（Regression 列）。"}, {"id": "human-judges", "chapter": "回看與交接", "title": "每一步，人判斷的是什麼", "lead": "Agent 負責讀、跑、寫；人負責四種判斷。這張表就是 Teammate 階段的分工。", "code": "分析      這個「事實」附得出來源嗎？\n共同脈絡  有沒有把分歧或假設說成事實？\nB1 核准   證據夠嗎？計畫夠小嗎？寫了不改什麼嗎？\nB1 驗收   同一批測試修前失敗、修後通過？審查三題都是「是」？\nB2 選擇   方案真的可行嗎？未確認的假設會改變選擇嗎？\nB2 驗收   每位旅客的結果符合新規則？改過的期待值都核准過？", "check": "說得出自己在其中一步曾經退回或追問過什麼。", "notes": "41–43 分鐘。回到開場那個問題：最不放心交給 Agent 的那段，對應到表上哪一行？通常不放心的原因是那一步沒有證據可看；解法是要求證據，而不是自己去讀程式。"}, {"id": "handoff", "chapter": "回看與交接", "title": "下一場：任務更大，你沒辦法盯每一段", "lead": "這次每做完一段都停下看證據。任務再大一點，人就得先寫清楚範圍，只在幾個關鍵點做決定。", "flow": ["Tool：逐步下指令", "Teammate：核准計畫", "Digital Worker：只在關鍵點決定"], "cards": [["帶到下一場的檔", "notes/shared-context.md、skills/team-rules.md、skills/fix-bug-with-test.md。"], ["帶到下一場的問題", "如果不能盯每一小段，你會先寫清楚哪些事，才敢讓 Agent 自己往前走？"]], "check": "離場前寫下一條自己團隊值得寫成 Skill 的規則或做法。", "notes": "43–45 分鐘。只留問題，不教下一場的工作單、關卡或例外處理，那是 04 Digital Worker 的內容。B2 本身就是從 Teammate 走向 Digital Worker 的過渡：主要 Agent 在核准後主導實作，人透過審查與驗收對照表決定。"}], "title": "Brownfield：讓 Agent 當隊友，一起接手既有系統", "minutes": 45, "downloads": [{"label": "下載操作講義", "name": "brownfield-handout.md", "text": "# Brownfield：讓 Agent 當隊友，一起接手既有系統\n\n\u003e 讀者：學員。時機：Brownfield（已有程式碼的既有專案）實作後的 45 分鐘講解。前置：做過個人分析、共同脈絡、B1 與 B2。\n\n這份講義整理技巧與人要判斷的事，不含任務解答。指令是示範用；沒有實際執行的結果一律視為未驗證。\n\n## 1. 接手既有系統：Agent 當隊友\n\n第三階段 · Brownfield（已有程式碼的既有專案）／Teammate（隊友：與 Agent，也就是 AI 助手，一起工作） · 概念與技巧\n\n- **今天回看**：個人分析、共同脈絡、B1（第一個變更任務：修 Bug）、B2（第二個：改規則）：四段各用了什麼技巧。\n\n- **今天帶走**：接手陌生系統、讓團隊共用規則、修 Bug 與改規則時，人該在哪裡判斷。\n\n**人工確認**：能說出剛才四段裡，自己核准過的一份計畫或選過的一個方案。\n\n## 2. Tool → Teammate：人改成核准計畫\n\n差別不在 Agent 多聰明，而在人怎麼介入：Tool 逐步下指令，Teammate 先一起分析，人核准計畫後才動手。\n\nTool：人逐步下指令 → Teammate：一起分析，人核准計畫 → Digital Worker（數位員工）：下一場\n\n- **Agent 多做的**：讀檔、跑測試、比較做法、寫紀錄，附來源回報。\n\n- **人保留的**：選哪份計畫、範圍多大、證據夠不夠、接不接受。\n\n**人工確認**：每段開始動手前，都有一個由人說「核准」的時間點。\n\n## 3. 先要一張地圖，不先問 Bug 在哪\n\n接手陌生專案，第一個問題是「分幾塊、規則在哪、測試現況」，不是「哪裡壞了」。\n\n- **系統地圖**：各部分負責什麼業務、依賴誰；不是一串檔名。\n\n- **規則在哪**：商業規則寫在哪份文件、對應到哪一部分。\n\n- **測試現況**：通過、失敗、跳過各幾個；先不推論原因。\n\n### 交給 Agent 的指令\n\n先不要修改程式。請帶我讀這個專案：先列資料夾結構，只挑必要的重點檔讀。用白話說明系統分哪幾部分、規則寫在哪、測試現況，每個結論標事實、假設或缺口，最後列出你讀了哪些檔，然後停下。\n\n**人工確認**：地圖說得出「誰負責什麼、依賴誰」；Agent 列得出實際讀了哪些檔。\n\n## 4. 技巧：模型選擇與推論強度\n\n分析陌生程式要想深一點：選較強的模型、調高推論強度。機械性工作用快速、便宜的模型就夠。\n\n- **模型選擇**：跑測試、整理格式用快速模型；分析、比較取捨用較強模型。\n\n- **推論強度（Reasoning Effort）**：同一個模型「想多深」；越深越慢，也越耗 Token（詞元）。\n\n- **沒有推論強度設定時**：有設定就直接調整；沒有，才在提示詞寫「先仔細想過再回答」替代。\n\n**人工確認**：說得出剛才分析時用的是哪一種設定，以及為什麼。\n\n## 5. Token 節費（加深一層）：指名檔案，只要摘要\n\nSpeech 02 學過開新對話與指名要讀的檔；陌生專案還不知道該指名哪些，就先列目錄、挑重點檔。\n\n- **先列目錄再挑**：先讀 README、架構文件與決策紀錄，回報讀了哪些；其他需要時才讀。\n\n- **只要摘要**：測試結果只報通過／失敗／跳過數，不貼完整輸出。\n\n- **交接用摘要**：給別人的 Agent 用 5 行摘要，是 Speech 02 交接檔的短版。\n\n**人工確認**：Agent 回報裡有「讀了哪些檔」；沒有出現整段原始輸出。\n\n## 6. 文件是線索，不是結論\n\nSpeech 02 的三方對照（文件、測試、程式），這裡落到每個結論：標出它是哪一種。\n\n- **事實**：附文件位置、測試名稱或實際執行過的指令。\n\n- **假設**：說明依據，以及還缺什麼證據。\n\n- **缺口**：查不清楚，需要問人。\n\n### 交給 Agent 的指令\n\n我要追問第 2 條事實：請引用規則或文件原文、測試名稱，並重新執行相關測試貼出結果摘要。拿不出證據就改標為假設，告訴我改了什麼，然後停下。\n\n**人工確認**：挑一個「事實」追問證據；說「可能」「應該」的地方已改標為假設。\n\n## 7. 幾個 Agent 讀同一份系統，說法不同怎麼辦\n\n每人的 Agent 先濃縮成 5 行摘要，小組才比得起來；比的是證據，不是誰的語氣最肯定。\n\n各自 5 行摘要 → 說法一樣且附來源：共同事實 → 說法不同或沒證據：分歧 → 寫下用什麼驗證分歧\n\n- **主要 Agent**：小組選定、代表全組執行工作的那一個 Agent。\n\n- **人員核准者**：小組指定說「核准」的人；之後的紀錄都記他。\n\n**人工確認**：說得出一條附來源的共同事實、一個分歧，以及要重跑哪個測試才分得出對錯。\n\n## 8. 口頭講過的，Agent 下次就忘了\n\n共同脈絡（Shared Context）：小組的共同事實、分歧與待決事項，由主要 Agent 寫成檔案。\n\n```text\nnotes/shared-context.md\n  ## 共同事實      多人一致，附來源\n  ## 仍有分歧      附驗證方式\n  ## 已知限制      只記限制，不預先核准修改\n  ## 待決事項      要等任務揭露才能決定\n  ## 分工          主要 Agent 與核准者\n```\n\n**人工確認**：主要 Agent 複述時，沒有把分歧或假設說成事實，也沒有自己加修改計畫。\n\n## 9. 技巧：Skill，把規則寫成開工先讀的檔\n\nSkill（技能檔）：本課程用簡化版，就是 skills/ 裡一份 Markdown 說明檔；工具內建的 Skill 另有固定格式。\n\n- **之後每段的第一句**：「請先讀 skills/team-rules.md」，不再整段重貼規則。\n\n```text\nskills/team-rules.md\n  ## 開工先讀    notes/shared-context.md\n  ## 工作規則    7 條，含過時期待值須經核准才更新\n  ## 回報格式    驗收對照表、改了哪些檔與原因\n```\n\n**人工確認**：說得出 team-rules.md 的三節；之後的提示詞都以它開頭。\n\n## 10. 用失敗測試找 Bug\n\n「修前失敗、修後通過」是你不讀程式也能信任的證據。先重現，才算找到 Bug。\n\n重現：一個現在會失敗的測試 → 定位：分開事實與推論 → 最小修正：只做核准的步驟 → 驗證：同一批測試變成通過\n\n**人工確認**：修好的證據是同一批測試的前後對照，而不是 Agent 說「完成了」。\n\n## 11. 人核准的是一份小計畫\n\nTeammate 的介入點：Agent 先交原因與計畫，人看證據夠不夠、範圍夠不夠小，再說核准或退回。\n\n- **原因分兩欄**：有規則或測試證據的事實，和還只是推論的部分。\n\n- **計畫最多 3 步**：每步標規則編號（Rule ID）或驗收條件（AC，Acceptance Criteria）。\n\n- **寫出不改什麼**：其他票種、既有優惠與順序都不動。\n\n### 交給 Agent 的指令\n\n先不要核准，也不要修改程式。請補證據：你的原因有沒有規則原文或測試結果支持？說不出依據的標成「推論」，計畫裡超出任務卡範圍的步驟刪掉，再告訴我改了哪裡，然後停下等我。\n\n**人工確認**：證據夠、範圍小才核准；證據不足或計畫太大就退回補證據。\n\n## 12. 改完先停：變更審查三題\n\nGreenfield 的四題審查，B1 留前三題；只看答案與附上的指令，三題都是「是」才放行。\n\n- **1. 範圍**：改的檔案都在核准計畫裡。\n\n- **2. 測試沒變少**：總數沒少，也沒新增跳過（skip）或預期失敗（xfail）。\n\n- **3. 期待值沒被動**：沒刪測試、沒改既有期待值，用變更內容（Diff）核對。\n\n**人工確認**：任一題是「否」或「不確定」，就請 Agent 解釋並還原超出範圍的修改，不放行。\n\n## 13. Skill（加深一層）：存的是一套做法\n\n重複的程序就該長成 Skill。team-rules.md 存規則；fix-bug-with-test.md 存修 Bug 的做法。\n\n```text\nskills/\n  team-rules.md          規則：每段開工先讀\n  fix-bug-with-test.md   做法：重現 → 定位 → 最小修正 → 驗證\n                         每步要交的證據、禁止事項、回報格式\n```\n\n**人工確認**：fix-bug-with-test.md 是通用說明，沒有寫進這次 Bug 的原因或修改內容。\n\n## 14. 改規則時，不接受第一個答案\n\n修 Bug 有明確的對錯；改規則常有不只一種做法。請 Agent 提 2–3 個可行方案，人來選。\n\n- **真的可行**：不是一個方案配兩個陪襯。\n\n- **對照禁止事項**：違反任務卡禁止事項的方案直接標出來。\n\n- **假設附依據**：沒有依據的標「未確認」，再決定要不要追問。\n\n**人工確認**：選方案前，至少問過一次：哪個「未確認」的假設錯了會改變選擇？\n\n## 15. 結構化輸出（加深一層）：固定欄位的比較表\n\nGreenfield 用固定欄位寫驗收表；這裡用同樣方法並排比較方案，幾個方案才能逐欄對照。\n\n```text\n| 方案 | 改動範圍 | 風險 | 測試影響 | 建議 |\n|------|----------|------|----------|------|\n| A    | 一定要改／可能影響／不應改，附證據 | … | … | … |\n| B    | …        | …    | …        | …    |\n```\n\n**人工確認**：每個方案都填滿同一組欄位；改動範圍附檔案或測試名稱當證據。\n\n## 16. 推論強度（加深一層）：比較調高，實作調回\n\n同一個任務的不同階段，需要的「想多深」不一樣。用對地方，既準又省。\n\n比較方案、找風險：調高 → 人選方案並核准 → 小步實作：調回低或預設\n\n- **為什麼實作調回**：核准後是照計畫的小步修改，想太深只是更慢、更耗 Token。\n\n**人工確認**：比較方案時有調高（沒有這項設定才改用提示詞），核准後有調回。\n\n## 17. 規則改了，舊測試怎麼辦\n\n有些既有測試只在舊規則下才對。Agent 要先停下列出來，人核准後才更新；其他期待值一律不改。\n\n- **三點都成立才核准**：舊期待只在舊規則下才對；新規則要求不同結果；附了 Rule ID。\n\n- **變更審查多兩題**：政策不放在 API 路由層，訂票與改票共用同一套；挑一位多優惠旅客實際驗證。\n\n- **核對到每位旅客**：看每人採用的優惠類型與折扣率，不只核對總額。\n\n**人工確認**：改過的既有期待值，每一處都附 Rule ID 和小組的核准紀錄。\n\n## 18. 每一步，人判斷的是什麼\n\nAgent 負責讀、跑、寫；人負責四種判斷。這張表就是 Teammate 階段的分工。\n\n```text\n分析      這個「事實」附得出來源嗎？\n共同脈絡  有沒有把分歧或假設說成事實？\nB1 核准   證據夠嗎？計畫夠小嗎？寫了不改什麼嗎？\nB1 驗收   同一批測試修前失敗、修後通過？審查三題都是「是」？\nB2 選擇   方案真的可行嗎？未確認的假設會改變選擇嗎？\nB2 驗收   每位旅客的結果符合新規則？改過的期待值都核准過？\n```\n\n**人工確認**：說得出自己在其中一步曾經退回或追問過什麼。\n\n## 19. 下一場：任務更大，你沒辦法盯每一段\n\n這次每做完一段都停下看證據。任務再大一點，人就得先寫清楚範圍，只在幾個關鍵點做決定。\n\nTool：逐步下指令 → Teammate：核准計畫 → Digital Worker：只在關鍵點決定\n\n- **帶到下一場的檔**：notes/shared-context.md、skills/team-rules.md、skills/fix-bug-with-test.md。\n\n- **帶到下一場的問題**：如果不能盯每一小段，你會先寫清楚哪些事，才敢讓 Agent 自己往前走？\n\n**人工確認**：離場前寫下一條自己團隊值得寫成 Skill 的規則或做法。\n\n## 完成條件\n說得出 Teammate 的介入方式（核准計畫，不盯每一步），並能為自己的工作寫下一份開工先讀的規則 Skill，以及一個先重現再修、或先比較再選的做法。\n"}]};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;
const el = id => document.getElementById(id);
let index = 0, notesVisible = false, running = false, accumulated = 0, startedAt = 0;
const overview = el('overview');
function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {
  const available = Math.max(100, innerHeight - document.querySelector('nav').offsetHeight - 18);
  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `${SPEECH_DATA.title.split('：')[0]} · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / ${String(SPEECH_DATA.minutes).padStart(2,'0')}:00`;el('timer').classList.toggle('over',secs>=SPEECH_DATA.minutes*60);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
SPEECH_DATA.downloads.forEach(d=>{const b=node('button',d.label);b.onclick=()=>save(d.name,d.text);el('downloads').append(b);});
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&(e.target.closest('textarea,input,select')||(e.target.closest('button')&&[' ','Enter'].includes(e.key))))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
</body>
</html>
