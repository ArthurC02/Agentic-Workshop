<style>:root{--ink:#1e3761;--blue:#0093c1;--teal:#008b82;--orange:#df6539;--muted:#536173;--line:#d5e1e6}

<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "開場", "title": "從做完一件事，到帶回團隊", "lead": "最後一段：用公開研究回答三個問題，再排出你的 30 天計畫。", "cards": [["三個問題", "有沒有用要怎麼量？團隊怎麼一起用？風險在哪？"], ["怎麼聽", "對照你下週真的會交給 Agent（能自己動手完成工作的 AI）的一件工作。"]], "check": "想好一件下週會交給 Agent 的工作，後面每頁都拿它來對照。", "notes": "（第 00–01 分）先請聽眾心裡選一件真實工作。本場只用一頁回顧，其餘是組織導入的研究證據與做法。📖 定義出處：本課程〈工作坊回顧〉。"}, {"id": "recap", "chapter": "開場", "title": "你今天帶走的不只是做法，還有紀錄", "lead": "Tool → Teammate → Digital Worker：差別是人什麼時候介入；每一段都留下了檔案。", "cards": [["notes/", "做了什麼、證據在哪、還缺什麼；別人不必問你就看得懂。"], ["skills/", "團隊規則、修 Bug 流程、工作單：可以被別人重複使用的做法。"]], "check": "拿一段紀錄給同事看，他能不能不問你就看懂？", "explain": ["三種介入方式的選擇判準是：做錯的代價、能不能復原、拿得到什麼證據；風險高、難復原，就退回前一種方式。今天每一段都留下了檔案：notes/ 記做了什麼、證據在哪、還缺什麼；skills/ 記可以被別人重複使用的做法。", "這些紀錄的價值在於別人不必問你就看得懂，所以它們也是向團隊說明「這樣做怎麼運作」的第一份材料。"], "notes": "（第 01–03 分）唯一的回顧頁。三種介入方式對應 Greenfield、Brownfield、Digital Worker。選擇判準：做錯的代價、能不能復原、拿得到什麼證據；風險高、難復原就退回前一種方式。接下來談：這些紀錄怎麼變成說服組織的證據。📖 定義出處：本課程〈共同詞彙與 Domain 定義〉。"}, {"id": "amplifier", "chapter": "有沒有用", "title": "AI 是擴音器，不是調音師", "lead": "第一場看過 DORA 2025：AI 放大原本的長處，也放大原本的短處。導入前要問：它會先放大你的哪一點？", "cards": [["回顧第一場", "AI 採用與交付量正相關，但與交付穩定度仍為負相關。"], ["導入前先盤點", "測試薄、審查慢、批量大：哪一項會先被放大？"]], "check": "你的團隊，哪一個現有的弱點最可能被 AI 放大？", "explain": ["DORA〈State of AI-assisted Software Development 2025〉的結論是：AI 主要的角色是放大器，放大組織原有的長處與短處。流程好的團隊被放大成更好；測試薄、審查慢、批量大的團隊，被放大成更亂。", "所以導入前要先盤點：AI 會先放大你的哪一點？測試少，Agent 就沒有可靠的檢查；審查慢，產出越多越塞；一次改太多，出錯就難退。先補最弱的一項，比換更強的工具有效。"], "read": ["〈State of AI-assisted Software Development 2025〉（DORA，2025）"], "notes": "（第 03–05 分）加深一層：DORA 的調查數字（90% 在工作中使用 AI 等）與「AI doesn't fix a team; it amplifies what's already there」都在第一場講過，這裡不重唸數字，只把結論轉成導入前的盤點題。比喻：流程好的團隊被放大成更好，測試薄、審查亂的團隊被放大成更亂。想看完整報告的人，給下面這份。📖 延伸閱讀：〈State of AI-assisted Software Development 2025〉（DORA, 2025）。"}, {"id": "capabilities", "chapter": "有沒有用", "title": "先補基本功：七項放大 AI 效益的能力", "lead": "DORA 的 AI 能力模型：光導入工具不保證成功，這七項決定效果。", "flow": ["清楚的 AI 使用立場", "健康的資料", "AI 取得得到的內部資料", "紮實的版本控制", "小批量工作", "以使用者為中心", "好用的內部平台"], "check": "七項裡，你的團隊最弱的是哪一項？那就是導入前要先補的。", "explain": ["Google Cloud（2025-09）公布 DORA 的 AI 能力模型，列出七項會放大 AI 效益的能力：清楚且有溝通的 AI 使用立場、健康的資料生態、AI 取得得到的內部資料、紮實的版本控制、小批量工作、以使用者為中心、高品質的內部平台。原文提醒：光是導入 AI 工具，不保證成功。", "工作坊裡做過的事就是其中幾項的縮影：每段先存一版（版本控制）、一次只做一個小步驟（小批量）、規則寫成檔案（清楚的立場）。下週可以和團隊一起替七項各打一個分數，最弱的那一項就是導入前要先補的。"], "read": ["〈Introducing DORA's inaugural AI Capabilities Model〉（Google Cloud，2025）"], "notes": "（第 05–07 分）來源：Google Cloud〈Introducing DORA's inaugural AI Capabilities Model〉（2025-09-24）。原文：simply adopting AI tools isn't a guarantee of success。對照工作坊：每段先存一版、一次只做一個小步驟、規則寫成檔案，就是版本控制、小批量與清楚立場的縮影。📖 延伸閱讀：〈Introducing DORA's inaugural AI Capabilities Model〉（Google Cloud, 2025）。"}, {"id": "perception", "chapter": "有沒有用", "title": "感覺變快，不等於真的變快", "lead": "METR 的實驗兩次結論不同；能確定的只有一件事：要自己量，而且要重量。", "cards": [["2025-07 研究", "16 位資深開源開發者：用 AI 反而多花 19% 時間，但事後仍自認快了 20%。"], ["2026-02 更新", "新一輪估計可能變快（約 4%–18%），但誤差範圍跨過零，研究者稱只是「很弱的證據」。"]], "check": "你說「Agent 讓我變快」時，手上有量過的數字，還是感覺？", "explain": ["研究機構 METR 2025-07 的研究：16 位資深開源開發者、246 個任務，用 AI 反而多花 19% 時間；他們事前預期快 24%，事後仍自認快了 20%。這份研究的頁面現在已標示結果過時。", "2026-02 的更新：回流的原受試者估計加速 18%，信賴區間從加速 38% 到減速 9%；新受試者估計加速 4%，區間從加速 15% 到減速 9%。區間都跨過零，METR 自己說這只是很弱的證據；另外，許多開發者不願在沒有 AI 的情況下工作而拒絕參加，造成選樣偏差。", "所以不要把「慢 19%」當成現況，也不要只引用任何單一數字。能確定的是：感覺不算數，要自己量，而且工具變了要重量。"], "read": ["〈We are Changing our Developer Productivity Experiment Design〉（METR，2026）"], "notes": "（第 07–09 分）一定要兩份一起講。2025-07-10〈Measuring the Impact of Early-2025 AI on Experienced Open-Source Developer Productivity〉：246 個任務，事前預期快 24%，量出來慢 19%，事後自認快 20%；頁面現已標示結果過時。2026-02-24〈We are Changing our Developer Productivity Experiment Design〉：原受試者估計加速 18%（區間從加速 38% 到減速 9%），新受試者加速 4%（區間從加速 15% 到減速 9%）；許多開發者不願在沒有 AI 的情況下工作而不參加，造成選樣偏差。不要把「慢 19%」當成現況。📖 延伸閱讀：〈We are Changing our Developer Productivity Experiment Design〉（METR, 2026）。"}, {"id": "bottleneck", "chapter": "有沒有用", "title": "水管變粗，瓶頸移到審查", "lead": "個人產出變多，不等於公司交付變好。（Faros AI，2025-07）", "cards": [["產出", "高採用團隊完成任務 +21%，合併的變更 +98%。"], ["代價", "審查時間 +91%、變更大小 +154%、每人 Bug +9%。"], ["公司層級", "交付指標與 AI 採用沒有顯著相關。"]], "check": "你的團隊，誰在審 Agent 的產出？他的時間被算進去了嗎？", "explain": ["Faros AI〈The AI Productivity Paradox Report 2025〉（2025-07）分析 1 萬多位開發者、1,255 個團隊：高採用 AI 的團隊完成任務多 21%、合併的變更多 98%，但審查時間多 91%、每個變更變大 154%、每人 Bug 多 9%；公司層級的交付指標和 AI 採用沒有顯著相關。限制：這是廠商報告，而且只是相關，不是因果。", "Anthropic〈Redesigning source control at Anthropic〉（2026-10）是同一現象的放大版：每天合併的變更從 2026-05 約 2,500 次增加到 9 月超過 30,000 次，他們說現在的瓶頸是為人類規模打造的開發基礎設施：版本控制、建置與持續整合。Thoughtworks 技術雷達第 34 期也警示，不要用程式碼產出量衡量生產力。", "所以關卡與證據式交付不是多餘的流程，而是讓審查變快的設計。下週把審查 Agent 產出花的人力時間也記下來，算進成本。"], "read": ["〈The AI Productivity Paradox Report 2025〉（Faros AI，2025）", "〈Redesigning source control at Anthropic〉（Anthropic，2026）", "〈Technology Radar Vol. 34〉（Thoughtworks，2026）"], "notes": "（第 09–11 分）來源：Faros AI〈The AI Productivity Paradox Report 2025〉（2025-07-23），1 萬多位開發者、1,255 個團隊。限制：廠商報告、只是相關性不是因果。Thoughtworks Technology Radar 第 34 期（2026-04）把「用程式碼產出量衡量生產力」列為 Caution（警示）。第三場的 Spotify 背景 Agent 案例也談到審查成為新瓶頸。新例子：Anthropic〈Redesigning source control at Anthropic〉（2026-10-13）說每天合併的變更從 2026-05 約 2,500 次增加到 9 月超過 30,000 次，原文「The bottleneck, now, is all of the developer infrastructure built for human scale: source control, builds, and CI.」限制：廠商自家案例。所以 Gate 與證據式交付不是多餘的流程，而是讓審查變快的設計。📖 延伸閱讀：〈The AI Productivity Paradox Report 2025〉（Faros AI, 2025）；〈Redesigning source control at Anthropic〉（Anthropic, 2026）；〈Technology Radar Vol. 34〉（Thoughtworks, 2026）。"}, {"id": "trust", "chapter": "有沒有用", "title": "最花時間的是「差一點就對」", "lead": "第一場看過 Stack Overflow 2025 調查：最大的挫折是「差一點就對」。量測時，這段時間最容易漏算。", "cards": [["回顧第一場", "只有 33% 信任準確度；66% 最大挫折是「差一點就對」。"], ["量測的含意", "驗證與修正的時間要算進成本，否則只量到「產出變快」。"]], "check": "你的量測有沒有把「驗證與修正」的時間算進去？", "explain": ["Stack Overflow 2025 年調查中，45% 的開發者認為除錯 AI 程式碼更花時間。這段驗證與修正的時間如果不算進去，量出來的效益就會偏高。差一點就對的產出最危險，因為它看起來像完成。", "一年後（Stack Overflow，2026-10）：用 AI 的開發者有 66% 用 Coding Agent，用助手或 Agent 的人有 73% 天天用；但只有 20% 用在部署或維運正式系統，93% 說要附來源才信得過。Agent 已經普及，「能驗證才信」沒有變。"], "read": ["〈The results of the 2026 Developer Survey are here!〉（Stack Overflow，2026）", "〈2025 Developer Survey — AI〉（Stack Overflow，2025）"], "notes": "（第 11–12.5 分）加深一層：調查數字第一場講過，這裡只回扣兩個，重點放在量測：45% 認為除錯 AI 程式碼更耗時，這段時間不算進去，量出來的效益就會偏高。一年後的變化：Stack Overflow〈The results of the 2026 Developer Survey are here!〉（2026-10-06）中，用 AI 的開發者有 66% 用 Coding Agent，用助手或 Agent 的人 73% 天天用；但只有 20% 用在部署或維運正式系統，93% 說要附來源才信得過。Agent 已經普及，「能驗證才信」沒有變。差一點就對的產出最危險，因為看起來像完成；這就是為什麼要先有能自己跑的檢查，交付要附證據。📖 延伸閱讀：〈The results of the 2026 Developer Survey are here!〉（Stack Overflow, 2026）。"}, {"id": "measure", "chapter": "怎麼量", "title": "領先與落後指標：量什麼才知道有沒有用", "lead": "先建基準再導入；每項做法配一個很快看得到的領先指標，和較晚才穩定的落後指標。", "cards": [["領先指標（兩週內）", "計畫一次就核准的比例、等審查的時間、每週退回次數。"], ["落後指標（一季後）", "上線後才發現的問題、重工次數、變更失敗率。"], ["成本", "Token 用量、人花在審查與修正的時間。"]], "check": "每項行動都有一個領先、一個落後指標，各有分子、分母與來源，導入前量過一次。", "explain": ["量測的順序是先建基準，再導入。Claude Code 官方〈Manage costs effectively〉建議，先找一小群人試行，用追蹤工具建立基準，再擴大。要量的是交付、品質與成本，不是程式碼行數；每個數字都要事先講好分子、分母與資料來源，否則前後無法比較。本工作坊沒有量測效率或自主率，所以不要引用工作坊的數字當成效證據；要用的是你自己團隊導入前後的數字。", "Anthropic〈The AI-native SDLC playbook〉替每個做法都列了兩種指標。領先指標很快就看得到，用來判斷做法有沒有在動，例如有多少比例的變更第一次實作就能合併；落後指標較晚才穩定，用來判斷結果有沒有變好，例如每個變更的重工次數、合併後的變更是否還符合當初核准的計畫。只看領先指標容易自我感覺良好，只看落後指標又太晚才知道。「兩週內」「一季後」是本課程的經驗法則，不是原文的規定。", "想和業界比較時，可以用 DORA 的軟體交付指標。dora.dev（2026-01 更新）列出五項：衡量交付量的變更前置時間（從提交到上線）、部署頻率、失敗部署的復原時間，以及衡量不穩定度的變更失敗率、部署重工率。常見誤解是「DORA 指標就是四項」：那是早年的版本，現在多了部署重工率。"], "read": ["〈Manage costs effectively〉（Anthropic，官方文件）", "〈The AI-native SDLC playbook〉（Anthropic，2026）", "〈DORA's software delivery performance metrics〉（DORA，2026）"], "notes": "（第 12.5–14.5 分）Claude Code 成本文件建議：先找一小群人試行，用追蹤工具建立基準，再擴大。Thoughtworks Radar 警示不要用程式碼產出量衡量生產力。playbook 每個做法都有「How to measure it」下的 Leading indicator 與 Lagging indicator；Build 的例子：領先是第一次實作就合併的比例，落後是重工次數與合併結果是否符合計畫。回顧的行動格式也改成「兩週內看得到的領先指標」「一季後看的落後指標」，請學員各舉一例：每週退回次數、上線後才發現的問題數。本次工作坊沒有量測效率或自主率，不要引用工作坊的數字。📖 延伸閱讀：〈Manage costs effectively〉、Anthropic〈The AI-native SDLC playbook〉。"}, {"id": "skill", "chapter": "團隊做法", "title": "寫自己的 Skill：從紀錄長出來", "lead": "Skill（技能檔）第三場講過；加深一層：不要憑空寫，從 notes/ 裡你真的重複做過的事整理出來。", "cards": [["值得寫", "做過三次以上、步驟固定、結果能檢查。"], ["只寫 Agent 猜不到的", "你們的慣例、檢查方式、要交的證據。"], ["改了就試跑", "拿一個舊例子在新對話照著走；規則或 Skill 改了就重跑。"]], "prompt": "請讀 notes/ 裡的紀錄，找出我做過多次、步驟固定的一個做法，先告訴我是哪一個並等我確認。確認後寫成 skills/ 裡的一份檔：何時用、步驟、要交的證據、回報格式。紀錄沒有的寫「未觀察」，不要編。寫完停下等我。", "check": "每一步都能在紀錄找到出處；寫完先試跑一次，之後每改一次就重跑。", "explain": ["Skill 不要憑空寫，要從 notes/ 裡你真的重複做過的事整理出來；紀錄沒有的寫「未觀察」，這樣寫出來的 Skill 有證據撐著。只寫 Agent 猜不到的事：你們的慣例、檢查方式、要交的證據。", "「做過三次以上才寫」是本工作坊的經驗法則，不是研究結論。", "寫完先試跑，這就是最小的評估（eval）。Anthropic〈The AI-native SDLC playbook〉把評估比作傳統流程裡關卡前的品質檢查：規則檔、Skill 或 hook（在固定時機自動執行的檢查）會引導 Agent 的行為，所以每次修改都要重跑同一組例子；通過率變差的修改，先審過再採用。今天回顧時可以選做：拿 notes/ 裡的一個例子，在新對話照 Skill 走一遍（只讀、不改檔），看哪一步沒照做，必要時改一句再收。"], "read": ["〈Equipping agents for the real world with Agent Skills〉（Anthropic，2025）", "〈The AI-native SDLC playbook〉（Anthropic，2026）"], "notes": "（第 14.5–17 分）加深一層：Skill 是什麼、開放格式、入職手冊的比喻、只裝可信來源，第三場都講過，不重講。這頁有兩個新重點。來源：從自己的紀錄找出真的重複的做法，紀錄沒有的寫「未觀察」；「三次以上才寫」是本工作坊的經驗法則。試跑：Skill 就是 Agent 的設定，改了要先試。原文：「Evals are the AI-native equivalent of stage-gate QA.」「A skill change that drops the pass rate gets reviewed before it merges.」回顧的選做步驟就是最小版：一個例子、新對話、只讀。本課程的 skills/ 是簡化版（Markdown 說明檔）。示範提示詞選用，未在現場執行。"}, {"id": "team", "chapter": "團隊做法", "title": "團隊規則：誰維護、多久修一次", "lead": "規則檔要短（第二場）、要共用（第三場）；帶回團隊時再加深一層：要有人負責，而且會隨錯誤更新。", "cards": [["指定負責人", "每條規則都有人說得出為什麼要有它。"], ["出錯就回寫", "Agent 錯一次就決定：補一行規則，還是加自動檢查。"], ["定期修剪", "和 30 天計畫一起回看，刪掉沒用的行。"]], "check": "你團隊的規則檔，現在是誰在維護？上次修剪是什麼時候？", "explain": ["規則帶回團隊後，最常見的問題是沒人負責：越寫越長，沒人記得為什麼有某一行。Claude Code 官方文件建議把規則檔當程式碼對待：出問題時回頭檢查、定期修剪，並觀察 Agent 的行為有沒有真的改變。", "Agent 錯一次，就做一個決定：補一行規則，還是加一個自動檢查？一定要發生的事，補的是自動檢查。下週替團隊的規則檔指定一位負責人，排好第一次修剪的日期。", "官方文件也點出兩個常見症狀：Agent 明明有規則卻一直不照做，通常是規則檔太長，那一行被淹沒了；很多行都加上「重要」，等於沒有一行特別重要。所以修剪比加強調有效。"], "read": ["〈Best practices for Claude Code〉（Anthropic，官方文件）"], "notes": "（第 17–18.5 分）加深一層：AGENTS.md、200 行建議、「規則檔膨脹」在第二場講過，「放進版本控制、共同維護」在第三場講過，這裡只談導入時的維護責任。Claude Code 最佳實務文件建議把規則檔當程式碼對待：出問題時回頭檢查、定期修剪，並觀察 Agent 行為有沒有真的改變。第二張卡連回第四場：一定要發生的事，補的是自動檢查，不是多一行規則；改完規則，用上一頁的試跑確認。"}, {"id": "loop", "chapter": "團隊做法", "title": "出事之後：回到下一輪的意圖", "lead": "上線後的監控與事故不是終點：超出門檻就診斷，寫成下一輪的意圖，再從計畫開始。", "flow": ["監控超出門檻（自動偵測）", "Agent 依授權診斷（先只讀）", "寫成下一輪意圖：要什麼、為什麼、限制", "人決定排不排進下一輪"], "cards": [["偵測要確定", "門檻由監控系統判斷，不靠 Agent 自己發現。"], ["今天練過", "交付的「下一步」寫成三行下一輪意圖，是同一個迴圈。"]], "check": "你團隊上一次事故，有沒有變成一份寫清楚「要什麼、為什麼、限制」的下一輪需求？", "explain": ["開發流程的最後一段是維運（Maintain）。Anthropic〈The AI-native SDLC playbook〉的做法是：任何超出監控門檻的狀況，都先診斷，再寫成新的意圖，送回流程開頭，迴圈就這樣接下去。偵測本身要確定：由監控系統依事先設好的門檻判斷，超出時才請 Agent 介入，它能做到哪一步由授權等級決定。", "今天的交付已經練過縮小版：沒做完的項目，「下一步」不是一句「之後再做」，而是三行下一輪意圖：要什麼、為什麼、限制。帶回團隊時，可以用這份文件給的維運領先指標來量：從超出門檻到意圖進入待處理清單要多久，和過去從事故到檢討後行動要多久相比。"], "read": ["〈The AI-native SDLC playbook〉（Anthropic，2026）"], "notes": "（第 18.5–20 分）新概念：維運回到計畫。原文：「Any breached control band is diagnosed and written back into the loop as a new intent.md」「Detection stays deterministic. Claude is invoked once a band is breached, and the tier sets what it may do.」control band 這裡說成「監控門檻」，學員頁不用 intent.md 檔名。連回交付：「下一步」寫成三行下一輪意圖，就是同一個迴圈；B1 從客服回報開始，也是事故變成需求的例子。提問：你們上一次事故的檢討，有沒有寫成下一輪能直接排的需求？📖 延伸閱讀：Anthropic〈The AI-native SDLC playbook〉。"}, {"id": "risks", "chapter": "風險", "title": "認知債：團隊層級怎麼補", "lead": "認知債第三場講過；加深一層：個人能說出「改了什麼、為什麼」還不夠，團隊要有制度讓理解不流失。", "cards": [["只能放手一部分", "高度採用的團隊，多數人也只能完全委派 0–20% 的工作。"], ["補法", "輪流請人用白話解釋變更；保留師徒交流與親手做的機會。"]], "check": "你團隊裡，有沒有一塊系統只有 Agent「知道」怎麼運作？", "explain": ["Anthropic〈How AI is transforming work at Anthropic〉（2025-12）用問卷、訪談與對話紀錄研究自家工程師：自評約 59% 的工作用到 AI、自評生產力提升 50%，但多數人說只能完全委派 0–20% 的工作，也擔心技能退化、師徒互動變少。限制：都是自評，對象是內部的早期使用者。", "品質也要另外看：CodeRabbit（2025-12）的報告稱 AI 共同撰寫的變更平均問題約是人工的 1.7 倍，但樣本小、發布者自己賣審查工具，只能說品質要另外量。補法要靠制度：輪流請人用白話解釋變更、保留師徒交流與親手做的機會；並承認「只看證據、不看程式」有盲點，需要指定審查角色或加自動檢查。"], "read": ["〈How AI is transforming work at Anthropic〉（Anthropic，2025）"], "notes": "（第 20–21.5 分）加深一層：認知債的定義、技術雷達的警示與「監督的悖論」第三場講過，不重講。同一份 Anthropic 內部研究的另一組數字：自評約 59% 的工作用到 AI、自評生產力 +50%，但多數人只能完全委派 0–20% 的工作，並擔心技能退化與師徒互動變少；限制是自評、內部早期使用者。CodeRabbit 2025-12 報告稱 AI 共同撰寫的變更問題約 1.7 倍，但樣本小、發布者賣審查工具：只能說品質要另外量。這也是本工作坊「只看證據、不看程式」的盲點：需要指定審查角色或加自動檢查。"}, {"id": "plan-30", "chapter": "30 天計畫", "title": "30 天導入計畫：一件小事、一組數字", "lead": "挑風險低、可復原、證據好取得的一件事；一次只改一個變數。", "flow": ["第 1 週：選一件事，量基準；Agent 先只讀", "第 2 週：寫規則、一個 Skill、設關卡", "第 3 週：在開發環境開放寫入，收證據", "第 4 週：看指標，決定擴大、調整或停止"], "cards": [["先試", "重複性高的文件整理、補測試、讀陌生程式。"], ["暫緩", "涉及權限、金流、正式資料或難復原的變更。"]], "check": "計畫有責任人、期限、領先與落後指標，也有「停止」的標準。", "explain": ["挑風險低、可復原、證據好取得的一件事，例如重複性高的文件整理、補測試、讀陌生程式；涉及權限、金流、正式資料或難復原的變更先暫緩。依據是官方建議的「小群體試行、先建基準」、DORA 的小批量工作，以及 METR 的教訓：感覺不算數，要量。", "放權照順序來。Anthropic〈The AI-native SDLC playbook〉建議先從只讀的判斷步驟開始（例如請 Agent 讀程式、提出分析），再開放寫入；並且依環境分級：開發環境可以放手，正式環境由 Agent 準備、由負責人放行，上線前的預備環境介於兩者之間。擴大時一次只多開一個環境，這和今天 Tool → Teammate → Digital Worker 的順序一樣。", "一次只改一個變數（背景資料、規則、關卡或權限其中之一），否則看不出是哪一項造成差異。計畫要寫清楚誰、何時、做什麼，以及一個領先指標、一個落後指標；也要事先寫好「停止」的標準，數字變差時才知道該收手。"], "read": ["〈Manage costs effectively〉（Anthropic，官方文件）", "〈The AI-native SDLC playbook〉（Anthropic，2026）"], "notes": "（第 21.5–24 分）依據：Claude Code 成本文件「小群體試行、先建基準」；DORA 能力模型的小批量工作；METR 的教訓：感覺不算數，要量。放權順序原文：「The platform engineer starts with read-only judgment steps.」「Tier the autonomy by environment.」「In production, the agent prepares the release and the release manager authorizes it」。playbook 也用依賴圖說明導入順序：箭頭指進來的做法要先導入。一次只改一項。行動格式：誰、何時、做什麼、領先指標、落後指標；沒把握的標「待研究」。"}, {"id": "close", "chapter": "結語", "title": "帶回去的三件事", "lead": "依風險選介入方式、把重複做法寫成 Skill、帶著數字小範圍先試。", "cards": [["下週", "把一個重複做法寫成 Skill，試跑一次。"], ["下個月", "跑完 30 天計畫，帶數字回來討論。"], ["隨時", "沒證據的，標「未驗證」。"]], "check": "寫下一項行動：誰、何時、做什麼、一個領先指標、一個落後指標。", "notes": "（第 24–25 分）系列收尾。謝謝大家走完 Tool、Teammate、Digital Worker 三段，請每人寫下一項行動。"}], "title": "回顧與組織導入：把做法帶回團隊", "minutes": 25, "downloads": [{"label": "下載操作講義", "name": "retrospective-handout.md", "text": "# 回顧與組織導入：把做法帶回團隊\n\n\u003e 讀者：學員。時機：25 分鐘回顧講解。前置：已聽過前四段，或手邊有自己的 `notes/` 與 `skills/` 紀錄。\n\n本段以組織導入的研究證據與做法為主；範例提示詞選用，貼給你自己的 Coding Agent（能自己讀寫專案檔案、執行指令與測試的 AI），結果由你檢查。\n\n**這一段帶走什麼**\n\n- AI 是放大器：導入前先補最弱的基本功\n- 感覺變快不等於真的變快：先建基準，每項做法配領先與落後指標\n- 產出變多時，瓶頸會移到審查\n- 從自己的紀錄長出 Skill，改了就試跑；規則要有人維護\n- 出事後寫成下一輪意圖；放權先只讀，再一個環境一個環境開\n- 30 天計畫：一件小事、一組數字、有停止標準\n\n## 1. 從做完一件事，到帶回團隊\n\n最後一段：用公開研究回答三個問題，再排出你的 30 天計畫。\n\n- **三個問題**：有沒有用要怎麼量？團隊怎麼一起用？風險在哪？\n\n- **怎麼聽**：對照你下週真的會交給 Agent（能自己動手完成工作的 AI）的一件工作。\n\n**人工確認**：想好一件下週會交給 Agent 的工作，後面每頁都拿它來對照。\n\n## 2. 你今天帶走的不只是做法，還有紀錄\n\nTool → Teammate → Digital Worker：差別是人什麼時候介入；每一段都留下了檔案。\n\n- **notes/**：做了什麼、證據在哪、還缺什麼；別人不必問你就看得懂。\n\n- **skills/**：團隊規則、修 Bug 流程、工作單：可以被別人重複使用的做法。\n\n三種介入方式的選擇判準是：做錯的代價、能不能復原、拿得到什麼證據；風險高、難復原，就退回前一種方式。今天每一段都留下了檔案：notes/ 記做了什麼、證據在哪、還缺什麼；skills/ 記可以被別人重複使用的做法。\n\n這些紀錄的價值在於別人不必問你就看得懂，所以它們也是向團隊說明「這樣做怎麼運作」的第一份材料。\n\n**人工確認**：拿一段紀錄給同事看，他能不能不問你就看懂？\n\n## 3. AI 是擴音器，不是調音師\n\n第一場看過 DORA 2025：AI 放大原本的長處，也放大原本的短處。導入前要問：它會先放大你的哪一點？\n\n- **回顧第一場**：AI 採用與交付量正相關，但與交付穩定度仍為負相關。\n\n- **導入前先盤點**：測試薄、審查慢、批量大：哪一項會先被放大？\n\nDORA〈State of AI-assisted Software Development 2025〉的結論是：AI 主要的角色是放大器，放大組織原有的長處與短處。流程好的團隊被放大成更好；測試薄、審查慢、批量大的團隊，被放大成更亂。\n\n所以導入前要先盤點：AI 會先放大你的哪一點？測試少，Agent 就沒有可靠的檢查；審查慢，產出越多越塞；一次改太多，出錯就難退。先補最弱的一項，比換更強的工具有效。\n\n📖 延伸閱讀：〈State of AI-assisted Software Development 2025〉（DORA，2025）\n\n**人工確認**：你的團隊，哪一個現有的弱點最可能被 AI 放大？\n\n## 4. 先補基本功：七項放大 AI 效益的能力\n\nDORA 的 AI 能力模型：光導入工具不保證成功，這七項決定效果。\n\n清楚的 AI 使用立場 → 健康的資料 → AI 取得得到的內部資料 → 紮實的版本控制 → 小批量工作 → 以使用者為中心 → 好用的內部平台\n\nGoogle Cloud（2025-09）公布 DORA 的 AI 能力模型，列出七項會放大 AI 效益的能力：清楚且有溝通的 AI 使用立場、健康的資料生態、AI 取得得到的內部資料、紮實的版本控制、小批量工作、以使用者為中心、高品質的內部平台。原文提醒：光是導入 AI 工具，不保證成功。\n\n工作坊裡做過的事就是其中幾項的縮影：每段先存一版（版本控制）、一次只做一個小步驟（小批量）、規則寫成檔案（清楚的立場）。下週可以和團隊一起替七項各打一個分數，最弱的那一項就是導入前要先補的。\n\n📖 延伸閱讀：〈Introducing DORA's inaugural AI Capabilities Model〉（Google Cloud，2025）\n\n**人工確認**：七項裡，你的團隊最弱的是哪一項？那就是導入前要先補的。\n\n## 5. 感覺變快，不等於真的變快\n\nMETR 的實驗兩次結論不同；能確定的只有一件事：要自己量，而且要重量。\n\n- **2025-07 研究**：16 位資深開源開發者：用 AI 反而多花 19% 時間，但事後仍自認快了 20%。\n\n- **2026-02 更新**：新一輪估計可能變快（約 4%–18%），但誤差範圍跨過零，研究者稱只是「很弱的證據」。\n\n研究機構 METR 2025-07 的研究：16 位資深開源開發者、246 個任務，用 AI 反而多花 19% 時間；他們事前預期快 24%，事後仍自認快了 20%。這份研究的頁面現在已標示結果過時。\n\n2026-02 的更新：回流的原受試者估計加速 18%，信賴區間從加速 38% 到減速 9%；新受試者估計加速 4%，區間從加速 15% 到減速 9%。區間都跨過零，METR 自己說這只是很弱的證據；另外，許多開發者不願在沒有 AI 的情況下工作而拒絕參加，造成選樣偏差。\n\n所以不要把「慢 19%」當成現況，也不要只引用任何單一數字。能確定的是：感覺不算數，要自己量，而且工具變了要重量。\n\n📖 延伸閱讀：〈We are Changing our Developer Productivity Experiment Design〉（METR，2026）\n\n**人工確認**：你說「Agent 讓我變快」時，手上有量過的數字，還是感覺？\n\n## 6. 水管變粗，瓶頸移到審查\n\n個人產出變多，不等於公司交付變好。（Faros AI，2025-07）\n\n- **產出**：高採用團隊完成任務 +21%，合併的變更 +98%。\n\n- **代價**：審查時間 +91%、變更大小 +154%、每人 Bug +9%。\n\n- **公司層級**：交付指標與 AI 採用沒有顯著相關。\n\nFaros AI〈The AI Productivity Paradox Report 2025〉（2025-07）分析 1 萬多位開發者、1,255 個團隊：高採用 AI 的團隊完成任務多 21%、合併的變更多 98%，但審查時間多 91%、每個變更變大 154%、每人 Bug 多 9%；公司層級的交付指標和 AI 採用沒有顯著相關。限制：這是廠商報告，而且只是相關，不是因果。\n\nAnthropic〈Redesigning source control at Anthropic〉（2026-10）是同一現象的放大版：每天合併的變更從 2026-05 約 2,500 次增加到 9 月超過 30,000 次，他們說現在的瓶頸是為人類規模打造的開發基礎設施：版本控制、建置與持續整合。Thoughtworks 技術雷達第 34 期也警示，不要用程式碼產出量衡量生產力。\n\n所以關卡與證據式交付不是多餘的流程，而是讓審查變快的設計。下週把審查 Agent 產出花的人力時間也記下來，算進成本。\n\n📖 延伸閱讀：〈The AI Productivity Paradox Report 2025〉（Faros AI，2025）；〈Redesigning source control at Anthropic〉（Anthropic，2026）；〈Technology Radar Vol. 34〉（Thoughtworks，2026）\n\n**人工確認**：你的團隊，誰在審 Agent 的產出？他的時間被算進去了嗎？\n\n## 7. 最花時間的是「差一點就對」\n\n第一場看過 Stack Overflow 2025 調查：最大的挫折是「差一點就對」。量測時，這段時間最容易漏算。\n\n- **回顧第一場**：只有 33% 信任準確度；66% 最大挫折是「差一點就對」。\n\n- **量測的含意**：驗證與修正的時間要算進成本，否則只量到「產出變快」。\n\nStack Overflow 2025 年調查中，45% 的開發者認為除錯 AI 程式碼更花時間。這段驗證與修正的時間如果不算進去，量出來的效益就會偏高。差一點就對的產出最危險，因為它看起來像完成。\n\n一年後（Stack Overflow，2026-10）：用 AI 的開發者有 66% 用 Coding Agent，用助手或 Agent 的人有 73% 天天用；但只有 20% 用在部署或維運正式系統，93% 說要附來源才信得過。Agent 已經普及，「能驗證才信」沒有變。\n\n📖 延伸閱讀：〈The results of the 2026 Developer Survey are here!〉（Stack Overflow，2026）；〈2025 Developer Survey — AI〉（Stack Overflow，2025）\n\n**人工確認**：你的量測有沒有把「驗證與修正」的時間算進去？\n\n## 8. 領先與落後指標：量什麼才知道有沒有用\n\n先建基準再導入；每項做法配一個很快看得到的領先指標，和較晚才穩定的落後指標。\n\n- **領先指標（兩週內）**：計畫一次就核准的比例、等審查的時間、每週退回次數。\n\n- **落後指標（一季後）**：上線後才發現的問題、重工次數、變更失敗率。\n\n- **成本**：Token 用量、人花在審查與修正的時間。\n\n量測的順序是先建基準，再導入。Claude Code 官方〈Manage costs effectively〉建議，先找一小群人試行，用追蹤工具建立基準，再擴大。要量的是交付、品質與成本，不是程式碼行數；每個數字都要事先講好分子、分母與資料來源，否則前後無法比較。本工作坊沒有量測效率或自主率，所以不要引用工作坊的數字當成效證據；要用的是你自己團隊導入前後的數字。\n\nAnthropic〈The AI-native SDLC playbook〉替每個做法都列了兩種指標。領先指標很快就看得到，用來判斷做法有沒有在動，例如有多少比例的變更第一次實作就能合併；落後指標較晚才穩定，用來判斷結果有沒有變好，例如每個變更的重工次數、合併後的變更是否還符合當初核准的計畫。只看領先指標容易自我感覺良好，只看落後指標又太晚才知道。「兩週內」「一季後」是本課程的經驗法則，不是原文的規定。\n\n想和業界比較時，可以用 DORA 的軟體交付指標。dora.dev（2026-01 更新）列出五項：衡量交付量的變更前置時間（從提交到上線）、部署頻率、失敗部署的復原時間，以及衡量不穩定度的變更失敗率、部署重工率。常見誤解是「DORA 指標就是四項」：那是早年的版本，現在多了部署重工率。\n\n📖 延伸閱讀：〈Manage costs effectively〉（Anthropic，官方文件）；〈The AI-native SDLC playbook〉（Anthropic，2026）；〈DORA's software delivery performance metrics〉（DORA，2026）\n\n**人工確認**：每項行動都有一個領先、一個落後指標，各有分子、分母與來源，導入前量過一次。\n\n## 9. 寫自己的 Skill：從紀錄長出來\n\nSkill（技能檔）第三場講過；加深一層：不要憑空寫，從 notes/ 裡你真的重複做過的事整理出來。\n\n- **值得寫**：做過三次以上、步驟固定、結果能檢查。\n\n- **只寫 Agent 猜不到的**：你們的慣例、檢查方式、要交的證據。\n\n- **改了就試跑**：拿一個舊例子在新對話照著走；規則或 Skill 改了就重跑。\n\n### 交給 Agent 的指令\n\n請讀 notes/ 裡的紀錄，找出我做過多次、步驟固定的一個做法，先告訴我是哪一個並等我確認。確認後寫成 skills/ 裡的一份檔：何時用、步驟、要交的證據、回報格式。紀錄沒有的寫「未觀察」，不要編。寫完停下等我。\n\nSkill 不要憑空寫，要從 notes/ 裡你真的重複做過的事整理出來；紀錄沒有的寫「未觀察」，這樣寫出來的 Skill 有證據撐著。只寫 Agent 猜不到的事：你們的慣例、檢查方式、要交的證據。\n\n「做過三次以上才寫」是本工作坊的經驗法則，不是研究結論。\n\n寫完先試跑，這就是最小的評估（eval）。Anthropic〈The AI-native SDLC playbook〉把評估比作傳統流程裡關卡前的品質檢查：規則檔、Skill 或 hook（在固定時機自動執行的檢查）會引導 Agent 的行為，所以每次修改都要重跑同一組例子；通過率變差的修改，先審過再採用。今天回顧時可以選做：拿 notes/ 裡的一個例子，在新對話照 Skill 走一遍（只讀、不改檔），看哪一步沒照做，必要時改一句再收。\n\n📖 延伸閱讀：〈Equipping agents for the real world with Agent Skills〉（Anthropic，2025）；〈The AI-native SDLC playbook〉（Anthropic，2026）\n\n**人工確認**：每一步都能在紀錄找到出處；寫完先試跑一次，之後每改一次就重跑。\n\n## 10. 團隊規則：誰維護、多久修一次\n\n規則檔要短（第二場）、要共用（第三場）；帶回團隊時再加深一層：要有人負責，而且會隨錯誤更新。\n\n- **指定負責人**：每條規則都有人說得出為什麼要有它。\n\n- **出錯就回寫**：Agent 錯一次就決定：補一行規則，還是加自動檢查。\n\n- **定期修剪**：和 30 天計畫一起回看，刪掉沒用的行。\n\n規則帶回團隊後，最常見的問題是沒人負責：越寫越長，沒人記得為什麼有某一行。Claude Code 官方文件建議把規則檔當程式碼對待：出問題時回頭檢查、定期修剪，並觀察 Agent 的行為有沒有真的改變。\n\nAgent 錯一次，就做一個決定：補一行規則，還是加一個自動檢查？一定要發生的事，補的是自動檢查。下週替團隊的規則檔指定一位負責人，排好第一次修剪的日期。\n\n官方文件也點出兩個常見症狀：Agent 明明有規則卻一直不照做，通常是規則檔太長，那一行被淹沒了；很多行都加上「重要」，等於沒有一行特別重要。所以修剪比加強調有效。\n\n📖 延伸閱讀：〈Best practices for Claude Code〉（Anthropic，官方文件）\n\n**人工確認**：你團隊的規則檔，現在是誰在維護？上次修剪是什麼時候？\n\n## 11. 出事之後：回到下一輪的意圖\n\n上線後的監控與事故不是終點：超出門檻就診斷，寫成下一輪的意圖，再從計畫開始。\n\n監控超出門檻（自動偵測） → Agent 依授權診斷（先只讀） → 寫成下一輪意圖：要什麼、為什麼、限制 → 人決定排不排進下一輪\n\n- **偵測要確定**：門檻由監控系統判斷，不靠 Agent 自己發現。\n\n- **今天練過**：交付的「下一步」寫成三行下一輪意圖，是同一個迴圈。\n\n開發流程的最後一段是維運（Maintain）。Anthropic〈The AI-native SDLC playbook〉的做法是：任何超出監控門檻的狀況，都先診斷，再寫成新的意圖，送回流程開頭，迴圈就這樣接下去。偵測本身要確定：由監控系統依事先設好的門檻判斷，超出時才請 Agent 介入，它能做到哪一步由授權等級決定。\n\n今天的交付已經練過縮小版：沒做完的項目，「下一步」不是一句「之後再做」，而是三行下一輪意圖：要什麼、為什麼、限制。帶回團隊時，可以用這份文件給的維運領先指標來量：從超出門檻到意圖進入待處理清單要多久，和過去從事故到檢討後行動要多久相比。\n\n📖 延伸閱讀：〈The AI-native SDLC playbook〉（Anthropic，2026）\n\n**人工確認**：你團隊上一次事故，有沒有變成一份寫清楚「要什麼、為什麼、限制」的下一輪需求？\n\n## 12. 認知債：團隊層級怎麼補\n\n認知債第三場講過；加深一層：個人能說出「改了什麼、為什麼」還不夠，團隊要有制度讓理解不流失。\n\n- **只能放手一部分**：高度採用的團隊，多數人也只能完全委派 0–20% 的工作。\n\n- **補法**：輪流請人用白話解釋變更；保留師徒交流與親手做的機會。\n\nAnthropic〈How AI is transforming work at Anthropic〉（2025-12）用問卷、訪談與對話紀錄研究自家工程師：自評約 59% 的工作用到 AI、自評生產力提升 50%，但多數人說只能完全委派 0–20% 的工作，也擔心技能退化、師徒互動變少。限制：都是自評，對象是內部的早期使用者。\n\n品質也要另外看：CodeRabbit（2025-12）的報告稱 AI 共同撰寫的變更平均問題約是人工的 1.7 倍，但樣本小、發布者自己賣審查工具，只能說品質要另外量。補法要靠制度：輪流請人用白話解釋變更、保留師徒交流與親手做的機會；並承認「只看證據、不看程式」有盲點，需要指定審查角色或加自動檢查。\n\n📖 延伸閱讀：〈How AI is transforming work at Anthropic〉（Anthropic，2025）\n\n**人工確認**：你團隊裡，有沒有一塊系統只有 Agent「知道」怎麼運作？\n\n## 13. 30 天導入計畫：一件小事、一組數字\n\n挑風險低、可復原、證據好取得的一件事；一次只改一個變數。\n\n第 1 週：選一件事，量基準；Agent 先只讀 → 第 2 週：寫規則、一個 Skill、設關卡 → 第 3 週：在開發環境開放寫入，收證據 → 第 4 週：看指標，決定擴大、調整或停止\n\n- **先試**：重複性高的文件整理、補測試、讀陌生程式。\n\n- **暫緩**：涉及權限、金流、正式資料或難復原的變更。\n\n挑風險低、可復原、證據好取得的一件事，例如重複性高的文件整理、補測試、讀陌生程式；涉及權限、金流、正式資料或難復原的變更先暫緩。依據是官方建議的「小群體試行、先建基準」、DORA 的小批量工作，以及 METR 的教訓：感覺不算數，要量。\n\n放權照順序來。Anthropic〈The AI-native SDLC playbook〉建議先從只讀的判斷步驟開始（例如請 Agent 讀程式、提出分析），再開放寫入；並且依環境分級：開發環境可以放手，正式環境由 Agent 準備、由負責人放行，上線前的預備環境介於兩者之間。擴大時一次只多開一個環境，這和今天 Tool → Teammate → Digital Worker 的順序一樣。\n\n一次只改一個變數（背景資料、規則、關卡或權限其中之一），否則看不出是哪一項造成差異。計畫要寫清楚誰、何時、做什麼，以及一個領先指標、一個落後指標；也要事先寫好「停止」的標準，數字變差時才知道該收手。\n\n📖 延伸閱讀：〈Manage costs effectively〉（Anthropic，官方文件）；〈The AI-native SDLC playbook〉（Anthropic，2026）\n\n**人工確認**：計畫有責任人、期限、領先與落後指標，也有「停止」的標準。\n\n## 14. 帶回去的三件事\n\n依風險選介入方式、把重複做法寫成 Skill、帶著數字小範圍先試。\n\n- **下週**：把一個重複做法寫成 Skill，試跑一次。\n\n- **下個月**：跑完 30 天計畫，帶數字回來討論。\n\n- **隨時**：沒證據的，標「未驗證」。\n\n**人工確認**：寫下一項行動：誰、何時、做什麼、一個領先指標、一個落後指標。\n\n## 完成條件\n帶走三項：用公開研究（DORA、METR、Faros AI、Stack Overflow）看清「感覺變快」與「交付變好」的差別、一個寫成 Skill 的重複做法，以及一份有基準、責任人、領先與落後指標、停止標準的 30 天導入計畫。\n\n**下週可以做的事**\n\n- 選一件小事，先量一次導入前的基準\n- 從 notes/ 找一個重複做法，寫成 Skill 並試跑一次\n- 寫下 30 天計畫的責任人、期限、領先與落後指標，以及停止標準\n\n## 名詞解釋\n| 名詞 | 意思 | 出處 |\n|---|---|---|\n| DORA | DevOps Research and Assessment：Google Cloud 旗下的軟體交付研究計畫，每年發布報告。 | Google Cloud〈Announcing the 2025 DORA Report〉 |\n| 放大器 | DORA 2025 的結論：AI 會放大組織原有的長處與短處，不會自己修好一個團隊。 | DORA〈State of AI-assisted Software Development 2025〉 |\n| DORA AI 能力模型 | 七項會放大 AI 效益的能力：清楚的 AI 使用立場、健康的資料生態、AI 取得得到的內部資料、紮實的版本控制、小批量工作、以使用者為中心、高品質的內部平台。 | Google Cloud〈Introducing DORA's inaugural AI Capabilities Model〉 |\n| DORA 軟體交付指標 | 衡量交付量的變更前置時間、部署頻率、失敗部署復原時間，與衡量不穩定度的變更失敗率、部署重工率，共五項。 | DORA〈DORA's software delivery performance metrics〉 |\n| 小批量工作 | 一次只改一小塊、儘快驗證；出錯時退回的成本小。 | Google Cloud〈Introducing DORA's inaugural AI Capabilities Model〉 |\n| 基準（baseline） | 導入前先量一次的數字，事後才有比較的依據；每個數字都要先講好分子、分母與資料來源。 | Anthropic〈Manage costs effectively〉 |\n| 領先指標（leading indicator） | 做法一開始就看得到變化的數字（本課程取兩週內），判斷做法有沒有在動，例如計畫一次就核准的比例、每週退回次數。 | Anthropic〈The AI-native SDLC playbook〉 |\n| 落後指標（lagging indicator） | 要等一段時間才穩定的結果數字（本課程取一季後），判斷交付有沒有真的變好，例如上線後才發現的問題數、重工次數。 | Anthropic〈The AI-native SDLC playbook〉 |\n| 評估（eval） | 用固定的例子重跑 Agent，檢查結果是否符合預期；規則、Skill 或 hook 改了就重跑，結果變差先審過再採用。 | Anthropic〈The AI-native SDLC playbook〉 |\n| 意圖 | 一件工作要什麼、為什麼、有哪些限制，用三行寫下；規格與計畫都從它開始。 | Anthropic〈The AI-native SDLC playbook〉 |\n| 監控門檻 | 上線後由監控系統自動判斷的界線（例如錯誤率、回應時間）；超出就先診斷，再寫成下一輪的意圖。 | Anthropic〈The AI-native SDLC playbook〉 |\n| 信賴區間 | 估計值可能落在的範圍；區間同時包含變快與變慢（跨過零）時，就不能確定有沒有變快。 | METR〈We are Changing our Developer Productivity Experiment Design〉 |\n| 認知債（Cognitive debt） | 程式能跑，但團隊裡沒有人真正懂它怎麼運作；Agent 改得越快越容易累積。 | Thoughtworks〈Technology Radar Vol. 34〉 |\n\n## 延伸閱讀\n- 〈State of AI-assisted Software Development 2025〉（DORA，2025）\n- 〈Introducing DORA's inaugural AI Capabilities Model〉（Google Cloud，2025）\n- 〈We are Changing our Developer Productivity Experiment Design〉（METR，2026）\n- 〈The AI Productivity Paradox Report 2025〉（Faros AI，2025）\n- 〈Redesigning source control at Anthropic〉（Anthropic，2026）\n- 〈Technology Radar Vol. 34〉（Thoughtworks，2026）\n- 〈The results of the 2026 Developer Survey are here!〉（Stack Overflow，2026）\n- 〈2025 Developer Survey — AI〉（Stack Overflow，2025）\n- 〈Manage costs effectively〉（Anthropic，官方文件）\n- 〈The AI-native SDLC playbook〉（Anthropic，2026）\n- 〈DORA's software delivery performance metrics〉（DORA，2026）\n- 〈Equipping agents for the real world with Agent Skills〉（Anthropic，2025）\n- 〈Best practices for Claude Code〉（Anthropic，官方文件）\n- 〈How AI is transforming work at Anthropic〉（Anthropic，2025）\n"}]};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;
const el = id => document.getElementById(id);
let index = 0, notesVisible = false, running = false, accumulated = 0, startedAt = 0;
const overview = el('overview');
function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {
  const available = Math.max(100, innerHeight - document.querySelector('nav').offsetHeight - 18);
  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `${SPEECH_DATA.title.split('：')[0]} · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / ${String(SPEECH_DATA.minutes).padStart(2,'0')}:00`;el('timer').classList.toggle('over',secs>=SPEECH_DATA.minutes*60);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
SPEECH_DATA.downloads.forEach(d=>{const b=node('button',d.label);b.onclick=()=>save(d.name,d.text);el('downloads').append(b);});
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&(e.target.closest('textarea,input,select')||(e.target.closest('button')&&[' ','Enter'].includes(e.key))))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
</body>
