<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "回看 Greenfield", "title": "從 Idea 到可開發的專案", "lead": "第一階段 · Greenfield（從頭開始的新專案）／Tool（把 Agent 當工具使用） · 操作教學", "cards": [["今天要完成", "在自己的新資料夾，留下一套開發依據：需求、MVP（Minimum Viable Product，最小可行產品）、使用者故事、驗收條件、業務流程、Gherkin（用 Given／When／Then 寫測試情境的格式）與架構文件。"], ["工作方式", "你確認問題與規則；Agent 協助整理與細化。每一步審查後才繼續。"]], "check": "完成時，一個核心訂票情境可以從需求一路追到測試與模組責任。", "notes": "本簡報用於 Greenfield 實作後的講解與引導操作。時間配置待確認，不把全部操作塞入既有29–33分鐘的Time Skip（時間快轉：專案假設已開發一段時間）。可以逐段使用；後續階段各有獨立簡報。請學員使用新的練習目錄，保留剛才成果。"}, {"id": "why", "chapter": "回看 Greenfield", "title": "剛才的順利，哪些來自事先準備？", "lead": "打開剛才的 G0（Greenfield 起始程式包）：先找到文件，再找到程式入口。", "cards": [["需求已明確", "四個 API、16 項商業規則、15 項驗收條件；限制了第一版範圍。"], ["骨架已備妥", "型別、分層、固定資料、模擬付款、Health（健康檢查端點）與測試骨架；留下11個主要TODO（待完成的程式標記）。"]], "prompt": "先不要修改檔案。閱讀目前G0的README、docs與tests，盤點哪些需求、規則、架構與驗證方式已準備好。列出檔案來源、這項準備消除了什麼不確定性，以及仍需要我決定的事項。", "check": "指出一項對你有幫助的準備與檔案位置；未觀察到順利時，記錄真實卡點。", "notes": "不預設每位學員都順利。G0初始測試結果1 passed／8 skipped（1項通過、8項跳過）只代表骨架，不代表MVP完成。詢問卡點屬需求、環境、實作或審查哪一類。順利是討論題，不是效率實測結論。來源：G0→G1差異說明（G1是G0補完11個TODO後的完成版）、學員版需求與AC（Acceptance Criteria，驗收條件）。"}, {"id": "chain", "chapter": "回看 Greenfield", "title": "把準備工作重新做一次", "lead": "選用同一個案例：成人與學生一起訂票。", "flow": ["構想（Idea）／docs", "MVP工作項目", "使用者故事／使用案例", "驗收條件（AC）", "業務流程（Business Flow）", "Gherkin測試情境", "分層架構"], "cards": [["每次只往前一步", "先讀來源 → 提出草稿 → 人確認 → 保存文件 → 再細化。"], ["文件可往回修", "流程暴露新問題時，回頭補使用者故事或驗收條件，保留調整理由。"]], "check": "所有文件使用相同規則與識別碼；Agent補出的假設先標記，等你決定。", "notes": "這是準備過程重建，尚未開始業務程式實作。文件間存在回饋循環。以一個情境完整貫穿，其他情境由學員延伸。"}, {"id": "folder", "chapter": "01 空資料夾", "title": "建立自己的空專案", "lead": "在自行選定的練習位置建立新資料夾，並用編輯器開啟。", "code": "# PowerShell\nNew-Item -ItemType Directory -Path smart-ticket-idea\nSet-Location smart-ticket-idea\nNew-Item -ItemType Directory -Path docs\n\n# bash（擇一執行）\nmkdir smart-ticket-idea\ncd smart-ticket-idea\nmkdir docs", "cards": [["連接 Agent", "讓你的 Coding Agent（能讀寫檔案、協助寫程式的 AI 助手）使用這個新資料夾；只在此處讀寫。"], ["準備來源", "取得本教材的 practice/idea.md；複製到新專案的 docs/idea.md。"]], "check": "確認位置正確且docs/idea.md可讀；若資料夾已存在，改用新名稱。", "notes": "不要在教材作者的Repo根目錄執行。先建立獨立目錄再連接Agent。可手動用檔案總管建立；不綁定IDE或Agent專屬功能。idea.md可由投影頁下載，或由講者提供practice目錄。"}, {"id": "idea", "chapter": "02 Idea 放入 docs", "title": "先保存業務原意", "lead": "開啟 docs/idea.md，讀完後用自己的話說明問題。", "cards": [["目標與流程", "旅客查詢班次、為1–4人訂票、模擬付款，成功後取得訂單。"], ["規則與限制", "成人100%、學生75%、逐人加總；本機虛構資料、固定日期、In-Memory（資料只存在記憶體，重啟即清空）、無前端或真實付款。"]], "prompt": "請閱讀docs/idea.md，先不要寫程式。整理問題、使用者、目標、核心情境、已明定規則與限制，寫入docs/01-project-brief.md。每項結論標示來源；來源未提到的內容列為待確認問題，不自行補成需求。完成後等我審查。", "check": "產出01-project-brief.md；指出一個假設或缺口，決定保留待確認還是補充規則。", "notes": "提醒學員：哪份來源算數，由人確認。Idea不是越長越好。此處第一次使用可下載教材；不要填真實資料。講者可示範Agent擅自新增登入時，要求移除並回到來源範圍。"}, {"id": "mvp", "chapter": "03 MVP 工作項目", "title": "把第一版切成可驗證的工作", "lead": "MVP：用最少功能完整走完核心流程的第一版；今天就是查詢→訂票→付款→訂單。每一階段都寫出能驗證的成果。", "cards": [["M1 查詢", "班次資料、只列可售班次、精確篩選。"], ["M2 訂票", "人數與容量驗證、逐人計價、保留座位。"], ["M3 付款與訂單", "成功付款、唯一訂單、重複與失敗處理。"], ["M4 完整交付", "串起四個API、測試、文件與交付摘要。"]], "prompt": "依已確認的docs/idea.md與01-project-brief.md，產生docs/02-mvp-plan.md。將本次MVP拆為M1查詢、M2訂票、M3付款與訂單、M4完整交付；每階段列目標、工作ID、依賴、可驗證產出及不處理項目。每個工作應可獨立審查；不要引入新功能。等我確認優先順序。", "check": "M1–M4是同一版MVP的工作階段；只有查詢完成時，仍是部分成果。", "notes": "M1–M4為本講解課（Speech）的教學拆分，不是G0／G1的版本標籤（Git Tag）。保留Greenfield四API與完整交付範圍。每階段測試跟著做，M4補完整回歸測試（Regression：確認舊功能沒被改壞）；不要把所有測試拖到最後。"}, {"id": "task", "chapter": "03 MVP 工作項目", "title": "練習：讓工作項目能被接手", "lead": "選M2，補上工作ID、規則與驗證方式。", "code": "TASK-GF-02：建立核心訂票\n輸入：Trip ID、1–4位旅客與旅客類型\n依據：BOOKING-001～005、FARE-001～004\n工作：驗證 → 逐人計價 → 建立待付款訂票 → 保留座位\n產出：使用案例、票價Policy、API與測試\n驗證：T001成人＋學生＝1225，座位20→18\n失敗：0／5人、班次不存在、容量不足；無部分寫入", "check": "說出這項工作依賴什麼，以及完成後如何驗證；無法回答時先補文件。", "notes": "TASK-GF-02是本講解課用的工作ID，不取代既有的任務登錄表（Registry）。細分工作可接受不同ID，但需對應規則與完成條件。學員可先填驗證案例，暫不指定類別與函式。"}, {"id": "story", "chapter": "04 使用者故事／使用案例", "title": "從工作項目，回到使用者情境", "lead": "使用者故事說明「誰、想做什麼、為了什麼價值」；使用案例寫出使用者與系統一步步的互動與例外。先說清楚使用者要什麼，再安排實作。", "cards": [["使用者故事（User Story）", "身為旅客，我希望為同行成人與學生一次訂票，以取得各自正確票價並保留座位。"], ["使用案例（Use Case）", "前置：班次可售。主流程：選班次→填旅客→確認總價→建立訂票。例外：人數不合法、班次不存在、容量不足。"]], "prompt": "依02-mvp-plan.md，將每個工作項目對應到User Story或Use Case，寫入docs/03-stories.md。先完整細化TASK-GF-02：列角色、目的、前置、主流程、例外、後置狀態與規則編號（Rule ID，例如FARE-002）。技術工作可列為支援任務，不硬寫成使用者需求。未知內容標待確認，等我審查。", "check": "使用者故事描述價值；使用案例描述互動。檢查每個工作都有情境或支援任務的依據。", "notes": "不要求Story與Use Case兩份都做。此例一起展示差異，學員可選合適形式。Infrastructure（資料存取、外部介面等基礎設施）等技術工作不需虛構使用者。一個故事可對應多個工作項目，反之亦然。"}, {"id": "acceptance", "chapter": "05 驗收條件", "title": "把「正確」寫成可判定的結果", "lead": "驗收條件（AC，Acceptance Criteria）：事先寫好、能明確判定符合或不符合的完成標準。先手算：700＋700×75%＝1225。", "cards": [["AC-G-005／009", "成人＋學生訂票：總額1225、整數、PENDING_PAYMENT（待付款）、座位20→18。"], ["AC-G-006～008", "0人／5人拒絕；4人容量足夠可接受；僅剩1座卻訂2人拒絕且座位不變。"]], "prompt": "依idea.md與03-stories.md，產生docs/04-acceptance.md。沿用來源AC-G識別碼與Rule ID；每列寫前置、操作、可觀察結果。先完整寫訂票正常、人數邊界、容量不足與班次不存在；再列付款與查詢條件。不要新增未明定錯誤碼，缺口列待確認。等我審查。", "check": "每個條件能判斷符合／不符合；避免只寫「正常運作」「錯誤處理完善」。", "notes": "AC-G-013 要求 Booking／Order 不存在回 404；Trip 不存在依需求澄清也回 404。保留0人與5人均不消耗座位的要求。"}, {"id": "flow", "chapter": "06 業務流程", "title": "把功能串成狀態與資料變化", "lead": "業務流程（Business Flow）：串起查詢、訂票、付款與訂單；成功和失敗都要有出口。", "flow": ["查詢可售班次（Trip）", "驗證旅客與容量", "逐人計價", "訂票（Booking）待付款＋保留座位", "模擬付款成功", "Booking已付款＋唯一訂單（Order）"], "cards": [["訂票拒絕", "不建立Booking，不扣座位；回傳明確錯誤。"], ["付款失敗", "不建立Order、不標PAID；訂票維持待付款，座位仍保留。"]], "prompt": "依03-stories.md與04-acceptance.md，建立docs/05-business-flow.md。用文字流程或Mermaid（用文字描述流程圖的語法）呈現查詢→訂票→付款→訂單，標示驗證點、狀態與資料變化；補上訂票失敗、付款失敗、重複付款。逐一核對Rule／AC，不確定的分支先列問題，不改規則。", "check": "付款前不能已有Order；付款成功只有一筆Order；失敗不誤標已付款。", "notes": "Greenfield付款失敗保留待付款（pending）與座位是G1既有行為，不套用後續團體取消。不要把PAID（Booking狀態）與SUCCESS（付款狀態）混為一談。流程可用簡單文字，不依賴繪圖套件。"}, {"id": "flow-review", "chapter": "06 業務流程", "title": "停下來：用流程反查驗收條件", "lead": "一位同學說明流程，另一位只追問狀態與證據。", "cards": [["追問一", "付款成功後又收到一次付款請求，會新增第二筆Order嗎？"], ["追問二", "票價已算出但容量不足，系統是否留下半筆Booking或扣掉座位？"], ["追問三", "付款失敗時，Booking、Order、座位各是什麼狀態？"], ["保存決策", "將缺漏補回04-acceptance.md，再同步05-business-flow.md；記錄來源與理由。"]], "check": "流程與驗收條件不能各說各話；無法決定的分支保留待確認。", "notes": "個人活動可由講者挑一位口述，其餘人自查；不強制重新分組。不引入額外退款政策。若Agent產生自動釋放座位，指回idea來源修正。"}, {"id": "gherkin", "chapter": "07 Gherkin", "title": "讓測試情境讀起來像業務範例", "lead": "Gherkin：用接近口語的步驟寫測試情境，業務與開發都讀得懂。Given：前置狀態 · When：一次操作 · Then：可觀察結果", "code": "@AC-G-005 @AC-G-009\nFeature: 核心訂票\n  Scenario: 成人與學生一起訂票\n    Given 狀態已重置，T001基本票價700且剩餘20座\n    When 為T001建立一位成人與一位學生的訂票\n    Then 訂票總額為1225且為整數\n    And 訂票狀態為PENDING_PAYMENT，T001剩餘18座", "prompt": "將04-acceptance.md與05-business-flow.md轉為docs/06-booking.feature，使用英文Gherkin關鍵字與中文敘述。用AC標籤追溯；涵蓋混合訂票、人數0／4／5、容量不足、班次不存在、付款成功／失敗與重複付款。每個情境重置資料；驗證結果由來源規則推導，未知內容列待確認。", "check": "預期金額先由人核對；同一情境的When只描述本次要驗證的操作。", "notes": "使用英文關鍵字，避免依賴語系設定（# language）。@AC-G-005這類寫法是有效的Gherkin標籤（tag）。可下載練習參考feature，在自行完成草稿後比較。它是描述文件，尚無把步驟接到程式的step definitions，也沒有BDD（Behavior-Driven Development，行為驅動開發）執行工具，不能直接執行。"}, {"id": "gherkin-boundary", "chapter": "07 Gherkin", "title": "操作：補上人數邊界", "lead": "用Scenario Outline（情境範本：同一組步驟，依Examples表格逐列代入不同輸入）把相同操作的不同輸入放在一起。", "code": "@AC-G-006 @AC-G-007\nScenario Outline: 驗證旅客人數\n  Given 狀態已重置，T001剩餘20座\n  When 為T001建立\u003ccount\u003e位成人的訂票\n  Then 建立結果為\u003cresult\u003e\n  And 剩餘座位為\u003cseats\u003e\n  Examples:\n    | count | result | seats |\n    | 0     | 拒絕   | 20    |\n    | 4     | 成功   | 16    |\n    | 5     | 拒絕   | 20    |", "check": "每一列從乾淨狀態開始；拒絕案例還要確認沒有新增Booking。", "notes": "學員應把拒絕不新增Booking寫進獨立情境，或另加清楚的結果欄位。不要讓多列消耗前列座位。四人案例須容量足夠。"}, {"id": "tests", "chapter": "07 Gherkin", "title": "從情境，接到可執行測試", "lead": "本案例用pytest；將Given／When／Then分別落到準備、操作與斷言。", "code": "# pytest示意：需要client與memory_store fixture\ndef test_mixed_booking(client, memory_store):\n    response = client.post('/bookings', json={\n        'trip_id': 'T001', 'passengers': [\n            {'passenger_id': 'P1', 'name': 'Adult', 'passenger_type': 'ADULT'},\n            {'passenger_id': 'P2', 'name': 'Student', 'passenger_type': 'STUDENT'}]})\n    assert response.status_code == 201\n    body = response.json()\n    assert body['total_fare'] == 1225 and type(body['total_fare']) is int\n    assert body['status'] == 'PENDING_PAYMENT'\n    assert memory_store.trips['T001'].available_seats == 18", "check": "現在先記錄對應；空專案還沒有App或fixture（pytest的測試前置準備）。Gherkin檔案本身不代表測試已執行。", "notes": "這段只示範情境怎麼對應到pytest，非空專案直接可跑。實作後由fixture每次重置資料。來源：G1的test_mixed_booking_reserves_seats。票價計算可寫單元測試（unit）、訂票使用案例可寫服務層測試（service）、HTTP可寫整合測試（integration）。不要求安裝BDD套件。"}, {"id": "architecture", "chapter": "08 分層架構", "title": "讓規則與流程有清楚的落點", "lead": "每層只做一類事；Domain（領域層：業務核心）不依賴FastAPI。", "flow": ["API／Schemas（介面層）：HTTP與輸入輸出", "Application（應用層）：協調訂票使用案例", "Domain：模型與票價規則"], "cards": [["Infrastructure（基礎設施層）", "記憶體資料存取、預設測試資料（Seed）、模擬付款。"], ["依賴方向", "API→Application→Domain；各層的實作在程式入口（main.py）串接起來。"]], "prompt": "依已確認的docs/01至06文件，建立docs/07-architecture.md。採API、Schemas、Application、Domain、Infrastructure輕量分層；列模組責任、依賴、入口組裝、Repository契約與測試方式。以訂票使用案例逐步說明在哪層驗證、計價、保存與轉HTTP回應。Domain不依賴FastAPI，不新增資料庫或外部服務；先不要寫業務程式。", "check": "學生75%在Domain的票價Policy（規則物件）；HTTP轉換在API；訂票協調在Application。", "notes": "Repository契約可用輕量Protocol或等價介面，不要求龐大抽象。分層圖是責任與依賴圖，不是每個請求依次穿過所有層。Schemas由API使用；Infrastructure的轉接實作（adapter）由程式入口注入。"}, {"id": "layout", "chapter": "08 分層架構", "title": "把架構轉成可開工的檔案規劃", "lead": "先核准架構，再請Agent建立目錄與責任說明。", "code": "docs/                         # 已確認的開發依據\nsrc/smart_ticket/\n  main.py                     # App與依賴組裝\n  api/、schemas/              # Router、HTTP錯誤轉換；Request／Response\n  application/                # 查詢、訂票、付款、訂單使用案例\n  domain/                     # 模型、票價Policy、Repository契約\n  infrastructure/             # In-Memory、Seed、Mock Payment\ntests/unit/、integration/     # 規則與使用案例；HTTP與完整流程", "prompt": "依我已核准的07-architecture.md，列出預計建立的目錄與檔案及每個檔案的責任，寫入docs/08-file-plan.md。維持Python3.13、FastAPI、Pydantic2、pytest與In-Memory。提出骨架建立計畫，等我確認後才建立目錄與README；不實作業務邏輯，不安裝新套件。", "check": "目錄與責任對得上；未核准時保留檔案計畫，不提前寫程式。", "notes": "這是空專案演練的檔案規劃，不覆蓋學員G0。可以建立只有README的目錄，稍後才實作；不要把空.py檔案當可啟動程式。保持既有技術選型（Python3.13、FastAPI等）。"}, {"id": "trace", "chapter": "交付與回看", "title": "用一條追溯鏈核對所有文件", "lead": "追溯鏈：從工作項目一路連到規則、驗收條件、測試情境與程式模組，每一環都找得到依據。選混合訂票情境，親手走一遍。", "flow": ["TASK-GF-02", "同行成人與學生的使用者故事", "FARE-002／003", "AC-G-005／009", "混合訂票情境（Scenario）", "FarePolicy＋Booking使用案例＋測試"], "prompt": "請交叉檢查docs/idea.md及01至08文件，產生docs/09-traceability.md。每列連結工作ID、Story／Use Case、Rule ID、AC、Gherkin情境、模組與預計測試。指出孤立需求、漏測條件、規則矛盾與未決問題，不自行改規則。最後列已完成、未完成與待我決定項目。", "check": "至少一條完整鏈；付款失敗、重複付款與容量不足都有對應情境。", "notes": "預計測試不等於實測證據。架構尚未實作時標planned（預計）。來源Rule與AC不能被Agent生成的新文件覆蓋；衝突由人決定。"}, {"id": "handover", "chapter": "交付與回看", "title": "保存現況，讓下一步可以開始", "lead": "這次交付的是開發依據；完成實作後仍需測試與檢視（Review）。", "cards": [["交付資料夾", "docs/idea.md與01–09文件；附未決問題、版本與人的確認紀錄。"], ["下一步指令", "請Agent依核准文件提出第一個實作計畫。人確認後，才執行、測試與審查變更差異（Diff）。"]], "prompt": "請整理本次文件交付摘要，寫入docs/10-handover.md：列文件、已確認決策、尚未確認事項、下一個可執行工作與驗證方式。明確標記程式／測試尚未實作或執行；不要宣稱MVP完成。先提出下一步計畫，等我確認。", "check": "離場前：能說明一項事先準備如何減少不確定性，並展示自己的文件與待辦。", "notes": "收取真實完成範圍；不足時間可只交Idea、Story、AC、Gherkin與待辦。完整文件練習與原22分鐘MVP完成度分開記錄。後續獨立deck再處理既有系統理解與團隊協作，這裡不提前揭露任務解法。"}], "handout": "# Greenfield：從 Idea 到可開發的專案\n\n\u003e 讀者：學員。時機：45分鐘引導操作。前置：獨立練習目錄與可用的Coding Agent。\n\n在新目錄進行；每步由人確認。程式與測試未執行時，標記未驗證。\n\n## 1. 從 Idea 到可開發的專案\n\n第一階段 · Greenfield（從頭開始的新專案）／Tool（把 Agent 當工具使用） · 操作教學\n\n- **今天要完成**：在自己的新資料夾，留下一套開發依據：需求、MVP（Minimum Viable Product，最小可行產品）、使用者故事、驗收條件、業務流程、Gherkin（用 Given／When／Then 寫測試情境的格式）與架構文件。\n\n- **工作方式**：你確認問題與規則；Agent 協助整理與細化。每一步審查後才繼續。\n\n**人工確認**：完成時，一個核心訂票情境可以從需求一路追到測試與模組責任。\n\n## 2. 剛才的順利，哪些來自事先準備？\n\n打開剛才的 G0（Greenfield 起始程式包）：先找到文件，再找到程式入口。\n\n- **需求已明確**：四個 API、16 項商業規則、15 項驗收條件；限制了第一版範圍。\n\n- **骨架已備妥**：型別、分層、固定資料、模擬付款、Health（健康檢查端點）與測試骨架；留下11個主要TODO（待完成的程式標記）。\n\n### 交給 Agent 的指令\n\n先不要修改檔案。閱讀目前G0的README、docs與tests，盤點哪些需求、規則、架構與驗證方式已準備好。列出檔案來源、這項準備消除了什麼不確定性，以及仍需要我決定的事項。\n\n**人工確認**：指出一項對你有幫助的準備與檔案位置；未觀察到順利時，記錄真實卡點。\n\n## 3. 把準備工作重新做一次\n\n選用同一個案例：成人與學生一起訂票。\n\n構想（Idea）／docs → MVP工作項目 → 使用者故事／使用案例 → 驗收條件（AC） → 業務流程（Business Flow） → Gherkin測試情境 → 分層架構\n\n- **每次只往前一步**：先讀來源 → 提出草稿 → 人確認 → 保存文件 → 再細化。\n\n- **文件可往回修**：流程暴露新問題時，回頭補使用者故事或驗收條件，保留調整理由。\n\n**人工確認**：所有文件使用相同規則與識別碼；Agent補出的假設先標記，等你決定。\n\n## 4. 建立自己的空專案\n\n在自行選定的練習位置建立新資料夾，並用編輯器開啟。\n\n- **連接 Agent**：讓你的 Coding Agent（能讀寫檔案、協助寫程式的 AI 助手）使用這個新資料夾；只在此處讀寫。\n\n- **準備來源**：取得本教材的 practice/idea.md；複製到新專案的 docs/idea.md。\n\n```text\n# PowerShell\nNew-Item -ItemType Directory -Path smart-ticket-idea\nSet-Location smart-ticket-idea\nNew-Item -ItemType Directory -Path docs\n\n# bash（擇一執行）\nmkdir smart-ticket-idea\ncd smart-ticket-idea\nmkdir docs\n```\n\n**人工確認**：確認位置正確且docs/idea.md可讀；若資料夾已存在，改用新名稱。\n\n## 5. 先保存業務原意\n\n開啟 docs/idea.md，讀完後用自己的話說明問題。\n\n- **目標與流程**：旅客查詢班次、為1–4人訂票、模擬付款，成功後取得訂單。\n\n- **規則與限制**：成人100%、學生75%、逐人加總；本機虛構資料、固定日期、In-Memory（資料只存在記憶體，重啟即清空）、無前端或真實付款。\n\n### 交給 Agent 的指令\n\n請閱讀docs/idea.md，先不要寫程式。整理問題、使用者、目標、核心情境、已明定規則與限制，寫入docs/01-project-brief.md。每項結論標示來源；來源未提到的內容列為待確認問題，不自行補成需求。完成後等我審查。\n\n**人工確認**：產出01-project-brief.md；指出一個假設或缺口，決定保留待確認還是補充規則。\n\n## 6. 把第一版切成可驗證的工作\n\nMVP：用最少功能完整走完核心流程的第一版；今天就是查詢→訂票→付款→訂單。每一階段都寫出能驗證的成果。\n\n- **M1 查詢**：班次資料、只列可售班次、精確篩選。\n\n- **M2 訂票**：人數與容量驗證、逐人計價、保留座位。\n\n- **M3 付款與訂單**：成功付款、唯一訂單、重複與失敗處理。\n\n- **M4 完整交付**：串起四個API、測試、文件與交付摘要。\n\n### 交給 Agent 的指令\n\n依已確認的docs/idea.md與01-project-brief.md，產生docs/02-mvp-plan.md。將本次MVP拆為M1查詢、M2訂票、M3付款與訂單、M4完整交付；每階段列目標、工作ID、依賴、可驗證產出及不處理項目。每個工作應可獨立審查；不要引入新功能。等我確認優先順序。\n\n**人工確認**：M1–M4是同一版MVP的工作階段；只有查詢完成時，仍是部分成果。\n\n## 7. 練習：讓工作項目能被接手\n\n選M2，補上工作ID、規則與驗證方式。\n\n```text\nTASK-GF-02：建立核心訂票\n輸入：Trip ID、1–4位旅客與旅客類型\n依據：BOOKING-001～005、FARE-001～004\n工作：驗證 → 逐人計價 → 建立待付款訂票 → 保留座位\n產出：使用案例、票價Policy、API與測試\n驗證：T001成人＋學生＝1225，座位20→18\n失敗：0／5人、班次不存在、容量不足；無部分寫入\n```\n\n**人工確認**：說出這項工作依賴什麼，以及完成後如何驗證；無法回答時先補文件。\n\n## 8. 從工作項目，回到使用者情境\n\n使用者故事說明「誰、想做什麼、為了什麼價值」；使用案例寫出使用者與系統一步步的互動與例外。先說清楚使用者要什麼，再安排實作。\n\n- **使用者故事（User Story）**：身為旅客，我希望為同行成人與學生一次訂票，以取得各自正確票價並保留座位。\n\n- **使用案例（Use Case）**：前置：班次可售。主流程：選班次→填旅客→確認總價→建立訂票。例外：人數不合法、班次不存在、容量不足。\n\n### 交給 Agent 的指令\n\n依02-mvp-plan.md，將每個工作項目對應到User Story或Use Case，寫入docs/03-stories.md。先完整細化TASK-GF-02：列角色、目的、前置、主流程、例外、後置狀態與規則編號（Rule ID，例如FARE-002）。技術工作可列為支援任務，不硬寫成使用者需求。未知內容標待確認，等我審查。\n\n**人工確認**：使用者故事描述價值；使用案例描述互動。檢查每個工作都有情境或支援任務的依據。\n\n## 9. 把「正確」寫成可判定的結果\n\n驗收條件（AC，Acceptance Criteria）：事先寫好、能明確判定符合或不符合的完成標準。先手算：700＋700×75%＝1225。\n\n- **AC-G-005／009**：成人＋學生訂票：總額1225、整數、PENDING_PAYMENT（待付款）、座位20→18。\n\n- **AC-G-006～008**：0人／5人拒絕；4人容量足夠可接受；僅剩1座卻訂2人拒絕且座位不變。\n\n### 交給 Agent 的指令\n\n依idea.md與03-stories.md，產生docs/04-acceptance.md。沿用來源AC-G識別碼與Rule ID；每列寫前置、操作、可觀察結果。先完整寫訂票正常、人數邊界、容量不足與班次不存在；再列付款與查詢條件。不要新增未明定錯誤碼，缺口列待確認。等我審查。\n\n**人工確認**：每個條件能判斷符合／不符合；避免只寫「正常運作」「錯誤處理完善」。\n\n## 10. 把功能串成狀態與資料變化\n\n業務流程（Business Flow）：串起查詢、訂票、付款與訂單；成功和失敗都要有出口。\n\n查詢可售班次（Trip） → 驗證旅客與容量 → 逐人計價 → 訂票（Booking）待付款＋保留座位 → 模擬付款成功 → Booking已付款＋唯一訂單（Order）\n\n- **訂票拒絕**：不建立Booking，不扣座位；回傳明確錯誤。\n\n- **付款失敗**：不建立Order、不標PAID；訂票維持待付款，座位仍保留。\n\n### 交給 Agent 的指令\n\n依03-stories.md與04-acceptance.md，建立docs/05-business-flow.md。用文字流程或Mermaid（用文字描述流程圖的語法）呈現查詢→訂票→付款→訂單，標示驗證點、狀態與資料變化；補上訂票失敗、付款失敗、重複付款。逐一核對Rule／AC，不確定的分支先列問題，不改規則。\n\n**人工確認**：付款前不能已有Order；付款成功只有一筆Order；失敗不誤標已付款。\n\n## 11. 停下來：用流程反查驗收條件\n\n一位同學說明流程，另一位只追問狀態與證據。\n\n- **追問一**：付款成功後又收到一次付款請求，會新增第二筆Order嗎？\n\n- **追問二**：票價已算出但容量不足，系統是否留下半筆Booking或扣掉座位？\n\n- **追問三**：付款失敗時，Booking、Order、座位各是什麼狀態？\n\n- **保存決策**：將缺漏補回04-acceptance.md，再同步05-business-flow.md；記錄來源與理由。\n\n**人工確認**：流程與驗收條件不能各說各話；無法決定的分支保留待確認。\n\n## 12. 讓測試情境讀起來像業務範例\n\nGherkin：用接近口語的步驟寫測試情境，業務與開發都讀得懂。Given：前置狀態 · When：一次操作 · Then：可觀察結果\n\n```text\n@AC-G-005 @AC-G-009\nFeature: 核心訂票\n  Scenario: 成人與學生一起訂票\n    Given 狀態已重置，T001基本票價700且剩餘20座\n    When 為T001建立一位成人與一位學生的訂票\n    Then 訂票總額為1225且為整數\n    And 訂票狀態為PENDING_PAYMENT，T001剩餘18座\n```\n\n### 交給 Agent 的指令\n\n將04-acceptance.md與05-business-flow.md轉為docs/06-booking.feature，使用英文Gherkin關鍵字與中文敘述。用AC標籤追溯；涵蓋混合訂票、人數0／4／5、容量不足、班次不存在、付款成功／失敗與重複付款。每個情境重置資料；驗證結果由來源規則推導，未知內容列待確認。\n\n**人工確認**：預期金額先由人核對；同一情境的When只描述本次要驗證的操作。\n\n## 13. 操作：補上人數邊界\n\n用Scenario Outline（情境範本：同一組步驟，依Examples表格逐列代入不同輸入）把相同操作的不同輸入放在一起。\n\n```text\n@AC-G-006 @AC-G-007\nScenario Outline: 驗證旅客人數\n  Given 狀態已重置，T001剩餘20座\n  When 為T001建立\u003ccount\u003e位成人的訂票\n  Then 建立結果為\u003cresult\u003e\n  And 剩餘座位為\u003cseats\u003e\n  Examples:\n    | count | result | seats |\n    | 0     | 拒絕   | 20    |\n    | 4     | 成功   | 16    |\n    | 5     | 拒絕   | 20    |\n```\n\n**人工確認**：每一列從乾淨狀態開始；拒絕案例還要確認沒有新增Booking。\n\n## 14. 從情境，接到可執行測試\n\n本案例用pytest；將Given／When／Then分別落到準備、操作與斷言。\n\n```text\n# pytest示意：需要client與memory_store fixture\ndef test_mixed_booking(client, memory_store):\n    response = client.post('/bookings', json={\n        'trip_id': 'T001', 'passengers': [\n            {'passenger_id': 'P1', 'name': 'Adult', 'passenger_type': 'ADULT'},\n            {'passenger_id': 'P2', 'name': 'Student', 'passenger_type': 'STUDENT'}]})\n    assert response.status_code == 201\n    body = response.json()\n    assert body['total_fare'] == 1225 and type(body['total_fare']) is int\n    assert body['status'] == 'PENDING_PAYMENT'\n    assert memory_store.trips['T001'].available_seats == 18\n```\n\n**人工確認**：現在先記錄對應；空專案還沒有App或fixture（pytest的測試前置準備）。Gherkin檔案本身不代表測試已執行。\n\n## 15. 讓規則與流程有清楚的落點\n\n每層只做一類事；Domain（領域層：業務核心）不依賴FastAPI。\n\nAPI／Schemas（介面層）：HTTP與輸入輸出 → Application（應用層）：協調訂票使用案例 → Domain：模型與票價規則\n\n- **Infrastructure（基礎設施層）**：記憶體資料存取、預設測試資料（Seed）、模擬付款。\n\n- **依賴方向**：API→Application→Domain；各層的實作在程式入口（main.py）串接起來。\n\n### 交給 Agent 的指令\n\n依已確認的docs/01至06文件，建立docs/07-architecture.md。採API、Schemas、Application、Domain、Infrastructure輕量分層；列模組責任、依賴、入口組裝、Repository契約與測試方式。以訂票使用案例逐步說明在哪層驗證、計價、保存與轉HTTP回應。Domain不依賴FastAPI，不新增資料庫或外部服務；先不要寫業務程式。\n\n**人工確認**：學生75%在Domain的票價Policy（規則物件）；HTTP轉換在API；訂票協調在Application。\n\n## 16. 把架構轉成可開工的檔案規劃\n\n先核准架構，再請Agent建立目錄與責任說明。\n\n```text\ndocs/                         # 已確認的開發依據\nsrc/smart_ticket/\n  main.py                     # App與依賴組裝\n  api/、schemas/              # Router、HTTP錯誤轉換；Request／Response\n  application/                # 查詢、訂票、付款、訂單使用案例\n  domain/                     # 模型、票價Policy、Repository契約\n  infrastructure/             # In-Memory、Seed、Mock Payment\ntests/unit/、integration/     # 規則與使用案例；HTTP與完整流程\n```\n\n### 交給 Agent 的指令\n\n依我已核准的07-architecture.md，列出預計建立的目錄與檔案及每個檔案的責任，寫入docs/08-file-plan.md。維持Python3.13、FastAPI、Pydantic2、pytest與In-Memory。提出骨架建立計畫，等我確認後才建立目錄與README；不實作業務邏輯，不安裝新套件。\n\n**人工確認**：目錄與責任對得上；未核准時保留檔案計畫，不提前寫程式。\n\n## 17. 用一條追溯鏈核對所有文件\n\n追溯鏈：從工作項目一路連到規則、驗收條件、測試情境與程式模組，每一環都找得到依據。選混合訂票情境，親手走一遍。\n\nTASK-GF-02 → 同行成人與學生的使用者故事 → FARE-002／003 → AC-G-005／009 → 混合訂票情境（Scenario） → FarePolicy＋Booking使用案例＋測試\n\n### 交給 Agent 的指令\n\n請交叉檢查docs/idea.md及01至08文件，產生docs/09-traceability.md。每列連結工作ID、Story／Use Case、Rule ID、AC、Gherkin情境、模組與預計測試。指出孤立需求、漏測條件、規則矛盾與未決問題，不自行改規則。最後列已完成、未完成與待我決定項目。\n\n**人工確認**：至少一條完整鏈；付款失敗、重複付款與容量不足都有對應情境。\n\n## 18. 保存現況，讓下一步可以開始\n\n這次交付的是開發依據；完成實作後仍需測試與檢視（Review）。\n\n- **交付資料夾**：docs/idea.md與01–09文件；附未決問題、版本與人的確認紀錄。\n\n- **下一步指令**：請Agent依核准文件提出第一個實作計畫。人確認後，才執行、測試與審查變更差異（Diff）。\n\n### 交給 Agent 的指令\n\n請整理本次文件交付摘要，寫入docs/10-handover.md：列文件、已確認決策、尚未確認事項、下一個可執行工作與驗證方式。明確標記程式／測試尚未實作或執行；不要宣稱MVP完成。先提出下一步計畫，等我確認。\n\n**人工確認**：離場前：能說明一項事先準備如何減少不確定性，並展示自己的文件與待辦。\n\n## 完成條件\n至少一條需求到情境與模組的追溯鏈，附已確認決策、缺項與下一步；實測需另有證據。\n", "idea": "# Smart Ticket：核心訂票 Idea\n\n\u003e 讀者：學員與 Coding Agent。時機：從空資料夾準備專案。前置：建立獨立練習目錄。\n\n## 問題與目標\n\n旅客需要查詢可售班次、為自己與同行者訂票、模擬付款並取得訂單。第一版提供本機API，完成查詢→訂票→付款→訂單查詢，附測試與文件。\n\n## 四個業務入口\n\n- `GET /trips`：只列有可售座位班次；origin／destination可選且精確符合固定站名。\n- `POST /bookings`：指定trip_id與1–4位ADULT／STUDENT旅客，驗證班次與容量、逐人計價、建立待付款Booking（訂票）並立即保留座位。\n- `POST /bookings/{booking_id}/pay`：模擬付款成功後Booking為PAID（已付款）並建立唯一Order（訂單）；不得重複付款。\n- `GET /orders/{order_id}`：讀取Booking ID、金額與付款狀態；不存在回傳404。\n\n另保留 `GET /health`，回應 `{\"status\":\"ok\"}`。\n\n## 固定規則\n\n| 規則編號（Rule ID） | 規則 |\n|---|---|\n| TRIP-001／002 | 只列可售座位大於0的班次；起訖站精確篩選。 |\n| BOOKING-001／002／003 | 至少1人、最多4人、不得超過可售座位。 |\n| BOOKING-004／005 | 訂票成功立即保留座位；初始狀態PENDING_PAYMENT（待付款）。 |\n| FARE-001／002 | 成人基本票價100%、學生75%。 |\n| FARE-003／004 | 每位計價後加總；金額為整數。 |\n| PAYMENT-001／002／003 | 僅待付款可付；成功PAID；拒絕重複付款。 |\n| ORDER-001／002 | 成功付款建立唯一Order；金額等於訂票總額。 |\n\n付款失敗可由測試控制：不建立Order，不標PAID，仍待付款且保留座位。訂票被拒絕時不建立Booking或消耗座位。不存在Booking付款回傳404；不存在Trip訂票回傳明確錯誤。請求格式驗證可採FastAPI 422。\n\n## 固定資料\n\n| Trip（班次） | 起站 | 訖站 | 基本票價 | 可售座位 |\n|---|---|---|---:|---:|\n| T001 | 台北 | 台中 | 700 | 20 |\n| T002 | 台北 | 高雄 | 1500 | 8 |\n| T003 | 台中 | 高雄 | 800 | 0 |\n| T004 | 高雄 | 台北 | 1500 | 12 |\n\n日期固定，測試每次重置資料；模擬付款預設成功，可明確指定失敗，不使用隨機結果。\n\n## 驗收條件（AC，Acceptance Criteria）索引\n\n| AC | 檢核 |\n|---|---|\n| AC-G-001／002 | 無篩選列T001／002／004；台北至台中精確篩選只列T001。 |\n| AC-G-003／004／005 | T001成人700、學生525、混合1225且整數。 |\n| AC-G-006／007 | 0人與5人拒絕且不扣座位；4人容量足夠可建立。 |\n| AC-G-008 | 僅剩1座卻要求2人拒絕且座位不變；售罄不可訂。 |\n| AC-G-009 | T001兩人建立後為待付款（PENDING_PAYMENT）、座位20→18，後續查詢反映。 |\n| AC-G-010／011／012 | 成功付款PAID、唯一Order且金額一致；重複付款不新增；Order查詢正確。 |\n| AC-G-013／014 | 不存在資源依上述要求拒絕；付款失敗不建立Order或標PAID。 |\n| AC-G-015 | 完整四API流程可執行，Health正常。 |\n\n## 技術與範圍\n\nPython3.13、FastAPI、Pydantic2、pytest、Uvicorn；venv／pip／requirements.txt，src/smart_ticket 目錄結構。API、Schemas、Application、Domain、Infrastructure輕量分層；Domain不依賴FastAPI。只使用本機In-Memory（資料只存在記憶體）、固定Seed Data（系統預設的測試資料）與模擬付款。不需前端、登入、其他優惠、改退票、真實個資、外部API或資料庫。\n\n## 完成條件\n\n先形成可追溯的文件與核准計畫；實作完成與測試通過須另有實際證據。本文件是第一階段課後練習用的需求摘要，內容取自 Greenfield 需求、驗收條件與 G1（G0 補完後的版本）。正式任務仍以 G0（Greenfield 起始程式包）的文件為準。\n", "feature": "Feature: 核心訂票\n  @AC-G-005 @AC-G-009\n  Scenario: 成人與學生一起訂票\n    Given 狀態已重置，T001基本票價700且剩餘20座\n    When 為T001建立一位成人與一位學生的訂票\n    Then 訂票總額為1225且為整數\n    And 訂票狀態為PENDING_PAYMENT\n    And T001剩餘18座\n\n  @AC-G-006 @AC-G-007\n  Scenario Outline: 驗證旅客人數\n    Given 狀態已重置，T001剩餘20座\n    When 為T001建立\u003ccount\u003e位成人的訂票\n    Then 建立結果為\u003cresult\u003e\n    And 剩餘座位為\u003cseats\u003e\n    And 新增Booking筆數為\u003cbookings\u003e\n    Examples:\n      | count | result | seats | bookings |\n      | 0     | 拒絕   | 20    | 0        |\n      | 4     | 成功   | 16    | 1        |\n      | 5     | 拒絕   | 20    | 0        |\n\n  @AC-G-008\n  Scenario: 容量不足不留下部分交易\n    Given 狀態已重置，T001剩餘1座\n    When 為T001建立2位成人的訂票\n    Then 訂票被拒絕\n    And T001仍剩餘1座\n    And 不新增Booking\n\n  @AC-G-010\n  Scenario: 成功付款建立唯一訂單\n    Given 狀態已重置，已有T001成人與學生總額1225的待付款訂票\n    And 模擬付款結果設定為成功\n    When 為該訂票付款\n    Then Booking狀態為PAID\n    And 建立唯一Order且金額1225\n\n  @AC-G-011\n  Scenario: 重複付款不新增訂單\n    Given 狀態已重置，已有已付款Booking及其唯一Order\n    When 再次為該Booking付款\n    Then 付款被拒絕\n    And Order仍只有一筆\n\n  @AC-G-014\n  Scenario: 付款失敗保持待付款\n    Given 狀態已重置，已有T001一位成人的待付款訂票且剩餘19座\n    And 模擬付款結果設定為失敗\n    When 為該訂票付款\n    Then 不建立Order\n    And Booking仍為PENDING_PAYMENT\n    And T001仍剩餘19座\n"};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;
const el = id => document.getElementById(id);
let index = 0, notesVisible = false, running = false, accumulated = 0, startedAt = 0;
const overview = el('overview');
function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {
  const available = Math.max(100, innerHeight - document.querySelector('nav').offsetHeight - 18);
  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `Greenfield · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / 45:00`;el('timer').classList.toggle('over',secs>=2700);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
el('download-idea').onclick=()=>save('idea.md',SPEECH_DATA.idea);el('download-feature').onclick=()=>save('booking.feature',SPEECH_DATA.feature);el('download-handout').onclick=()=>save('greenfield-handout.md',SPEECH_DATA.handout);
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&e.target.closest('button,textarea,input,select'))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
</body>
</html>
