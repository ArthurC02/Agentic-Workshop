<script>const SPEECH_DATA = {"slides": [{"id": "start", "chapter": "開場", "title": "剛才的順利，不是運氣", "lead": "G0（Greenfield 起始程式包）先備好了 16 條規則、15 項驗收條件與測試骨架；Agent（能自己讀寫檔案、執行指令來完成工作的 AI）因此知道什麼叫做對。", "cards": [["本場回答三個問題", "Agent 怎麼知道做對了？怎麼知道要做什麼？人怎麼確認？"], ["講法", "每個做法：白話概念 → 官方說法 → 怎麼用在你的工作 → 業界案例。"]], "check": "說得出剛才 Greenfield 哪一步最順、哪一步卡住。", "explain": ["這份講義是給課後回頭讀的。投影片只放得下幾個字，這裡補上每個做法為什麼重要、證據是什麼、常見的誤解，以及下週怎麼用。數字都附上誰量的、哪一年；廠商自家的案例會特別註明。", "剛才 Greenfield 順利，是因為起始程式包先準備好三樣東西：編號的業務規則、能判定對錯的驗收條件，以及會告訴 Agent「還差什麼」的測試骨架。回到工作上，這三樣不會自己出現；你交辦的專案缺哪一樣，Agent 就只能用猜的。"], "notes": "（第 00–02 分）本場 45 分鐘，接在主課 Greenfield（第 07–30 分鐘）之後。這不是實作課：學員不寫、不讀程式，也不打指令；頁面上的提示詞是講者示範用，學員想試可以貼給自己的 Agent，不試也不影響，沒實際執行的結果一律視為未驗證。開場請 2–3 位學員各用一句話說最順與最卡的一步，記在白板，第 20 頁回來對照。數字來源：本課程〈Greenfield Business Requirements〉16 條規則、〈Greenfield Acceptance Criteria〉AC-G-001～015。本場約四分之一連回剛才的體驗，其餘是做法背後的原理、官方建議與近期案例。"}, {"id": "tool", "chapter": "開場", "title": "Tool：人一步一步介入", "lead": "Tool（工具）→ Teammate（隊友）→ Digital Worker（數位員工）差在人怎麼介入，不是人寫多少程式。", "flow": ["Tool：逐步下指令、每步驗收", "Teammate：核准計畫後才動手", "Digital Worker：只在核准關卡決定"], "cards": [["剛才的 Greenfield 是 Tool", "步驟由你定；Agent 做完一步就停，你看證據才放行下一步。"], ["為什麼從 Tool 開始", "先學會「怎麼判斷做對了」，之後才能放手讓 Agent 多做。"]], "check": "說出 Greenfield 中你「放行」了幾次，每次看了什麼證據。", "explain": ["三種方式的差別不在 Agent 多強，而在人什麼時候介入：Tool 是你決定每一步、每步驗收；Teammate 是你先核准整份計畫；Digital Worker 是你只在事先設好的核准關卡（Gate）做決定。後兩種在第三、四場展開。", "常見的誤解是「越後面越好」。其實這是依風險選擇：做錯代價高、難以復原、或還沒有自動檢查的工作，就該停在 Tool，一步一步看證據放行。"], "notes": "（第 02–04 分）Greenfield 的放行點：核准計畫、放行第 1、2 步、放行第 3、4 步、在 /docs 試完回一行。Teammate 與 Digital Worker 分別在 Speech 03、04 展開，這裡只說出三者差在人介入的方式。核准關卡（Gate）只提名稱，不展開。📖 定義出處：本課程〈歡迎與使用方式〉。"}, {"id": "loop", "chapter": "Agent 怎麼知道做對了", "title": "新概念：Agent 在迴圈裡看結果做事", "lead": "Agent 不是一次寫完答案：它讀檔、動手、看執行結果，再決定下一步，一圈一圈往前。", "flow": ["讀需求與檔案", "修改或執行", "看結果：測試、錯誤訊息", "決定下一步"], "cards": [["白話比喻", "很快、很勤勞，但第一天上班的新同事：不知道你們的規則，也不會讀心。"], ["經驗法則", "迴圈裡沒有檢查，你就是那個檢查：每一步都得等你看過才知道對不對。"], ["📖 延伸閱讀", "〈Building effective agents〉（Anthropic，2024）"]], "check": "說得出剛才 Agent 每一步「看了什麼結果」才回報：是測試輸出，還是它自己覺得完成了。", "explain": ["Agent 的運作方式是「做一點、看結果、再決定」。Anthropic 在〈Building effective agents〉（2024-12）強調，Agent 每一步都要從環境取得真實結果，例如測試輸出、錯誤訊息、指令的回傳值。它看到的結果越可靠，下一步就越準。", "所以問題不在 Agent 勤不勤勞，而在它的迴圈裡有沒有可靠的回饋。如果唯一的回饋是它自己覺得「完成了」，那每一步都要靠你檢查。G0 先準備測試骨架，就是讓測試結果成為 Agent 的真相來源。", "這個迴圈也是 Agent 和聊天式 AI 助手的差別。Claude Code 官方詞彙表的說法是：聊天助手只回一段文字，要你自己貼上、自己執行；Agent 有工具，能讀檔、改檔、執行指令，看到結果再決定下一步。官方把這一圈稱為 agentic loop：收集脈絡、動手、驗證結果，重複到完成。常見誤解是「Agent 夠聰明，就不用給檢查」：迴圈轉得再快，沒有可靠的回饋，也只是很快地猜。"], "notes": "（第 04–06 分）新概念。Anthropic〈Building effective agents〉（2024-12-19）：Agent 是模型在迴圈裡使用工具、依環境回饋行動；文中強調 Agent 每一步都要從環境取得「ground truth」（真實結果，例如工具回傳、程式執行結果）。這就是為什麼 G0 先備好測試骨架：測試結果就是 Agent 的真相來源。「沒有檢查，你就是那個檢查」改寫自 Claude Code 官方文件〈Best practices for Claude Code〉：沒有可執行的檢查時，人就變成驗證迴圈。同樣概念在 OpenAI、GitHub 的 Agent 文件也找得到，不是單一產品的說法。"}, {"id": "check-first", "chapter": "Agent 怎麼知道做對了", "title": "技巧：先給檢查，再請它做事", "lead": "官方建議：給 Agent 一個能自己執行的檢查（測試、建置、可比對的畫面），它才能自己收斂。", "cards": [["沒有檢查時", "「看起來完成」是唯一訊號，你只能相信或自己試。"], ["有檢查時", "Agent 自己跑、自己修，附上結果；你只看結果對不對。"], ["📖 延伸閱讀", "〈Best practices for Claude Code〉（Anthropic，官方文件）"]], "prompt": "先不要修改任何檔案。請告訴我這個專案現在有哪些你能自己執行的檢查（例如測試、建置、啟動後的畫面），各自目前的結果是什麼。再對照需求，列出哪些需求還沒有任何檢查能證明，並建議要補什麼檢查。列完就停下等我。", "check": "每條需求都對得到一個檢查；沒有檢查的，先決定要補檢查還是由你親自試。", "explain": ["Claude Code 官方文件〈Best practices for Claude Code〉建議：給 Agent 一個能自己執行的檢查，例如測試、建置、可比對的畫面。OpenAI Codex、GitHub Copilot 的官方文件也建議讓 Agent 執行測試來驗證，這不是單一產品的說法。", "剛才 G0 一開始是 1 個測試通過、8 個跳過；跳過的就是還沒做完的檢查，所以 Agent 每做一步都看得到進度。常見的誤解是「有測試就好」：測試只證明它檢查到的那部分，對照需求找出沒有任何檢查的項目，才是人要補的。", "下週怎麼用：接手任何專案，先貼上方的提示詞，請 Agent 盤點現有檢查、找出沒被檢查到的需求，再開始交辦工作。"], "notes": "（第 06–08 分）新技巧。原文（Claude Code 官方文件〈Best practices for Claude Code〉，持續更新）：「Give Claude a check it can run: tests, a build, a screenshot to compare.」換成你的工具也一樣：OpenAI Codex、GitHub Copilot 的官方文件都建議讓 Agent 執行測試來驗證。連回剛才：G0 起始時 1 個通過、8 個跳過，跳過的就是「還沒做完」的檢查，所以 Agent 每做一步都看得到進度。示範提示詞適合用在任何既有專案：先盤點檢查，再交辦工作。"}, {"id": "acceptance", "chapter": "Agent 怎麼知道做對了", "title": "驗收條件：把「正確」寫成可判定", "lead": "AC（Acceptance Criteria，驗收條件）：事先寫好、能明確判定符合或不符合的完成標準。它是人和 Agent 共同的真相來源。", "cards": [["好的寫法", "AC-G-005：成人＋學生訂 T001，總價 1225 且為整數。"], ["不好的寫法", "「計價正常」「錯誤處理完善」：Agent 和你都無法判定。"], ["預期值先從規則推", "成人 700＋學生 75%：看 Agent 回報前就先算好。"], ["寫給 Agent 的好處", "條件可判定，Agent 才能把它轉成測試，自己檢查。"]], "check": "每一條都能判斷「符合／不符合」；預期數字指得回一條規則編號。", "explain": ["驗收條件寫得可判定，有兩個好處：人不讀程式也能判斷，因為你事先算好了預期數字；Agent 也能把條件直接變成測試，自己檢查。像「計價正常」這種句子，誰都沒辦法說它到底有沒有達成。ISTQB 詞彙表的定義也是這個方向：驗收條件是元件或系統要被使用者、客戶或其他授權者接受前，必須滿足的條件。", "以 AC-G-005 為例：成人付基礎票價 700；學生是基礎票價的 75%，也就是 525；合計 1225，而且是整數。預期值要從規則推，而且要在看 Agent 回報之前就算好；先看回報再判斷，人很容易被一個看起來合理的數字說服。下週交辦任務前，先問自己：「完成時，我要看到什麼數字或畫面？」寫不出來，就請 Agent 先把需求改寫成可判定的條件，再由你確認。"], "read": ["〈Glossary〉（ISTQB，acceptance criteria 條目）"], "notes": "（第 08–10 分）連回剛才：主課第 3、4 步請學員把 1225 和驗收對照表比對。本頁的重點是背後的原理：可判定的條件才能變成上一頁說的「可執行的檢查」；人不讀程式，也能用預先算好的數字判斷 Agent 對不對。帶回工作：下次交辦任務，先問自己「完成時，我要看到什麼數字或畫面？」寫不出來，就先請 Agent 幫你把需求改寫成可判定的條件，再由你確認。📖 延伸閱讀：ISTQB〈Glossary〉（acceptance criteria 條目）。"}, {"id": "gherkin", "chapter": "Agent 怎麼知道做對了", "title": "Given／When／Then：可判定的好寫法", "lead": "Gherkin 用 Given（前提）／When（操作）／Then（結果）寫情境：業務方讀得懂，也能接上測試自動驗證。", "code": "Scenario: 成人與學生一起訂票\n  Given T001 基本票價 700，剩餘 20 座\n  When 為 T001 訂一位成人與一位學生\n  Then 總價為 1225 且為整數\n  And 訂票為待付款，T001 剩餘 18 座", "cards": [["人看什麼", "Then 寫看得到的結果；一個情境只有一個 When。"], ["📖 延伸閱讀", "〈Gherkin Reference〉（Cucumber，官方文件）"]], "check": "每個 Then 都能在 Agent 的回報裡找到實際結果；情境沒接上測試的標「未驗證」。", "explain": ["Cucumber 官方文件把 Gherkin 稱為「可執行的規格」：用固定的關鍵字寫情境，業務人員讀得懂，測試工具也能接上。適合用在需求還在跟業務方討論、需要用具體例子對齊的時候。", "要注意兩件事。第一，Gherkin 檔本身不會執行，要接上測試工具，情境才算被驗證；沒接上的只是寫得比較整齊的需求。第二，主課 Greenfield 並沒有使用 Gherkin 檔，測試是 Agent 直接依驗收條件補上的。", "下週怎麼用：請 Agent「把這份需求的驗收條件改寫成 Given／When／Then，每個 Then 寫看得到的結果，不確定的標待確認」，你只審每個 Then 對不對。"], "notes": "（第 10–12 分）Cucumber 官方文件說 Gherkin 用關鍵字讓規格「可執行」（executable specifications）。主課沒有 Gherkin 檔，測試由 Agent 直接依驗收條件補上，不要宣稱主課做過。什麼時候用：需求還在跟業務方討論、要用具體例子對齊時。Gherkin 檔本身不會執行，要接上測試工具才算驗證。帶回工作：請 Agent「把這份需求的驗收條件改寫成 Given／When／Then，每個 Then 寫看得到的結果，不確定的標待確認」，你只審 Then 對不對。"}, {"id": "sdd", "chapter": "Agent 怎麼知道要做什麼", "title": "規格驅動開發：先寫規格再動手", "lead": "Spec-driven development（規格驅動開發）：把需求、設計、任務寫成檔案，Agent 照規格做、人照規格審。", "flow": ["需求（含驗收條件）", "設計（例如分層架構）", "任務清單", "逐項實作與驗證"], "cards": [["三種深度", "只在開工前寫（多數做法）→ 規格隨程式維護 → 只改規格、程式由它產生。"], ["經驗法則：別用大鐵鎚敲核桃", "小改動不必走完整流程；規格大小要和任務大小相稱。"], ["業界現況", "仍在試：相關工具多列在「評估」，還不是業界標準。"], ["📖 延伸閱讀", "〈Understanding Spec-Driven-Development: Kiro, spec-kit, and Tessl〉（martinfowler.com，2025）"]], "check": "說得出 Greenfield 的規格在哪：需求、驗收條件、架構文件各是哪一份。", "explain": ["Birgitta Böckeler 在 martinfowler.com（2025-10）把規格驅動開發分成三種深度：只在開工前寫規格、規格隨程式長期維護、只改規格而程式由它產生。她觀察到多數工具停在第一種；用小 Bug 試完整流程時，她形容像「用大鐵鎚敲核桃」；她也發現 Agent 常沒照全部規格做，而且大量的規格文件本身就很難審。", "Thoughtworks 技術雷達第 34 期（2026-04）把 GitHub Spec Kit、OpenSpec 這類工具列在「評估」（Assess），不是「建議採用」，所以不要說規格驅動是業界標準。實際的做法是規格大小跟著任務走：一句話說得清楚的小改動直接做，牽涉多個檔案或規則的工作才先寫規格。剛才 G0 的需求、驗收條件與架構文件，就是第一種深度的規格。"], "read": ["〈Technology Radar Vol. 34〉（Thoughtworks，2026）"], "notes": "（第 12–14 分）Birgitta Böckeler 在 martinfowler.com（2025-10-15）把規格驅動開發分成 spec-first（先寫規格）、spec-anchored（規格隨程式長期維護）、spec-as-source（規格就是原始碼）三層，大多數工具停在第一層；她用小 bug 試 Kiro 的完整流程，形容像「用大鐵鎚敲核桃」，也觀察到 Agent 常沒照全部規格做，且大量 Markdown 很難審。AWS Kiro 文件把規格拆成需求（含驗收條件）、設計、任務三份檔。Thoughtworks Technology Radar Vol. 34（2026-04）把 GitHub Spec Kit、OpenSpec 列在 Assess（評估），而 Context engineering 列在 Adopt。連回剛才：G0 的 02 需求、03 驗收條件、docs/architecture.md 就是第一層規格；分層架構決定規則放哪，所以工作規則第 3 條能讓你不讀程式也檢查變更落點。不要說「規格驅動是業界標準」。"}, {"id": "spec-small", "chapter": "Agent 怎麼知道要做什麼", "title": "技巧：規格從短開始，請 Agent 訪談你", "lead": "先寫幾行高層次的構想，請 Agent 一次問一個問題補齊，再擴寫成規格；人只審，不從零寫。", "cards": [["為什麼有效", "Agent 擅長找出缺口；你只要回答它問的題，不必自己想到每一件事。"], ["📖 延伸閱讀", "〈How to write a good spec for AI agents〉（Addy Osmani，2026）"]], "prompt": "請讀 docs/idea.md，先不要寫程式。一次問我一個問題，釐清使用者、範圍外項目、失敗時怎麼處理。問完後寫成 docs/spec.md，分三段：需求（每條附可判定的驗收條件）、設計重點、任務清單。來源沒寫的標「待確認」，不要自行補成需求。寫完停下等我。", "check": "規格裡每個「待確認」都由你決定；沒有出現來源以外的功能（例如登入、會員）。", "explain": ["Addy Osmani〈How to write a good spec for AI agents〉（2026-01）建議：先寫精簡的高層規格，再請 AI 擴寫成詳細計畫；而且一次只交一個聚焦的任務，不要把所有事情塞進一段提示詞。Claude Code 官方文件也建議，大功能先請 Agent 訪談你、寫成規格，再開始實作。", "讓 Agent 一次問一個問題，是因為它擅長找缺口，你只要回答，不必自己想到每一件事。最常見的問題是 Agent 會「熱心補需求」，例如自己加上登入或會員功能。審規格時最重要的事，就是把來源沒寫的東西刪掉，或標成待確認由你決定。"], "notes": "（第 14–17 分）示範：在空資料夾放入可下載的 idea.md（Greenfield 需求的課後摘要）再貼提示詞，講者回答 2–3 題即可。Addy Osmani〈How to write a good spec for AI agents〉（2026-01-13）：先寫精簡的高層規格，再請 AI 擴寫成詳細計畫；並建議一次只給一個聚焦任務：規格拆成小任務，每次只交一個，不要一次全丟。Claude Code 官方文件也建議大功能先請 Agent 訪談你、寫成規格，再開始實作。示範重點：Agent 常自己補出「登入」「會員」，這時指回來源範圍，請它移除。連回剛才：主課的 MVP（最小可行產品）範圍與範圍外清單，就是由人決定、寫進提示詞的。"}, {"id": "case-airbnb", "chapter": "Agent 怎麼知道要做什麼", "title": "案例：每一步都有自動驗證", "lead": "Airbnb 用大型語言模型把近 3,500 個前端測試檔換到新的測試框架；原估 1.5 年，6 週完成。", "cards": [["做法", "逐檔、分步驟；每一步都跑驗證，失敗就把錯誤帶回去重試。"], ["結果", "4 小時自動完成 75%；調整 4 天後 97%；剩 3% 人工約一週。"], ["關鍵", "不是一次生成全部，而是「小步＋檢查＋重試」的迴圈。"], ["📖 延伸閱讀", "〈Accelerating Large-Scale Test Migration with LLMs〉（Airbnb Tech Blog）"]], "check": "說出這個案例裡的「檢查」是什麼，以及沒有它時會發生什麼。", "explain": ["這是 Charles Covey-Brandt 在 Airbnb 技術部落格公開的案例（原頁面沒有標示發布日期）。近 3,500 個 React 前端測試檔要換到新的測試框架，原本估計要 1.5 年。做法是逐檔、分步驟處理，每一步都跑驗證，失敗就把錯誤訊息帶回去重試。", "結果：4 小時內自動完成 75%，調整提示詞與脈絡 4 天後達到 97%，剩下 3% 由人工處理約一週，總共 6 週完成。值得帶走的不是「6 週」，而是方法：能放大規模，是因為每一步都有自動驗證。這是公司自己公布的成果，換到你的專案不一定有一樣的比例。"], "notes": "（第 17–19 分）Charles Covey-Brandt〈Accelerating Large-Scale Test Migration with LLMs〉，Airbnb Tech Blog：近 3.5K 個 React 測試檔從舊測試工具遷移；原估 1.5 年、6 週完成；4 小時內自動完成 75%，調整提示詞與脈絡 4 天後達 97%，剩下 3% 人工約一週。原頁面沒有顯示發布日期，所以投影片不寫年份，口頭也不要說確切日期。連回第 3 頁的迴圈：每一步都有自動驗證，所以能放大規模；這和 Greenfield「每步跑測試、附對照表」是同一個原理，只是規模不同。"}, {"id": "context", "chapter": "Agent 怎麼知道要做什麼", "title": "新概念：脈絡工程", "lead": "Context engineering（脈絡工程）：提供讓任務「有可能被解出來」的全部資訊。重點從「怎麼問」移到「給它看什麼」。", "cards": [["要給", "目標與完成標準、指名要讀的檔、限制與範圍外、一段真實範例、怎麼驗證。"], ["不要給", "整個資料夾、不相關的舊對話；多不等於好，雜訊會蓋過重點。"], ["經驗法則", "一段真實範例，勝過三段文字描述。"], ["📖 延伸閱讀", "〈Context engineering〉（Simon Willison，2025）"]], "check": "交辦前檢查：Agent 不問你，能從你給的資料推出「什麼算做完」嗎？", "explain": ["Simon Willison〈Context engineering〉（2025-06）引用 Shopify 執行長 Tobi Lütke 的定義：提供讓任務「有可能被模型解出來」的全部脈絡。Thoughtworks 技術雷達第 34 期（2026-04）把脈絡工程列為「建議採用」（Adopt）。", "常見的誤解有兩個。一是「提示詞工程過時了」：其實只是用詞轉向，寫清楚的提示詞仍是基本功。二是「給越多越好」：整個資料夾、不相關的舊對話反而會蓋過重點，原因下一場用脈絡視窗說明。GitHub 分析兩千五百多個專案的規則檔後建議：一段真實範例，勝過三段文字描述。", "下週怎麼用：交辦前問自己，Agent 不問你，能不能從你給的資料推出「什麼算做完」？推不出來，就補上目標、完成標準、要讀的檔、限制與一段範例。"], "read": ["〈Effective context engineering for AI agents〉（Anthropic，2025）", "〈How to write a great agents.md: Lessons from over 2,500 repositories〉（GitHub，2025）"], "notes": "（第 19–21 分）新概念。Simon Willison〈Context engineering〉（2025-06-27）引用 Shopify 執行長 Tobi Lütke 的定義：「the art of providing all the context for the task to be plausibly solvable by the LLM.」Thoughtworks Technology Radar Vol. 34（2026-04）把 Context engineering 列為 Adopt（建議採用）。「一段真實範例勝過三段描述」出自 GitHub Blog〈How to write a great agents.md: Lessons from over 2,500 repositories〉（2025-11-19）。Prompt engineering（提示詞工程）沒有過時，只是術語轉向，寫清楚的提示詞仍是基本功。為什麼「多不等於好」留到 Speech 02 用 Context Window（脈絡視窗）解釋，這裡只預告。連回剛才：G0 把需求、驗收條件、架構放在固定檔案，就是替 Agent 準備好脈絡。📖 延伸閱讀：Anthropic Engineering〈Effective context engineering for AI agents〉。"}, {"id": "rules", "chapter": "Agent 怎麼知道要做什麼", "title": "技巧：工作規則是每次都要的脈絡", "lead": "每次都要的要求寫進專案根目錄的 AGENTS.md；Agent 開工自動讀，提示詞只寫這次的事。", "cards": [["流程", "改之前先提計畫；只做核准的步驟，做完就停。"], ["邊界", "照分層放規則；不新增套件；不刪測試，不用跳過藏失敗。"], ["回報", "固定格式的驗收對照表與審查答案；沒執行的標「未驗證」。"], ["注意", "規則只能提醒；一定要發生的事，交給 hook 或權限把關。"]], "check": "Agent 每做完一步真的停下；每次回報都附上驗收對照表與審查答案。", "explain": ["工作規則是把每一步都會用到的要求（流程、邊界、回報格式）先寫下來，之後每段提示詞只要寫這次的事：要什麼、為什麼、完成的樣子、素材在哪。剛才 Greenfield 檢查點 1 請 Agent 在專案根目錄寫的 AGENTS.md 就是這樣：「怎麼跑」加上「工作規則」，例如做完一步就停、照分層放規則、不刪測試、固定格式回報。", "AGENTS.md 是給 Agent 看的專案說明，多數 Coding Agent 開新對話會自動讀它，但讀法各家不同。以 OpenAI Codex 為例，它從 Git 根目錄往下讀到目前資料夾，合計預設上限 32 KiB；以 Claude Code 為例，v2.1.277 起沒有 CLAUDE.md 時直接讀 AGENTS.md，兩者都有時只讀 CLAUDE.md，除非 CLAUDE.md 匯入 @AGENTS.md。讀不到時，開工先說一句「請先讀 AGENTS.md」。", "裡面只放每次都要的事（怎麼跑、慣例、邊界），每份最好在 200 行內；一步步的固定做法另存成 Skill，例如 check，用得上時 Agent 才讀全文，第三場細講。什麼時候加一行？Claude Code 官方文件的建議是：Agent 同一個錯犯第二次，或審查抓到它本來就該知道的事。", "要知道它的限制：規則是給 Agent 的脈絡，只能提醒，不能強制，Agent 可能漏做。Anthropic〈The AI-native SDLC playbook〉說得很直接：Skill 是建議性的控制，hook（在固定時機一定會自動執行的檢查）才是背後確定會發生的那一層。一定要發生的事（例如不得刪測試），要靠 hook、測試、持續整合（CI：成員頻繁把變更合併回共用的程式碼，每次合併都自動建置與測試）或權限把關，這是第四場的主題。Claude Code 官方文件也說，規則檔是脈絡，不是強制的設定。"], "read": ["〈AGENTS.md〉（OpenAI，官方文件）", "〈How Claude remembers your project〉（Anthropic，官方文件）", "〈The AI-native SDLC playbook〉（Anthropic，2026）", "〈Automate actions with hooks〉（Anthropic，官方文件）"], "notes": "（第 21–23 分）連回 Runbook Greenfield 檢查點 1：Agent 照範本寫的 AGENTS.md（怎麼跑＋工作規則）和 check Skill。工具中立：只說「多數 Coding Agent 會自動讀」，工具細節只當例子。OpenAI〈AGENTS.md〉：Codex 從專案根目錄（通常是 Git 根目錄）往下讀到目前資料夾，每層最多一個檔，越近越優先，合計預設 32 KiB。Claude Code〈How Claude remembers your project〉：沒有 CLAUDE.md 時直接讀 AGENTS.md（v2.1.277 起）；兩者都有時只讀 CLAUDE.md，除非 CLAUDE.md 匯入 @AGENTS.md。何時加一行，原文：「Claude makes the same mistake a second time」「A code review catches something Claude should have known」；只放每次都要的事實，多步驟流程放 Skill，每檔目標 200 行內。Skill 本身留到 Speech 03。限制只講一句：規則檔只是建議，hook 才是強制。原文：「A skill is an advisory control while a hook is the deterministic layer behind it.」Claude Code hooks 文件：hook 讓「certain actions always happen rather than relying on the LLM to choose to run them」。一定要發生的事（例如不得刪測試）要靠 hook、測試、持續整合或權限把關，細節是 Speech 04 的主題。同一份文件原文：「Claude treats them as context, not enforced configuration」。規則檔為什麼要短留到 Speech 02，團隊共用規則留到 Speech 03，這裡只預告。📖 延伸閱讀：OpenAI〈AGENTS.md〉；Claude Code 官方文件〈How Claude remembers your project〉；Anthropic〈The AI-native SDLC playbook〉。"}, {"id": "prompt", "chapter": "Agent 怎麼知道要做什麼", "title": "技巧：像交辦工作一樣寫提示詞", "lead": "像交辦給同事：這次要什麼、為什麼、完成的樣子、素材在哪；規則已在 AGENTS.md，不用重寫。", "code": "【要什麼】先別改程式，給我一份 4 步的實作計畫\n【為什麼】先看計畫，動手前就抓得出範圍外的項目\n【完成的樣子】寫進 notes/greenfield.md「計畫」，每步列 AC 和檔案\n【素材在哪】01 到 03 需求文件、程式裡的 TODO(GREENFIELD\n需求沒寫清楚的列成問題，每題附建議答案", "cards": [["不用重寫的", "做完就停、回報格式、不刪測試：已在 AGENTS.md 與 Skill。"], ["沒寫清楚的", "讓 Agent 列成問題、附建議答案，由你決定。"]], "check": "提示詞指名了檔案、情境和「什麼算修好」；決策點用短回覆：「同意」「選 B」。", "explain": ["Claude Code 官方文件的說法是：Agent 能推測意圖，但不會讀心。它建議提示詞指名檔案、情境與「什麼算修好」；模糊的提示詞會讓 Agent 掃過大量檔案，又慢又容易偏。", "四樣各擋掉一種常見問題：少了「素材在哪」，Agent 會讀整個資料夾或憑印象；少了「完成的樣子」，它不知道要交什麼、何時算做完；少了「為什麼」，遇到沒講到的情況只能自己猜。做完就停、回報格式、不刪測試這類每次都要的規則和固定做法，已寫在 AGENTS.md 與 Skill，工具會自己讀，提示詞只寫這次的事。", "需求沒寫清楚的，不要在提示詞裡替它補答案；請 Agent 列成問題、每題附建議答案，由你決定。下週每次交辦前，對照四樣檢查一次；寫不出來的那一樣，通常就是你自己還沒想清楚的地方。"], "read": ["〈Prompt engineering overview〉（Anthropic，官方文件）", "〈Prompting best practices〉（Anthropic，官方文件）", "〈Prompt engineering〉（OpenAI，官方文件）"], "notes": "（第 23–25 分）新技巧，是 Runbook Greenfield 檢查點 2 計畫提示詞的拆解，對應該頁「技巧：Prompt 結構」。Claude Code 官方文件〈Best practices for Claude Code〉：「Claude can infer intent, but it can't read your mind.」並建議指名檔案、情境與什麼算修好；模糊的提示詞會讓 Agent 掃大量檔案。逐樣問學員：拿掉「素材在哪」會怎樣（Agent 讀整個資料夾，或只憑印象）；拿掉「完成的樣子」會怎樣（不知道交什麼、何時停）。提示詞裡沒有「做完就停」「用白話」，因為那些已在 AGENTS.md；需求缺口（例如付款失敗怎麼處理）由 Agent 列成問題附建議答案，學員決定，講者不先寫進提示詞。原提示詞的「先仔細想過再回答」和模型選擇、推論強度有關，留到 Speech 03。📖 延伸閱讀：Anthropic 官方文件〈Prompt engineering overview〉與〈Prompting best practices〉、OpenAI 官方文件〈Prompt engineering〉。"}, {"id": "plan", "chapter": "人怎麼確認", "title": "技巧：先探索、再計畫、再實作", "lead": "先讓 Agent 讀懂現況、提出計畫，你核准後才動手；錯在計畫上，比錯在程式上便宜得多。", "flow": ["探索：只讀不改", "計畫：每步對應驗收條件", "人核准", "實作與驗證", "存一版"], "cards": [["經驗法則", "一句話講得完的改動，不用寫計畫；說不清楚的，一定要先計畫。"], ["📖 延伸閱讀", "〈Vibe engineering〉（Simon Willison，2025）"]], "prompt": "先不要修改任何檔案。請先讀需求與相關檔案，再提出實作計畫：每一步寫要改哪些檔案、對應哪條驗收條件、用什麼檢查證明完成。如果這個改動一句話就說得完，直接告訴我不需要計畫。寫完停下等我核准。", "check": "計畫每一步都有檔案、驗收條件與檢查；沒有範圍外的項目才核准。", "explain": ["Claude Code 官方文件建議四步：探索、計畫、實作、存一版；並說「如果一句話就能描述這次改動，就跳過計畫」。Simon Willison〈Vibe engineering〉（2025-10）也說，先有高層計畫再動手，結果好得多。", "先計畫的理由是成本：計畫錯了，改幾行字；程式改錯了，要找出來、還原、再重做。很多工具有「只規劃、不修改」的模式，但不是必要；在提示詞寫「先不要修改任何檔案」就做得到。審計畫時看三件事：每一步有沒有對應的驗收條件、有沒有說用什麼檢查證明完成、有沒有範圍外的項目。"], "notes": "（第 25–28 分）Claude Code 官方文件〈Best practices for Claude Code〉建議 Explore → Plan → Implement → Commit 四步，並說：「If you could describe the diff in one sentence, skip the plan.」Simon Willison〈Vibe engineering〉（2025-10-07）：「Sitting down to hack something together goes much better if you start with a high level plan.」很多工具有「只規劃、不修改」的模式，可以當例子提，但不是必要；用提示詞說「先不要修改任何檔案」就做得到。連回剛才：主課檢查點 2 就是計畫，核准紀錄寫進 notes/greenfield.md。到 Speech 03 Teammate，人介入方式會變成「只核准計畫」。"}, {"id": "small-steps", "chapter": "人怎麼確認", "title": "小步驗證：錯了只退一小步", "lead": "一次只放行一小段；每段都有檢查和存檔點，錯了只退回上一段。大型專案也是這樣做的。", "flow": ["核准計畫", "做第 1、2 步", "審查後放行", "做第 3、4 步", "審查後放行"], "cards": [["案例：先試 6 個檔", "一次大型遷移先只轉 6 個檔，抓到 2 個規則問題，才擴大到 1,448 個檔。"], ["案例：測試當裁判", "近百萬行的程式換語言，既有測試全部通過才合併。"], ["放行前三問", "改的檔案都在計畫裡？測試數沒變少？沒改既有期待值？"], ["📖 延伸閱讀", "〈How Anthropic runs large-scale code migrations with Claude Code〉（Anthropic，2026）"]], "check": "說得出你哪一次差點放行了不該放行的變更，靠什麼發現的。", "explain": ["Anthropic〈How Anthropic runs large-scale code migrations with Claude Code〉（2026-07）公開了兩次大型改寫：Bun 從 Zig 改成 Rust，約百萬行、兩週內完成；另一次 Python 改成 TypeScript，約 16.5 萬行、一個週末。做法是先只轉 6 個檔試水溫，抓到 2 個規則問題才擴大到 1,448 個檔；既有測試在持續整合裡 100% 通過才合併，合併後發現的 19 個回歸問題也全數修好。這是廠商自家的案例，數字由他們公布。", "小步的價值在於退回的成本只有一段。Google Cloud 發布的 DORA 研究也把「小批量工作」列為放大 AI 效益的能力之一。下週怎麼用：Agent 一口氣做了好幾步時，請它停下來，補上每一步的回報，再一段一段放行；每次放行前問三題：改的檔案都在計畫裡嗎？測試數沒變少嗎？沒改既有期待值嗎？"], "notes": "（第 28–30 分）Anthropic〈How Anthropic runs large-scale code migrations with Claude Code〉（2026-07-16）：Bun 從 Zig 改寫成 Rust 約百萬行、兩週內完成；另一次 Python → TypeScript 約 16.5 萬行、一個週末。既有測試在持續整合 100% 通過後才合併，合併後發現的 19 個回歸全數修好；先只轉 6 個檔試水溫，抓到 2 個規則問題才擴大到 1,448 個檔。這是廠商自家案例，請照實說。DORA 也把「小批量工作」列為放大 AI 效益的能力之一。連回剛才：每次放行後 Agent 寫 notes 並存一版（Git Commit），所以退一步的成本只有一段；Agent 一口氣做好幾步時，請它停下並補上每一步的回報。"}, {"id": "structured", "chapter": "人怎麼確認", "title": "技巧：結構化輸出", "lead": "Structured Output（結構化輸出）：要求 Agent 照固定欄位回報，人才看得快、能前後比對，也能交給下一個工具處理。", "code": "編號     | 白話內容           | 結果   | 依據的測試名稱\nAC-G-005 | 成人＋學生總價1225 | 通過   | 混合訂票測試\nAC-G-014 | 付款失敗不建立訂單 | 未驗證 | （尚無）\n通過 6／失敗 0／跳過 3（示意，非實際輸出）", "cards": [["人看什麼", "每條驗收條件都有一列；「未驗證」不等於「通過」；跳過數沒有增加。"], ["業界評價", "固定格式輸出被列為「建議採用」：可比對、可自動檢查。"]], "check": "對照表沒有漏列、漏欄；結果和你從規則推出的預期值一致。", "explain": ["固定欄位有三個好處：人一眼就找到要看的那一格；前後兩次回報可以直接比對；下一個工具也能自動處理。Thoughtworks 技術雷達第 34 期（2026-04）把「從大型語言模型取得結構化輸出」列為建議採用。", "本課程的結構化輸出，指的是用提示詞要求固定欄位或標題；有些 API（應用程式介面）提供的結構化輸出功能，則是用結構定義強制格式，目的相同。用提示詞要求時，Agent 仍可能漏列或漏欄，所以第一件事是檢查有沒有漏；第二件事是記得「未驗證」不等於「通過」。下週怎麼用：任何要比對的回報（測試結果、方案比較、風險清單），先定好欄位再請 Agent 填。"], "read": ["〈Structured outputs〉（Anthropic，官方文件）", "〈Structured model outputs〉（OpenAI，官方文件）", "〈Technology Radar Vol. 34〉（Thoughtworks，2026）"], "notes": "（第 30–32 分）新技巧。畫面是示意，不是實際輸出。欄位固定寫在工作規則第 5 條：編號、白話內容、結果（通過／失敗／未驗證）、依據的測試名稱，最後一行寫測試數。Thoughtworks Technology Radar Vol. 34（2026-04）把「Structured output from LLMs」列為 Adopt。本課程的結構化輸出指用提示詞要求固定欄位或標題；官方 API 的 Structured Output 功能是用結構定義強制格式，目的相同。帶回工作：任何要比對的回報（測試結果、方案比較、風險清單）都先定好欄位，再請 Agent 填。Agent 仍可能漏欄，所以要檢查。📖 延伸閱讀：Anthropic 官方文件〈Structured outputs〉、OpenAI 官方文件〈Structured model outputs〉。"}, {"id": "review", "chapter": "人怎麼確認", "title": "審查變更：看證據，不看宣稱", "lead": "不讀程式也能審：要求 Agent 拿出執行結果當證據，再親眼看一次真實行為。", "cards": [["要證據", "「測試全過」要附實際執行的結果；沒執行的標「未驗證」。"], ["看範圍", "有沒有計畫外的檔案、刪測試、新增跳過、改期待值。"], ["親眼看", "沒看過它做對，就當它還沒做好；你在 /docs 試的就是這一步。"], ["📖 延伸閱讀", "〈Your job is to deliver code you have proven to work〉（Simon Willison，2025）"]], "prompt": "請審查剛才的變更，先不要修改任何檔案。用證據回答：改了哪些檔案、有沒有超出計畫；實際執行了哪些檢查、結果是什麼；有沒有刪測試、新增跳過或改期待值；最後列出你沒有驗證的部分。只回報事實，不要宣稱完成。", "check": "每個「通過」都附了實際執行的結果；你親自試過至少一個關鍵行為。", "explain": ["Claude Code 官方文件建議：要 Agent 拿出證據，而不是宣稱成功；也建議用另一個乾淨的對話來審查。但它同時提醒，被要求找問題的審查者，即使成品沒問題，通常也會報出一些，所以審查結果也要你判斷。Simon Willison（2025-12）說得更直接：沒親眼看過程式做對，就當它還沒做好。", "要誠實面對盲點：只看證據、不看程式，抓不到「測試全過但寫法有問題」的情況。所以 Greenfield 的工作規則把分層寫進去，並禁止刪改測試。下週怎麼用：Agent 說「完成了」時，先貼上方的審查提示詞，再挑一個最重要的行為親自試一次。"], "read": ["〈Best practices for Claude Code〉（Anthropic，官方文件）"], "notes": "（第 32–35 分）Claude Code 官方文件〈Best practices for Claude Code〉：「Have Claude show evidence rather than asserting success」；也建議用另一個乾淨的對話來審查，並提醒審查者被要求找問題時，即使成品沒問題也「will usually report some」，所以審查結果也要你判斷。Simon Willison〈Your job is to deliver code you have proven to work〉（2025-12-18）：「If you haven't seen the code do the right thing yourself, that code doesn't work.」連回剛才：工作規則第 6 條的四題審查，以及檢查點 4 在 /docs 親自試訂票與付款。誠實說盲點：只看證據不看程式，抓不到「測試全過但寫法有問題」，所以規則把分層寫進去、禁止改測試。開新對話留到 Speech 02，這裡只提「另一個乾淨的對話」不展開。"}, {"id": "cases", "chapter": "業界現況", "title": "案例：大規模使用的共同點", "lead": "近一年的公開案例，Agent 每週產出成百上千個變更；共同點不是模型更聰明，而是驗證與人審。", "cards": [["Stripe", "隔離環境、大量自動測試，產出全部經人審查。"], ["Spotify", "背景 Agent 改完仍跑格式與靜態檢查，人審後才合併。"], ["數字與細節", "Spotify 在 Speech 03，Stripe 與 GitHub 在 Speech 04 詳談。"]], "check": "說得出這些案例共同的「檢查」與「人審」在哪裡，對應你今天練的哪一步。", "explain": ["這頁只看共同點，數字留到後面兩場：Spotify 的背景 Agent 在第三場，Stripe 與 GitHub 在第四場。要記住的只有一句：規模能放大，前提是每個變更都過自動檢查與人審。", "這些看起來像 Digital Worker 的大場面，地基就是今天 Tool 階段練的三件事：先給檢查、小步放行、看證據審查。少了這些，產出越多，風險只會越大。"], "notes": "（第 35–37 分）這頁只點出共同點，不講數字：Spotify 的背景 Agent 在 Speech 03 詳談，Stripe 的 Minions 與 GitHub 的 Coding Agent 在 Speech 04 詳談，數字與來源都留到那兩場，這裡不要先講。要講的只有一句：規模放大的前提是每個變更都過自動檢查與人審。這些是 Digital Worker 的樣子，但地基就是今天 Tool 階段的檢查、小步與審查。"}, {"id": "caution", "chapter": "業界現況", "title": "平衡提醒：差一點就對，最花時間", "lead": "開發者普遍在用 AI，但信任度不高；AI 會放大團隊原有的長處，也會放大短處。", "cards": [["差一點就對", "66% 開發者最大的挫折是 AI 的答案「差一點就對」；只有 33% 信任其準確度。"], ["放大器", "DORA：90% 在工作中用 AI；採用與交付量正相關，但與交付穩定度仍負相關。"], ["所以", "檢查、小步、審查不是多餘的手續，是讓速度不變成風險的方法。"], ["📖 延伸閱讀", "〈2025 Developer Survey — AI〉（Stack Overflow，2025）；〈Announcing the 2025 DORA Report〉（Google Cloud，2025）"]], "check": "你的團隊有哪一項基本功（測試、小批量、版本控制）還不夠，會被 AI 放大？", "explain": ["Stack Overflow 2025 年開發者調查：84% 使用或打算使用 AI 工具，但只有 33% 信任它的準確度、46% 不信任；66% 說最大的挫折是答案「差一點就對」；45.2% 認為除錯 AI 產生的程式碼更花時間。當年在工作中使用 AI Agent 的約 31%；到 2026 年的調查，用 AI 的開發者已有 66% 用 Coding Agent，第五場再談。", "Google Cloud 公布的 DORA 2025 報告（2025-09）：90% 受訪者在工作中使用 AI，超過 80% 認為生產力提升，但 30% 幾乎或完全不信任 AI 產生的程式碼；AI 採用與交付量正相關，與交付穩定度卻仍是負相關。原文的結論是：AI 不會修好一個團隊，只會放大原本就有的東西。", "兩個常見的誤讀：「90% 用 AI」不等於「90% 用 Agent」；任何單一的「快了幾 %」也不能當通則。差一點就對的結果最危險，因為它看起來像完成，這正是檢查、小步與審查要擋的東西。"], "notes": "（第 37–39 分）Stack Overflow〈2025 Developer Survey — AI〉：84% 使用或打算使用 AI 工具；33% 信任準確度、46% 不信任；66% 最大挫折是「almost right, but not quite」；45.2% 認為除錯 AI 產生的程式碼更耗時；在工作中使用 AI Agent 的約 31%（這是 2025 年；2026 年調查中，用 AI 的開發者已有 66% 用 Coding Agent，Speech 05 再談）。Google Cloud〈Announcing the 2025 DORA Report〉（2025-09-24）：90% 受訪者在工作中使用 AI，超過 80% 認為生產力提升，30% 幾乎或完全不信任 AI 產生的程式碼；AI 採用與交付吞吐量正相關、與交付穩定度仍為負相關；原文「AI doesn't fix a team; it amplifies what's already there.」不要把「90% 使用 AI」說成「90% 使用 Agent」；也不要用單一的加速百分比當通則（Speech 05 會談量測）。"}, {"id": "notes", "chapter": "帶回工作", "title": "把決定寫進檔案，不留在對話裡", "lead": "計畫、核准、每步驗收與交付摘要，都請 Agent 寫進 notes/greenfield.md；你不用抄。", "cards": [["為什麼寫下來", "對話會結束，檔案會留下；下一個人或下一段對話照著讀就能接手。"], ["如實交付", "未完成項目與「未驗證」照實列出，不把部分完成寫成完整交付。"]], "check": "交付摘要如實列出未完成項目與「未驗證」，沒有把部分完成寫成完整交付。", "explain": ["對話會結束，檔案會留下。計畫、核准、每步驗收和交付摘要寫進 notes/，下一個人或下一段對話照著讀就能接手，不必重猜當時為什麼這樣決定。核准紀錄就是一種決策紀錄；Michael Nygard 提出的架構決策紀錄（ADR）也是同一個想法：寫下決定與理由。", "交付摘要有七項：完成的功能與對應規則、驗收條件；修改的檔案；最後一次測試指令與總數；文件更新；未完成項目、仍被跳過的測試與風險；人和 Agent 各做了什麼；人工驗證。最容易被省略的是「未完成」與「未驗證」，偏偏這兩項是下一個人最需要的。", "Nygard 原文的 ADR 是一份短文字檔，只記一個重要決定，分五段：標題、背景（當時有哪些考量）、決定（我們要怎麼做）、狀態（提議中、已接受，或已被新決定取代）、後果（包含壞處）。下週可以請 Agent 把一個已核准的決定照這五段寫進 notes/；寫不出「後果」那段，通常代表取捨還沒想清楚。"], "read": ["〈Documenting Architecture Decisions〉（Michael Nygard，2011）"], "notes": "（第 39–40 分）交付摘要七項：完成的功能與對應規則編號、驗收條件；修改的檔案；最後一次測試指令與總數；文件更新；未完成項目、仍被跳過的測試與風險；人和 Agent 各做了什麼；人工驗證。核准紀錄就是一種決策紀錄：寫下決定與理由，之後的人不必重猜。這頁是 Speech 02 交接的起點。📖 延伸閱讀：Michael Nygard〈Documenting Architecture Decisions〉。資料來源：Runbook〈Greenfield 任務：核心訂票 MVP〉、〈Greenfield Submission Checklist〉。"}, {"id": "apply", "chapter": "帶回工作", "title": "討論：交辦前的五個問題", "lead": "兩人一組，各挑一件自己工作上想交給 Agent 的事，互相問這五題；答不出來的，就是要先補的地方。", "flow": ["檢查：怎麼證明完成？", "規格：驗收條件可判定嗎？", "脈絡：要讀哪些檔？", "計畫：一句話講得完嗎？", "審查：要看什麼證據？"], "cards": [["答不出「檢查」", "先請 Agent 盤點現有檢查（第 4 頁的提示詞）。"], ["答不出「驗收條件」", "先請 Agent 訪談你、寫短規格（第 8 頁的提示詞）。"]], "check": "每人說出一題自己答不出來的，以及下一步要請 Agent 先做什麼。", "explain": ["五個問題各對應今天的一個做法：檢查（第 4 頁）、可判定的驗收條件（第 5 頁）、脈絡（第 10 頁）、先計畫（第 13 頁）、看證據審查（第 16 頁）。它們都不綁特定工具，換任何 Coding Agent 都適用。", "答不出來不是壞事，它告訴你交辦前要先補什麼。下週挑一件真實工作先問這五題；答不出的那一題，就變成你給 Agent 的第一個任務，例如先盤點檢查，或先訪談你、寫一份短規格。"], "notes": "（第 40–44 分）討論 3 分鐘，請一組分享；時間不夠就由講者用一個學員的例子帶過五題。回到開場白板上的卡點，請學員說哪一題能解：環境類卡點不在本場範圍，提示詞類對應脈絡與交辦四樣，審查類對應證據。五題分別對應第 4、5、10、13、16 頁，都是工具中立的做法，換任何 Coding Agent 都適用。"}, {"id": "next", "chapter": "帶回工作", "title": "下一場：Time Skip（時間快轉）", "lead": "今天讓新專案順利；接下來專案長大、換了對話，要怎麼接得上？", "cards": [["今天帶走", "先給檢查、可判定的驗收條件、脈絡、先計畫、小步驗證、結構化輸出、看證據審查。"], ["Speech 02 會談", "對話越長為什麼越不準、怎麼開新對話，用交接檔接手長大的系統。"]], "check": "說出一項回到工作時，你最想先寫成文件或規則交給 Agent 的事。", "notes": "（第 44–45 分）銜接：notes/greenfield.md 是下一段的起點；新對話不記得舊對話，Speech 02 Time Skip 會說明為什麼要開新對話、怎麼寫交接檔。這裡不展開。第 45 分鐘結束，不延長。"}], "title": "Greenfield：從 Idea 到可開發的專案", "minutes": 45, "downloads": [{"label": "下載 Idea 範例", "name": "idea.md", "text": "# Smart Ticket：核心訂票 Idea\n\n\u003e 讀者：學員與 Coding Agent。時機：從空資料夾準備專案。前置：建立獨立練習目錄。\n\n## 問題與目標\n\n旅客需要查詢可售班次、為自己與同行者訂票、模擬付款並取得訂單。第一版提供本機API，完成查詢→訂票→付款→訂單查詢，附測試與文件。\n\n## 四個業務入口\n\n- `GET /trips`：只列有可售座位班次；origin／destination可選且精確符合固定站名。\n- `POST /bookings`：指定trip_id與1–4位ADULT／STUDENT旅客，驗證班次與容量、逐人計價、建立待付款Booking（訂票）並立即保留座位。\n- `POST /bookings/{booking_id}/pay`：模擬付款成功後Booking為PAID（已付款）並建立唯一Order（訂單）；不得重複付款。\n- `GET /orders/{order_id}`：讀取Booking ID、金額與付款狀態；不存在回傳404。\n\n另保留 `GET /health`，回應 `{\"status\":\"ok\"}`。\n\n## 固定規則\n\n| 規則編號（Rule ID） | 規則 |\n|---|---|\n| TRIP-001／002 | 只列可售座位大於0的班次；起訖站精確篩選。 |\n| BOOKING-001／002／003 | 至少1人、最多4人、不得超過可售座位。 |\n| BOOKING-004／005 | 訂票成功立即保留座位；初始狀態PENDING_PAYMENT（待付款）。 |\n| FARE-001／002 | 成人基本票價100%、學生75%。 |\n| FARE-003／004 | 每位計價後加總；金額為整數。 |\n| PAYMENT-001／002／003 | 僅待付款可付；成功PAID；拒絕重複付款。 |\n| ORDER-001／002 | 成功付款建立唯一Order；金額等於訂票總額。 |\n\n付款失敗可由測試控制：不建立Order，不標PAID，仍待付款且保留座位。訂票被拒絕時不建立Booking或消耗座位。不存在Booking付款回傳404；不存在Trip訂票回傳明確錯誤。請求格式驗證可採FastAPI 422。\n\n## 固定資料\n\n| Trip（班次） | 起站 | 訖站 | 基本票價 | 可售座位 |\n|---|---|---|---:|---:|\n| T001 | 台北 | 台中 | 700 | 20 |\n| T002 | 台北 | 高雄 | 1500 | 8 |\n| T003 | 台中 | 高雄 | 800 | 0 |\n| T004 | 高雄 | 台北 | 1500 | 12 |\n\n日期固定，測試每次重置資料；模擬付款預設成功，可明確指定失敗，不使用隨機結果。\n\n## 驗收條件（AC，Acceptance Criteria）索引\n\n| AC | 檢核 |\n|---|---|\n| AC-G-001／002 | 無篩選列T001／002／004；台北至台中精確篩選只列T001。 |\n| AC-G-003／004／005 | T001成人700、學生525、混合1225且整數。 |\n| AC-G-006／007 | 0人與5人拒絕且不扣座位；4人容量足夠可建立。 |\n| AC-G-008 | 僅剩1座卻要求2人拒絕且座位不變；售罄不可訂。 |\n| AC-G-009 | T001兩人建立後為待付款（PENDING_PAYMENT）、座位20→18，後續查詢反映。 |\n| AC-G-010／011／012 | 成功付款PAID、唯一Order且金額一致；重複付款不新增；Order查詢正確。 |\n| AC-G-013／014 | 不存在資源依上述要求拒絕；付款失敗不建立Order或標PAID。 |\n| AC-G-015 | 完整四API流程可執行，Health正常。 |\n\n## 技術與範圍\n\nPython3.13、FastAPI、Pydantic2、pytest、Uvicorn；venv／pip／requirements.txt，src/smart_ticket 目錄結構。API、Schemas、Application、Domain、Infrastructure輕量分層；Domain不依賴FastAPI。只使用本機In-Memory（資料只存在記憶體）、固定Seed Data（系統預設的測試資料）與模擬付款。不需前端、登入、其他優惠、改退票、真實個資、外部API或資料庫。\n\n## 完成條件\n\n先形成可追溯的文件與核准計畫；實作完成與測試通過須另有實際證據。本文件是第一階段課後練習用的需求摘要，內容取自 Greenfield 需求、驗收條件與 G1（G0 補完後的版本）。正式任務仍以 G0（Greenfield 起始程式包）的文件為準。\n"}, {"label": "下載操作講義", "name": "greenfield-handout.md", "text": "# Greenfield：從 Idea 到可開發的專案\n\n\u003e 讀者：學員。時機：主課 Greenfield 之後的 45 分鐘講解。前置：已體驗 Greenfield。\n\n本場講概念與技巧，不需要寫程式或打指令。頁面上的提示詞是示範，想試再貼給自己的 Agent；沒有實際執行的結果，一律視為未驗證。\n\n**這一段帶走什麼**\n\n- 先給 Agent 能自己跑的檢查，再請它做事\n- 驗收條件寫成可判定的句子，預期值先從規則推\n- 像交辦工作一樣寫提示詞，規則放 AGENTS.md\n- 先計畫、小步放行、用固定欄位回報\n- 審查看證據，不看宣稱\n\n## 1. 剛才的順利，不是運氣\n\nG0（Greenfield 起始程式包）先備好了 16 條規則、15 項驗收條件與測試骨架；Agent（能自己讀寫檔案、執行指令來完成工作的 AI）因此知道什麼叫做對。\n\n- **本場回答三個問題**：Agent 怎麼知道做對了？怎麼知道要做什麼？人怎麼確認？\n\n- **講法**：每個做法：白話概念 → 官方說法 → 怎麼用在你的工作 → 業界案例。\n\n這份講義是給課後回頭讀的。投影片只放得下幾個字，這裡補上每個做法為什麼重要、證據是什麼、常見的誤解，以及下週怎麼用。數字都附上誰量的、哪一年；廠商自家的案例會特別註明。\n\n剛才 Greenfield 順利，是因為起始程式包先準備好三樣東西：編號的業務規則、能判定對錯的驗收條件，以及會告訴 Agent「還差什麼」的測試骨架。回到工作上，這三樣不會自己出現；你交辦的專案缺哪一樣，Agent 就只能用猜的。\n\n**人工確認**：說得出剛才 Greenfield 哪一步最順、哪一步卡住。\n\n## 2. Tool：人一步一步介入\n\nTool（工具）→ Teammate（隊友）→ Digital Worker（數位員工）差在人怎麼介入，不是人寫多少程式。\n\nTool：逐步下指令、每步驗收 → Teammate：核准計畫後才動手 → Digital Worker：只在核准關卡決定\n\n- **剛才的 Greenfield 是 Tool**：步驟由你定；Agent 做完一步就停，你看證據才放行下一步。\n\n- **為什麼從 Tool 開始**：先學會「怎麼判斷做對了」，之後才能放手讓 Agent 多做。\n\n三種方式的差別不在 Agent 多強，而在人什麼時候介入：Tool 是你決定每一步、每步驗收；Teammate 是你先核准整份計畫；Digital Worker 是你只在事先設好的核准關卡（Gate）做決定。後兩種在第三、四場展開。\n\n常見的誤解是「越後面越好」。其實這是依風險選擇：做錯代價高、難以復原、或還沒有自動檢查的工作，就該停在 Tool，一步一步看證據放行。\n\n**人工確認**：說出 Greenfield 中你「放行」了幾次，每次看了什麼證據。\n\n## 3. 新概念：Agent 在迴圈裡看結果做事\n\nAgent 不是一次寫完答案：它讀檔、動手、看執行結果，再決定下一步，一圈一圈往前。\n\n讀需求與檔案 → 修改或執行 → 看結果：測試、錯誤訊息 → 決定下一步\n\n- **白話比喻**：很快、很勤勞，但第一天上班的新同事：不知道你們的規則，也不會讀心。\n\n- **經驗法則**：迴圈裡沒有檢查，你就是那個檢查：每一步都得等你看過才知道對不對。\n\n- **📖 延伸閱讀**：〈Building effective agents〉（Anthropic，2024）\n\nAgent 的運作方式是「做一點、看結果、再決定」。Anthropic 在〈Building effective agents〉（2024-12）強調，Agent 每一步都要從環境取得真實結果，例如測試輸出、錯誤訊息、指令的回傳值。它看到的結果越可靠，下一步就越準。\n\n所以問題不在 Agent 勤不勤勞，而在它的迴圈裡有沒有可靠的回饋。如果唯一的回饋是它自己覺得「完成了」，那每一步都要靠你檢查。G0 先準備測試骨架，就是讓測試結果成為 Agent 的真相來源。\n\n這個迴圈也是 Agent 和聊天式 AI 助手的差別。Claude Code 官方詞彙表的說法是：聊天助手只回一段文字，要你自己貼上、自己執行；Agent 有工具，能讀檔、改檔、執行指令，看到結果再決定下一步。官方把這一圈稱為 agentic loop：收集脈絡、動手、驗證結果，重複到完成。常見誤解是「Agent 夠聰明，就不用給檢查」：迴圈轉得再快，沒有可靠的回饋，也只是很快地猜。\n\n**人工確認**：說得出剛才 Agent 每一步「看了什麼結果」才回報：是測試輸出，還是它自己覺得完成了。\n\n## 4. 技巧：先給檢查，再請它做事\n\n官方建議：給 Agent 一個能自己執行的檢查（測試、建置、可比對的畫面），它才能自己收斂。\n\n- **沒有檢查時**：「看起來完成」是唯一訊號，你只能相信或自己試。\n\n- **有檢查時**：Agent 自己跑、自己修，附上結果；你只看結果對不對。\n\n- **📖 延伸閱讀**：〈Best practices for Claude Code〉（Anthropic，官方文件）\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請告訴我這個專案現在有哪些你能自己執行的檢查（例如測試、建置、啟動後的畫面），各自目前的結果是什麼。再對照需求，列出哪些需求還沒有任何檢查能證明，並建議要補什麼檢查。列完就停下等我。\n\nClaude Code 官方文件〈Best practices for Claude Code〉建議：給 Agent 一個能自己執行的檢查，例如測試、建置、可比對的畫面。OpenAI Codex、GitHub Copilot 的官方文件也建議讓 Agent 執行測試來驗證，這不是單一產品的說法。\n\n剛才 G0 一開始是 1 個測試通過、8 個跳過；跳過的就是還沒做完的檢查，所以 Agent 每做一步都看得到進度。常見的誤解是「有測試就好」：測試只證明它檢查到的那部分，對照需求找出沒有任何檢查的項目，才是人要補的。\n\n下週怎麼用：接手任何專案，先貼上方的提示詞，請 Agent 盤點現有檢查、找出沒被檢查到的需求，再開始交辦工作。\n\n**人工確認**：每條需求都對得到一個檢查；沒有檢查的，先決定要補檢查還是由你親自試。\n\n## 5. 驗收條件：把「正確」寫成可判定\n\nAC（Acceptance Criteria，驗收條件）：事先寫好、能明確判定符合或不符合的完成標準。它是人和 Agent 共同的真相來源。\n\n- **好的寫法**：AC-G-005：成人＋學生訂 T001，總價 1225 且為整數。\n\n- **不好的寫法**：「計價正常」「錯誤處理完善」：Agent 和你都無法判定。\n\n- **預期值先從規則推**：成人 700＋學生 75%：看 Agent 回報前就先算好。\n\n- **寫給 Agent 的好處**：條件可判定，Agent 才能把它轉成測試，自己檢查。\n\n驗收條件寫得可判定，有兩個好處：人不讀程式也能判斷，因為你事先算好了預期數字；Agent 也能把條件直接變成測試，自己檢查。像「計價正常」這種句子，誰都沒辦法說它到底有沒有達成。ISTQB 詞彙表的定義也是這個方向：驗收條件是元件或系統要被使用者、客戶或其他授權者接受前，必須滿足的條件。\n\n以 AC-G-005 為例：成人付基礎票價 700；學生是基礎票價的 75%，也就是 525；合計 1225，而且是整數。預期值要從規則推，而且要在看 Agent 回報之前就算好；先看回報再判斷，人很容易被一個看起來合理的數字說服。下週交辦任務前，先問自己：「完成時，我要看到什麼數字或畫面？」寫不出來，就請 Agent 先把需求改寫成可判定的條件，再由你確認。\n\n📖 延伸閱讀：〈Glossary〉（ISTQB，acceptance criteria 條目）\n\n**人工確認**：每一條都能判斷「符合／不符合」；預期數字指得回一條規則編號。\n\n## 6. Given／When／Then：可判定的好寫法\n\nGherkin 用 Given（前提）／When（操作）／Then（結果）寫情境：業務方讀得懂，也能接上測試自動驗證。\n\n- **人看什麼**：Then 寫看得到的結果；一個情境只有一個 When。\n\n- **📖 延伸閱讀**：〈Gherkin Reference〉（Cucumber，官方文件）\n\n```text\nScenario: 成人與學生一起訂票\n  Given T001 基本票價 700，剩餘 20 座\n  When 為 T001 訂一位成人與一位學生\n  Then 總價為 1225 且為整數\n  And 訂票為待付款，T001 剩餘 18 座\n```\n\nCucumber 官方文件把 Gherkin 稱為「可執行的規格」：用固定的關鍵字寫情境，業務人員讀得懂，測試工具也能接上。適合用在需求還在跟業務方討論、需要用具體例子對齊的時候。\n\n要注意兩件事。第一，Gherkin 檔本身不會執行，要接上測試工具，情境才算被驗證；沒接上的只是寫得比較整齊的需求。第二，主課 Greenfield 並沒有使用 Gherkin 檔，測試是 Agent 直接依驗收條件補上的。\n\n下週怎麼用：請 Agent「把這份需求的驗收條件改寫成 Given／When／Then，每個 Then 寫看得到的結果，不確定的標待確認」，你只審每個 Then 對不對。\n\n**人工確認**：每個 Then 都能在 Agent 的回報裡找到實際結果；情境沒接上測試的標「未驗證」。\n\n## 7. 規格驅動開發：先寫規格再動手\n\nSpec-driven development（規格驅動開發）：把需求、設計、任務寫成檔案，Agent 照規格做、人照規格審。\n\n需求（含驗收條件） → 設計（例如分層架構） → 任務清單 → 逐項實作與驗證\n\n- **三種深度**：只在開工前寫（多數做法）→ 規格隨程式維護 → 只改規格、程式由它產生。\n\n- **經驗法則：別用大鐵鎚敲核桃**：小改動不必走完整流程；規格大小要和任務大小相稱。\n\n- **業界現況**：仍在試：相關工具多列在「評估」，還不是業界標準。\n\n- **📖 延伸閱讀**：〈Understanding Spec-Driven-Development: Kiro, spec-kit, and Tessl〉（martinfowler.com，2025）\n\nBirgitta Böckeler 在 martinfowler.com（2025-10）把規格驅動開發分成三種深度：只在開工前寫規格、規格隨程式長期維護、只改規格而程式由它產生。她觀察到多數工具停在第一種；用小 Bug 試完整流程時，她形容像「用大鐵鎚敲核桃」；她也發現 Agent 常沒照全部規格做，而且大量的規格文件本身就很難審。\n\nThoughtworks 技術雷達第 34 期（2026-04）把 GitHub Spec Kit、OpenSpec 這類工具列在「評估」（Assess），不是「建議採用」，所以不要說規格驅動是業界標準。實際的做法是規格大小跟著任務走：一句話說得清楚的小改動直接做，牽涉多個檔案或規則的工作才先寫規格。剛才 G0 的需求、驗收條件與架構文件，就是第一種深度的規格。\n\n📖 延伸閱讀：〈Technology Radar Vol. 34〉（Thoughtworks，2026）\n\n**人工確認**：說得出 Greenfield 的規格在哪：需求、驗收條件、架構文件各是哪一份。\n\n## 8. 技巧：規格從短開始，請 Agent 訪談你\n\n先寫幾行高層次的構想，請 Agent 一次問一個問題補齊，再擴寫成規格；人只審，不從零寫。\n\n- **為什麼有效**：Agent 擅長找出缺口；你只要回答它問的題，不必自己想到每一件事。\n\n- **📖 延伸閱讀**：〈How to write a good spec for AI agents〉（Addy Osmani，2026）\n\n### 交給 Agent 的指令\n\n請讀 docs/idea.md，先不要寫程式。一次問我一個問題，釐清使用者、範圍外項目、失敗時怎麼處理。問完後寫成 docs/spec.md，分三段：需求（每條附可判定的驗收條件）、設計重點、任務清單。來源沒寫的標「待確認」，不要自行補成需求。寫完停下等我。\n\nAddy Osmani〈How to write a good spec for AI agents〉（2026-01）建議：先寫精簡的高層規格，再請 AI 擴寫成詳細計畫；而且一次只交一個聚焦的任務，不要把所有事情塞進一段提示詞。Claude Code 官方文件也建議，大功能先請 Agent 訪談你、寫成規格，再開始實作。\n\n讓 Agent 一次問一個問題，是因為它擅長找缺口，你只要回答，不必自己想到每一件事。最常見的問題是 Agent 會「熱心補需求」，例如自己加上登入或會員功能。審規格時最重要的事，就是把來源沒寫的東西刪掉，或標成待確認由你決定。\n\n**人工確認**：規格裡每個「待確認」都由你決定；沒有出現來源以外的功能（例如登入、會員）。\n\n## 9. 案例：每一步都有自動驗證\n\nAirbnb 用大型語言模型把近 3,500 個前端測試檔換到新的測試框架；原估 1.5 年，6 週完成。\n\n- **做法**：逐檔、分步驟；每一步都跑驗證，失敗就把錯誤帶回去重試。\n\n- **結果**：4 小時自動完成 75%；調整 4 天後 97%；剩 3% 人工約一週。\n\n- **關鍵**：不是一次生成全部，而是「小步＋檢查＋重試」的迴圈。\n\n- **📖 延伸閱讀**：〈Accelerating Large-Scale Test Migration with LLMs〉（Airbnb Tech Blog）\n\n這是 Charles Covey-Brandt 在 Airbnb 技術部落格公開的案例（原頁面沒有標示發布日期）。近 3,500 個 React 前端測試檔要換到新的測試框架，原本估計要 1.5 年。做法是逐檔、分步驟處理，每一步都跑驗證，失敗就把錯誤訊息帶回去重試。\n\n結果：4 小時內自動完成 75%，調整提示詞與脈絡 4 天後達到 97%，剩下 3% 由人工處理約一週，總共 6 週完成。值得帶走的不是「6 週」，而是方法：能放大規模，是因為每一步都有自動驗證。這是公司自己公布的成果，換到你的專案不一定有一樣的比例。\n\n**人工確認**：說出這個案例裡的「檢查」是什麼，以及沒有它時會發生什麼。\n\n## 10. 新概念：脈絡工程\n\nContext engineering（脈絡工程）：提供讓任務「有可能被解出來」的全部資訊。重點從「怎麼問」移到「給它看什麼」。\n\n- **要給**：目標與完成標準、指名要讀的檔、限制與範圍外、一段真實範例、怎麼驗證。\n\n- **不要給**：整個資料夾、不相關的舊對話；多不等於好，雜訊會蓋過重點。\n\n- **經驗法則**：一段真實範例，勝過三段文字描述。\n\n- **📖 延伸閱讀**：〈Context engineering〉（Simon Willison，2025）\n\nSimon Willison〈Context engineering〉（2025-06）引用 Shopify 執行長 Tobi Lütke 的定義：提供讓任務「有可能被模型解出來」的全部脈絡。Thoughtworks 技術雷達第 34 期（2026-04）把脈絡工程列為「建議採用」（Adopt）。\n\n常見的誤解有兩個。一是「提示詞工程過時了」：其實只是用詞轉向，寫清楚的提示詞仍是基本功。二是「給越多越好」：整個資料夾、不相關的舊對話反而會蓋過重點，原因下一場用脈絡視窗說明。GitHub 分析兩千五百多個專案的規則檔後建議：一段真實範例，勝過三段文字描述。\n\n下週怎麼用：交辦前問自己，Agent 不問你，能不能從你給的資料推出「什麼算做完」？推不出來，就補上目標、完成標準、要讀的檔、限制與一段範例。\n\n📖 延伸閱讀：〈Effective context engineering for AI agents〉（Anthropic，2025）；〈How to write a great agents.md: Lessons from over 2,500 repositories〉（GitHub，2025）\n\n**人工確認**：交辦前檢查：Agent 不問你，能從你給的資料推出「什麼算做完」嗎？\n\n## 11. 技巧：工作規則是每次都要的脈絡\n\n每次都要的要求寫進專案根目錄的 AGENTS.md；Agent 開工自動讀，提示詞只寫這次的事。\n\n- **流程**：改之前先提計畫；只做核准的步驟，做完就停。\n\n- **邊界**：照分層放規則；不新增套件；不刪測試，不用跳過藏失敗。\n\n- **回報**：固定格式的驗收對照表與審查答案；沒執行的標「未驗證」。\n\n- **注意**：規則只能提醒；一定要發生的事，交給 hook 或權限把關。\n\n工作規則是把每一步都會用到的要求（流程、邊界、回報格式）先寫下來，之後每段提示詞只要寫這次的事：要什麼、為什麼、完成的樣子、素材在哪。剛才 Greenfield 檢查點 1 請 Agent 在專案根目錄寫的 AGENTS.md 就是這樣：「怎麼跑」加上「工作規則」，例如做完一步就停、照分層放規則、不刪測試、固定格式回報。\n\nAGENTS.md 是給 Agent 看的專案說明，多數 Coding Agent 開新對話會自動讀它，但讀法各家不同。以 OpenAI Codex 為例，它從 Git 根目錄往下讀到目前資料夾，合計預設上限 32 KiB；以 Claude Code 為例，v2.1.277 起沒有 CLAUDE.md 時直接讀 AGENTS.md，兩者都有時只讀 CLAUDE.md，除非 CLAUDE.md 匯入 @AGENTS.md。讀不到時，開工先說一句「請先讀 AGENTS.md」。\n\n裡面只放每次都要的事（怎麼跑、慣例、邊界），每份最好在 200 行內；一步步的固定做法另存成 Skill，例如 check，用得上時 Agent 才讀全文，第三場細講。什麼時候加一行？Claude Code 官方文件的建議是：Agent 同一個錯犯第二次，或審查抓到它本來就該知道的事。\n\n要知道它的限制：規則是給 Agent 的脈絡，只能提醒，不能強制，Agent 可能漏做。Anthropic〈The AI-native SDLC playbook〉說得很直接：Skill 是建議性的控制，hook（在固定時機一定會自動執行的檢查）才是背後確定會發生的那一層。一定要發生的事（例如不得刪測試），要靠 hook、測試、持續整合（CI：成員頻繁把變更合併回共用的程式碼，每次合併都自動建置與測試）或權限把關，這是第四場的主題。Claude Code 官方文件也說，規則檔是脈絡，不是強制的設定。\n\n📖 延伸閱讀：〈AGENTS.md〉（OpenAI，官方文件）；〈How Claude remembers your project〉（Anthropic，官方文件）；〈The AI-native SDLC playbook〉（Anthropic，2026）；〈Automate actions with hooks〉（Anthropic，官方文件）\n\n**人工確認**：Agent 每做完一步真的停下；每次回報都附上驗收對照表與審查答案。\n\n## 12. 技巧：像交辦工作一樣寫提示詞\n\n像交辦給同事：這次要什麼、為什麼、完成的樣子、素材在哪；規則已在 AGENTS.md，不用重寫。\n\n- **不用重寫的**：做完就停、回報格式、不刪測試：已在 AGENTS.md 與 Skill。\n\n- **沒寫清楚的**：讓 Agent 列成問題、附建議答案，由你決定。\n\n```text\n【要什麼】先別改程式，給我一份 4 步的實作計畫\n【為什麼】先看計畫，動手前就抓得出範圍外的項目\n【完成的樣子】寫進 notes/greenfield.md「計畫」，每步列 AC 和檔案\n【素材在哪】01 到 03 需求文件、程式裡的 TODO(GREENFIELD\n需求沒寫清楚的列成問題，每題附建議答案\n```\n\nClaude Code 官方文件的說法是：Agent 能推測意圖，但不會讀心。它建議提示詞指名檔案、情境與「什麼算修好」；模糊的提示詞會讓 Agent 掃過大量檔案，又慢又容易偏。\n\n四樣各擋掉一種常見問題：少了「素材在哪」，Agent 會讀整個資料夾或憑印象；少了「完成的樣子」，它不知道要交什麼、何時算做完；少了「為什麼」，遇到沒講到的情況只能自己猜。做完就停、回報格式、不刪測試這類每次都要的規則和固定做法，已寫在 AGENTS.md 與 Skill，工具會自己讀，提示詞只寫這次的事。\n\n需求沒寫清楚的，不要在提示詞裡替它補答案；請 Agent 列成問題、每題附建議答案，由你決定。下週每次交辦前，對照四樣檢查一次；寫不出來的那一樣，通常就是你自己還沒想清楚的地方。\n\n📖 延伸閱讀：〈Prompt engineering overview〉（Anthropic，官方文件）；〈Prompting best practices〉（Anthropic，官方文件）；〈Prompt engineering〉（OpenAI，官方文件）\n\n**人工確認**：提示詞指名了檔案、情境和「什麼算修好」；決策點用短回覆：「同意」「選 B」。\n\n## 13. 技巧：先探索、再計畫、再實作\n\n先讓 Agent 讀懂現況、提出計畫，你核准後才動手；錯在計畫上，比錯在程式上便宜得多。\n\n探索：只讀不改 → 計畫：每步對應驗收條件 → 人核准 → 實作與驗證 → 存一版\n\n- **經驗法則**：一句話講得完的改動，不用寫計畫；說不清楚的，一定要先計畫。\n\n- **📖 延伸閱讀**：〈Vibe engineering〉（Simon Willison，2025）\n\n### 交給 Agent 的指令\n\n先不要修改任何檔案。請先讀需求與相關檔案，再提出實作計畫：每一步寫要改哪些檔案、對應哪條驗收條件、用什麼檢查證明完成。如果這個改動一句話就說得完，直接告訴我不需要計畫。寫完停下等我核准。\n\nClaude Code 官方文件建議四步：探索、計畫、實作、存一版；並說「如果一句話就能描述這次改動，就跳過計畫」。Simon Willison〈Vibe engineering〉（2025-10）也說，先有高層計畫再動手，結果好得多。\n\n先計畫的理由是成本：計畫錯了，改幾行字；程式改錯了，要找出來、還原、再重做。很多工具有「只規劃、不修改」的模式，但不是必要；在提示詞寫「先不要修改任何檔案」就做得到。審計畫時看三件事：每一步有沒有對應的驗收條件、有沒有說用什麼檢查證明完成、有沒有範圍外的項目。\n\n**人工確認**：計畫每一步都有檔案、驗收條件與檢查；沒有範圍外的項目才核准。\n\n## 14. 小步驗證：錯了只退一小步\n\n一次只放行一小段；每段都有檢查和存檔點，錯了只退回上一段。大型專案也是這樣做的。\n\n核准計畫 → 做第 1、2 步 → 審查後放行 → 做第 3、4 步 → 審查後放行\n\n- **案例：先試 6 個檔**：一次大型遷移先只轉 6 個檔，抓到 2 個規則問題，才擴大到 1,448 個檔。\n\n- **案例：測試當裁判**：近百萬行的程式換語言，既有測試全部通過才合併。\n\n- **放行前三問**：改的檔案都在計畫裡？測試數沒變少？沒改既有期待值？\n\n- **📖 延伸閱讀**：〈How Anthropic runs large-scale code migrations with Claude Code〉（Anthropic，2026）\n\nAnthropic〈How Anthropic runs large-scale code migrations with Claude Code〉（2026-07）公開了兩次大型改寫：Bun 從 Zig 改成 Rust，約百萬行、兩週內完成；另一次 Python 改成 TypeScript，約 16.5 萬行、一個週末。做法是先只轉 6 個檔試水溫，抓到 2 個規則問題才擴大到 1,448 個檔；既有測試在持續整合裡 100% 通過才合併，合併後發現的 19 個回歸問題也全數修好。這是廠商自家的案例，數字由他們公布。\n\n小步的價值在於退回的成本只有一段。Google Cloud 發布的 DORA 研究也把「小批量工作」列為放大 AI 效益的能力之一。下週怎麼用：Agent 一口氣做了好幾步時，請它停下來，補上每一步的回報，再一段一段放行；每次放行前問三題：改的檔案都在計畫裡嗎？測試數沒變少嗎？沒改既有期待值嗎？\n\n**人工確認**：說得出你哪一次差點放行了不該放行的變更，靠什麼發現的。\n\n## 15. 技巧：結構化輸出\n\nStructured Output（結構化輸出）：要求 Agent 照固定欄位回報，人才看得快、能前後比對，也能交給下一個工具處理。\n\n- **人看什麼**：每條驗收條件都有一列；「未驗證」不等於「通過」；跳過數沒有增加。\n\n- **業界評價**：固定格式輸出被列為「建議採用」：可比對、可自動檢查。\n\n```text\n編號     | 白話內容           | 結果   | 依據的測試名稱\nAC-G-005 | 成人＋學生總價1225 | 通過   | 混合訂票測試\nAC-G-014 | 付款失敗不建立訂單 | 未驗證 | （尚無）\n通過 6／失敗 0／跳過 3（示意，非實際輸出）\n```\n\n固定欄位有三個好處：人一眼就找到要看的那一格；前後兩次回報可以直接比對；下一個工具也能自動處理。Thoughtworks 技術雷達第 34 期（2026-04）把「從大型語言模型取得結構化輸出」列為建議採用。\n\n本課程的結構化輸出，指的是用提示詞要求固定欄位或標題；有些 API（應用程式介面）提供的結構化輸出功能，則是用結構定義強制格式，目的相同。用提示詞要求時，Agent 仍可能漏列或漏欄，所以第一件事是檢查有沒有漏；第二件事是記得「未驗證」不等於「通過」。下週怎麼用：任何要比對的回報（測試結果、方案比較、風險清單），先定好欄位再請 Agent 填。\n\n📖 延伸閱讀：〈Structured outputs〉（Anthropic，官方文件）；〈Structured model outputs〉（OpenAI，官方文件）；〈Technology Radar Vol. 34〉（Thoughtworks，2026）\n\n**人工確認**：對照表沒有漏列、漏欄；結果和你從規則推出的預期值一致。\n\n## 16. 審查變更：看證據，不看宣稱\n\n不讀程式也能審：要求 Agent 拿出執行結果當證據，再親眼看一次真實行為。\n\n- **要證據**：「測試全過」要附實際執行的結果；沒執行的標「未驗證」。\n\n- **看範圍**：有沒有計畫外的檔案、刪測試、新增跳過、改期待值。\n\n- **親眼看**：沒看過它做對，就當它還沒做好；你在 /docs 試的就是這一步。\n\n- **📖 延伸閱讀**：〈Your job is to deliver code you have proven to work〉（Simon Willison，2025）\n\n### 交給 Agent 的指令\n\n請審查剛才的變更，先不要修改任何檔案。用證據回答：改了哪些檔案、有沒有超出計畫；實際執行了哪些檢查、結果是什麼；有沒有刪測試、新增跳過或改期待值；最後列出你沒有驗證的部分。只回報事實，不要宣稱完成。\n\nClaude Code 官方文件建議：要 Agent 拿出證據，而不是宣稱成功；也建議用另一個乾淨的對話來審查。但它同時提醒，被要求找問題的審查者，即使成品沒問題，通常也會報出一些，所以審查結果也要你判斷。Simon Willison（2025-12）說得更直接：沒親眼看過程式做對，就當它還沒做好。\n\n要誠實面對盲點：只看證據、不看程式，抓不到「測試全過但寫法有問題」的情況。所以 Greenfield 的工作規則把分層寫進去，並禁止刪改測試。下週怎麼用：Agent 說「完成了」時，先貼上方的審查提示詞，再挑一個最重要的行為親自試一次。\n\n📖 延伸閱讀：〈Best practices for Claude Code〉（Anthropic，官方文件）\n\n**人工確認**：每個「通過」都附了實際執行的結果；你親自試過至少一個關鍵行為。\n\n## 17. 案例：大規模使用的共同點\n\n近一年的公開案例，Agent 每週產出成百上千個變更；共同點不是模型更聰明，而是驗證與人審。\n\n- **Stripe**：隔離環境、大量自動測試，產出全部經人審查。\n\n- **Spotify**：背景 Agent 改完仍跑格式與靜態檢查，人審後才合併。\n\n- **數字與細節**：Spotify 在 Speech 03，Stripe 與 GitHub 在 Speech 04 詳談。\n\n這頁只看共同點，數字留到後面兩場：Spotify 的背景 Agent 在第三場，Stripe 與 GitHub 在第四場。要記住的只有一句：規模能放大，前提是每個變更都過自動檢查與人審。\n\n這些看起來像 Digital Worker 的大場面，地基就是今天 Tool 階段練的三件事：先給檢查、小步放行、看證據審查。少了這些，產出越多，風險只會越大。\n\n**人工確認**：說得出這些案例共同的「檢查」與「人審」在哪裡，對應你今天練的哪一步。\n\n## 18. 平衡提醒：差一點就對，最花時間\n\n開發者普遍在用 AI，但信任度不高；AI 會放大團隊原有的長處，也會放大短處。\n\n- **差一點就對**：66% 開發者最大的挫折是 AI 的答案「差一點就對」；只有 33% 信任其準確度。\n\n- **放大器**：DORA：90% 在工作中用 AI；採用與交付量正相關，但與交付穩定度仍負相關。\n\n- **所以**：檢查、小步、審查不是多餘的手續，是讓速度不變成風險的方法。\n\n- **📖 延伸閱讀**：〈2025 Developer Survey — AI〉（Stack Overflow，2025）；〈Announcing the 2025 DORA Report〉（Google Cloud，2025）\n\nStack Overflow 2025 年開發者調查：84% 使用或打算使用 AI 工具，但只有 33% 信任它的準確度、46% 不信任；66% 說最大的挫折是答案「差一點就對」；45.2% 認為除錯 AI 產生的程式碼更花時間。當年在工作中使用 AI Agent 的約 31%；到 2026 年的調查，用 AI 的開發者已有 66% 用 Coding Agent，第五場再談。\n\nGoogle Cloud 公布的 DORA 2025 報告（2025-09）：90% 受訪者在工作中使用 AI，超過 80% 認為生產力提升，但 30% 幾乎或完全不信任 AI 產生的程式碼；AI 採用與交付量正相關，與交付穩定度卻仍是負相關。原文的結論是：AI 不會修好一個團隊，只會放大原本就有的東西。\n\n兩個常見的誤讀：「90% 用 AI」不等於「90% 用 Agent」；任何單一的「快了幾 %」也不能當通則。差一點就對的結果最危險，因為它看起來像完成，這正是檢查、小步與審查要擋的東西。\n\n**人工確認**：你的團隊有哪一項基本功（測試、小批量、版本控制）還不夠，會被 AI 放大？\n\n## 19. 把決定寫進檔案，不留在對話裡\n\n計畫、核准、每步驗收與交付摘要，都請 Agent 寫進 notes/greenfield.md；你不用抄。\n\n- **為什麼寫下來**：對話會結束，檔案會留下；下一個人或下一段對話照著讀就能接手。\n\n- **如實交付**：未完成項目與「未驗證」照實列出，不把部分完成寫成完整交付。\n\n對話會結束，檔案會留下。計畫、核准、每步驗收和交付摘要寫進 notes/，下一個人或下一段對話照著讀就能接手，不必重猜當時為什麼這樣決定。核准紀錄就是一種決策紀錄；Michael Nygard 提出的架構決策紀錄（ADR）也是同一個想法：寫下決定與理由。\n\n交付摘要有七項：完成的功能與對應規則、驗收條件；修改的檔案；最後一次測試指令與總數；文件更新；未完成項目、仍被跳過的測試與風險；人和 Agent 各做了什麼；人工驗證。最容易被省略的是「未完成」與「未驗證」，偏偏這兩項是下一個人最需要的。\n\nNygard 原文的 ADR 是一份短文字檔，只記一個重要決定，分五段：標題、背景（當時有哪些考量）、決定（我們要怎麼做）、狀態（提議中、已接受，或已被新決定取代）、後果（包含壞處）。下週可以請 Agent 把一個已核准的決定照這五段寫進 notes/；寫不出「後果」那段，通常代表取捨還沒想清楚。\n\n📖 延伸閱讀：〈Documenting Architecture Decisions〉（Michael Nygard，2011）\n\n**人工確認**：交付摘要如實列出未完成項目與「未驗證」，沒有把部分完成寫成完整交付。\n\n## 20. 討論：交辦前的五個問題\n\n兩人一組，各挑一件自己工作上想交給 Agent 的事，互相問這五題；答不出來的，就是要先補的地方。\n\n檢查：怎麼證明完成？ → 規格：驗收條件可判定嗎？ → 脈絡：要讀哪些檔？ → 計畫：一句話講得完嗎？ → 審查：要看什麼證據？\n\n- **答不出「檢查」**：先請 Agent 盤點現有檢查（第 4 頁的提示詞）。\n\n- **答不出「驗收條件」**：先請 Agent 訪談你、寫短規格（第 8 頁的提示詞）。\n\n五個問題各對應今天的一個做法：檢查（第 4 頁）、可判定的驗收條件（第 5 頁）、脈絡（第 10 頁）、先計畫（第 13 頁）、看證據審查（第 16 頁）。它們都不綁特定工具，換任何 Coding Agent 都適用。\n\n答不出來不是壞事，它告訴你交辦前要先補什麼。下週挑一件真實工作先問這五題；答不出的那一題，就變成你給 Agent 的第一個任務，例如先盤點檢查，或先訪談你、寫一份短規格。\n\n**人工確認**：每人說出一題自己答不出來的，以及下一步要請 Agent 先做什麼。\n\n## 21. 下一場：Time Skip（時間快轉）\n\n今天讓新專案順利；接下來專案長大、換了對話，要怎麼接得上？\n\n- **今天帶走**：先給檢查、可判定的驗收條件、脈絡、先計畫、小步驗證、結構化輸出、看證據審查。\n\n- **Speech 02 會談**：對話越長為什麼越不準、怎麼開新對話，用交接檔接手長大的系統。\n\n**人工確認**：說出一項回到工作時，你最想先寫成文件或規則交給 Agent 的事。\n\n## 完成條件\n說得出 Agent 怎麼知道做對了（先給檢查、可判定的驗收條件）、怎麼知道要做什麼（規格、脈絡、工作規則、交辦式提示詞）、人怎麼確認（先計畫、小步驗證、結構化輸出、看證據審查），以及大規模案例的共同點；交辦自己的工作前問得出五個問題。\n\n**下週可以做的事**\n\n- 挑一個專案，請 Agent 盤點現有檢查與沒被檢查到的需求（第 4 頁的提示詞）\n- 交辦一件工作前，先寫下完成時要看到的數字或畫面\n- 用交辦前的五個問題檢查一次，答不出的那題先補\n\n## 名詞解釋\n| 名詞 | 意思 | 出處 |\n|---|---|---|\n| Agent | 由 AI 模型自己決定步驟、使用工具（讀寫檔案、執行指令）來完成任務的系統。 | Anthropic Engineering〈Building effective agents〉 |\n| Coding Agent | 專做軟體開發的 Agent：能自己讀檔、改檔、執行指令與測試；聊天式助手只回文字，要你自己貼上執行。 | Claude Code 官方文件〈Glossary〉 |\n| Agent 迴圈（agentic loop） | 收集脈絡、動手、驗證結果，重複到完成；每一步的結果決定下一步。 | Claude Code 官方文件〈Glossary〉 |\n| 可執行的檢查 | Agent 自己能跑、會回報通過或失敗的檢查，例如測試、建置、畫面比對；有了它，Agent 能一直修到檢查通過。 | Claude Code 官方文件〈Best practices for Claude Code〉 |\n| 驗收條件（AC，Acceptance Criteria） | 元件或系統要被使用者、客戶或其他授權者接受前必須滿足的條件；要寫到能判定符合或不符合。 | ISTQB〈Glossary〉 |\n| Gherkin | 用 Given（前提）／When（操作）／Then（結果）寫情境的格式；接上測試工具後才成為可執行的規格。 | Cucumber 官方文件〈Gherkin Reference〉 |\n| 規格驅動開發（Spec-driven development） | 先把需求、設計、任務寫成檔案，Agent 照規格做、人照規格審；多數做法只在開工前寫規格。 | martinfowler.com〈Understanding Spec-Driven-Development: Kiro, spec-kit, and Tessl〉 |\n| 脈絡工程（Context engineering） | 提供讓任務「有可能被模型解出來」的全部脈絡；重點從怎麼問，移到給它看什麼。 | Simon Willison〈Context engineering〉 |\n| 交辦式提示詞 | 像交辦工作給同事：這次要什麼、為什麼、完成的樣子、素材在哪；規則和固定做法放在 AGENTS.md 與 Skill，不在提示詞重寫。四樣是本課程的寫法，官方文件的重點相同：寫清楚、給脈絡、指名檔案。 | Anthropic〈Prompting best practices〉 |\n| 結構化輸出（Structured Output） | 本課程指用提示詞要求固定欄位或標題回報；API 的同名功能則用 JSON 結構定義強制格式。 | Anthropic〈Structured outputs〉 |\n| AGENTS.md | 放在專案根目錄、給 Agent 看的說明：怎麼跑、工作規則；多數 Coding Agent 開新對話會自動讀，各工具讀法不同。 | OpenAI〈AGENTS.md〉；Claude Code 官方文件〈How Claude remembers your project〉 |\n| Skill（技能檔） | 一個資料夾，裡面的 SKILL.md 開頭寫 name（名稱）與 description（什麼時候用）；工具平常只讀這兩項，任務符合才讀全文。 | agentskills.io〈Agent Skills Overview〉 |\n| hook | 在固定時機（例如執行工具前、改檔後）自動執行的處理程式；和規則檔不同，它一定會執行。 | Claude Code 官方文件〈Glossary〉；Anthropic〈The AI-native SDLC playbook〉 |\n| 持續整合（CI，Continuous Integration） | 團隊成員頻繁（至少每天）把變更合併回共用的程式碼，每次合併都由自動建置與測試驗證。 | Martin Fowler〈Continuous Integration〉 |\n| PR（Pull Request） | 把一組程式變更提議合併進專案；合併前讓別人討論與審查。 | GitHub 官方文件〈Pull requests〉 |\n| ADR（Architecture Decision Record，架構決策紀錄） | 一份短文字檔，只記一個重要的架構決定：背景、決定、狀態與後果。 | Michael Nygard〈Documenting Architecture Decisions〉 |\n| DORA | DevOps Research and Assessment：Google Cloud 旗下的軟體交付研究計畫，每年發布報告。 | Google Cloud〈Announcing the 2025 DORA Report〉 |\n\n## 延伸閱讀\n- 〈Building effective agents〉（Anthropic，2024）\n- 〈Best practices for Claude Code〉（Anthropic，官方文件）\n- 〈Glossary〉（ISTQB，acceptance criteria 條目）\n- 〈Gherkin Reference〉（Cucumber，官方文件）\n- 〈Understanding Spec-Driven-Development: Kiro, spec-kit, and Tessl〉（martinfowler.com，2025）\n- 〈Technology Radar Vol. 34〉（Thoughtworks，2026）\n- 〈How to write a good spec for AI agents〉（Addy Osmani，2026）\n- 〈Accelerating Large-Scale Test Migration with LLMs〉（Airbnb Tech Blog）\n- 〈Context engineering〉（Simon Willison，2025）\n- 〈Effective context engineering for AI agents〉（Anthropic，2025）\n- 〈How to write a great agents.md: Lessons from over 2,500 repositories〉（GitHub，2025）\n- 〈AGENTS.md〉（OpenAI，官方文件）\n- 〈How Claude remembers your project〉（Anthropic，官方文件）\n- 〈The AI-native SDLC playbook〉（Anthropic，2026）\n- 〈Automate actions with hooks〉（Anthropic，官方文件）\n- 〈Prompt engineering overview〉（Anthropic，官方文件）\n- 〈Prompting best practices〉（Anthropic，官方文件）\n- 〈Prompt engineering〉（OpenAI，官方文件）\n- 〈Vibe engineering〉（Simon Willison，2025）\n- 〈How Anthropic runs large-scale code migrations with Claude Code〉（Anthropic，2026）\n- 〈Structured outputs〉（Anthropic，官方文件）\n- 〈Structured model outputs〉（OpenAI，官方文件）\n- 〈Your job is to deliver code you have proven to work〉（Simon Willison，2025）\n- 〈2025 Developer Survey — AI〉（Stack Overflow，2025）\n- 〈Announcing the 2025 DORA Report〉（Google Cloud，2025）\n- 〈Documenting Architecture Decisions〉（Michael Nygard，2011）\n"}]};</script>
<script>'use strict';
const slides = SPEECH_DATA.slides;
const el = id => document.getElementById(id);
let index = 0, notesVisible = false, running = false, accumulated = 0, startedAt = 0;
const overview = el('overview');
function node(tag, value, cls) { const n = document.createElement(tag); if(value !== undefined) n.textContent = value; if(cls) n.className = cls; return n; }
function announce(message) { el('status').textContent = message; }
function resize() {
  const available = Math.max(100, innerHeight - document.querySelector('nav').offsetHeight - 18);
  const scale = Math.min(innerWidth / 1600, available / 900);
  const stage = el('stage'); stage.style.transform = `scale(${scale})`;
  stage.style.left = `${(innerWidth - 1600 * scale) / 2}px`; stage.style.top = `${(available - 900 * scale) / 2}px`;
}
function render() {
  const s = slides[index]; el('chapter').textContent = s.chapter; el('title').textContent = s.title; el('lead').textContent = s.lead;
  const content = el('content'); content.replaceChildren();
  if(s.flow) { const flow = node('div', undefined, 'flow'); s.flow.forEach((v,i)=>{ if(i)flow.append(node('b','→'));flow.append(node('span',v)); });content.append(flow); }
  if(s.code) content.append(node('pre', s.code));
  if(s.cards) { const cards = node('div',undefined,'cards');s.cards.forEach(([title,body])=>{ const card=node('article',undefined,'card');card.append(node('h2',title),node('p',body));cards.append(card); });content.append(cards); }
  el('prompt-box').hidden = !s.prompt; el('prompt').textContent = s.prompt || '';
  el('check').textContent = '人工確認｜' + s.check; el('notes').textContent = '講者備註 · ' + (index+1) + '\n\n' + s.notes;
  el('notes').hidden = !notesVisible; el('counter').textContent = `${index+1} / ${slides.length}`;
  el('prev').disabled = index === 0; el('next').disabled = index === slides.length-1;
  document.title = `${SPEECH_DATA.title.split('：')[0]} · ${s.title}`; location.replace('#'+s.id);
  announce(''); document.querySelectorAll('#overview-list button').forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  requestAnimationFrame(resize);
}
function move(delta){index=Math.max(0,Math.min(slides.length-1,index+delta));render();}
function toggleNotes(){notesVisible=!notesVisible;el('notes-button').setAttribute('aria-pressed',String(notesVisible));el('notes').hidden=!notesVisible;}
function openOverview(){if(!overview.open)overview.showModal();}
function elapsed(){return accumulated+(running?performance.now()-startedAt:0);}
function toggleTimer(){if(running){accumulated=elapsed();running=false;}else{startedAt=performance.now();running=true;}el('timer-button').textContent=running?'暫停 T':'計時 T';}
function updateTimer(){const secs=Math.floor(elapsed()/1000);el('timer').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} / ${String(SPEECH_DATA.minutes).padStart(2,'0')}:00`;el('timer').classList.toggle('over',secs>=SPEECH_DATA.minutes*60);}
function save(filename, value){const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=node('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已下載 '+filename);}
async function copyPrompt(){const value=slides[index].prompt;if(!value)return;try{await navigator.clipboard.writeText(value);announce('指令已複製');}catch{const t=node('textarea');t.value=value;document.body.append(t);t.select();let copied=false;try{copied=document.execCommand('copy');}catch{}t.remove();if(copied)announce('指令已複製');else{const range=document.createRange();range.selectNodeContents(el('prompt'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);announce('請按 Ctrl+C／Cmd+C 複製已選取的指令');}}}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('copy').onclick=copyPrompt;
el('notes-button').onclick=toggleNotes;el('overview-button').onclick=openOverview;el('close-overview').onclick=()=>overview.close();
el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('請使用瀏覽器的全螢幕功能');}};
el('timer-button').onclick=toggleTimer;el('reset').onclick=()=>{running=false;accumulated=0;el('timer-button').textContent='計時 T';updateTimer();};
SPEECH_DATA.downloads.forEach(d=>{const b=node('button',d.label);b.onclick=()=>save(d.name,d.text);el('downloads').append(b);});
slides.forEach((s,i)=>{const b=node('button',`${i+1}. ${s.title}`);b.onclick=()=>{index=i;overview.close();render();};el('overview-list').append(b);});
function fromHash(){const target=slides.findIndex(s=>s.id===location.hash.slice(1));if(target>=0&&target!==index){index=target;render();}}
addEventListener('hashchange',fromHash);addEventListener('resize',resize);
addEventListener('keydown',e=>{if((e.target instanceof Element&&(e.target.closest('textarea,input,select')||(e.target.closest('button')&&[' ','Enter'].includes(e.key))))||e.ctrlKey||e.metaKey||e.altKey)return;if(overview.open)return;const key=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();move(1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();move(-1);}else if(key==='home'){index=0;render();}else if(key==='end'){index=slides.length-1;render();}else if(key==='n')toggleNotes();else if(key==='o')openOverview();else if(key==='t')toggleTimer();else if(key==='f')el('fullscreen').click();else if(key==='escape'&&notesVisible)toggleNotes();});
fromHash();render();setInterval(updateTimer,500);resize();
</script>
